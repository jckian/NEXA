    const DEMO_ON = (new URLSearchParams(location.search)).get('demo') !== '0';
    const SHORT_TARGETS = () => USE_VOCAB.filter(v => isShort(v.type) && !isFixedUse(v.type));

    function buildDemoTimeline() {
      if (!BASE_PROGRAM.length) return false;
      CONVERSIONS = []; TL_HORIZON = 0; SCEN_YEAR = 0;
      const live = BASE_PROGRAM.filter(p => !p.isCore && !isCorridor(p.type) && !isFixedUse(p.type));
      if (!live.length) return false;

      // SHORT tenancies re-plug on a 3-year beat, a third of the stock at a time (see the deal below)
      const byType = new Map();
      for (const p of live) {
        if (!isShort(p.type)) continue;
        const g = byType.get(p.type) || { type: p.type, area: 0, levels: new Set() };
        g.area += p.area; g.levels.add(p.level); byType.set(p.type, g);
      }
      const pool = [...byType.values()].sort((a, b) => b.area - a.area);
      const taken = new Set(pool.map(g => g.type));
      const targets = SHORT_TARGETS();
      const cur = new Map(pool.map(g => [g, g.type]));
      // ONE PER BEAT WAS NOT A TIMELINE, IT WAS A QUEUE. The loop below used to run k = 1…6 and
      // re-plug pool[k-1], so with the SAMPLE's 17 plug-in tenancies only the six largest ever
      // changed — all of them on L0–L2, because the biggest tenancies are in the base. The lounge
      // bar on L5 sat at rank 13 and never got a turn, so the top of the model was identical at
      // every year of the run (user 260729: "上面的 SHORT 也要隨時間迭代"). The horizon is not the
      // place to fix that: covering 17 tenancies one at a time needs 51 years.
      // So every tenancy gets a turn, and gets it more than once. The pool is DEALT into SLOTS by
      // rank: beat k re-plugs the tenancies in slot (k-1) mod SLOTS, so a third of the stock
      // changes every beat and each tenancy's own turn comes round every third one. Dealt by rank,
      // not sliced into blocks — the pool is sorted by area, and blocks would put the big
      // ground-floor tenancies in the early beats and the small upper-floor ones at the end, which
      // is the same "the top goes last" bias in a milder form.
      const CYCLE = 3, span = pool.length ? CYCLE * Math.min(6, Math.max(3, pool.length * 2)) : 0;
      const beats = Math.max(1, Math.floor(span / CYCLE)), SLOTS = Math.min(3, beats);
      for (let k = 1; pool.length && k * CYCLE <= span; k++) {
        for (let n = (k - 1) % SLOTS; n < pool.length; n += SLOTS) {
          const g = pool[n], from = cur.get(g);
          // Fresh use first; once the vocabulary is used up, step through it from a different
          // place each time. The old fallback always took targets[0], so with the whole stock
          // now re-plugging, twenty of the twenty-one events read "→ coffee shop".
          const t = targets.find(v => v.type !== from && !taken.has(v.type))
            || targets.filter(v => v.type !== from)[(n + k) % Math.max(1, targets.filter(v => v.type !== from).length)];
          if (!t) break;
          taken.add(t.type); cur.set(g, t.type);
          CONVERSIONS.push({
            id: ++CONV_SEQ, year: k * CYCLE, levels: [...g.levels].sort((a, b) => a - b),
            from: { label: prettyName(from), re: new RegExp('^' + reEsc(from) + '$', 'i') },
            to: { type: t.type, category: t.category }, kind: 'short', tier: null, basis: null,
          });
        }
      }

      // ── and the permanent rooms change use, floor by floor ──
      // Tier 1 freezes the rect, so a permanent conversion moves nothing. On the SAMPLE program
      // that made the whole demo read as 1% of the model changing (measured 260729) — the user's
      // "完全沒變". What IS visible without breaking Tier 1 is the CATEGORY: a private office
      // plate that takes on a public use turns from blue to orange in the default colour mode.
      // Same slab, same footprint, different use, and it reads at a glance.
      // So the demo converts the biggest permanent uses in turn, each across the category line.
      const byLong = new Map();
      for (const p of live) {
        if (isShort(p.type)) continue;
        const g = byLong.get(p.type) || { type: p.type, area: 0, levels: new Set() };
        g.area += p.area; g.levels.add(p.level); byLong.set(p.type, g);
      }
      const longs = [...byLong.values()].sort((a, b) => b.area - a.area).slice(0, 3);
      // a target on the far side of the category line, so the plate visibly repaints
      const flip = src => {
        const want = src.category === 'public' ? 'private' : 'public';
        const cands = USE_VOCAB.filter(v => v.category === want && !isFixedUse(v.type) && v.type !== src.type);
        // prefer a use that reads as a different building, not a neighbour of the same one
        const pick = cands.find(v => want === 'public' ? isShort(v.type) : /apartment/i.test(v.type)) || cands[0];
        return pick ? { type: pick.type, category: pick.category } : null;
      };
      const base = Math.max(4, Math.round((span || 12) * 0.45));
      longs.forEach((g, i) => {
        const src = live.find(p => p.type === g.type) || { type: g.type, category: 'private' };
        const to = flip(src);
        if (!to) return;
        CONVERSIONS.push({
          id: ++CONV_SEQ, year: base + i * 4, levels: [...g.levels].sort((a, b) => a - b),
          from: { label: prettyName(g.type), re: new RegExp('^' + reEsc(g.type) + '$', 'i') },
          to, kind: 'long', tier: null, basis: null,
        });
      });
      if (!CONVERSIONS.length) return false;
      CONVERSIONS.sort((a, b) => a.year - b.year);
      TL_HORIZON = Math.min(30, Math.max(...CONVERSIONS.map(c => c.year)) + 2);
      TL_DEMO = true;
      return true;
    }

    // Seeds CONVERSIONS or FORECAST_TRACK from the payload in force and clears the other.
    // `rebuild` is false during page setup, where loadText() does the first build anyway.
    function applyTimelineMode(rebuild) {
      CONVERSIONS = []; FORECAST_TRACK = []; FORECAST_BASE_YEAR = null;
      TL_HORIZON = 0; SCEN_YEAR = 0; TL_REASON = null;
      if (EVOLUTION && !EVOLUTION.events.length) TL_REASON = EVOLUTION.reason || null;
      if (TL_MODE === 'evolution' && EVOLUTION) {
        for (const e of EVOLUTION.events) {
          const types = (e.fromTypes || []).filter(Boolean);
          const lv = Array.isArray(e.levels) && e.levels.length ? e.levels.slice() : 'all';
          CONVERSIONS.push({
            id: ++CONV_SEQ,
            year: Math.max(0, Math.round(e.year) || 0),
            levels: lv,
            // exact-type alternation: the wizard names the rows it means, and a loose match
            // would let "office" also take "office lobby" on the same floor
            from: types.length
              ? { label: e.fromLabel || types[0], re: new RegExp('^(?:' + types.map(reEsc).join('|') + ')$', 'i') }
              : null,
            to: { type: e.toType, category: e.toCategory || 'private' },
            kind: e.kind || null, tier: e.likelihood || null, basis: e.basis || null,
          });
        }
        TL_HORIZON = Math.max(0, Math.round(EVOLUTION.horizon) || 0);
      } else if (FUTURES) {
        FORECAST_BASE_YEAR = FUTURES.baseYear;
        FORECAST_TRACK = FUTURES.entries;
      }
      if (rebuild) applyScenario();
    }

    // Core lock: one unlaid-out pass over every scenario, then take the envelope that
    // satisfies all of them. Rebuilt whenever the core scheme changes, because "fixed" is
    // only meaningful WITHIN a scheme — switching compact/pinwheel/inset is a different
    // building diagram, not a different year.
    let CORE_LOCK = null, CORE_LOCK_KEY = null;

    function buildCoreLock() {
      CORE_LOCK_KEY = CORE_OPTION;
      CORE_LOCK = null;
      if (FORECAST_TRACK.length < 2) return;                 // nothing to hold still against
      const ls = FORECAST_TRACK.map(t => { try { return computeLayout(t.rows); } catch (e) { return null; } }).filter(Boolean);
      if (ls.length < 2) return;
      const coreNxOf = L => {
        // the north core is the shaft sitting on the far side of the corridor
        const n = (L.coreShafts || []).filter(c => c.zMod > L.zMid);
        return n.length ? Math.max(...n.map(c => c.xMod)) : 0;
      };
      CORE_LOCK = {
        FW: Math.max(...ls.map(L => L.FW)),
        FD: Math.max(...ls.map(L => L.FD)),
        southDepth: Math.max(...ls.map(L => L.zMid)),
        northDepth: Math.max(...ls.map(L => L.FD - L.zMid - 1)),
        coreNx: Math.max(...ls.map(coreNxOf)),
      };
    }

    const coreLock = () => {
      if (!FORECAST_TRACK.length) return null;
      if (CORE_LOCK_KEY !== CORE_OPTION) buildCoreLock();
      return CORE_LOCK;
    };

    const forecastAt = y => {
      let hit = null;
      for (const t of FORECAST_TRACK) if (t.year <= y) hit = t;
      return hit;
    };

    // ── FORECAST PHASING ──────────────────────────────────────────────────────────────────
    // Each scenario is anchored at its own horizon year and shown there in full. BETWEEN two
    // anchors the building phases in: the floors the next scenario adds arrive bottom-up at
    // PHASE_FLOORS_PER_YEAR, so scrubbing shows a build-out instead of 3 storeys becoming 9 in
    // a single step (user 260728, measured on citymarket: 3 → 9 → 6 → 7 occupied floors).
    // Basements come first because `extra` is sorted ascending, which is also the order they
    // would actually be built in.
    // The ramp is ONE-WAY. A later scenario that uses less never pulls floors back down; it
    // leaves them vacant, because the frame is built once and built floors do not un-build.
    // The cap applies to EVERY year, anchor years included. Letting an anchor top up to its full
    // scenario put the jump straight back: measured 260728, citymarket still went +4 floors in
    // one step at its 2035 anchor and college went +5 at 2030, because those two scenarios sit a
    // single year apart and differ by five floors. No amount of ramping between anchors can
    // absorb that; only capping the anchor itself can. The cost is stated plainly in the panel:
    // a scenario is reached when the build-out gets there, which can be later than its horizon.
    // ?phase=0 turns phasing off and every anchor snaps, which is the old behaviour.
    let PHASE_FLOORS_PER_YEAR = 1;   // ?phase=<n> · 0 disables phasing entirely
    let PHASE_STATE = null;          // {target, built, pending, late} for the panel + __DEBUG__
    const phaseLevels = rows => [...new Set(rows.map(p => p.level))].sort((a, b) => a - b);
    function phasedRows(y) {
      PHASE_STATE = null;
      if (!FORECAST_TRACK.length) return null;
      let i = -1;
      for (let k = 0; k < FORECAST_TRACK.length; k++) if (FORECAST_TRACK[k].year <= y) i = k;
      if (i < 0) return null;
      const cur = FORECAST_TRACK[i];
      if (PHASE_FLOORS_PER_YEAR <= 0) return cur.rows;
      const t0 = FORECAST_TRACK[0];
      // Every level any scenario up to entry k has asked for, lowest first. Basements sit at the
      // bottom of that list, which is also the order they would be built in.
      const cumOrder = [], cumSeen = new Set();
      for (const t of FORECAST_TRACK) {
        for (const p of t.rows) cumSeen.add(p.level);
        cumOrder.push([...cumSeen].sort((a, b) => a - b));
      }
      // Step the build-out year by year rather than multiplying the elapsed years by the rate.
      // Allowance that had nothing to build cannot be banked: citymarket sits on a 3-storey
      // interim use for three years, and a formula-based allowance released all three years of
      // credit the moment the next scenario arrived, putting a +3 step straight back in.
      let built = phaseLevels(t0.rows).length;
      for (let yy = t0.year + 1; yy <= y; yy++) {
        let idx = 0;
        for (let k = 0; k < FORECAST_TRACK.length; k++) if (FORECAST_TRACK[k].year <= yy) idx = k;
        built = Math.min(cumOrder[idx].length, built + PHASE_FLOORS_PER_YEAR);
      }
      const order = cumOrder[i];
      built = Math.min(built, order.length);
      const pending = order.length - built;
      const levelSet = new Set(order.slice(0, Math.max(1, built)));
      // levelSet is the building that PHYSICALLY EXISTS this year. Everything above it has not
      // been built yet, so it must not be drawn — including the core. A nine-storey core standing
      // over three storeys of program was the giveaway (user 260728).
      PHASE_STATE = { target: cur.id, built: levelSet.size, pending, late: pending > 0, levelSet };
      if (!pending) return cur.rows;
      // Each built level takes its use from the LATEST scenario up to the one in force that
      // programs it, so a floor put up under an earlier scenario keeps working rather than
      // going dark the moment a newer scenario ignores it.
      const out = [];
      for (const lv of levelSet) {
        for (let k = i; k >= 0; k--) {
          const rs = FORECAST_TRACK[k].rows.filter(p => p.level === lv);
          if (rs.length) { out.push(...rs); break; }
        }
      }
      return out;
    }

    // Rebuild PROGRAM from the year-0 program by replaying every rule due at SCEN_YEAR.
    function applyScenario() {
      const track = phasedRows(SCEN_YEAR);   // the scenario in force, phased in between anchors
      const rows = (track || BASE_PROGRAM).map(p => ({ ...p }));
      CONV_HITS.clear();
      const due = CONVERSIONS.filter(c => c.year <= SCEN_YEAR).sort((a, b) => a.year - b.year || a.id - b.id);
      for (const c of due) {
        let n = 0, area = 0;
        for (const p of rows) {
          if (!ruleHits(p, c)) continue;
          if (p.origType === undefined) p.origType = p.type;
          p.type = c.to.type; p.category = c.to.category; p.convYear = c.year;
          n++; area += p.area;
        }
        CONV_HITS.set(c.id, { n, area });
      }
      for (const p of rows) p.converted = p.origType !== undefined && p.origType !== p.type;
      PROGRAM = rows;
      // ⚠ There was an auto-switch to 'change' colour here, added 260729 so a Tier 1 conversion
      // would not look like nothing had happened. Reverted the same day: measured, dragging the
      // slider turned 70 of 87 SHORT blocks from orange to CHANGE_KEEP grey, because 'change'
      // colours by converted-or-not and drops the span reading entirely. The user read that as
      // "the SHORT modules have all disappeared", and they were right to. Trading the LONG/SHORT
      // identity for a conversion highlight is a worse deal than the problem it solved.
      //
      // The conversion is instead reported in words under the slider (see `#chat-change`), which
      // costs nothing and takes nothing away, and the readout carries the switch into 'change'
      // colour for anyone who wants it.
      build();
      syncScenarioUI();
      renderProgramPanel();
    }

    // ─────────────────────────────────────────────────────────
    // INITIAL PROGRAM (year 0) — the wizard's selection, made editable
    //   BASE_PROGRAM arrives from program-input.html (?src=input + localStorage) or the
    //   SAMPLE. INPUT_PROGRAM keeps that handover verbatim so "Reset to input" can undo
    //   every edit. Rows of the same type on the same level are shown as one group: the
    //   panel edits GROUP area, which is what the wizard asked for ("which programs, how
    //   much area"), and splits it back over the group's rows evenly.
    // ─────────────────────────────────────────────────────────
    let INPUT_PROGRAM = [];        // untouched copy of the handover, for Reset
    let PROGRAM_EDITED = false;    // has the user changed the initial program?
    let PROGRAM_SRC = 'sample';    // 'input' (wizard) · 'file' (drag-drop) · 'sample'
    const groupKey = p => p.level + '|' + p.type;

    function programGroups() {
      const m = new Map();
      for (const p of BASE_PROGRAM) {
        const k = groupKey(p);
        const g = m.get(k) || { key: k, level: p.level, type: p.type, category: p.category, n: 0, area: 0, isCore: p.isCore };
        g.n++; g.area += p.area;
        m.set(k, g);
      }
      return [...m.values()];
    }
    // Mutators rebuild unless `defer` is set, so a multi-group edit rebuilds once at the end.
    // Area is authored per group; keep each row's footprint proportion by scaling w/h with it.
    function setGroupArea(key, area, defer) {
      const rows = BASE_PROGRAM.filter(p => groupKey(p) === key);
      if (!rows.length || !(area > 0)) return;
      const each = area / rows.length;
      for (const p of rows) { const k = Math.sqrt(each / p.area); p.area = each; p.w *= k; p.h *= k; }
      PROGRAM_EDITED = true;
      if (!defer) applyScenario();
    }
    function removeGroup(key, defer) {
      BASE_PROGRAM = BASE_PROGRAM.filter(p => groupKey(p) !== key);
      PROGRAM_EDITED = true;
      if (!defer) applyScenario();
    }
    function addProgramRow(level, type, area, defer) {
      if (!type || !(area > 0)) return;
      const v = USE_VOCAB.find(u => u.type === type);
      const side = Math.sqrt(area);
      BASE_PROGRAM.push({ uid: ++ROW_UID, type, area, level, category: v ? v.category : 'private', w: side, h: side, isCore: isCore(type) });
      PROGRAM_EDITED = true;
      if (!defer) applyScenario();
    }

    // which floors the user has opened in the program list; closed is the default and a re-render
    // (every applyScenario) must not slam them shut again
    const PROG_OPEN_LV = new Set();

    function renderProgramPanel() {
      const list = document.getElementById('prog-list'); if (!list) return;
      const groups = programGroups();
      const levels = [...new Set(groups.map(g => g.level))].sort((a, b) => a - b);
      const opts = USE_VOCAB.map(v => `<option value="${escHtml(v.type)}">${escHtml(prettyName(v.type))}</option>`).join('');
      let html = '', total = 0;
      for (const lv of levels) {
        const gs = groups.filter(g => g.level === lv).sort((a, b) => b.area - a.area);
        const lvArea = gs.reduce((s, g) => s + g.area, 0);
        const open = PROG_OPEN_LV.has(lv);
        total += lvArea;
        html += `<button class="prog-lv${open ? ' open' : ''}" data-lvhead="${lv}" aria-expanded="${open}">` +
          `<span>${levelLabel(lv)}${shortFloors.has(lv) ? ' · 8&prime;-6&Prime;' : ''}</span>` +
          `<b>${Math.round(lvArea).toLocaleString()} m&sup2;</b><span class="chev">&#9660;</span></button>` +
          `<div class="prog-lv-body" data-lvbody="${lv}"${open ? '' : ' hidden'}>`;
        for (const g of gs) {
          const fixed = g.isCore || isCorridor(g.type);   // generated by the layout, not authored here
          const span = fixed ? '' : isShort(g.type) ? 'short' : 'long';
          html += `<div class="prog-row ${span}"><span class="nm" title="${escHtml(prettyName(g.type))}">${escHtml(prettyName(g.type))}${g.n > 1 ? ` <i>×${g.n}</i>` : ''}</span>` +
            `<span class="sp ${span}">${span ? span.toUpperCase() : ''}</span>` +
            (fixed
              ? `<input type="number" value="${Math.round(g.area)}" disabled title="Cores and corridors are sized by the layout" /><span class="del" style="visibility:hidden">&times;</span>`
              : `<input type="number" min="1" step="1" value="${Math.round(g.area)}" data-key="${escHtml(g.key)}" /><button class="del" data-key="${escHtml(g.key)}" title="Remove">&times;</button>`) +
            `</div>`;
        }
        html += `<div class="prog-add"><select data-lv="${lv}">${opts}</select><input type="number" min="1" step="1" value="100" data-lv="${lv}" /><button data-lv="${lv}">Add</button></div></div>`;
      }
      list.innerHTML = html || '<div style="font-size:10px;color:var(--text-lo);padding:8px 0">No program loaded.</div>';
      document.getElementById('prog-total').textContent = Math.round(total).toLocaleString() + ' m²';
    }

    (function initProgramPanel() {
      const list = document.getElementById('prog-list');
      list.addEventListener('change', e => {
        const el = e.target;
        if (el.tagName === 'INPUT' && el.dataset.key) setGroupArea(el.dataset.key, parseFloat(el.value));
      });
      list.addEventListener('click', e => {
        // a floor header opens its own rows; toggled in the DOM, not by re-rendering, so the
        // list does not jump back to the top under the pointer
        const head = e.target.closest('[data-lvhead]');
        if (head) {
          const lv = parseInt(head.dataset.lvhead, 10);
          const open = !PROG_OPEN_LV.has(lv);
          open ? PROG_OPEN_LV.add(lv) : PROG_OPEN_LV.delete(lv);
          head.classList.toggle('open', open);
          head.setAttribute('aria-expanded', String(open));
          const body = list.querySelector(`[data-lvbody="${lv}"]`);
          if (body) body.hidden = !open;
          return;
        }
        const del = e.target.closest('.del[data-key]');
        if (del) { removeGroup(del.dataset.key); return; }
        const add = e.target.closest('button[data-lv]');
        if (!add) return;
        const lv = parseInt(add.dataset.lv, 10);
        const sel = list.querySelector(`select[data-lv="${lv}"]`), num = list.querySelector(`input[data-lv="${lv}"]`);
        addProgramRow(lv, sel.value, parseFloat(num.value));
      });
      document.getElementById('prog-reset').addEventListener('click', () => {
        BASE_PROGRAM = INPUT_PROGRAM.map(p => ({ ...p }));
        PROGRAM_EDITED = false;
        applyScenario();
      });
    })();

    const ruleLabel = c => (c.levels === 'all' ? 'All floors' : c.levels.map(levelLabel).join(', ')) +
      ' · ' + (c.from ? c.from.label : 'convertible program') + ' → ' + prettyName(c.to.type);

    function syncScenarioUI() {
      const sl = document.getElementById('chat-slider'); if (!sl) return;
      // TL_HORIZON keeps the slider running past the last predicted event, so the settled
      // building is reachable rather than sitting exactly on the final conversion
      const horizon = Math.max(10, SCEN_YEAR, TL_HORIZON, ...CONVERSIONS.map(c => c.year), ...FORECAST_TRACK.map(t => t.year));
      sl.max = horizon; sl.value = SCEN_YEAR;
      // a tick on the line for every year that does something — the same set the demo playback
      // holds on, so what you see marked is what the run pauses for
      const ticks = document.getElementById('chat-ticks');
      if (ticks) {
        const beats = [...tlBeats()].sort((a, b) => a - b);
        const label = y => FORECAST_BASE_YEAR != null ? String(FORECAST_BASE_YEAR + y) : 'Y+' + y;
        // Every beat gets a tick; a beat only gets a NUMBER if there is room for one. Two events a
        // year apart on a 230 px strip would print their labels on top of each other, so the label
        // is dropped and the tick still says something happened there. Width is measured, not
        // guessed: the strip can be any width the panel is.
        const px = ticks.clientWidth || 230;
        const gap = (FORECAST_BASE_YEAR != null ? 30 : 26);   // 4-digit calendar years need more
        let lastX = -Infinity;
        ticks.innerHTML = beats.map(y => {
          const f = y / Math.max(1, horizon), x = f * px, past = y <= SCEN_YEAR;
          const room = x - lastX >= gap; if (room) lastX = x;
          return `<i class="${past ? 'past' : ''}" style="left:${f * 100}%" title="${label(y)}"></i>` +
            (room ? `<b class="${past ? 'past' : ''}" style="left:${f * 100}%">${label(y)}</b>` : '');
        }).join('');
      }
      // with a forecast track loaded the slider reads as calendar years, which is what the
      // scenarios are actually dated in
      const active = forecastAt(SCEN_YEAR);
      document.getElementById('chat-year').textContent =
        FORECAST_BASE_YEAR != null ? (FORECAST_BASE_YEAR + SCEN_YEAR) : SCEN_YEAR;
      // between two anchors, say so — otherwise a part-built year looks like the scenario
      // simply failed to deliver what its card promised
      const ps = PHASE_STATE;
      // Right of the year: the scenario this year is in, on the forecast path only. The plain
      // "horizon N yr" (and the "demo ·" that prefixed it) was dropped 260730 — the slider's own
      // travel says the horizon, and the see-the-change switch took the space.
      document.getElementById('chat-horizon').innerHTML =
        (FORECAST_BASE_YEAR != null
          ? `<span>` + escHtml(ps && ps.late
            ? `scenario ${ps.target} · building out · ${ps.built} floors up, ${ps.pending} to go`
            : active ? 'scenario ' + active.id + ' · ' + active.name : 'before the first scenario') + `</span>`
          : '') +
        // Offered, never imposed: 'change' colour greys out the whole unconverted SHORT kit. Since
        // the colour picker came out of the panel this is also the only way back, so it toggles.
        (PROGRAM.some(p => p.converted)
          ? (COLOR_MODE === 'change'
            ? `<button id="chg-see" title="Back to one hue per program type">back to type colour</button>`
            : `<button id="chg-see" title="Colour by what has changed">see the change</button>`)
          : '');
      // What this year actually did to the building. Split by span, because the two halves
      // behave differently and only one of them moves anything: a permanent room changes use
      // where it stands, a plug-in module unplugs and lands somewhere else.
      const chg = document.getElementById('chat-change');
      if (chg) {
        const conv = PROGRAM.filter(p => p.converted);
        if (TL_REASON) chg.innerHTML = '<span class="none">' + escHtml(TL_REASON) + ' Describe one below and the slider will run it.</span>';
        else if (!CONVERSIONS.length && !FORECAST_TRACK.length) chg.innerHTML = '';
        else if (!conv.length) chg.innerHTML = '<span class="none">Nothing has changed yet at this year.</span>';
        else {
          // one line per thing that happened; the m² total went 260730, the counts carry it
          const rooms = conv.filter(p => !isShort(p.origType)).length;
          const A = ADAPT_STATS, bits = [];
          if (rooms) bits.push(`<b class="blue">${rooms}</b> room${rooms === 1 ? '' : 's'} changed use in place`);
          if (A && A.moved) bits.push(`<b>${A.moved}</b> module${A.moved === 1 ? '' : 's'} re-plugged${A.plugs ? ` (<b>${A.plugs}</b> as bays off the frame)` : ''}`);
          else { const mods = conv.filter(p => isShort(p.origType)).length; if (mods) bits.push(`<b>${mods}</b> plug-in space${mods === 1 ? '' : 's'} swapped`); }
          if (A && A.dropped) bits.push(`<b>${A.dropped}</b> with nowhere legal to go`);
          chg.innerHTML = bits.map(b => `<div>${b}</div>`).join('') +
            // with no plug-in program nothing can move, and the model is pixel-identical at
            // every year. Saying so is the difference between a rule and a bug report.
            (EVOLUTION && EVOLUTION.flat ? `<div class="none">No plug-in program, so the massing stays put and only the use changes.</div>` : '');
        }
      }
      // The site reading behind the ordering. Stated once, with its own limits, so the
      // massing view never presents a counted ring as a catchment or as demand.
      const cx = document.getElementById('chat-ctx');
      if (cx) {
        const C = EVOLUTION && EVOLUTION.context;
        if (!C) cx.innerHTML = '';
        else {
          const mix = Object.entries(C.mix || {}).sort((a, b) => b[1] - a[1]).map(([k, n]) => `<b>${n}</b> ${escHtml(k)}`).join(' · ');
          const thin = (C.thin || []).map(t => escHtml(t.label)).join(', ');
          cx.innerHTML = `<span class="k">Site reading · ${escHtml(C.label || 'site')}</span>` +
            `within ${C.radius} m: ${mix}<br>` +
            `transit <b>${escHtml(C.transit.tier)}</b>${C.street ? ` · best frontage <b>${escHtml(C.street)}</b>` : ''}` +
            (C.capacity ? `<br>code allows <b>${C.capacity.allowedM2.toLocaleString()}</b> m² at FAR ${C.capacity.far}${C.capacity.farAssumed ? ' (assumed)' : ''}, drawn <b>${C.capacity.drawnM2.toLocaleString()}</b>` : '') +
            (thin ? `<br>thinnest around it: ${thin}` : '') +
            `<br><em>OSM composition of a 500 m radius. Not a catchment, not footfall, not demand.</em>`;
        }
      }
      const track = document.getElementById('chat-track');
      if (track) {
        track.innerHTML = FORECAST_TRACK.map(t =>
          `<div class="chat-rule${t.year > SCEN_YEAR ? ' pending' : ''}${active && active.id === t.id ? ' on' : ''}">` +
          `<span class="yr">${t.horizon || ('Y+' + t.year)}</span>` +
          `<span class="txt" title="${escHtml(t.name)}">${escHtml(t.id)} · ${escHtml(t.name)}</span></div>`).join('');
        track.style.display = FORECAST_TRACK.length ? 'block' : 'none';
      }
      // A predicted rule carries its likelihood tier and the DB basis it came from, so the
      // list says why the year is what it is instead of reading as an assertion.
      document.getElementById('chat-rules').innerHTML = [...CONVERSIONS].sort((a, b) => a.year - b.year || a.id - b.id)
        .map(c => {
          const tip = ruleLabel(c) + (c.basis ? '\n\n' + c.basis : '');
          // no 're-plug' label: the year chip is orange for exactly that, and the line already
          // reads '<use> → <use>'. The likelihood tier stays, it is DB evidence and nothing else says it.
          const tag = c.tier ? `<span class="tier">${escHtml(c.tier)}</span>` : '';
          // Yellow year chip when the plug-in kit is being re-plugged, orange when the year brings
          // in a use that was not in the building at all — the two things the timeline can do, told
          // apart at a glance instead of by reading the line.
          const fresh = !BASE_PROGRAM.some(p => p.type === c.to.type);
          return `<div class="chat-rule${c.year > SCEN_YEAR ? ' pending' : ''}${c.kind === 'short' && !fresh ? ' replug' : ''}"><span class="yr">Y+${c.year}</span>` +
            `<span class="txt" title="${escHtml(tip)}">${tag}${escHtml(ruleLabel(c))}</span>` +
            `<button class="del" data-id="${c.id}" title="Remove">&times;</button></div>`;
        })
        .join('');
    }

    const escHtml = t => String(t == null ? '' : t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    function say(who, html) {
      const log = document.getElementById('chat-log');
      const d = document.createElement('div');
      d.className = 'chat-msg ' + who;
      d.innerHTML = html;
      log.appendChild(d);
      log.scrollTop = log.scrollHeight;
      return d;   // the LLM fallback posts a placeholder and rewrites it when the answer lands
    }

    // ── Program edits by sentence ─────────────────────────────────────────────────────────
    //   These rewrite the INITIAL program (BASE_PROGRAM); the conversion timeline then
    //   replays on top of the result. Verbs:
    //     add     "add 200 m2 coffee shop on L1"   · area + floor required
    //     set     "set office to 800 m2"           · area required
    //     remove  "remove the gym on L3"           · a use named, or a bare floor drops the floor
    //     move    "move the gym to L5"             · same area, different floor
    //     make    "make L3 housing"                · year-0 use change, files NO timeline rule
    //     floors  "add 2 floors of office" · "remove L5"
    //   An area always needs a unit, so a number can never be confused with a floor. A line
    //   carrying a conversion connector ("L3 becomes housing") is left to parseScenario, which
    //   files it as an undoable timeline rule — that is the better tool and it already works.
    //   Returns true if it handled the line.
    const AREA_RE = /(\d[\d,]*(?:\.\d+)?)\s*(?:m2|m²|sqm|sq\.?\s?m|平方米|平方公尺)/i;
    const FLOOR_OBJ_RE = new RegExp('^(?:add|新增|加)\\s*(?:a|an|one|new)?\\s*(\\d+|[' + ZH_NUM + ']+)?\\s*(?:new\\s+)?(?:floors?|levels?|stor(?:eys?|ies|y)|層|樓層)', 'i');
    const MOVE_RE = /^(?:move|relocate|shift)(?![a-z])/i;
    const MOVE_ZH = /搬到|搬去|搬至|移到|移至|挪到/;
    const TO_SPLIT = /搬到|搬去|搬至|移到|移至|挪到|\bto\b|→|->/;

    const baseLevels = () => [...new Set(BASE_PROGRAM.map(p => p.level))].sort((a, b) => a - b);
    const progTotal = () => Math.round(BASE_PROGRAM.reduce((a, p) => a + p.area, 0)).toLocaleString();
    const vocabHint = () => USE_VOCAB.slice(0, 8).map(v => prettyName(v.type)).join(' · ');
    // A Site Forecast track replaces the base program outright in applyScenario, so an edit made
    // while one is loaded is real but invisible. Say so rather than let it look like a no-op.
    const trackNote = () => FORECAST_TRACK.length ? ' A Site Forecast track is driving the view, so this shows once the track is cleared.' : '';

    // One undo stack for both kinds of edit, so "undo" walks back what actually happened last
    // rather than only ever popping a conversion rule.
    let EDIT_LOG = [];
    function snapProgram() {
      EDIT_LOG.push({ kind: 'prog', snap: BASE_PROGRAM.map(p => ({ ...p })) });
      if (EDIT_LOG.length > 30) EDIT_LOG.shift();
    }

    function programEdit(raw) {
      const s = raw.trim();
      const isMove = MOVE_RE.test(s) || MOVE_ZH.test(s);
      const verb = /^(?:add|新增|加入|加)(?![a-z])/i.test(s) ? 'add'
        : /^(?:remove|delete|drop|刪除|移除|拿掉)(?![a-z])/i.test(s) ? 'remove'
        : isMove ? 'move'
        : /^(?:set|resize|設定)(?![a-z])/i.test(s) ? 'set'
        : /^(?:make|change|convert|改|把)(?![a-z])/i.test(s) ? 'make' : null;
      if (!verb) return false;
      if (verb === 'make' && CONNECT.test(s)) return false;   // "把 L3 改成住宅" stays a timeline rule
      const am = s.match(AREA_RE);
      const area = am ? parseFloat(am[1].replace(/,/g, '')) : NaN;

      // whole floors first — "add a floor of office" names a use too, and must not be read as "add a room"
      const fm = verb === 'add' ? s.match(FLOOR_OBJ_RE) : null;
      if (fm) return addFloors(s, Math.min(20, Math.max(1, num(fm[1] || '1') || 1)), area);

      const use = findUse(s);
      if (verb === 'remove' && !use) {
        const lv = parseLevels(s);
        if (lv && lv !== 'all') return removeFloors(lv);
        say('bot', 'Remove what? A program ("remove the gym on L3") or a whole floor ("remove L5").');
        return true;
      }
      if (!use) {
        say('bot', verb === 'move'
          ? 'Move what? Name a program, e.g. "move the gym to L5".'
          : `Which program? Name one, e.g. "add 200 m2 coffee shop on L1".<span class="sub">Known uses: ${escHtml(vocabHint())}, and ${USE_VOCAB.length - 8} more.</span>`);
        return true;
      }
      if (verb === 'move') return moveProgram(s, use);
      if ((verb === 'make' || verb === 'set') && !(area > 0)) return changeUse(s, use);

      const levels = parseLevels(s);
      const label = prettyName(use.v.type);

      if (verb === 'add') {
        if (!(area > 0)) { say('bot', 'How big? Give an area with a unit, e.g. "add 200 m2 ' + label.toLowerCase() + ' on L1".'); return true; }
        const on = levels === 'all' ? baseLevels() : levels;
        if (!on || !on.length) { say('bot', 'Which floor? e.g. "add ' + Math.round(area) + ' m2 ' + label.toLowerCase() + ' on L1", or "on every floor".'); return true; }
        snapProgram();
        for (const lv of on) addProgramRow(lv, use.v.type, area, true);
        applyScenario();
        say('bot', `Added <b>${escHtml(label)}</b>, ${Math.round(area).toLocaleString()} m² on ${on.map(levelLabel).join(', ')}.<span class="sub">Initial program is now ${progTotal()} m². The timeline replays on top of it.${trackNote()}</span>`);
        return true;
      }
      const hits = programGroups().filter(g => use.v.re.test(g.type) && !g.isCore && !isCorridor(g.type)
        && (!levels || levels === 'all' || levels.includes(g.level)));
      if (!hits.length) { say('bot', `No ${escHtml(label.toLowerCase())} ${levels && levels !== 'all' ? 'on ' + levels.map(levelLabel).join(', ') : 'in the initial program'}.`); return true; }
      if (verb === 'remove') {
        const gone = hits.reduce((a, g) => a + g.area, 0);
        snapProgram();
        for (const g of hits) removeGroup(g.key, true);
        applyScenario();
        say('bot', `Removed <b>${escHtml(hits.map(g => prettyName(g.type) + ' ' + levelLabel(g.level)).join(', '))}</b>, ${Math.round(gone).toLocaleString()} m² total.<span class="sub">Initial program is now ${progTotal()} m².${trackNote()}</span>`);
        return true;
      }
      const was = hits.reduce((a, g) => a + g.area, 0);
      snapProgram();
      for (const g of hits) setGroupArea(g.key, area, true);
      applyScenario();
      // one label per floor: two office types on the same level are two groups, not two floors
      const on = [...new Set(hits.map(g => g.level))].sort((a, b) => a - b).map(levelLabel).join(', ');
      say('bot', `<b>${escHtml(label)}</b> on ${on} set to ${Math.round(area).toLocaleString()} m² per group (was ${Math.round(was).toLocaleString()} m² total, ${hits.length} group${hits.length > 1 ? 's' : ''}).<span class="sub">Initial program is now ${progTotal()} m².${trackNote()}</span>`);
      return true;
    }

    // "move the gym to L5" — the split point is the LAST connector, so "move the L3 offices to
    // L5" reads L3 as the source and L5 as the destination rather than collecting both.
    function moveProgram(s, use) {
      let m = null;
      for (const x of s.matchAll(new RegExp(TO_SPLIT, 'gi'))) m = x;
      const dst = m ? parseLevels(s.slice(m.index + m[0].length)) : null;
      if (!dst || dst === 'all') { say('bot', `Move it where? e.g. "move the ${escHtml(prettyName(use.v.type).toLowerCase())} to L5".`); return true; }
      const target = dst[dst.length - 1];
      const src = parseLevels(s.slice(0, m.index));
      const label = prettyName(use.v.type);
      const hits = programGroups().filter(g => use.v.re.test(g.type) && !g.isCore && !isCorridor(g.type)
        && (!src || src === 'all' || src.includes(g.level)) && g.level !== target);
      if (!hits.length) { say('bot', `No ${escHtml(label.toLowerCase())} to move ${src && src !== 'all' ? 'from ' + src.map(levelLabel).join(', ') : 'off ' + levelLabel(target)}.`); return true; }
      const keys = new Set(hits.map(g => g.key));
      const rows = BASE_PROGRAM.filter(p => keys.has(groupKey(p)));
      snapProgram();
      for (const p of rows) p.level = target;
      PROGRAM_EDITED = true;
      applyScenario();
      const from = [...new Set(hits.map(g => g.level))].sort((a, b) => a - b);
      say('bot', `Moved <b>${escHtml(label)}</b> from ${from.map(levelLabel).join(', ')} to ${levelLabel(target)}, ${Math.round(rows.reduce((a, p) => a + p.area, 0)).toLocaleString()} m².<span class="sub">Area unchanged. The packer re-fits both floors, so the plate outline can change.${trackNote()}</span>`);
      return true;
    }

    // "make L3 housing" — a year-0 use change written straight into the initial program. No
    // from-filter here on purpose: naming both sides ("the office on L3 becomes housing") is a
    // conversion sentence, and parseScenario already files that as an undoable rule.
    function changeUse(s, use) {
      const levels = parseLevels(s);
      const label = prettyName(use.v.type);
      if (!levels) { say('bot', `Which floor? e.g. "make L3 ${escHtml(label.toLowerCase())}", or "set the office to 800 m2" to resize instead.`); return true; }
      let rows = BASE_PROGRAM.filter(p => !p.isCore && !isCorridor(p.type) && !isFixedUse(p.type)
        && (levels === 'all' || levels.includes(p.level)));
      // ground-floor rule: "all floors housing" means all floors above the street
      let groundNote = '';
      if (isDwelling(use.v.type) && levels === 'all' && rows.some(p => p.level === 0)) {
        rows = rows.filter(p => p.level !== 0);
        groundNote = ' L1 kept as it is: the ground floor is the street face, so a dwelling there has to be asked for by name.';
      } else if (isDwelling(use.v.type) && levels !== 'all' && levels.includes(0)) {
        groundNote = ' L1 is the street face and normally stays public, so this one is unusual.';
      }
      if (!rows.length) { say('bot', 'Nothing convertible there. Cores, corridors and service spaces (restrooms, plant, parking) are left alone.'); return true; }
      const area = rows.reduce((a, p) => a + p.area, 0);
      snapProgram();
      for (const p of rows) { p.type = use.v.type; p.category = use.v.category; }
      PROGRAM_EDITED = true;
      applyScenario();
      say('bot', `${levels === 'all' ? 'All floors' : levels.map(levelLabel).join(', ')} set to <b>${escHtml(label)}</b> — ${rows.length} spaces, ${Math.round(area).toLocaleString()} m².<span class="sub">This is the year-0 program, not a timeline rule. Cores, corridors and service spaces untouched.${groundNote}${trackNote()}</span>`);
      return true;
    }

    // ── the building-type question, in the chat ──────────────────────────────────────────
    // Asked once when the tab first opens. Answering recasts the plates now and sets the
    // default for everything asked afterwards.
    const btChips = () => '<div class="chat-chips">' + Object.entries(BUILDING_TYPES)
      .map(([k, label]) => `<button data-btype="${k}"${BUILDING_TYPE === k ? ' class="on"' : ''}>${label}</button>`).join('') + '</div>';

    let ASKED_BTYPE = false;
    function askBuildingType() {
      if (ASKED_BTYPE) return;
      ASKED_BTYPE = true;
      if (BUILDING_TYPE) {
        const n = BUILDING_TYPES[BUILDING_TYPE].toLowerCase();
        say('bot ask', `Programming ${/^[aeiou]/.test(n) ? 'an' : 'a'} <b>${n}</b> building.` +
          '<span class="sub">Pick another to recast the plates.</span>' + btChips());
        return;
      }
      say('bot ask', '<em>What building type</em> are we programming?' +
        '<span class="sub">Sets the main use above grade. Plug-in programs stay.</span>' + btChips());
    }

    function answerBuildingType(key) {
      if (!BUILDING_TYPES[key]) return;
      BUILDING_TYPE = key;
      ASKED_BTYPE = true;
      const name = BUILDING_TYPES[key];
      // repaint any chip row already in the log, so the answered type reads as chosen
      for (const b of document.querySelectorAll('#chat-log .chat-chips button')) b.classList.toggle('on', b.dataset.btype === key);
      if (!BASE_PROGRAM.length) {
        say('bot', `<b>${name}</b> it is.<span class="sub">Nothing loaded yet, so this shapes what comes next.</span>`);
        return;
      }
      snapProgram();
      const r = applyBuildingType();
      if (!r.n) {
        EDIT_LOG.pop();   // nothing moved, so nothing to undo
        say('bot', `Already <b>${escHtml(name.toLowerCase())}</b> above grade. Nothing to recast.` +
          '<span class="sub">Later edits still default to it.</span>');
        return;
      }
      applyScenario();
      const where = r.levels.length > 2
        ? levelLabel(r.levels[0]) + '–' + levelLabel(r.levels[r.levels.length - 1])
        : r.levels.map(levelLabel).join(', ');
      const notes = [];
      if (key === 'mixed-use') {
        const h = r.levels.filter(housingAt);
        notes.push(h.length ? `Office and housing alternate up the stack: ${h.map(levelLabel).join(', ')} housing.` : 'Office and housing alternate up the stack.');
      }
      notes.push('Plug-in programs, cores, corridors and service spaces untouched.');
      notes.push(`Floors added later default to ${escHtml(name.toLowerCase())}.`);
      say('bot', `<b>${escHtml(name)}</b> it is. ${where}: ${r.n} space${r.n > 1 ? 's' : ''}, ` +
        `${Math.round(r.area).toLocaleString()} m² recast.<span class="sub">${notes.join(' ')}${trackNote()}</span>`);
    }

    // "add 2 floors of office" — new levels on top, sized from the average built floor unless an
    // area is given. The exit cores are carried up with them, or the new floor is an X-1
    // violation the moment it appears.
    function addFloors(s, count, area) {
      const lvs = baseLevels();
      if (!lvs.length) { say('bot', 'No program loaded yet.'); return true; }
      const use = findUse(s);
      // no use named: the answered building type decides, which on mixed-use means the new
      // floors keep alternating rather than all arriving as the same plate
      const live = BASE_PROGRAM.filter(p => !p.isCore);
      const each = area > 0 ? area : Math.round(live.reduce((a, p) => a + p.area, 0) / lvs.length);
      if (!(each > 0)) { say('bot', 'How big? e.g. "add a floor of office, 900 m2".'); return true; }
      snapProgram();
      const top = Math.max(...lvs);
      const cores = BASE_PROGRAM.filter(p => p.level === top && p.isCore).map(p => ({ ...p }));
      const names = [];
      for (let i = 1; i <= count; i++) {
        const lv = top + i;
        for (const c of cores) BASE_PROGRAM.push({ ...c, uid: ++ROW_UID, level: lv });
        if (!use && BUILDING_TYPE && housingAt(lv)) {
          for (const [t, a] of decomposeHousing(each)) addProgramRow(lv, t, a, true);
          names.push('housing');
        } else {
          const type = use ? use.v.type : (BUILDING_TYPE ? mainUseAt(lv) : 'office loft');
          addProgramRow(lv, type, each, true);
          names.push(prettyName(type));
        }
      }
      applyScenario();
      const span = count > 1 ? levelLabel(top + 1) + '–' + levelLabel(top + count) : levelLabel(top + 1);
      const what = [...new Set(names)].join(' / ');
      say('bot', `Added ${count} floor${count > 1 ? 's' : ''} of <b>${escHtml(what)}</b> at ${Math.round(each).toLocaleString()} m² each — ${span}.<span class="sub">${cores.length ? `Cores from ${levelLabel(top)} carried up. ` : ''}Initial program is now ${progTotal()} m².${trackNote()}</span>`);
      return true;
    }

    // "remove L5" — the floor goes and the stack closes up, so levels stay contiguous. Above-grade
    // floors drop, basements rise: neither side crosses grade. Conversion rules follow the shift,
    // or a rule aimed at L7 would silently start pointing at a different floor.
    function removeFloors(levels) {
      const lvs = baseLevels();
      const gone = new Set(levels.filter(lv => lvs.includes(lv)));
      if (!gone.size) { say('bot', `Nothing on ${levels.map(levelLabel).join(', ')}.`); return true; }
      if (gone.size >= lvs.length) { say('bot', 'That is every floor. Load a different program instead of emptying this one.'); return true; }
      const label = [...gone].sort((a, b) => a - b).map(levelLabel).join(', ');
      const area = BASE_PROGRAM.filter(p => gone.has(p.level)).reduce((a, p) => a + p.area, 0);
      snapProgram();
      BASE_PROGRAM = BASE_PROGRAM.filter(p => !gone.has(p.level));
      const above = [...gone].filter(l => l >= 0), below = [...gone].filter(l => l < 0);
      const remap = l => l >= 0 ? l - above.filter(g => g < l).length : l + below.filter(g => g > l).length;
      for (const p of BASE_PROGRAM) p.level = remap(p.level);
      for (const c of CONVERSIONS) if (c.levels !== 'all') c.levels = c.levels.filter(l => !gone.has(l)).map(remap);
      CONVERSIONS = CONVERSIONS.filter(c => c.levels === 'all' || c.levels.length);
      PROGRAM_EDITED = true;
      applyScenario();
      say('bot', `Removed ${escHtml(label)}, ${Math.round(area).toLocaleString()} m².<span class="sub">The floors above shifted down. Initial program is now ${progTotal()} m² over ${baseLevels().length} levels.${trackNote()}</span>`);
      return true;
    }

    // ── LLM fallback (optional, off unless a key is set) ──────────────────────────────────
    //   Its only job is to rewrite a sentence the rules above could not parse into ONE of the
    //   documented commands. It never edits the program itself, so it can do nothing a typed
    //   command cannot, and the rewrite is printed back so what ran is visible.
    //   The key is kept in this browser's localStorage and is sent to Anthropic, with the
    //   sentence, on every call. `key <value>` sets it, `key off` clears it, `?llm=0` parks
    //   the whole layer. With no key the app behaves exactly as it did before.
    const LLM_MODEL = 'claude-opus-5';
    const LLM_URL = 'https://api.anthropic.com/v1/messages';
    const LLM_OFF = new URLSearchParams(location.search).get('llm') === '0';
    let LLM_KEY = '';
    try { LLM_KEY = localStorage.getItem('nexaApiKey') || ''; } catch (e) { LLM_KEY = ''; }
    const llmOn = () => !LLM_OFF && !!LLM_KEY;
    const llmSet = v => { LLM_KEY = v; try { v ? localStorage.setItem('nexaApiKey', v) : localStorage.removeItem('nexaApiKey'); } catch (e) { } };

    const LLM_SCHEMA = {
      type: 'object',
      properties: {
        command: { type: 'string', description: 'One command in the documented grammar, in English. Empty string if the sentence is not one of them.' },
        note: { type: 'string', description: 'One short sentence for the user, in the language they wrote in.' }
      },
      required: ['command', 'note'],
      additionalProperties: false
    };

    const llmSystem = () => [
      'You turn a sentence about a building program into ONE command for a massing tool. You do nothing else.',
      '',
      'The commands, written in English, exactly these shapes:',
      '  add <area> m2 <use> on <floor>',
      '  set <use> to <area> m2',
      '  remove the <use> on <floor>',
      '  remove <floor>',
      '  move the <use> to <floor>',
      '  make <floor> <use>',
      '  add <n> floors of <use>',
      '  in <n> years turn <floor> into <use>',
      '',
      'Floors are L1, L2 … above grade and B1, B2 … below. "every floor" is also accepted.',
      'Areas always carry the unit m2. Never invent an area or a floor the user did not give.',
      'Uses must be one of: ' + USE_VOCAB.map(v => v.type).join(', ') + '.',
      'Floors that exist right now: ' + (baseLevels().map(levelLabel).join(', ') || 'none'),
      '',
      'If the sentence does not map onto one of those commands, or a required part is missing,',
      'return an empty command and say what is missing in the note.',
      'Write the note plainly and briefly, in the language the user wrote in. No em dashes.'
    ].join('\n');

    async function llmTranslate(raw) {
      const res = await fetch(LLM_URL, {
        method: 'POST',
        headers: {
          'content-type': 'application/json',
          'x-api-key': LLM_KEY,
          'anthropic-version': '2023-06-01',
          'anthropic-dangerous-direct-browser-access': 'true'   // opts a browser origin into the API
        },
        body: JSON.stringify({
          model: LLM_MODEL,
          max_tokens: 8192,   // thinking shares this budget, so leave room above the tiny answer
          output_config: { effort: 'low', format: { type: 'json_schema', schema: LLM_SCHEMA } },
          system: llmSystem(),
          messages: [{ role: 'user', content: raw }]
        })
      });
      if (!res.ok) {
        let msg = res.status + ' ' + res.statusText;
        try { const e = await res.json(); if (e && e.error && e.error.message) msg = e.error.message; } catch (err) { }
        throw new Error(msg);
      }
      const data = await res.json();
      if (data.stop_reason === 'refusal') throw new Error('The model declined that one.');
      if (data.stop_reason === 'max_tokens') throw new Error('The answer was cut off.');
      const block = (data.content || []).find(b => b.type === 'text');
      if (!block) throw new Error('Nothing came back.');
      return JSON.parse(block.text);
    }

    async function llmFallback(raw) {
      const slot = say('bot', '<span style="color:var(--text-lo)">Reading that…</span>');
      try {
        const out = await llmTranslate(raw);
        const cmd = String(out.command || '').trim();
        if (!cmd) { slot.innerHTML = escHtml(out.note || 'I could not turn that into a command.'); return; }
        slot.innerHTML = `Read as <b>${escHtml(cmd)}</b>.`;
        chatHandle(cmd, true);   // straight back through the same rules as a typed command
      } catch (e) {
        slot.innerHTML = `Could not reach the model.<span class="sub">${escHtml(e.message)}</span>`;
      }
    }

    function chatHandle(raw, fromLLM) {
      const t = raw.trim().toLowerCase();
      const km = raw.trim().match(/^key\s*(.*)$/i);
      if (km) {
        const v = km[1].trim();
        if (!v) {
          say('bot', llmOn()
            ? 'A key is set. Sentences the built-in commands cannot read are sent to Anthropic to be rewritten as a command. Type "key off" to stop.'
            : 'No key set, so everything runs locally. Type "key sk-ant-…" to let a model rewrite sentences the built-in commands cannot read.<span class="sub">The key is stored in this browser and sent to Anthropic with each sentence.</span>');
          return;
        }
        if (/^off$/i.test(v)) { llmSet(''); say('bot', 'Key cleared. Everything runs locally again.'); return; }
        llmSet(v);
        say('bot', 'Key stored in this browser.<span class="sub">Sentences the built-in commands cannot read will now be sent to Anthropic, with the key, to be rewritten as a command. It never edits the program directly. Type "key off" to stop.</span>');
        return;
      }
      if (/^(help|\?|說明|怎麼用|怎么用)$/.test(t)) {
        say('bot', 'Set the building type:<br>"office" · "housing" · "mixed-use"<br><br>Change the program over time:<br>"in 8 years turn L3 into housing"<br>"after 5 years the office on L2 becomes exhibition"<br>"year 10 B1 to retail"<br><br>Edit the initial program (year 0):<br>"add 200 m2 coffee shop on L1"<br>"set office to 800 m2"<br>"remove the gym on L3"<br>"move the gym to L5"<br>"make L3 housing"<br>"add 2 floors of office" · "remove L5"<span class="sub">Also: list · undo · reset · key. Areas need a unit (m2) so a number is never read as a floor. Everything runs locally unless you set a key.</span>');
        return;
      }
      if (/^(reset|clear|清除|清空|重設|重置)$/.test(t)) {
        CONVERSIONS = []; SCEN_YEAR = 0;
        EDIT_LOG = EDIT_LOG.filter(e => e.kind === 'prog');   // reset is about the timeline; program edits stay undoable
        applyScenario();
        say('bot', 'Cleared. Back to year 0.');
        return;
      }
      if (/^(undo|復原|撤銷)$/.test(t)) {
        // walk back past rules already deleted from the list panel, so undo never no-ops silently
        while (EDIT_LOG.length) {
          const e = EDIT_LOG.pop();
          if (e.kind === 'prog') {
            BASE_PROGRAM = e.snap; PROGRAM_EDITED = true; applyScenario();
            say('bot', `Undid the last program edit. Initial program is ${progTotal()} m².`);
            return;
          }
          const c = CONVERSIONS.find(x => x.id === e.id);
          if (!c) continue;
          CONVERSIONS = CONVERSIONS.filter(x => x.id !== e.id); applyScenario();
          say('bot', 'Removed: ' + escHtml(ruleLabel(c)));
          return;
        }
        say('bot', 'Nothing to undo.');
        return;
      }
      if (/^(list|rules|列表|規則|目前)$/.test(t)) {
        say('bot', CONVERSIONS.length ? CONVERSIONS.length + ' rule(s), listed below.' : 'No conversions yet.');
        return;
      }
      // a bare "office" / "housing" / "mixed-use" answers the building-type question. Read
      // before programEdit, or "make it housing" is a use change with no floor named.
      const bt = readBuildingType(raw);
      if (bt) { answerBuildingType(bt); return; }
      if (!BASE_PROGRAM.length) { say('bot', 'No program loaded yet.'); return; }
      if (programEdit(raw)) return;   // "add / set / remove" act on the initial program, not the timeline

      const r = parseScenario(raw);
      if (!r.ok) {
        // the rules could not read it. Hand it to the model if one is configured, else say so.
        if (llmOn() && !fromLLM) { llmFallback(raw); return; }
        say('bot', r.why === 'no-target'
          ? 'I did not catch the new use. Try "in 8 years turn L3 into housing".'
          : 'Which spaces? Give me a level or the current use, e.g. "L3" or "the offices".');
        return;
      }
      const rule = { id: ++CONV_SEQ, year: r.year, levels: r.levels, from: r.from, to: r.to };
      CONVERSIONS.push(rule);
      SCEN_YEAR = Math.max(SCEN_YEAR, rule.year);   // jump the timeline to the year just described
      applyScenario();
      const hit = CONV_HITS.get(rule.id) || { n: 0, area: 0 };
      if (!hit.n) {
        CONVERSIONS = CONVERSIONS.filter(c => c.id !== rule.id);
        applyScenario();
        say('bot', 'Nothing convertible there. Cores, corridors and service spaces (restrooms, plant, parking) are left alone.');
        return;
      }
      EDIT_LOG.push({ kind: 'conv', id: rule.id });   // only rules that stuck are worth undoing
      if (EDIT_LOG.length > 30) EDIT_LOG.shift();
      const span = isShort(rule.to.type) ? 'SHORT' : 'LONG';
      const msg = `Year ${rule.year} · ${rule.levels === 'all' ? 'all floors' : rule.levels.map(levelLabel).join(', ')}: ${rule.from ? escHtml(rule.from.label) : 'convertible program'} → <b>${escHtml(prettyName(rule.to.type))}</b> (${hit.n} spaces, ${Math.round(hit.area).toLocaleString()} m², ${span} timespan).`;
      const notes = [];
      // what the tiers actually did — the frame never moves, so the only news is identity vs modules
      const A = ADAPT_STATS;
      if (A) {
        if (A.longRooms) notes.push(`${A.longRooms} long-duration ${A.longRooms === 1 ? 'room changes' : 'rooms change'} use in place, same footprint.`);
        if (A.moved) notes.push(`${A.moved} short-duration ${A.moved === 1 ? 'module is' : 'modules are'} unplugged and re-plugged${A.plugs ? `, ${A.plugs} of them as plug-in bays off the frame` : ''}.`);
        if (A.dropped) notes.push(`${A.dropped} ${A.dropped === 1 ? 'module has' : 'modules have'} nowhere legal to go: the frame is full and the cantilever limit is reached.`);
      }
      if (r.assumedYear) notes.push('No year given, filed at year 0.');
      say('bot', msg + '<span class="sub">' + notes.join(' ') + '</span>');
    }

    let openChatPanel = null;   // set by initChat; the handover and ?play=1 open the tab directly
    (function initChat() {
      const panel = document.getElementById('chat-panel');
      const toggle = document.getElementById('chat-toggle');
      const input = document.getElementById('chat-input');
      // ── the left column is one accordion: Layout · Program, then Adaptive use ──
      // Two headers, two bodies, one open at a time. Layout and Program merged into a single
      // panel (layout fixed on top, program scrolling under it), so 'layout' now opens both.
      // Its body is a div inside the panel; Adaptive use is a panel of its own, so it takes a
      // class rather than a display style.
      const layoutHead = document.getElementById('acc-layout'), layoutBody = document.getElementById('left-body');
      const setTab = t => {
        layoutBody.style.display = t === 'layout' ? '' : 'none';
        layoutHead.classList.toggle('open', t === 'layout');
        layoutHead.setAttribute('aria-expanded', String(t === 'layout'));
        for (const [head, body, name] of [[toggle, panel, 'adaptive']]) {
          head.classList.toggle('open', t === name);
          head.setAttribute('aria-expanded', String(t === name));
          body.classList.toggle('open', t === name);
        }
        // the big year readout belongs to the timeline, so it comes and goes with it
        document.getElementById('year-badge').classList.toggle('open', t === 'adaptive');
        document.getElementById('left-panel').classList.toggle('collapsed', t !== 'layout');
        // the only greeting is the one question the page cannot answer for itself; the bar's
        // placeholder already shows the form a rule takes, so nothing else is said
        if (t === 'adaptive') { askBuildingType(); input.focus(); }
      };
      const isOpen = name => (name === 'layout' ? layoutBody.style.display !== 'none'
        : panel.classList.contains('open'));
      const hit = name => setTab(isOpen(name) ? null : name);
      openChatPanel = on => setTab(on ? 'adaptive' : 'layout');   // the handover and ?play=1 open it directly
      layoutHead.addEventListener('click', () => hit('layout'));
      toggle.addEventListener('click', () => hit('adaptive'));
      const send = () => {
        const v = input.value.trim(); if (!v) return;
        input.value = '';
        // the bar is under the model, the conversation and the rule it files are in the tab —
        // so sending brings the tab up, or the answer lands somewhere the user cannot see
        if (!isOpen('adaptive')) setTab('adaptive');
        // never echo an API key into the transcript
        say('you', escHtml(/^key\s+\S/i.test(v) ? 'key ••••••••' : v));
        chatHandle(v);
      };
      // the chips are a shortcut for typing the same word, so they go through the same answer
      document.getElementById('chat-log').addEventListener('click', e => {
        const b = e.target.closest('button[data-btype]');
        if (!b) return;
        say('you', escHtml(b.textContent));
        answerBuildingType(b.dataset.btype);
      });
      document.getElementById('chat-send').addEventListener('click', send);
      input.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); send(); } });
      document.getElementById('tl-play').addEventListener('click', () => tlPlay());
      document.getElementById('chat-slider').addEventListener('input', e => {
        tlStop();               // dragging the slider is the user taking over
        SCEN_YEAR = parseInt(e.target.value, 10) || 0;
        document.getElementById('chat-year').textContent = SCEN_YEAR;
        applyScenario();
      });
      // the readout's own switch into 'change' colour and back — the only way there since the
      // colour picker left the panel, so it has to go both directions
      document.getElementById('chat-horizon').addEventListener('click', e => {
        if (!e.target.closest('#chg-see')) return;
        COLOR_MODE = COLOR_MODE === 'change' ? 'type' : 'change';
        build(); syncScenarioUI();   // build() re-renders the legend
      });
      document.getElementById('chat-rules').addEventListener('click', e => {
        const b = e.target.closest('.del'); if (!b) return;
        CONVERSIONS = CONVERSIONS.filter(c => c.id !== +b.dataset.id);
        applyScenario();
      });
    })();

    // ── load ──
    // A load replaces the initial program: keep a verbatim copy for "Reset to input" and
    // drop any scenario built on the previous one.
    function loadText(raw, src) {
      BASE_PROGRAM = parse(raw);
      INPUT_PROGRAM = BASE_PROGRAM.map(p => ({ ...p }));
      PROGRAM_SRC = src || 'sample'; PROGRAM_EDITED = false;
      VIEW_FRAMED = false;                 // a different program is a different building: fit it once
      // A handed-over timeline belongs to the handed-over program, so this load keeps it and
      // re-seeds it. Any load that REPLACES the program (a dropped file) drops the payloads
      // first, and then this falls through to the plain reset.
      // It has to be re-seeded here rather than after the call: an extra build() with the
      // forecast track absent leaves a core lock derived from the base program alone, and the
      // real build then reuses it. That moved City Market scenario B from 5,556 m² occupied to
      // 5,636 and its frame occupancy from 59% to 61% (measured 260729).
      if (EVOLUTION || FUTURES) applyTimelineMode(false);
      else {
        CONVERSIONS = []; SCEN_YEAR = 0; TL_HORIZON = 0; TL_DEMO = false;
        // nothing was handed over, so derive a demo scenario from this program. A dropped file
        // gets its own; ?demo=0 leaves the slider empty (the pre-260729 behaviour).
        if (DEMO_ON) buildDemoTimeline();
      }
      applyScenario();
    }
    // Program Source panel removed — load via drag-and-drop (below) or the ?src=input wizard handoff.
    const drop = document.getElementById('drop-overlay');
    addEventListener('dragover', e => { e.preventDefault(); drop.style.display = 'flex'; });
    addEventListener('dragleave', e => { if (e.clientX === 0 && e.clientY === 0) drop.style.display = 'none'; });
    addEventListener('drop', e => { e.preventDefault(); drop.style.display = 'none'; const f = e.dataTransfer.files[0]; if (!f) return; const rd = new FileReader(); rd.onload = () => { FLOOR_H_OVERRIDE = new Map(); dropTimeline(); loadText(rd.result, 'file'); }; rd.readAsText(f); });   // dropped file = fresh program: drop the SAMPLE's L3 height override and the handed-over timeline, which described a different building

    // A dropped file is a different building, so the wizard's prediction no longer describes it.
    function dropTimeline() {
      EVOLUTION = null; FUTURES = null; TL_REASON = null;
      CONVERSIONS = []; FORECAST_TRACK = []; FORECAST_BASE_YEAR = null; TL_HORIZON = 0; SCEN_YEAR = 0;
      const seg = document.getElementById('tl-mode'); if (seg) seg.style.display = 'none';
    }

    document.getElementById('ctl-fh').addEventListener('change', e => { FLOOR_H = (parseFloat(e.target.value) || 12.75) * FT; build(); });
    // segmented two-option toggle buttons
    function seg(id, cb) {
      const el = document.getElementById(id);
      el.addEventListener('click', e => {
        const b = e.target.closest('button'); if (!b) return;
        [...el.children].forEach(c => c.classList.toggle('active', c === b));
        cb(b.dataset.v);
      });
    }
    seg('seg-mode', v => { RENDER_MODE = v; updateExportPanel(); updateSysToggle(); build(); });
    seg('seg-struct-sys', v => { STRUCT_SYS = v; build(); });
    // The structural-system switch only changes what Structure mode draws, so it rides with it.
    function updateSysToggle() {
      const el = document.getElementById('seg-struct-sys');
      if (el) el.style.display = RENDER_MODE === 'structure' ? '' : 'none';
    }
    // Export panel follows the render mode: massing exports in Solid massing, structure exports in Structure.
    function updateExportPanel() {
      const structure = RENDER_MODE === 'structure';
      document.getElementById('export-massing').style.display = structure ? 'none' : '';
      document.getElementById('export-structure').style.display = structure ? '' : 'none';
      document.getElementById('export-title').innerHTML = structure ? 'Export &middot; Structure' : 'Export &middot; Massing';
    }
    seg('seg-core', v => { CORE_OPTION = v; build(); });
    // M8: the readout states the OUTCOME (which side the core landed on), not the flips —
    // "core NE" is checkable against the drawing, "flipX true" is not.
    function renderOrientReadout() {
      const v = document.getElementById('ap-val');
      if (!v) return;
      const SRC = { frontage: ' · main frontage', site: ' · nearest street', manual: '', none: '' };
      v.textContent = SITE_APPROACH == null ? 'not set'
        : `${SITE_APPROACH}° ${compassOf(SITE_APPROACH)}${SRC[SITE_APPROACH_SRC] || ''}`;
      const gv = document.getElementById('gr-val'), gs = document.getElementById('ctl-grid');
      if (gv) gv.textContent = `${GRID_ROT_DEG > 0 ? '+' : ''}${GRID_ROT_DEG}°` + (GRID_ROT_LOCK ? ' · pinned' : STREET_BEARING != null ? ' · from street' : '');
      if (gs && !GRID_ROT_LOCK) gs.value = String(Math.round(GRID_ROT_DEG));
    }
    document.getElementById('ctl-approach').addEventListener('input', e => {
      SITE_APPROACH = parseInt(e.target.value, 10); SITE_APPROACH_SRC = 'manual';
      build(); renderOrientReadout();
    });
    // Moving this pins the rotation, exactly as ?grid= does: once the architect has turned the
    // site by hand, a rebuild must not silently put it back on the street it derived.
    document.getElementById('ctl-grid').addEventListener('input', e => {
      GRID_ROT_DEG = norm180(parseInt(e.target.value, 10)); GRID_ROT_LOCK = true;
      build(); renderOrientReadout();
    });
    // Core-vs-approach and View-on-rebuild lost their controls on 260730, Cantilever on 260731;
    // all three still work, set the way they were before there was a control: ?facing=, ?view=refit,
    // ?canti=show.
    seg('seg-program', v => {
      PROGRAM_MODE = v;
      document.getElementById('move-controls').style.display = v === 'on' ? '' : 'none';
      // Program Mode takes the right column over: while you are placing blocks, the palette is
      // what that side is for. Statistics, code check and export come back when the mode goes off.
      document.getElementById('add-palette').style.display = v === 'on' ? 'flex' : 'none';
      document.getElementById('right-stack').style.display = v === 'on' ? 'none' : '';
      if (v !== 'on') {
        if (drag) { try { renderer.domElement.releasePointerCapture(drag.pointerId); } catch (e) {} drag = null; controls.enabled = true; }
        setSelected(null);
      }
    });
    seg('seg-move', v => { MOVE_INC = v === '2/3' ? 2 / 3 : v === '1/2' ? 0.5 : 1; });
    document.getElementById('btn-reset-moves').addEventListener('click', () => { MOVE_OFFSETS.clear(); applyMoveOffsets(); moveReadout(); });

    // ── export ──
    function download(name, text) {
      const blob = new Blob([text], { type: 'text/plain' }); const a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = name; a.click(); URL.revokeObjectURL(a.href);
    }
    // SHORT = porous plug-in bricks (part: 'short' massing volume);
    // LONG = everything else (solid programs + cores + circulation count as LONG).
    const isLongBox = b => !b.short && !b.part;

    // ── SHORT kit export: writes the REAL extracted Rhino module meshes (BLOCKS geometry),
    //    one instance per placement in SHORT_PLACE, mirroring geomOf()'s scale + z-rotation.
    //    Works from ANY view mode — placements are computed on every build.
    const FRAME_PARTS = [['frameHx', 'frameH', 'black', 'x'], ['frameHz', 'frameH', 'black', 'z'], ['frameV', 'frameV', 'black', 'x'], ['stair', 'stair', 'black', 'x']];
    const INFILL_PARTS = [['infillX', 'infill', 'orange', 'x'], ['infillZ', 'infill', 'orange', 'z']];
    function exportKitOBJ(parts, fname, title, acc) {
      if (!BLOCKS) { if (!acc) alert('Module block geometry (BLOCKS) missing — cannot export the kit.'); return; }
      if (!SHORT_PLACE || !parts.some(([l]) => SHORT_PLACE[l] && SHORT_PLACE[l].length)) { if (!acc) alert(`Nothing to export for ${title} — no SHORT programs in the current model.`); return; }
      const meshCache = {};
      const meshOf = (name, group, orient) => {
        const key = name + '.' + group + '.' + orient; if (meshCache[key]) return meshCache[key];
        const src = BLOCKS[name].groups[group];
        let verts = [];
        for (let n = 0; n < src.p.length; n += 3) verts.push([src.p[n] * BLOCK_S, src.p[n + 1] * BLOCK_S, src.p[n + 2] * BLOCK_S]);
        if (orient === 'z') {                        // match geomOf: rotate 90° about Y, re-origin to min corner
          verts = verts.map(v => [v[2], v[1], -v[0]]);
          const mn = [Infinity, Infinity, Infinity];
          for (const v of verts) for (let d = 0; d < 3; d++) mn[d] = Math.min(mn[d], v[d]);
          verts = verts.map(v => [v[0] - mn[0], v[1] - mn[1], v[2] - mn[2]]);

      };
      const A = acc || { obj: `# ${title} — extracted Rhino module blocks · module 8'-6" = ${MODULE.toFixed(4)} m\n`, vi: 1 };
      for (const [listName, name, group, orient] of parts) {
        const list = SHORT_PLACE[listName] || [];
        const { verts, idx } = list.length ? meshOf(name, group, orient) : { verts: [], idx: [] };
        for (let n = 0; n < list.length; n++) {
          const p = list[n];

          for (const v of verts) A.obj += `v ${(v[0] + p[0]).toFixed(4)} ${(v[1] + p[1]).toFixed(4)} ${(v[2] + p[2]).toFixed(4)}\n`;
          for (let t = 0; t < idx.length; t += 3) A.obj += `f ${idx[t] + A.vi} ${idx[t + 1] + A.vi} ${idx[t + 2] + A.vi}\n`;

    // When `acc` ({obj, vi}) is passed, boxes are appended to it and nothing downloads — lets several
    // exporters share one OBJ (see exportStructureOBJ). Without acc, writes a standalone file.
    function exportOBJ(filter, fname, title, acc) {
      const boxes = exportBoxes.filter(filter);
      if (!boxes.length) { if (!acc) alert(`Nothing to export for ${title}.`); return; }
      const A = acc || { obj: `# ${title} — module 8'-6" = ${MODULE.toFixed(4)} m\n`, vi: 1 };
      for (const b of boxes) {
        const o = (!b.struct && isMovable(b) && MOVE_OFFSETS.get(moveKeyOf(b))) || { dx: 0, dy: 0, dz: 0 };
        const hx = b.w / 2, hy = b.h / 2, hz = b.d / 2, x = b.cx + o.dx, y = b.cy + o.dy, z = b.cz + o.dz;
        // Record program identity per box so the OBJ self-documents which massing is which program.
        const dur = b.struct ? 'STRUCT' : (b.short ? 'SHORT' : 'LONG');
        const nm = `${dur}_${b.type.replace(/\s+/g, '_')}_${(b.category || 'na').replace(/\s+/g, '_')}_${levelLabel(b.level)}`;
        A.obj += `o ${nm}\ng ${nm}\n`;
        // `quat`-bearing boxes (diagonal struts, addStrut) are rotated in the scene — rotate the
        // local corners by the same quaternion before offsetting to world position, otherwise the
        // OBJ would export them as if axis-aligned (wrong shape/orientation for a diagonal).
        const local = [[-hx, -hy, -hz], [hx, -hy, -hz], [hx, -hy, hz], [-hx, -hy, hz], [-hx, hy, -hz], [hx, hy, -hz], [hx, hy, hz], [-hx, hy, hz]];
        const c = b.quat
          ? local.map(([lx, ly, lz]) => { const v = new THREE.Vector3(lx, ly, lz).applyQuaternion(b.quat); return [v.x + x, v.y + y, v.z + z]; })
          : local.map(([lx, ly, lz]) => [lx + x, ly + y, lz + z]);
        for (const p of c) A.obj += `v ${p[0].toFixed(4)} ${p[1].toFixed(4)} ${p[2].toFixed(4)}\n`;
        for (const q of [[1, 2, 3, 4], [5, 8, 7, 6], [1, 5, 6, 2], [2, 6, 7, 3], [3, 7, 8, 4], [4, 8, 5, 1]]) A.obj += `f ${q.map(n => n + A.vi - 1).join(' ')}\n`;
        A.vi += 8;
      }
      if (!acc) download(fname, A.obj);
    }

    document.getElementById('exp-massing').addEventListener('click', () => {
      const wantShort = document.querySelector('.mass-chk[data-k="short"]').checked;
      const wantLong = document.querySelector('.mass-chk[data-k="long"]').checked;
      if (!wantShort && !wantLong) { alert('Select at least one program type to export.'); return; }
      const tags = []; if (wantShort) tags.push('SHORT'); if (wantLong) tags.push('LONG');

        b => !b.struct && !b.ghost && ((wantShort && b.short) || (wantLong && !b.short)),   // a vacant shell is not program
        'program_massing_' + tags.join('+') + '.obj',
        tags.join(' + ') + ' program massing'

    const SKIN_PARTS = [['skinDeck', 121, 10, 239, false], ['skinWinL', 173, 239, 5, true], ['skinWinS', 66, 239, 5, true]];
    function exportSkinOBJ(acc) {
      if (!SHORT_PLACE) { if (!acc) alert('Nothing to export for SHORT · SKIN — no SHORT programs in the current model.'); return; }
      let total = 0; for (const [k] of SKIN_PARTS) total += (SHORT_PLACE[k] || []).length;
      total += (SHORT_PLACE.skinPane || []).length;
      if (!total) { if (!acc) alert('Nothing to export for SHORT · SKIN — toggle skin ON (structure mode) and build a model with SHORT programs.'); return; }
      const A = acc || { obj: `# SHORT skin — module-deck / window / curtain-louver dressing · module 8'-6" = ${MODULE.toFixed(4)} m\n`, vi: 1 };
      let vtotal = 0, groups = 0;
      for (const [key, W, H, D, hasRot] of SKIN_PARTS) {
        const list = SHORT_PLACE[key] || []; if (!list.length) continue;
        const hx = (W * BLOCK_S) / 2, hy = (H * BLOCK_S) / 2, hz = (D * BLOCK_S) / 2;
        for (let n = 0; n < list.length; n++) {

          const [x, y, z] = it.p, rot = it.rot || 0, c = Math.cos(rot), s = Math.sin(rot);
          const local = [[-hx, -hy, -hz], [hx, -hy, -hz], [hx, -hy, hz], [-hx, -hy, hz], [-hx, hy, -hz], [hx, hy, -hz], [hx, hy, hz], [-hx, hy, hz]];
          A.obj += `o RELOC_${key}_${n}\ng RELOC_${key}_${n}\n`; groups++;
          for (const [lx, ly, lz] of local) A.obj += `v ${(x + lx * c + lz * s).toFixed(4)} ${(y + ly).toFixed(4)} ${(z + (-lx * s + lz * c)).toFixed(4)}\n`;
          for (const q of [[1, 2, 3, 4], [5, 8, 7, 6], [1, 5, 6, 2], [2, 6, 7, 3], [3, 7, 8, 4], [4, 8, 5, 1]]) A.obj += `f ${q.map(n2 => n2 + A.vi - 1).join(' ')}\n`;
          A.vi += 8; vtotal += 8;
        }
      }
      // FACADE_PANE07 louver — 25 blades + 2 rails per pane placement (see louverBoxSpecs()),
      // each written as its own box/group so the OBJ preserves the slat geometry.
      {
        const list = SHORT_PLACE.skinPane || [];
        if (list.length) {
          const specs = louverBoxSpecs();
          for (let n = 0; n < list.length; n++) {
            const it = list[n];
            const [x, y, z] = it.p, rot = it.rot || 0, c = Math.cos(rot), s = Math.sin(rot);
            specs.forEach((sp, bi) => {
              const hx = sp.hx * BLOCK_S, hy = sp.hy * BLOCK_S, hz = sp.hz * BLOCK_S;
              const ccx = sp.cx * BLOCK_S, ccy = sp.cy * BLOCK_S, ccz = sp.cz * BLOCK_S;
              const local = [[-hx, -hy, -hz], [hx, -hy, -hz], [hx, -hy, hz], [-hx, -hy, hz], [-hx, hy, -hz], [hx, hy, -hz], [hx, hy, hz], [-hx, hy, hz]];
              A.obj += `o RELOC_skinPane_${n}_${bi}\ng RELOC_skinPane_${n}_${bi}\n`; groups++;
              for (const [lx, ly, lz] of local) {

                A.obj += `v ${(x + wx_ * c + wz_ * s).toFixed(4)} ${(y + wy_).toFixed(4)} ${(z + (-wx_ * s + wz_ * c)).toFixed(4)}\n`;

              for (const q of [[1, 2, 3, 4], [5, 8, 7, 6], [1, 5, 6, 2], [2, 6, 7, 3], [3, 7, 8, 4], [4, 8, 5, 1]]) A.obj += `f ${q.map(n2 => n2 + A.vi - 1).join(' ')}\n`;

      const tags = [];
