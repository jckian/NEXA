      const near = ring => ring && ring.length > 1 && meanDist(ring) <= CTX_LINE_M;
      const near100 = (s.neighbours || []).filter(n => n.ring && n.ring.length > 2 && meanDist(n.ring) <= CTX_KEEP_M);

      // linework reaches further than the volumes: a drawing of lot and road lines reads
      // better with a wider field, and flat lines cost nothing to draw
      const lots = (s.lots || []).filter(near);
      // roads gained a class wrapper (M6); a bare array is a payload from before that
      const roads = (s.roads || []).filter(r => near(roadPath(r)));

      // ── the site is assembled, then cleared, before the massing lands on it ──────────────
      // Overpass returns every building it can see, INCLUDING whatever stands on the subject
      // parcel today. The study puts a NEW building there, so anything on the site is
      // demolished here and the ground is drawn vacant.
      //
      // A footprint that runs past the parcel is a real answer, not an error: the study buys
      // the lot next door. So the site is the parcel PLUS every lot-line polygon the plate
      // actually reaches over, and those lots are cleared exactly like the parcel. A plate
      // that fits inside the parcel overlaps nothing else, so this costs nothing when the
      // building behaves.
      //
      // Party walls are normal in a dense block, so a building only comes down when it is
      // genuinely ON the assembled site: centroid inside it, or most of its corners inside.
      // Touching a lot line from outside is not enough. With no parcel polygon the clearing
      // falls back to a circle at the address, sized from the recorded lot area.
      const parcelXZ = (s.parcel && s.parcel.ring && s.parcel.ring.length > 2) ? s.parcel.ring.map(toXZ) : null;
      // The plate is axis-aligned in the scene; the lots live in the site group, which is
      // turned by GRID_ROT_DEG. Bring the plate into the site's frame rather than turning
      // every lot, so the overlap test runs in the same coordinates the drawing uses.
      const gr = GRID_ROT_DEG * Math.PI / 180, cg = Math.cos(gr), sg = Math.sin(gr);
      const plateRect = (mx, mz) => PLATE_FP ? [[-1, -1], [1, -1], [1, 1], [-1, 1]]
        .map(([u, v]) => [u * (PLATE_FP.w / 2 + mx) + (PLATE_FP.x || 0), v * (PLATE_FP.d / 2 + mz) + (PLATE_FP.z || 0)])
        .map(([x, z]) => [x * cg - z * sg, x * sg + z * cg]) : null;
      const plateXZ = plateRect(0, 0);
      // What a lot next door actually sells: the strip under the building plus a working margin,
      // not the whole parcel. Buying a 3,000 m² lot because a corner of the plate crossed its
      // line drew a site far larger than the project, so the bought piece is trimmed to this
      // window and a sliver smaller than BUY_MIN_M2 is not worth calling site at all.
      const buyXZ = plateRect(BUY_MARGIN_M, BUY_MARGIN_M);

      const siteRings = parcelXZ ? [parcelXZ] : [];
      const assembled = [];
      if (plateXZ) {
        for (const ring of lots) {
          const r = ring.map(toXZ);
          const [cx, cz] = centroidXZ(r);
          if (parcelXZ && inRing(cx, cz, parcelXZ)) continue;      // that polygon IS the parcel
          if (!overlaps(plateXZ, r)) continue;                     // the plate never reaches it
          const buy = clipToConvex(r, buyXZ);
          if (buy.length < 3 || shoelace(buy) < BUY_MIN_M2) continue;
          assembled.push(buy);
          siteRings.push(buy);
        }
      }
      const clearR = siteRings.length ? 0 : Math.max(Math.sqrt((s.parcel && s.parcel.lotAreaM2) || 0) / 2, CLEAR_MIN_R);
      const inSite = (x, z) => siteRings.some(r => inRing(x, z, r));
      const onLot = ring => {
        const pts = ring.map(toXZ);
        const [cx, cz] = centroidXZ(pts);
        if (!siteRings.length) return Math.hypot(cx, cz) <= clearR;
        if (inSite(cx, cz)) return true;
        let n = 0;
        for (const [x, z] of pts) if (inSite(x, z)) n++;
        return n / pts.length >= 0.6;
      };
      let cleared = 0;
      const neighbours = near100.filter(n => { const on = onLot(n.ring); if (on) cleared++; return !on; });
      // Recorded lot area is the county's own number, so it beats measuring the ring back;
      // assembled lots have no recorded area, so those are measured off their polygons.
      const parcelArea = (s.parcel && s.parcel.lotAreaM2) || (parcelXZ ? shoelace(parcelXZ) : 0);
      const siteAreaM2 = parcelArea + assembled.reduce((a, r) => a + shoelace(r), 0);

      let radius = 0;
      const scan = ring => { for (const p of ring || []) { const [x, z] = toXZ(p); radius = Math.max(radius, Math.hypot(x, z)); } };
      if (s.parcel) scan(s.parcel.ring);
      for (const r of lots.concat(roads.map(roadPath), neighbours.map(n => n.ring))) scan(r);
      return { s, toXZ, neighbours, lots, roads, parcelXZ, siteRings, assembled, siteAreaM2,
        clearR, cleared, radius: Math.min(radius, CTX_LINE_M) };
    }
    // deliberately ignores SITE_ON: the ground and the camera keep the same extent whether
    // the layer is shown or hidden, so the switch reads as a layer toggle, not a zoom
    const siteContextRadius = () => { const g = siteContextGeo(); return g ? g.radius : 0; };

    // ── M11 SITE FIT (260805) ───────────────────────────────────────────────────────────────
    // The packer works in module space and the finished plate lands, by default, centred on the
    // address. On a real parcel that is often half in the street. This slides the FINISHED plate
    // to the best standing ground near the address: off the road corridors first, on lot land
    // second, as close to the address as those two allow. It never resizes and never turns the
    // plate, so the layout, the core orientation and every area figure are untouched.
    //
    // Method: rasterise the neighbourhood once per build into a cost grid in the SCENE frame
    // (where the plate is axis-aligned), integral-image it, then read the cost of any candidate
    // position in constant time. A search rather than a push-away heuristic, because a corner
    // site has no single direction to push in but does have a best position.
    const FIT_CELL = 2, FIT_SEARCH_M = 70;
    const FIT_STREET = 1, FIT_OFFLOT = 0.3, FIT_MOVE = 0.02;   // cost per cell · per metre moved
    // Half-width of the road corridor by street rank, in metres: centreline to property line,
    // roadway plus sidewalk. LA's rights of way, rounded (Boulevard I 36 m, Avenue II 26 m,
    // local street 18 m, alley 6 m). An unranked road (the OSM fallback) reads as a local street.
    const RANK_HALF = { 1: 18, 2: 16, 3: 14, 4: 13, 5: 11, 6: 10, 7: 9, 8: 3, 9: 2 };

    function sitePlacement(plateW, plateD) {
      const geo = SITE_FIT_ON ? siteContextGeo() : null;
      if (!geo) return { x: 0, z: 0 };
      const { toXZ, lots, roads } = geo;
      if (!roads.length && !lots.length) return { x: 0, z: 0 };   // nothing to place against
      // the lots and roads live in the site group, which is turned by GRID_ROT_DEG
      const gr = GRID_ROT_DEG * Math.PI / 180, cg = Math.cos(gr), sg = Math.sin(gr);
      const toScene = ([x, z]) => [x * cg + z * sg, -x * sg + z * cg];
      const R = Math.ceil((Math.max(plateW, plateD) / 2 + FIT_SEARCH_M) / FIT_CELL) * FIT_CELL;
      const N = Math.round(2 * R / FIT_CELL);
      const ci = x => Math.max(0, Math.min(N - 1, Math.floor((x + R) / FIT_CELL)));
      // Unknown ground carries a small cost: with no lot line saying otherwise it may be
      // anything, and the address is the better guess. Lot land is free, street is expensive.
      const cell = new Float32Array(N * N).fill(FIT_OFFLOT);
      const street = new Float32Array(N * N);   // kept apart so the panel can report the overlap
      for (const ring of lots) {
        const r = ring.map(toXZ).map(toScene);
        let x0 = Infinity, x1 = -Infinity, z0 = Infinity, z1 = -Infinity;
        for (const [x, z] of r) { x0 = Math.min(x0, x); x1 = Math.max(x1, x); z0 = Math.min(z0, z); z1 = Math.max(z1, z); }
        if (x1 < -R || x0 > R || z1 < -R || z0 > R) continue;
        for (let j = ci(z0); j <= ci(z1); j++) for (let i = ci(x0); i <= ci(x1); i++)
          if (inRing(-R + (i + 0.5) * FIT_CELL, -R + (j + 0.5) * FIT_CELL, r)) cell[j * N + i] = 0;
      }
      // Roads are stamped after the lots and win outright: a parcel polygon runs to the kerb
      // in some layers, and no part of the roadway is standing ground either way. Square stamps
      // spaced by the half-width tile the corridor without a per-cell distance test.
      for (const rd of roads) {
        const path = roadPath(rd).map(toXZ).map(toScene);
        const half = RANK_HALF[roadRank(rd)] || RANK_HALF[7];
        for (let k = 1; k < path.length; k++) {
          const [ax, az] = path[k - 1], [bx, bz] = path[k];
          const len = Math.hypot(bx - ax, bz - az), steps = Math.max(1, Math.ceil(len / half));
          for (let t = 0; t <= steps; t++) {
            const x = ax + (bx - ax) * t / steps, z = az + (bz - az) * t / steps;
            if (x + half < -R || x - half > R || z + half < -R || z - half > R) continue;
            for (let j = ci(z - half); j <= ci(z + half); j++) for (let i = ci(x - half); i <= ci(x + half); i++) {
              cell[j * N + i] = FIT_STREET; street[j * N + i] = 1;
            }
          }
        }
      }
      // integral image, so a candidate rectangle costs one lookup instead of a sweep
      const W = N + 1;
      const integral = src => {
        const S = new Float64Array(W * W);
        for (let j = 0; j < N; j++) for (let i = 0; i < N; i++)
          S[(j + 1) * W + i + 1] = src[j * N + i] + S[j * W + i + 1] + S[(j + 1) * W + i] - S[j * W + i];
        return S;
      };
      const S = integral(cell), SS = integral(street);
      const clamp = v => Math.max(0, Math.min(N, v));
      const sum = (T, x0, z0, x1, z1) => {
        const i0 = clamp(Math.round((x0 + R) / FIT_CELL)), i1 = clamp(Math.round((x1 + R) / FIT_CELL));
        const j0 = clamp(Math.round((z0 + R) / FIT_CELL)), j1 = clamp(Math.round((z1 + R) / FIT_CELL));
        return T[j1 * W + i1] - T[j0 * W + i1] - T[j1 * W + i0] + T[j0 * W + i0];
      };
      const hw = plateW / 2, hd = plateD / 2;
      let best = { x: 0, z: 0 }, bestC = Infinity;
      for (let dz = -FIT_SEARCH_M; dz <= FIT_SEARCH_M; dz += FIT_CELL) {
        for (let dx = -FIT_SEARCH_M; dx <= FIT_SEARCH_M; dx += FIT_CELL) {
          // the move term only breaks ties: staying at the address beats an equal spot further off
          const c = sum(S, dx - hw, dz - hd, dx + hw, dz + hd) + FIT_MOVE * Math.hypot(dx, dz);
          if (c < bestC - 1e-9) { bestC = c; best = { x: dx, z: dz }; }
        }
      }
      // What it could not avoid. A plate wider than the block has nowhere clean to stand, and
      // the panel says so rather than implying the street was dodged.
      const cells = Math.max(1, Math.round(plateW / FIT_CELL) * Math.round(plateD / FIT_CELL));
      best.streetPct = Math.round(100 * sum(SS, best.x - hw, best.z - hd, best.x + hw, best.z + hd) / cells);
      return best;
    }

    // ── M6 FRONTAGE ANALYSIS ─────────────────────────────────────────────────────────────
    // Parcel edges paired to classified streets, ranked into primary / secondary / service.
    // Everything here is geometry plus the city's own street designation. It does NOT model
    // pedestrian flow: there is no free source for that (see SITE-ORIENTATION-RULES O1), so
    // "primary" means "the best street this parcel fronts", not "where the people are".
    const FRONT_MAX_M = 35;      // a parcel edge further than this from a centreline fronts nothing
    const COLLINEAR_DEG = 12;    // consecutive edges within this angle are one frontage
    const bearingOf = (x, z) => ((Math.atan2(x, -z) * 180 / Math.PI) % 360 + 360) % 360;

    // ── M6b MOVEMENT GENERATORS ──────────────────────────────────────────────────────────
    // Weights are a stated judgement, not a measurement. A rail station is set an order of
    // magnitude above a shop because it concentrates arrival at one point; a crossing counts
    // because it decides WHERE people reach a face, not how many. GEN_DECAY_M is the distance
    // at which a generator's contribution falls to 1/e.
    const GEN_WEIGHT = { rail: 10, bus: 3, crossing: 2, institution: 3, food: 1, retail: 1 };
    const GEN_DECAY_M = 220;
    const GEN_RADIUS_M = 500;    // must match findGenerators() in program-input.html
    // Only the strongest few of each kind count towards a face. Measured at City Market: 256
    // generators came back and 226 of them were crossings. Summed raw, sheer count swamps the
    // signal, every face saturates near 1, and the score stops telling the faces apart. A
    // crossing says WHERE people cross, not how many, so the fortieth one carries no
    // information the second one did not already carry.
    const GEN_CAP = { rail: 2, bus: 4, crossing: 2, institution: 3, food: 6, retail: 6 };
    // How much of the ranking is street class and how much is context. Class leads because it
    // is the authoritative datum (the city's own designation) and context is a proxy.
    const W_CLASS = 0.6, W_PULL = 0.4;
    // Pull is mapped onto 0..1 by pull/(pull + PULL_HALF), NOT by dividing through the best
    // face. Relative normalisation makes the strongest face score 1 on every site, so a single
    // corner shop reads as loudly as a rail station and can move the entry two class steps
    // (it did: caught by check O). A saturating absolute scale means the context score means
    // the same thing everywhere. PULL_HALF is set so a rail station 90 m off a face plus its
    // crossings lands near 0.7, while a lone shop 60 m off lands near 0.16.
    const PULL_HALF = 4;

    function analyseFrontages() {
      const g = siteContextGeo();
      const ringLL = SITE_CTX && SITE_CTX.parcel && SITE_CTX.parcel.ring;
      if (!g || !ringLL || ringLL.length < 4) return null;
      const pts = ringLL.map(g.toXZ);
      // a closed ring repeats its first vertex; carrying it makes a zero-length edge
      if (pts.length > 1 && Math.hypot(pts[0][0] - pts[pts.length - 1][0], pts[0][1] - pts[pts.length - 1][1]) < 0.5) pts.pop();
      if (pts.length < 3) return null;
      const cx = pts.reduce((a, p) => a + p[0], 0) / pts.length;
      const cz = pts.reduce((a, p) => a + p[1], 0) / pts.length;

      // ── edges, then merge collinear runs: a city parcel often carries several vertices
      //    along one street face and each one is not a separate frontage ──
      const raw = pts.map((p, i) => {
        const q = pts[(i + 1) % pts.length];
        return { a: p, b: q, len: Math.hypot(q[0] - p[0], q[1] - p[1]) };
      }).filter(e => e.len > 0.5);
      if (!raw.length) return null;
      const dirDiff = (e, f) => {
        const d = Math.abs(bearingOf(e.b[0] - e.a[0], e.b[1] - e.a[1]) - bearingOf(f.b[0] - f.a[0], f.b[1] - f.a[1])) % 180;
        return Math.min(d, 180 - d);
      };
      const runs = [];
      for (const e of raw) {
        const last = runs[runs.length - 1];
        if (last && dirDiff(last[last.length - 1], e) < COLLINEAR_DEG) last.push(e); else runs.push([e]);
      }
      // the ring wraps, so the last run may continue into the first
      if (runs.length > 1 && dirDiff(runs[runs.length - 1][runs[runs.length - 1].length - 1], runs[0][0]) < COLLINEAR_DEG) {
        runs[0] = runs.pop().concat(runs[0]);
      }

      // ── nearest classified street to a point ──
      const roads = (SITE_CTX.roads || []).filter(r => roadPath(r).length > 1);
      // A face fronts a street only if that street runs ALONG it. Without this test the
      // sample points near a corner pick up the cross street, and every corner parcel reports
      // all four faces as fronting the major road.
      const PARALLEL_DEG = 30;
      const nearestRoad = (px, pz, faceBearing, nx, nz) => {
        let best = Infinity, hit = null;
        for (const r of roads) {
          const path = roadPath(r);
          for (let i = 1; i < path.length; i++) {
            const [x1, z1] = g.toXZ(path[i - 1]), [x2, z2] = g.toXZ(path[i]);
            const ex = x2 - x1, ez = z2 - z1, l2 = ex * ex + ez * ez;
            if (l2 < 0.25) continue;
            const dd = Math.abs(bearingOf(ex, ez) - faceBearing) % 180;
            if (Math.min(dd, 180 - dd) > PARALLEL_DEG) continue;   // a cross street, not this face's
            const t = Math.max(0, Math.min(1, ((px - x1) * ex + (pz - z1) * ez) / l2));
            const qx = x1 + t * ex - px, qz = z1 + t * ez - pz;
            // the street has to be OUTSIDE the face. On a parcel narrower than FRONT_MAX_M the
            // back face is also within range of the front street, and without this test one
            // street gets reported on two opposite faces (seen on the real City Market parcel).
            if (qx * nx + qz * nz <= 0) continue;
            const d = Math.hypot(qx, qz);
            if (d < best) { best = d; hit = { r, d, ex, ez }; }
          }
        }
        return hit;
      };

      // ── generators, once, in the site's XZ frame ──
      const gens = (SITE_CTX.generators || [])
        .filter(gg => gg && Array.isArray(gg.ll))
        .map(gg => { const [x, z] = g.toXZ(gg.ll); return { x, z, kind: gg.kind, name: gg.name, w: GEN_WEIGHT[gg.kind] || 1 }; });
      // A generator pulls on a face only from OUTSIDE it, and most strongly when it lies
      // straight off the face rather than along it: cos of the angle between the face's
      // outward normal and the direction to the generator, clamped at 0.
      const pullOn = (mx, mz, nx, nz) => {
        const byKind = new Map();
        for (const q of gens) {
          const dx = q.x - mx, dz = q.z - mz, d = Math.hypot(dx, dz);
          const cos = d < 1 ? 1 : (dx * nx + dz * nz) / d;
          if (cos <= 0) continue;
          const c = q.w * cos * (d < 1 ? 1 : Math.exp(-d / GEN_DECAY_M));
          if (!byKind.has(q.kind)) byKind.set(q.kind, []);
          byKind.get(q.kind).push(c);
        }
        let s = 0;
        for (const [kind, cs] of byKind) {
          cs.sort((a, b) => b - a);
          for (const c of cs.slice(0, GEN_CAP[kind] || 4)) s += c;
        }
        return s;
      };

      const fronts = runs.map((run, i) => {
        const a = run[0].a, b = run[run.length - 1].b;
        const len = run.reduce((s, e) => s + e.len, 0);
        const mx = (a[0] + b[0]) / 2, mz = (a[1] + b[1]) / 2;
        const ex = b[0] - a[0], ez = b[1] - a[1];
        // outward normal: the perpendicular that points away from the parcel centroid
        let nx = ez, nz = -ex;
        if (nx * (mx - cx) + nz * (mz - cz) < 0) { nx = -nx; nz = -nz; }
        const nl = Math.hypot(nx, nz) || 1;
        // sample along the face, not just the midpoint: a corner parcel's midpoint can sit
        // further from its own street than the quarter points do
        const faceBearing = bearingOf(ex, ez);
        let hit = null;
        for (const t of [0.5, 0.25, 0.75]) {
          const h = nearestRoad(a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, faceBearing, nx / nl, nz / nl);
          if (h && (!hit || h.d < hit.d)) hit = h;
        }
        return {
          i, len: +len.toFixed(1),
          mid: [mx, mz],
          bearing: Math.round(faceBearing) % 180,                // the face's own line
          normal: Math.round(bearingOf(nx / nl, nz / nl)),        // outward, true compass
          dist: hit ? +hit.d.toFixed(1) : null,
          onStreet: !!hit && hit.d <= FRONT_MAX_M,
          rank: hit && hit.d <= FRONT_MAX_M ? roadRank(hit.r) : null,
          name: hit && hit.d <= FRONT_MAX_M && !Array.isArray(hit.r) ? hit.r.name : null,
          cls: hit && hit.d <= FRONT_MAX_M && !Array.isArray(hit.r) ? hit.r.cls : null,
          pull: +pullOn(mx, mz, nx / nl, nz / nl).toFixed(2),
          role: null,
        };
      });

      // ── rank: street class first, then how much of it this parcel has ──
      // An unclassified road (a pre-M6 payload) sorts as 7, i.e. a local street, so an older
      // cached site still produces a sane primary rather than nothing.
      const streetFronts = fronts.filter(f => f.onStreet);
      if (!streetFronts.length) return { fronts, primary: null, secondary: null, service: null, align: null, gens: gens.length };
      // ── score = street class + context pull ──
      // With no generator data every pull is 0 and the ranking falls back to class alone,
      // which is exactly the pre-M6b behaviour.
      for (const f of streetFronts) {
        f.classScore = +((9 - Math.min(9, f.rank ?? 7)) / 8).toFixed(3);
        f.pullScore = +(f.pull / (f.pull + PULL_HALF)).toFixed(3);
        f.score = +(W_CLASS * f.classScore + W_PULL * f.pullScore).toFixed(3);
      }
      const byQuality = [...streetFronts].sort((a, b) => b.score - a.score || (a.rank ?? 7) - (b.rank ?? 7) || b.len - a.len);
      const primary = byQuality[0];
      primary.role = 'primary';
      // ALIGNMENT is a separate question from ENTRY. The building's long axis runs along its
      // longest street face, because that is the shape of the parcel; the entry goes on the
      // best street, which on a corner site is often the short face. Measured on the real City
      // Market parcel: 15 m on San Pedro (Avenue II) against 44 m on 10th (Collector), where
      // aligning to San Pedro turned the long façade across the block.
      const align = [...streetFronts].sort((a, b) => b.len - a.len)[0];
      // a secondary entry has to be on a different face, not the same street round a bend
      const angleTo = f => { const d = Math.abs(f.normal - primary.normal) % 360; return Math.min(d, 360 - d); };
      const secondary = byQuality.find(f => f !== primary && angleTo(f) >= 45) || null;
      if (secondary) secondary.role = 'secondary';
      // service takes the meanest street it fronts, provided that is not already the entry
      // service takes the meanest street with the least pull: the back of the building goes
      // where the fewest people are, which is the one place pull should be minimised not maximised
      const byMean = [...streetFronts].sort((a, b) => a.score - b.score || (b.rank ?? 7) - (a.rank ?? 7));
      const service = byMean.find(f => !f.role && (f.rank ?? 7) >= 6) || null;
      if (service) service.role = 'service';
      return { fronts, primary, secondary, service, align, gens: gens.length };
    }

    // ── OSM raster base on the ground plane ──────────────────────────────────────────
    // Stitches the few web-mercator tiles that cover the ground plane into one canvas and
    // maps it onto the plane, so the tile pixels land where the geometry does. Cached by
    // tile range: rebuilds (mode switches, slider drags) must not re-hit the tile server.
    // Attribution is required by the OSM tile policy and is shown in the Site panel.
    const MAP_CACHE = new Map();
    const merc = (lat, lng, world) => [
      (lng + 180) / 360 * world,
      (1 - Math.log(Math.tan(lat * Math.PI / 180) + 1 / Math.cos(lat * Math.PI / 180)) / Math.PI) / 2 * world,
    ];

    // A square plane ends at a square edge, and at city scale that edge reads as the map having
    // been cut out with a knife right where a street leaves the frame. This fades the outer ring
    // instead: opaque inside MAP_FADE of the half-width, falling to nothing at the edge midpoint,
    // so what remains is a soft circle and the corners are gone. The material is PATCHED rather
    // than swapped for a ShaderMaterial, because the plane still has to light and take the
    // massing's shadow like any other ground. The uv varying is added here rather than reusing
    // three's own, whose name has changed between versions.
    const MAP_FADE = 0.45;
    function fadeGroundEdges(mat) {
      mat.transparent = true;
      mat.onBeforeCompile = sh => {
        sh.vertexShader = 'varying vec2 vGroundUv;\n' + sh.vertexShader.replace(
          '#include <begin_vertex>', '#include <begin_vertex>\n  vGroundUv = uv;');
        const fade = '  float gd = length(vGroundUv - 0.5) * 2.0;\n'
          + `  gl_FragColor.a *= 1.0 - smoothstep(${MAP_FADE.toFixed(2)}, 1.0, gd);\n`;
        sh.fragmentShader = 'varying vec2 vGroundUv;\n' + (
          sh.fragmentShader.includes('#include <dithering_fragment>')
            ? sh.fragmentShader.replace('#include <dithering_fragment>', '#include <dithering_fragment>\n' + fade)
            // the include is where it has always been; this only keeps a version bump from
            // silently dropping the fade and leaving the hard edge back
            : sh.fragmentShader.replace(/\}\s*$/, fade + '}'));
      };
      mat.needsUpdate = true;
    }

    function applyMapGround(mesh, gSpan) {
      const geo = siteContextGeo();
      if (!geo) return;
      const s = geo.s, c = (s.parcel && s.parcel.centroid) || { lat: s.lat, lng: s.lng };
      const mLat = 111320, mLng = 111320 * Math.cos(c.lat * Math.PI / 180), h = gSpan / 2;
      // zoom chosen so the plane spans roughly 2-4 tiles: enough detail, few requests
      let z = 18;
      while (z > 13 && gSpan / (156543.03392 * Math.cos(c.lat * Math.PI / 180) / 2 ** z * 256) > 4) z--;
      const world = 256 * 2 ** z;
      const [pxW, pyN] = merc(c.lat + h / mLat, c.lng - h / mLng, world);
      const [pxE, pyS] = merc(c.lat - h / mLat, c.lng + h / mLng, world);
      const tx0 = Math.floor(pxW / 256), tx1 = Math.floor(pxE / 256);
      const ty0 = Math.floor(pyN / 256), ty1 = Math.floor(pyS / 256);
      const key = `${z}/${tx0},${ty0}-${tx1},${ty1}`;

      const fit = tex => {
        const cw = (tx1 - tx0 + 1) * 256, ch = (ty1 - ty0 + 1) * 256;
        const l = pxW - tx0 * 256, t = pyN - ty0 * 256, w = pxE - pxW, hh = pyS - pyN;
        tex.offset.set(l / cw, 1 - (t + hh) / ch);
        tex.repeat.set(w / cw, hh / ch);
        tex.needsUpdate = true;
        mesh.material.map = tex;
        mesh.material.color.setHex(0xffffff);
        mesh.material.needsUpdate = true;
      };

      if (MAP_CACHE.has(key)) { fit(MAP_CACHE.get(key)); return; }

      const cv = document.createElement('canvas');
      cv.width = (tx1 - tx0 + 1) * 256; cv.height = (ty1 - ty0 + 1) * 256;
      const ctx = cv.getContext('2d');
      ctx.fillStyle = '#e8ecf1'; ctx.fillRect(0, 0, cv.width, cv.height);
      const jobs = [];
      for (let tx = tx0; tx <= tx1; tx++) for (let ty = ty0; ty <= ty1; ty++) {
        jobs.push(new Promise(res => {
          const img = new Image();
          img.crossOrigin = 'anonymous';           // tiles send Access-Control-Allow-Origin: *
          img.onload = () => { ctx.drawImage(img, (tx - tx0) * 256, (ty - ty0) * 256); res(true); };
          img.onerror = () => res(false);
          img.src = `https://tile.openstreetmap.org/${z}/${tx}/${ty}.png`;
        }));
      }
      Promise.all(jobs).then(ok => {
        if (!ok.some(Boolean)) return;             // every tile failed: leave the plain plane
        const tex = new THREE.CanvasTexture(cv);
        tex.colorSpace = THREE.SRGBColorSpace;
        MAP_CACHE.set(key, tex);
        if (SITE_ON) fit(tex);                     // the layer may have been switched off while loading
      });
    }

    // One fact per line: label left, value right. Every read-only number in the Site panel
    // goes through this, so the column stays scannable instead of running facts together
    // with middots and wrapping mid-phrase.
    const siteKV = (k, v, cls) => `<div class="site-kv"><span>${k}</span><span class="v${cls ? ' ' + cls : ''}">${v}</span></div>`;

    // Geocoders return two very different strings for the same door: the Census one is
    // short and shouted ("300 S SANTA FE AVE, LOS ANGELES, CA, 90013"), Nominatim's carries
    // the neighbourhood, the county and the country. The panel shows one line either way:
    // street, city, state, zip. The untouched string stays on the row's title attribute.
    const US_STATE = { alabama: 'AL', alaska: 'AK', arizona: 'AZ', arkansas: 'AR', california: 'CA', colorado: 'CO', connecticut: 'CT', delaware: 'DE', florida: 'FL', georgia: 'GA', hawaii: 'HI', idaho: 'ID', illinois: 'IL', indiana: 'IN', iowa: 'IA', kansas: 'KS', kentucky: 'KY', louisiana: 'LA', maine: 'ME', maryland: 'MD', massachusetts: 'MA', michigan: 'MI', minnesota: 'MN', mississippi: 'MS', missouri: 'MO', montana: 'MT', nebraska: 'NE', nevada: 'NV', 'new hampshire': 'NH', 'new jersey': 'NJ', 'new mexico': 'NM', 'new york': 'NY', 'north carolina': 'NC', 'north dakota': 'ND', ohio: 'OH', oklahoma: 'OK', oregon: 'OR', pennsylvania: 'PA', 'rhode island': 'RI', 'south carolina': 'SC', 'south dakota': 'SD', tennessee: 'TN', texas: 'TX', utah: 'UT', vermont: 'VT', virginia: 'VA', washington: 'WA', 'west virginia': 'WV', wisconsin: 'WI', wyoming: 'WY', 'district of columbia': 'DC' };
    const ST_ABBR = { north: 'N', south: 'S', east: 'E', west: 'W', northeast: 'NE', northwest: 'NW', southeast: 'SE', southwest: 'SW', street: 'St', avenue: 'Ave', boulevard: 'Blvd', drive: 'Dr', road: 'Rd', place: 'Pl', court: 'Ct', lane: 'Ln', terrace: 'Ter', parkway: 'Pkwy', highway: 'Hwy' };
    function shortAddr(label) {
      const raw = String(label || '').trim();
      if (!raw) return '';
      const title = w => w.length > 1 && w === w.toUpperCase() ? w[0] + w.slice(1).toLowerCase() : w;
      const clean = s => s.split(/\s+/).map(w => {
        const k = w.toLowerCase().replace(/[.,]/g, '');
        return ST_ABBR[k] || title(w);
      }).join(' ');
      let parts = raw.split(',').map(x => x.trim()).filter(Boolean)
        .filter(p => !/^(united states|usa|u\.s\.a?\.?)$/i.test(p) && !/\bcounty\b/i.test(p));
      if (!parts.length) return raw;
      const zip = parts.find(p => /^\d{5}(-\d{4})?$/.test(p)) || '';
      parts = parts.filter(p => p !== zip);
      // state is the last part left once the zip is out: a code as-is, a name abbreviated
      let state = '';
      if (parts.length > 1) {
        const last = parts[parts.length - 1];
        if (/^[A-Za-z]{2}$/.test(last)) { state = last.toUpperCase(); parts.pop(); }
        else if (US_STATE[last.toLowerCase()]) { state = US_STATE[last.toLowerCase()]; parts.pop(); }
      }
      // Nominatim splits the house number off the street; the Census does not
      const street = /^\d+[A-Za-z]?$/.test(parts[0]) && parts[1] ? parts[0] + ' ' + parts[1] : parts[0];
      const city = parts.length > 1 ? parts[parts.length - 1] : '';   // neighbourhoods in between are dropped
      const line = [clean(street), city && clean(city)].filter(Boolean).join(', ');
      const tail = [state, zip].filter(Boolean).join(' ');
      return (line + (tail ? ', ' + tail : '')) || raw;
    }

    // Footprint vs lot, written into the Site panel after every rebuild. The massing runs
    // on its own module grid, so it can and does overrun the real lot; this states by how
    // much instead of leaving it to be eyeballed off an axonometric.
    function updateSiteFit(plateW, plateD) {
      const el = document.getElementById('site-fit');
      if (!el) return;
      // Once the plate has grown over the lot next door, the site IS parcel plus that lot,
      // so every ratio below is taken against the assembled area rather than the parcel.
      const g = siteContextGeo();
      const nAdd = (g && g.assembled) ? g.assembled.length : 0;
      const lot = (g && g.siteAreaM2) || (SITE_CTX && SITE_CTX.parcel && SITE_CTX.parcel.lotAreaM2);
      if (!lot) { el.innerHTML = ''; return; }
      const vs = nAdd ? 'vs site' : 'vs lot';
      // plateW/plateD are the layout's grid EXTENT, not its occupied area: a porous or
      // L-shaped plan fills far less than its bounding box, so this is labelled as an
      // extent and must not be read as built floor area.
      const box = plateW * plateD;
      const pct = Math.round((box / lot - 1) * 100);
      const rows = [siteKV('Footprint', `${plateW.toFixed(1)} × ${plateD.toFixed(1)} m`)];
      // Where the plate ended up. The offset is a scene direction, so it is turned back by the
      // site rotation to be reported as a true bearing, like every other direction in the panel.
      const mv = Math.hypot(PLATE_SHIFT.x, PLATE_SHIFT.z);
      rows.push(!SITE_FIT_ON ? siteKV('Placed', 'on the address', 'dim')
        : mv < 1 ? siteKV('Placed', 'on the address')
        : siteKV('Placed', `${Math.round(mv)} m ${compassOf(Math.atan2(PLATE_SHIFT.x, -PLATE_SHIFT.z) * 180 / Math.PI + GRID_ROT_DEG)} of it`));
      if (SITE_FIT_ON && PLATE_SHIFT.streetPct > 2) rows.push(siteKV('Still over the street', `${PLATE_SHIFT.streetPct}%`, 'hot'));
      if (nAdd) rows.push(siteKV('Site assembled', `${nAdd + 1} lots · ${Math.round(lot).toLocaleString()} m²`, 'hot'));
      rows.push(pct > 2 ? siteKV(vs, `${pct}% past`, 'hot')
        : pct < -2 ? siteKV(vs, `${-pct}% inside`) : siteKV(vs, 'lot-sized'));
      // PLOT RATIO. The bounding box tells you the massing overhangs the lot; it does not tell
      // you whether the BUILDING is too big for it, which is a floor-area question. Drawn GFA
      // against lot × FAR is the number that decides that, so it is stated here whenever the
      // zoning gave a FAR. Where the code carries no FAR (the DTLA 2040 new-format districts
      // refuse to yield one, see the scout's interpretZone) this says so rather than guessing.
      const drawn = PROGRAM.reduce((a, p) => a + (p.isCore || isCorridor(p.type) ? 0 : p.area), 0);
      if (drawn > 0) {
        rows.push(siteKV('GFA', Math.round(drawn).toLocaleString() + ' m²'));
        const far = SITE_CTX && SITE_CTX.far;
        if (far && !(SITE_CTX && SITE_CTX.farAssumed)) {
          const cap = lot * far, over = Math.round((drawn / cap - 1) * 100);
          rows.push(siteKV(`FAR ${far} cap`, Math.round(cap).toLocaleString() + ' m²'));
          rows.push(over > 2 ? siteKV('vs cap', `${over}% over`, 'hot')
            : over < -2 ? siteKV('vs cap', `${-over}% under`) : siteKV('vs cap', 'at the limit'));
        } else {
          rows.push(siteKV('FAR cap', 'not in this code', 'dim'));
        }
      }
      el.innerHTML = rows.join('');
    }

    function buildSiteContext(root, groundY) {
      if (!SITE_ON) return;
      const geo = siteContextGeo();
      if (!geo) return;
      const { s, toXZ, neighbours, lots, roads } = geo;
      // Shapes are authored in XY then rotated flat by -90° about X, which maps (x,y,z) to
      // (x,z,-y) — so the plan's z is stored negated to come back the right way round.
      const shapeOf = ring => {
        const sh = new THREE.Shape();
        ring.forEach((p, i) => { const [x, z] = toXZ(p); i ? sh.lineTo(x, -z) : sh.moveTo(x, -z); });
        sh.closePath();
        return sh;
      };

      const polyline = (pts2, colour, y, loop, opacity) => {
        const v = pts2.map(p => { const [x, z] = toXZ(p); return new THREE.Vector3(x, groundY + y, z); });
        const g = new THREE.BufferGeometry().setFromPoints(v);
        const m = new THREE.LineBasicMaterial({ color: colour, transparent: opacity < 1, opacity });
        root.add(loop ? new THREE.LineLoop(g, m) : new THREE.Line(g, m));
      };

      // ── linework: drawn in BOTH modes. In 'volumes' it is held back so the massing and
      //    the context blocks stay dominant; in 'lines' it IS the drawing. ──
      // The raster base already carries the streets, so road centrelines sit well back.
      // Lot lines stay readable because OSM tiles do not draw property boundaries at all.
      for (const ring of lots) polyline(ring, 0x6b7480, 0.04, true, 0.45);
      // major streets draw a touch stronger, so the hierarchy the entry ranking uses is visible
      for (const r of roads) { const rk = roadRank(r); polyline(roadPath(r), 0x39414f, 0.05, false, rk != null && rk <= 5 ? 0.42 : 0.22); }

      if (neighbours.length) {
        // opaque: at 0.45 alpha the extrusions read as hollow shells rather than context massing.
        // DoubleSide is defensive — OSM ways are not guaranteed to be consistently wound.
        const mat = new THREE.MeshStandardMaterial({ color: 0xc3c9d4, roughness: 0.95, metalness: 0, side: THREE.DoubleSide });
        for (const n of neighbours) {
          const g = new THREE.ExtrudeGeometry(shapeOf(n.ring), { depth: n.h || 8, bevelEnabled: false });
          g.rotateX(-Math.PI / 2);
          const m = new THREE.Mesh(g, mat);
          m.name = 'ctx-building';
          m.position.y = groundY;
          root.add(m);
        }
      }

      // ── the cleared site ─────────────────────────────────────────────────────────────────
      // One pad per lot in the assembled site: the parcel, plus any neighbouring lot the
      // plate grew over. The buildings were dropped in siteContextGeo, but the OSM raster
      // still prints their footprints on the ground, so an opaque pad covers them and the
      // site reads as cleared ground. Pads sit above the map and below the site fill and
      // outline, and still take the shadow. An assembled lot is drawn in the parcel's own
      // orange: once it is bought it is site, not context.
      const shapeXZ = pts => {
        const sh = new THREE.Shape();
        pts.forEach(([x, z], i) => { i ? sh.lineTo(x, -z) : sh.moveTo(x, -z); });
        sh.closePath();
        return sh;
      };
      const padMat = new THREE.MeshStandardMaterial({ color: 0xdde3ec, roughness: 0.95, metalness: 0 });
      const fillMat = new THREE.MeshBasicMaterial({ color: 0xE67033, transparent: true, opacity: 0.16, side: THREE.DoubleSide });
      const lineMat = new THREE.LineBasicMaterial({ color: 0xE67033 });
      const padGeos = geo.siteRings.length
        ? geo.siteRings.map(r => [new THREE.ShapeGeometry(shapeXZ(r)), r])
        : geo.clearR > 0 ? [[new THREE.CircleGeometry(geo.clearR, 48), null]] : [];
      for (const [g, ring] of padGeos) {
        const pad = new THREE.Mesh(g, padMat);
        pad.name = 'lot-pad';
        pad.rotateX(-Math.PI / 2); pad.position.y = groundY + 0.02; pad.receiveShadow = true;
        root.add(pad);
        if (!ring) continue;
        const fill = new THREE.Mesh(g.clone(), fillMat);
        fill.rotateX(-Math.PI / 2); fill.position.y = groundY + 0.03; root.add(fill);
        const pts = ring.map(([x, z]) => new THREE.Vector3(x, groundY + 0.06, z));
        root.add(new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(pts), lineMat));
      }

      // ── M6 entry markers ─────────────────────────────────────────────────────────────────
      // One tick per ranked frontage, drawn on the face and pointing out along its normal.
      // Inside this group, so they turn with the parcel they belong to.
      if (SITE_FRONTAGES) {
        // Scale with the parcel, not in fixed metres: on the real City Market lot a 9 m arrow
        // vanished under a study massing many times the lot's size. depthTest is off and the
        // render order is late so the markers read as an annotation LAYER, visible through the
        // volume, rather than as ground linework the building buries.
        let pr0 = 0;
        for (const p of (s.parcel && s.parcel.ring) || []) { const [x, z] = toXZ(p); pr0 = Math.max(pr0, Math.hypot(x, z)); }
        const mScale = Math.max(1, pr0 / 30);
        const ROLE = { primary: [0xE67033, 9], secondary: [0xEEC341, 6], service: [0x6b7480, 4] };
        for (const f of SITE_FRONTAGES.fronts) {
          if (!f.role) continue;
          const [col, base] = ROLE[f.role];
          const reach = base * mScale;
          const mat = new THREE.LineBasicMaterial({ color: col, depthTest: false, transparent: true });
          const y = groundY + 0.09, [mx, mz] = f.mid;
          const th = f.normal * Math.PI / 180, ux = Math.sin(th), uz = -Math.cos(th);
          const seg = (ax, az, bx, bz) => {
            const ln = new THREE.Line(
              new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(ax, y, az), new THREE.Vector3(bx, y, bz)]), mat);
            ln.renderOrder = 12;
            root.add(ln);
          };
          // the arrow out of the face
          seg(mx, mz, mx + ux * reach, mz + uz * reach);
          const hx = ux * reach * 0.72, hz = uz * reach * 0.72, wx2 = -uz * reach * 0.2, wz2 = ux * reach * 0.2;
          seg(mx + hx + wx2, mz + hz + wz2, mx + ux * reach, mz + uz * reach);
          seg(mx + hx - wx2, mz + hz - wz2, mx + ux * reach, mz + uz * reach);
          // a bar across the face itself, so the marker reads as an entry ON that frontage
          const bl = Math.min(f.len * 0.36, reach * 1.5);
          const tx = Math.sin(f.bearing * Math.PI / 180), tz = -Math.cos(f.bearing * Math.PI / 180);
          seg(mx - tx * bl, mz - tz * bl, mx + tx * bl, mz + tz * bl);
        }
      }

      // ── north arrow ──────────────────────────────────────────────────────────────────────
      // Drawn INSIDE this group, pointing at local -Z. The group carries the site rotation, so
      // the arrow comes out pointing at true north with no angle maths of its own. Once the
      // site is turned, "up the screen" stops meaning north and the drawing has to say so.
      if (GRID_ROT_DEG !== 0) {
        // Sits just outside the PARCEL, not out at the context radius: the arrow is an
        // annotation on the site plan and has to stay inside the frame the camera picks.
        let pr = 0;
        for (const p of (s.parcel && s.parcel.ring) || []) { const [x, z] = toXZ(p); pr = Math.max(pr, Math.hypot(x, z)); }
        const R = Math.max(pr * 1.18, 30), y = groundY + 0.08;
        const line = (a, b) => new THREE.Line(
          new THREE.BufferGeometry().setFromPoints([a, b]),
          new THREE.LineBasicMaterial({ color: 0x172FC7 })
        );
        const tip = new THREE.Vector3(0, y, -R), tail = new THREE.Vector3(0, y, -R * 0.82);
        root.add(line(tail, tip));
        const head = R * 0.045;
        root.add(line(new THREE.Vector3(-head, y, -R + head * 2), tip));
        root.add(line(new THREE.Vector3(head, y, -R + head * 2), tip));
        // "N" as two strokes, small and north of the tip — no font loading, no sprite
        const nz = -R - head * 3.2, nh = head * 1.9, nw = head * 0.85;
        root.add(line(new THREE.Vector3(-nw, y, nz + nh), new THREE.Vector3(-nw, y, nz - nh)));
        root.add(line(new THREE.Vector3(-nw, y, nz - nh), new THREE.Vector3(nw, y, nz + nh)));
        root.add(line(new THREE.Vector3(nw, y, nz + nh), new THREE.Vector3(nw, y, nz - nh)));
      }
    }

    // Every build used to re-seat the camera and the orbit target, so orbiting to an angle and
    // then scrubbing a year threw the view away — the model appeared to jump on every tick of
    // the timeline. A rebuild is not a new building. With VIEW_KEEP on (the default) the eye,
    // the target and the zoom are left exactly where the user put them; only a genuinely new
    // program re-frames, by clearing VIEW_FRAMED first. The window-resize handler keeps working
    // on its own, since it derives the span from `camera.top` rather than from here.
    function frameCamera(plate, towerH, yMin) {
      const span = Math.max(plate, towerH) * 0.7 + 6, aspect = innerWidth / innerHeight;
      if (!camera) {
        camera = new THREE.OrthographicCamera(-span * aspect, span * aspect, span, -span, -4000, 8000);
        controls = new OrbitControls(camera, renderer.domElement); controls.enableDamping = true; controls.dampingFactor = 0.08;
      } else if (VIEW_KEEP && VIEW_FRAMED) {
        controls.update();
        return;
      } else { camera.left = -span * aspect; camera.right = span * aspect; camera.top = span; camera.bottom = -span; camera.updateProjectionMatrix(); }
      const d = span * 2;
      camera.position.set(d, d * 0.85 + towerH * 0.3, d); camera.updateProjectionMatrix();
      controls.target.set(0, yMin + towerH * 0.45, 0); controls.update();
      VIEW_FRAMED = true;
    }
    // Put the view back to the framed default, on demand.
    function refitCamera() { VIEW_FRAMED = false; build(); }

    // ── stats / legend ──
    function renderStats() {
      const el = document.getElementById('stats');
      if (!PROGRAM.length) { el.innerHTML = '<div style="font-size:10px;color:var(--text-lo)">Load output.txt to build.</div>'; return; }
      // Area split by program duration (isShort) instead of public/private category; circulation kept aside.
      let circ = 0, longA = 0, shortA = 0, total = 0;
      const tally = (cat, type, area) => {
        total += area;
        if (cat === 'circulation') circ += area;
        else if (isShort(type)) shortA += area;
        else longA += area;
      };
      for (const p of PROGRAM) tally(p.category, p.type, p.area);
      for (const b of ADDED_BLOCKS) tally(b.category, b.type, b.area);
      const levels = new Set(PROGRAM.map(p => p.level));
      let html = '';
      html += `<div class="stat-row"><span>Long-duration</span><b>${Math.round(longA).toLocaleString()} m²</b></div>`;
      html += `<div class="stat-row"><span>Short-duration</span><b>${Math.round(shortA).toLocaleString()} m²</b></div>`;
      if (circ) html += `<div class="stat-row"><span>Circulation</span><b>${Math.round(circ).toLocaleString()} m²</b></div>`;
      html += `<div class="stat-row stat-total"><span>Total GFA</span><b>${Math.round(total).toLocaleString()} m²</b></div>`;
      // On a frame, "Floors" alone reads as if the tower shrank. Say what is built and what is used.
      html += GEO_IS_FRAME
        ? `<div class="stat-row"><span>Floors built</span><b>${LAST_LAYOUT ? LAST_LAYOUT.levels.length : levels.size}</b>`
          + (LAST_LAYOUT && LAST_LAYOUT.frameLevels && LAST_LAYOUT.frameLevels.length > LAST_LAYOUT.levels.length
            ? `<span style="color:var(--text-lo)"> of ${LAST_LAYOUT.frameLevels.length}</span>` : '') + `</div>`
          + `<div class="stat-row"><span>Floors in use</span><b>${levels.size}</b></div>`
        : `<div class="stat-row"><span>Floors</span><b>${levels.size}</b></div>`;
      // On a forecast frame the building is the union of every future, so how much of it this
      // future leaves standing empty is the number that actually distinguishes the scenarios.
      if (GEO_IS_FRAME) {
        const frame = total + VACANT_AREA;
        html += `<div class="stat-row"><span>Vacant frame</span><b>${Math.round(VACANT_AREA).toLocaleString()} m²</b></div>`;
        html += `<div class="stat-row"><span>Frame occupancy</span><b>${frame ? Math.round(total / frame * 100) : 0} %</b></div>`;
      }
      const compressed = [...shortFloors].sort((a, b) => a - b);
      html += `<div class="stat-row stat-total"><span>8'-6" SHORT floors</span><b>${compressed.length}</b></div>`;
      if (compressed.length) html += `<div class="stat-row"><span style="color:var(--orange)">levels</span><b>${compressed.map(levelLabel).join(', ')}</b></div>`;
      el.innerHTML = html;
    }
    // ── Program Mode: add-volume palette ──
    // Rebuilt every build() from types actually present in the loaded case (exportBoxes), so the
    // palette always matches what's currently open — no separate hardcoded program table to keep in sync.
    function renderPalette() {
      const seen = new Set(); const list = [];
      for (const b of exportBoxes) {
        if (b.added || b.struct || b.ghost || !isMovable(b) || seen.has(b.type)) continue;   // vacant shells are not a program you can place
        seen.add(b.type); list.push({ type: b.type, category: b.category, w: b.w, d: b.d, area: b.area, w_d: b.w_d });
      }
      PALETTE = list;
      const row = document.getElementById('palette-row');
      if (!row) return;
      // split by timespan, because that is the decision behind placing one: a LONG block is
      // structure you are committing to, a SHORT one is a module that can be unplugged again
      // each card wears the hue its blocks have in the model — same `hashHue(type)`, washed out to
      // a tint so 33 of them can sit in a column without shouting. The type hue and not the change
      // colours: nothing in the palette has been converted yet, so 'change' would hand back one
      // grey for all 33.
      const card = p => `<button class="btn small pal-card" data-type="${p.type.replace(/"/g, '&quot;')}" style="background:${hslToHex(hashHue(p.type), 48, 88)};">${prettyName(p.type)}<br><span class="ar">${Math.round(p.area)} m&sup2;</span></button>`;
      const longs = list.filter(p => !isShort(p.type)), shorts = list.filter(p => isShort(p.type));
      row.innerHTML = (longs.length ? '<div class="pal-head long">Long duration</div>' + longs.map(card).join('') : '')
        + (shorts.length ? '<div class="pal-head short">Short duration</div>' + shorts.map(card).join('') : '');
    }
    function addProgramBlock(type) {
      const tmpl = PALETTE.find(p => p.type === type); if (!tmpl) return;
      const FWm = (LAST_LAYOUT ? LAST_LAYOUT.FW : 10) * MODULE, FDm = (LAST_LAYOUT ? LAST_LAYOUT.FD : 10) * MODULE;
      const idx = ADDED_BLOCKS.length, stepZ = tmpl.d + MODULE;
      const rec = {
        type: tmpl.type, category: tmpl.category, level: 'add', vertical: false, isCore: false,
        short: true, added: true, moveKey: 'added#' + (ADDED_SEQ++),
        cx: FWm / 2 + 3 * MODULE + tmpl.w / 2, cy: MODULE / 2, cz: -FDm / 2 + idx * stepZ,
        w: tmpl.w, h: MODULE, d: tmpl.d, area: tmpl.area, w_d: tmpl.w_d
      };
      ADDED_BLOCKS.push(rec);
      build();
      setSelected(rec.moveKey);
    }
    document.getElementById('palette-row').addEventListener('click', e => {
      const b = e.target.closest('.pal-card'); if (b) addProgramBlock(b.dataset.type);
    });
    function renderCodePanel() {
      const el = document.getElementById('code-violations');
      if (!el) return;
      if (!PROGRAM.length) { el.innerHTML = '<div style="font-size:10px;color:var(--text-lo)">No program loaded.</div>'; return; }
      const v = CODE_CHECK.violations;
      const sh = CODE_CHECK.shafts || [];

      // status line — aligned like a stat-total row
      const ok = !v.length;
      const status = `<div class="code-status"><span>Massing checks</span>`
        + (ok
          ? `<b style="color:#2e9e6b">&#10003; Clear</b>`
          : `<b style="color:#e05555">${v.length} issue${v.length > 1 ? 's' : ''}</b>`)
        + `</div>`;

      let body = '';
      if (!ok) {
        body += v.map(x =>
          `<div class="stat-row code-row" title="${x.note}"><span style="color:#e05555">${x.rule} &middot; ${x.level === 'all' ? 'ALL' : levelLabel(x.level)}</span><b>${x.measured} / ${x.threshold} ${x.unit}</b></div>`
        ).join('');
        body += `<div class="code-cap" style="margin:5px 0 0">Hover a row for the rule note.</div>`;
      }

      if (sh.length) {
        body += `<div class="code-sub">Exit shafts &middot; ${sh.length}</div>`;
        body += sh.map(s =>
          `<div class="stat-row code-row"><span>${prettyName(s.type).replace(/fire stair (&|and) /i, '')}</span><b>${levelLabel(s.minL)}&ndash;${levelLabel(s.maxL)}</b></div>`
        ).join('');
      }
      el.innerHTML = status + body;
    }

    // ── hover ──
    renderer.domElement.addEventListener('pointermove', ev => {
      if (drag) { tooltip.style.display = 'none'; return; }
      const r = renderer.domElement.getBoundingClientRect();
      ndc.x = ((ev.clientX - r.left) / r.width) * 2 - 1; ndc.y = -((ev.clientY - r.top) / r.height) * 2 + 1;
      raycaster.setFromCamera(ndc, camera);
      const hit = raycaster.intersectObjects(meshes, false)[0];
      if (hit) {
        const u = hit.object.userData;
        tooltip.style.display = 'block'; tooltip.style.left = (ev.clientX + 14) + 'px'; tooltip.style.top = (ev.clientY + 14) + 'px';
        tooltip.innerHTML = `<strong>${prettyName(u.type)}</strong> · ${Math.round(u.area)} m² ${u.vertical ? '· ⊥ shaft' : ''}<br><span style="color:var(--text-lo);font-size:9px">${levelLabel(u.level)} · ${u.category} · ${u.w_d}</span>`;
      } else tooltip.style.display = 'none';
    });

    // ── FREE MOVE (program massing) ──
    // Per-program-type world offset, snapped to a fraction of MODULE. Applied to mesh.position only
    // (never to rec.cx/cy/cz, which is shared with exportBoxes). Re-applied after every build() so it
    // survives rebuilds without touching computeLayout.
    const isMovable = u => !!u && !u.struct && u.cx !== undefined && !isCore(u.type) && !isCorridor(u.type);
    const offOf = t => MOVE_OFFSETS.get(t) || { dx: 0, dy: 0, dz: 0 };
    function moveReadout() {
      const el = document.getElementById('move-readout');
      if (!el) return;
      if (!MOVE_OFFSETS.size) { el.textContent = ''; return; }
      el.innerHTML = [...MOVE_OFFSETS.entries()]
        .map(([k, o]) => {
          const added = ADDED_BLOCKS.find(b => b.moveKey === k);
          const label = added ? prettyName(added.type) + ' (new)' : prettyName(k);
          return `${label}: ${(o.dx / MODULE).toFixed(2)}, ${(o.dy / MODULE).toFixed(2)}, ${(o.dz / MODULE).toFixed(2)} mod`;
        })
        .join('<br>');
    }
    function applyMoveOffsets() {
      for (const m of meshes) {
        const u = m.userData;
        if (u.struct || u.cx === undefined) continue;
        const o = isMovable(u) ? offOf(moveKeyOf(u)) : { dx: 0, dy: 0, dz: 0 };
        m.position.set(u.cx + o.dx, u.cy + o.dy, u.cz + o.dz);
        if (m.material && 'emissive' in m.material) {
          m.material.emissive.setHex(isMovable(u) && moveKeyOf(u) === SELECTED ? 0x2a3dcf : 0x000000);
        }
      }
    }
    function setSelected(type) {
      SELECTED = type || null;
      applyMoveOffsets();
      moveReadout();
    }

    let drag = null;
    const dragPlaneHit = new THREE.Vector3();
    function planeFor(vertical, point) {
      if (vertical) {
        const n = new THREE.Vector3(); camera.getWorldDirection(n); n.y = 0;
        if (n.lengthSq() < 1e-6) n.set(0, 0, 1); else n.normalize();
        return new THREE.Plane().setFromNormalAndCoplanarPoint(n, point);
      }
      return new THREE.Plane(new THREE.Vector3(0, 1, 0), -point.y);
    }
    function stepFor(ev) {
      const inc = ev.altKey ? 0.5 : (ev.ctrlKey || ev.metaKey) ? (2 / 3) : MOVE_INC;
      return inc * MODULE;
    }
    const snapTo = (v, step) => Math.round(v / step) * step;

    renderer.domElement.addEventListener('pointerdown', ev => {
      if (ev.button !== 0 || RENDER_MODE !== 'solid' || PROGRAM_MODE !== 'on') return;
      const r = renderer.domElement.getBoundingClientRect();
      ndc.x = ((ev.clientX - r.left) / r.width) * 2 - 1; ndc.y = -((ev.clientY - r.top) / r.height) * 2 + 1;
      raycaster.setFromCamera(ndc, camera);
      const hit = raycaster.intersectObjects(meshes, false).find(h => isMovable(h.object.userData));
      if (!hit) { setSelected(null); return; }
      const key = moveKeyOf(hit.object.userData);
      setSelected(key);
      const vertical = ev.shiftKey;
      const plane = planeFor(vertical, hit.point);
      drag = { key, plane, start: hit.point.clone(), base: { ...offOf(key) }, live: { dx: 0, dy: 0, dz: 0 }, vertical, pointerId: ev.pointerId };
      controls.enabled = false;
      renderer.domElement.setPointerCapture(ev.pointerId);
      ev.preventDefault();
    });

    renderer.domElement.addEventListener('pointermove', ev => {
      if (!drag) return;
      const r = renderer.domElement.getBoundingClientRect();
      ndc.x = ((ev.clientX - r.left) / r.width) * 2 - 1; ndc.y = -((ev.clientY - r.top) / r.height) * 2 + 1;
      raycaster.setFromCamera(ndc, camera);
      if (ev.shiftKey !== drag.vertical) {
        drag.base.dx += drag.live.dx; drag.base.dy += drag.live.dy; drag.base.dz += drag.live.dz;
        drag.live = { dx: 0, dy: 0, dz: 0 };
        drag.vertical = ev.shiftKey;
        if (!raycaster.ray.intersectPlane(drag.plane, dragPlaneHit)) return;
        drag.start = dragPlaneHit.clone();
        drag.plane = planeFor(drag.vertical, drag.start);
      }
      if (!raycaster.ray.intersectPlane(drag.plane, dragPlaneHit)) return;
      const delta = dragPlaneHit.clone().sub(drag.start);
      const step = stepFor(ev);
      if (drag.vertical) { drag.live.dx = 0; drag.live.dy = snapTo(delta.y, step); drag.live.dz = 0; }
      else { drag.live.dx = snapTo(delta.x, step); drag.live.dy = 0; drag.live.dz = snapTo(delta.z, step); }
      const o = { dx: drag.base.dx + drag.live.dx, dy: drag.base.dy + drag.live.dy, dz: drag.base.dz + drag.live.dz };
      MOVE_OFFSETS.set(drag.key, o);
      applyMoveOffsets();
      moveReadout();
    });

    function endDrag(ev) {
      if (!drag) return;
      const o = { dx: drag.base.dx + drag.live.dx, dy: drag.base.dy + drag.live.dy, dz: drag.base.dz + drag.live.dz };
      if (o.dx === 0 && o.dy === 0 && o.dz === 0) MOVE_OFFSETS.delete(drag.key); else MOVE_OFFSETS.set(drag.key, o);
      try { renderer.domElement.releasePointerCapture(ev.pointerId); } catch (e) {}
      drag = null;
      controls.enabled = true;
      moveReadout();
    }
    renderer.domElement.addEventListener('pointerup', endDrag);
    renderer.domElement.addEventListener('pointercancel', endDrag);

    addEventListener('keydown', ev => {
      const tag = document.activeElement && document.activeElement.tagName;
      if (tag === 'INPUT' || tag === 'TEXTAREA') return;
      if (PROGRAM_MODE !== 'on') return;
      if (ev.key === 'Escape') { setSelected(null); return; }
      if (ev.key === '1' || ev.key === '2' || ev.key === '3') {
        const v = ev.key === '2' ? '2/3' : ev.key === '3' ? '1/2' : '1';
        MOVE_INC = v === '2/3' ? 2 / 3 : v === '1/2' ? 0.5 : 1;
        const sm = document.getElementById('seg-move');
        if (sm) sm.querySelectorAll('button').forEach(b => b.classList.toggle('active', b.dataset.v === v));
        return;
      }
      if (!SELECTED || RENDER_MODE !== 'solid') return;
      const step = stepFor(ev);
      const o = { ...offOf(SELECTED) };
      let used = true;
      if (ev.key === 'ArrowLeft') o.dx -= step;
      else if (ev.key === 'ArrowRight') o.dx += step;
      else if (ev.key === 'ArrowUp') o.dz -= step;
      else if (ev.key === 'ArrowDown') o.dz += step;
      else if (ev.key === 'PageUp') o.dy += step;
      else if (ev.key === 'PageDown') o.dy -= step;
      else if (ev.key === 'Delete' || ev.key === 'Backspace') {
        const idx = ADDED_BLOCKS.findIndex(b => b.moveKey === SELECTED);
        if (idx >= 0) { ADDED_BLOCKS.splice(idx, 1); MOVE_OFFSETS.delete(SELECTED); SELECTED = null; build(); }
        else { MOVE_OFFSETS.delete(SELECTED); applyMoveOffsets(); moveReadout(); }
        return;
      }
      else used = false;
      if (!used) return;
      ev.preventDefault();
      if (o.dx === 0 && o.dy === 0 && o.dz === 0) MOVE_OFFSETS.delete(SELECTED); else MOVE_OFFSETS.set(SELECTED, o);
      applyMoveOffsets();
      moveReadout();
    });

    // ─────────────────────────────────────────────────────────
    // ADAPTIVE USE — chat-driven conversion timeline
    //   "in 8 years turn L3 into housing" → a conversion rule. The timeline slider
    //   re-derives PROGRAM from BASE_PROGRAM by replaying every rule due at that
    //   year, then rebuilds. Because a rule can swap a LONG use for a SHORT one,
    //   a floor can cross SHORT_THRESHOLD and collapse to the 8'-6" plug-in storey
    //   (or grow back), so the massing itself carries the scenario.
    //   Parsing is local and rule-based: no API call, works offline.
    // ─────────────────────────────────────────────────────────
    // Canonical types are the ones the massing already speaks (see SAMPLE + the
    // PROGRAM-MODULE-AREA-TABLE). `keys` are what a user might type, EN or ZH.
    // `re` is how the entry matches EXISTING rows when it is the source of a rule,
    // so "office" catches both `office loft` and `startup office suite`.
    const USE_VOCAB = [
      { type: 'coffee shop', category: 'public', re: /coffee|cafe/i, keys: ['coffee', 'cafe', 'café', '咖啡'] },
      { type: 'restaurant', category: 'public', re: /restaurant|dining|kitchen/i, keys: ['restaurant', 'dining', '餐廳', '餐饮', '餐飲'] },
      { type: 'lounge bar', category: 'public', re: /lounge bar|\bbar\b/i, keys: ['lounge bar', 'bar', '酒吧'] },
      { type: 'pop-up retail', category: 'public', re: /retail|pop[- ]?up|shop|store(?!age)/i, keys: ['pop-up', 'pop up', 'popup', 'retail', 'shop', 'store', '快閃', '零售', '店鋪', '店舖', '商店'] },
      { type: 'brand showroom', category: 'public', re: /showroom|display/i, keys: ['showroom', 'display', '展間', '展示'] },
      { type: 'exhibition gallery', category: 'public', re: /exhibition|gallery|museum/i, keys: ['exhibition', 'gallery', 'museum', '展覽', '展览', '藝廊', '美術館', '博物館'] },
      { type: 'event hall', category: 'public', re: /event hall|event|banquet/i, keys: ['event hall', 'event', 'banquet', '活動', '會展', '宴會'] },
      { type: 'ai training classroom', category: 'public', re: /classroom|training|school/i, keys: ['classroom', 'training', 'school', '教室', '教學', '培訓', '學校'] },
      { type: 'seminar room', category: 'public', re: /seminar|conference|meeting/i, keys: ['seminar', 'conference', 'meeting room', '研討', '會議室'] },
      { type: 'computer lab', category: 'public', re: /computer lab|\blab\b/i, keys: ['computer lab', 'lab', '電腦教室', '實驗室'] },
      { type: 'startup demo space', category: 'public', re: /\bdemo\b|incubator/i, keys: ['demo', 'incubator', '展演', '育成'] },
      { type: 'library', category: 'public', re: /library/i, keys: ['library', '圖書', '图书'] },
      { type: 'yoga studio', category: 'public', re: /yoga/i, keys: ['yoga', '瑜珈', '瑜伽'] },
      { type: 'pilates studio', category: 'public', re: /pilates/i, keys: ['pilates', '皮拉提斯'] },
      { type: 'group fitness studio', category: 'public', re: /fitness|\bgym\b/i, keys: ['fitness', 'gym', '健身'] },
      { type: 'recovery lounge', category: 'public', re: /recovery/i, keys: ['recovery', 'spa', '恢復', '休憩'] },
      { type: 'physical therapy suite', category: 'private', re: /physical therapy|therapy/i, keys: ['physical therapy', 'therapy', 'clinic', '物理治療', '復健', '診所'] },
      { type: 'meditation room', category: 'public', re: /meditation/i, keys: ['meditation', '冥想', '靜心'] },
      { type: 'office loft', category: 'private', re: /office/i, keys: ['office', 'workplace', 'workspace', '辦公', '办公'] },
      { type: 'startup office suite', category: 'private', re: /startup office|co[- ]?working/i, keys: ['coworking', 'co-working', 'startup office', '共同工作', '共享辦公', '新創辦公'] },
      { type: '1b1b apartment', category: 'private', re: /apartment|residence|housing|dwelling/i, keys: ['housing', 'apartment', 'residential', 'residence', 'flat', '住宅', '住家', '公寓', '居住'] },
      { type: 'studio apartment', category: 'private', re: /studio apartment/i, keys: ['studio apartment', 'micro unit', '套房'] },
      { type: '2b2b apartment', category: 'private', re: /2b2b/i, keys: ['2b2b', 'two bedroom', 'family apartment', '兩房', '家庭住宅'] },
      { type: 'residential lounge', category: 'public', re: /residential lounge/i, keys: ['residential lounge', 'resident lounge', '交誼廳', '住戶交誼'] },
      { type: 'community kitchen', category: 'public', re: /community kitchen/i, keys: ['community kitchen', 'shared kitchen', '共享廚房', '共同廚房'] },
      { type: 'shared amenity', category: 'public', re: /shared amenity|amenity/i, keys: ['amenity', 'shared amenity', '共享空間', '公共設施'] },
      { type: 'foyer', category: 'public', re: /foyer|lobby/i, keys: ['foyer', 'lobby', '大廳', '門廳'] },
      { type: 'storage', category: 'private', re: /storage/i, keys: ['storage', 'warehouse', '倉庫', '儲藏'] },
      { type: 'parking bay group', category: 'private', re: /parking/i, keys: ['parking', 'car park', '停車', '車位'] },
      { type: 'mechanical room', category: 'private', re: /mechanical|electrical/i, keys: ['mechanical', 'plant room', '機房', '機電'] }
    ];
    // Services stay put unless a rule names them: a floor-wide "L3 becomes housing"
    // should not eat the restrooms, risers or the loading dock.
    const isFixedUse = t => isToilet(t) || /mechanical|electrical|storage|loading|parking|\bplant\b|laundry|package room|it support/i.test(t);

    // ── BUILDING TYPE ────────────────────────────────────────────────────────────────────
    // The wizard's second question, asked here too because this page is reachable without
    // it: the SAMPLE path, a shared link, a program pasted in. It decides the main-use plate
    // on every above-grade floor, and it is remembered, so a later edit that has to invent a
    // use (a floor added with no use named) invents the right one.
    const BUILDING_TYPES = { 'mixed-use': 'Mixed-use', office: 'Office', housing: 'Housing' };
    let BUILDING_TYPE = null;
    // Mirrors useHousingAt() in program-input.html's generateEntries, level for level, so the
    // wizard and the chat produce the same stack from the same answer.
    // ── ground-floor rule ────────────────────────────────────────────────────────────────
    // A dwelling does not belong on L1. The ground is the street face: entrance, lobby, the
    // active frontage, and a unit sitting directly on the pavement needs a raised floor and
    // its own door before it works at all. The wizard already builds it that way (its
    // useHousingAt starts at level 1), so the chat has to agree or the same building comes
    // out different depending on which page made it.
    // Blanket paths therefore skip level 0: a building-type recast, "all floors", a timeline
    // rule written for every floor. Naming L1 outright still works, with a note, because
    // that is a decision rather than an oversight.
    const isDwelling = t => /apartment|dwelling|residential/i.test(t);
    const housingAt = lv => lv < 1 ? false
      : BUILDING_TYPE === 'housing' ? true
      : BUILDING_TYPE === 'mixed-use' ? ((lv - 1) % 2 === 1) : false;
    const mainUseAt = lv => housingAt(lv) ? '1b1b apartment' : 'office loft';
    // Read a bare answer only. "housing" and "make it housing" set the type; "make L3 housing"
    // names a floor and belongs to programEdit, so the pattern has to end after the use.
    const BT_RE = /^(?:(?:the\s+)?building\s*type\s*(?:is|:|=)?\s*|make\s+it\s+(?:an?\s+)?|it(?:'s|s|\s+is)\s+(?:an?\s+)?|we(?:'re|\s+are)\s+programming\s+(?:an?\s+)?)?(mixed[-\s]?use|mixed|office|housing|residential|apartments?|住宅|辦公|办公|混合(?:使用)?)\s*(?:building)?[.!]?$/i;
    function readBuildingType(s) {
      const m = String(s).trim().match(BT_RE);
      if (!m) return null;
      const v = m[1].toLowerCase();
      if (/^mixed|混合/.test(v)) return 'mixed-use';
      if (/^office|辦公|办公/.test(v)) return 'office';
      return 'housing';
    }

    // Rule D in the wizard: no residential line over 160 m². Renaming a 900 m² office plate
    // whole would land one apartment the size of a floor, so a housing plate is cut into the
    // fewest units that all clear the cap and then named by the nearest wizard preset
    // (2b2b 134 / 1b1b 107 / studio 67). Area is preserved exactly: a greedy largest-first
    // split leaves a remainder, and both places to put it are wrong — growing the last unit
    // breaks the cap (a 322 m² plate came out as a 188 m² apartment), dropping it loses GFA.
    const HOUSING_MAX = 160;
    const housingUnitName = a => a >= 121 ? '2b2b apartment' : a >= 87 ? '1b1b apartment' : 'studio apartment';
    function decomposeHousing(area) {
      const n = Math.max(1, Math.ceil(area / HOUSING_MAX));
      const each = Math.round(area / n);
      const out = [];
      let rem = area;
      for (let i = 0; i < n; i++) {
        const a = i === n - 1 ? Math.round(rem) : each;
        out.push([housingUnitName(a), a]);
        rem -= a;
      }
      return out;
    }

    // Recast the LONG main-use plates to the answered type. The SHORT plug-in band is the
    // wizard's OTHER question (what activities plug in) and is left alone: recasting it would
    // drop every floor's SHORT share under the 50% threshold and collapse the 8'-6" storeys.
    // Cores, corridors, service spaces and the ground floor's public anchors stay put.
    function applyBuildingType() {
      const isPlate = p => p.level >= 1 && !p.isCore && !isCorridor(p.type)
        && !isFixedUse(p.type) && !isShort(p.type);
      const next = [];
      let n = 0, area = 0;
      const levels = new Set();
      for (const p of BASE_PROGRAM) {
        if (!isPlate(p)) { next.push(p); continue; }
        if (housingAt(p.level)) {
          const units = decomposeHousing(p.area);
          if (units.length === 1 && units[0][0] === p.type) { next.push(p); continue; }
          for (const [t, a] of units) {
            const v = USE_VOCAB.find(u => u.type === t);
            const side = Math.sqrt(a);
            next.push({ uid: ++ROW_UID, type: t, area: a, level: p.level, category: v ? v.category : 'private', w: side, h: side, isCore: false });
          }
        } else {
          const want = mainUseAt(p.level);
          if (p.type === want) { next.push(p); continue; }
          const v = USE_VOCAB.find(u => u.type === want);
          next.push({ ...p, type: want, category: v ? v.category : 'private' });
        }
        n++; area += p.area; levels.add(p.level);
      }
      BASE_PROGRAM = next;
      PROGRAM_EDITED = true;
      return { n, area, levels: [...levels].sort((a, b) => a - b) };
    }

    let BASE_PROGRAM = [];     // parsed source rows — the year-0 state, never mutated by the timeline
    let CONVERSIONS = [];      // {id, year, levels:'all'|[lv], from:{label,re}|null, to:{type,category}}
    let SCEN_YEAR = 0, CONV_SEQ = 0;
    const CONV_HITS = new Map();   // rule id → {n, area} actually converted in the last apply
    const hasCJK = s => /[一-鿿]/.test(s);

    const ZH_DIG = { '零': 0, '〇': 0, '一': 1, '二': 2, '兩': 2, '两': 2, '三': 3, '四': 4, '五': 5, '六': 6, '七': 7, '八': 8, '九': 9 };
    const ZH_NUM = '零〇一二兩两三四五六七八九十';
    function num(s) {
      if (s == null) return NaN;
      s = String(s).trim();
      if (/^\d+$/.test(s)) return parseInt(s, 10);
      if (!s || [...s].some(c => !ZH_NUM.includes(c))) return NaN;
      const i = s.indexOf('十');
      if (i < 0) { let n = 0; for (const c of s) n = n * 10 + ZH_DIG[c]; return n; }
      const hi = i === 0 ? 1 : ZH_DIG[s[i - 1]];
      const lo = i === s.length - 1 ? 0 : ZH_DIG[s[i + 1]];
      return hi * 10 + lo;
    }

    // Year first, then strip it — otherwise "5年後三樓" reads the 5 as a floor.
    function parseYear(s) {
      if (/\b(now|today|immediately)\b|現在|立刻|馬上|目前/i.test(s)) return { year: 0, rest: s };
      const pats = [
        new RegExp('(?:in|after)\\s+(\\d+)\\s*(?:years?|yrs?)', 'i'),
        new RegExp('(\\d+)\\s*(?:years?|yrs?)', 'i'),
        new RegExp('\\byear\\s*(\\d+)', 'i'),
        new RegExp('第\\s*([0-9' + ZH_NUM + ']+)\\s*年'),
        new RegExp('([0-9' + ZH_NUM + ']+)\\s*年(?:後|后|內|内)?')
      ];
      for (const re of pats) {
        const m = s.match(re);
        if (!m) continue;
        const y = num(m[1]);
        if (isNaN(y)) continue;
        return { year: Math.max(0, Math.min(200, y)), rest: s.slice(0, m.index) + ' ' + s.slice(m.index + m[0].length) };
      }
      return { year: null, rest: s };
    }

    // Display levels are 1-indexed (L1 = ground, B1 = first basement); internal are 0-indexed.
    function parseLevels(s) {
      if (/整棟|全部樓層|所有樓層|每一?層|各層|全部空間|all\s+(?:floors?|levels?)|every\s+(?:floor|level)|(?:whole|entire)\s+building|\beverything\b/i.test(s)) return 'all';
      const out = new Set();
      let t = s;
      const N = '[0-9' + ZH_NUM + ']+';
      const eat = (re, fn) => {
        t = t.replace(re, (...a) => { fn(a); return ' '; });
      };
      // ranges — "L3-L5", "3到5樓", "levels 2 to 4"
      eat(new RegExp('\\b(?:l|lv|level|floor)s?\\s*(\\d+)\\s*(?:[-~–]|\\bto\\b|\\bthrough\\b)\\s*(?:l|lv|level|floor)?s?\\s*(\\d+)', 'ig'),
        a => { const lo = +a[1], hi = +a[2]; for (let i = Math.min(lo, hi); i <= Math.max(lo, hi); i++) out.add(i - 1); });
      eat(new RegExp('(' + N + ')\\s*(?:[-~–]|到|至)\\s*(' + N + ')\\s*[樓層层]', 'g'),
        a => { const lo = num(a[1]), hi = num(a[2]); if (!isNaN(lo) && !isNaN(hi)) for (let i = Math.min(lo, hi); i <= Math.max(lo, hi); i++) out.add(i - 1); });
      // singles — basements first so "地下二樓" is not read as L2
      eat(new RegExp('地下\\s*(' + N + ')\\s*[樓層层]?', 'g'), a => { const n = num(a[1]); if (!isNaN(n)) out.add(-n); });
      eat(/\bb\s*(\d+)\b/ig, a => out.add(-(+a[1])));
      eat(/\b(?:level|floor|lvl)s?\s*(\d+)\b/ig, a => out.add(+a[1] - 1));
      eat(/\bl\s*(\d+)\b/ig, a => out.add(+a[1] - 1));
      eat(/\b(\d+)\s*f\b/ig, a => out.add(+a[1] - 1));
      eat(new RegExp('(' + N + ')\\s*[樓層层]', 'g'), a => { const n = num(a[1]); if (!isNaN(n)) out.add(n - 1); });
      if (/頂樓|頂層|top\s+floor|roof\s+level/i.test(t)) { const mx = Math.max(...BASE_PROGRAM.map(p => p.level)); if (isFinite(mx)) out.add(mx); }
      if (/地面層|street\s+level|ground\s+floor/i.test(t)) out.add(0);
      return out.size ? [...out].sort((a, b) => a - b) : null;
    }

    // Longest keyword wins, so "computer lab" beats "lab" and "coffee shop" beats "shop".
    function findUse(s) {
      let best = null;
      for (const v of USE_VOCAB) for (const k of v.keys) {
        let at = -1;
        if (hasCJK(k)) at = s.indexOf(k);
        else {
          // trailing s? so "apartments" / "the offices" still match a singular key
          const m = s.match(new RegExp('(^|[^a-z0-9])' + k.replace(/[.*+?^${}()|[\]\\-]/g, '\\$&') + 's?([^a-z0-9]|$)', 'i'));
          if (m) at = m.index + m[1].length;
        }
        if (at < 0) continue;
        if (!best || k.length > best.len || (k.length === best.len && at < best.at)) best = { v, at, len: k.length, key: k };
      }
      return best;
    }

    const CONNECT = /改造成|改成|改為|改为|轉為|轉成|轉型為|轉型成|轉換成|變成|變為|换成|換成|做成|→|->|=>|\bturn(?:ed|s)?\s+into\b|\bconvert(?:ed|s)?\s+(?:in)?to\b|\bswitch(?:ed|es)?\s+to\b|\bbecomes?\b|\bre-?purposed?\s+(?:as|to|into)\b|\binto\b/i;

    function parseScenario(raw) {
      const s = raw.trim().replace(/[，、]/g, ' ');
      const { year, rest } = parseYear(s);
      const m = rest.match(CONNECT);
      const lhs = m ? rest.slice(0, m.index) : rest;
      const rhs = m ? rest.slice(m.index + m[0].length) : rest;
      const to = findUse(rhs);
      if (!to) return { ok: false, why: 'no-target' };
      let from = null;
      if (m) {
        const f = findUse(lhs);
        if (f && f.v !== to.v) from = { label: prettyName(f.v.type), re: f.v.re };
      }
      const levels = parseLevels(m ? lhs : rest.slice(0, to.at)) || parseLevels(rest);
      if (!levels && !from) return { ok: false, why: 'no-target-space' };
      return { ok: true, year: year == null ? 0 : year, assumedYear: year == null, levels: levels || 'all', from, to: { type: to.v.type, category: to.v.category } };
    }

    const ruleHits = (p, c) => {
      if (p.isCore || isCorridor(p.type)) return false;
      if (c.levels !== 'all' && !c.levels.includes(p.level)) return false;
      // ground-floor rule: a blanket "every floor becomes housing" stops at the street face.
      // A rule that names L1 still converts it — see isDwelling above.
      if (c.levels === 'all' && p.level === 0 && isDwelling(c.to.type)) return false;
      if (c.from) return c.from.re.test(p.type);
      return !isFixedUse(p.type);
    };

    // ── Site Forecast timeline ────────────────────────────────────────────────────────
    // A year-keyed track of WHOLE programs, handed over by program-input.html's Site
    // Forecast. Different from CONVERSIONS, which mutate rows in place: each entry here
    // replaces the base program outright, because the Intel scenarios are parallel futures
    // of the same site rather than edits to one. The two stack: the track picks the base
    // for the current year, then any chat conversions replay on top of it.
    let FORECAST_TRACK = [];   // [{ year, id, name, horizon, rows }] ascending by year
    let FORECAST_BASE_YEAR = null;

    // ── Wizard timeline: two readings, one slider ─────────────────────────────────────
    // Both payloads are held parsed; TL_MODE decides which one drives the year axis. They
    // are mutually exclusive by construction — an evolution edits one program in place, a
    // track swaps the program outright, and running both at once would report a conversion
    // of a room the track had already replaced.
    let TL_MODE = 'evolution';   // 'evolution' | 'futures'
    let EVOLUTION = null;        // { horizon, churn, events:[…] } from program-input.html
    let FUTURES = null;          // { baseYear, entries:[{year,id,name,rows}] }
    let TL_HORIZON = 0;          // slider reach the evolution asked for, so it runs past its last event
    let TL_REASON = null;        // why a handed-over timeline is empty, shown instead of silence

    const reEsc = s => String(s).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

    // ── Demo playback ─────────────────────────────────────────────────────────────────
    // Steps the year slider on its own so the timeline can be shown rather than dragged.
    // A chained setTimeout, not an interval: build() takes 300 to 700 ms depending on how
    // much moved, and an interval would queue up rebuilds it cannot keep up with.
    // The dwell is uneven on purpose. A year where nothing happens is dead air, and a year
    // where the building actually recomposes needs long enough to read; the point of the demo
    // is the change, not the constant rate.
    let TL_PLAY = false, TL_TIMER = null, TL_SPEED = 1;
    const TL_DWELL = 420, TL_DWELL_EVENT = 1500, TL_DWELL_END = 2200;

    // years the audience should be held on: a conversion, or a forecast scenario anchor
    const tlBeats = () => new Set([...CONVERSIONS.map(c => c.year), ...FORECAST_TRACK.map(t => t.year)]);

    function tlPlay(on) {
      TL_PLAY = on === undefined ? !TL_PLAY : !!on;
      if (TL_TIMER) { clearTimeout(TL_TIMER); TL_TIMER = null; }
      const b = document.getElementById('tl-play');
      if (b) { b.classList.toggle('on', TL_PLAY); b.innerHTML = TL_PLAY ? '&#10073;&#10073;' : '&#9654;'; b.title = TL_PLAY ? 'Pause' : 'Play the timeline'; }
      if (!TL_PLAY) return;
      const sl = document.getElementById('chat-slider');
      const max = +sl.max;
      if (SCEN_YEAR >= max) { SCEN_YEAR = 0; applyScenario(); }   // restart rather than sit at the end
      const step = () => {
        if (!TL_PLAY) return;
        const beats = tlBeats(), last = SCEN_YEAR >= max;
        // hold on the year just reached, then move
        const dwell = (last ? TL_DWELL_END : beats.has(SCEN_YEAR) ? TL_DWELL_EVENT : TL_DWELL) / TL_SPEED;
        TL_TIMER = setTimeout(() => {
          if (!TL_PLAY) return;
          SCEN_YEAR = last ? 0 : SCEN_YEAR + 1;
          applyScenario();          // this is the expensive part, so it happens once per tick
          step();
        }, dwell);
      };
      step();
    }
    // Anything the user does to the timeline by hand takes the wheel back.
    const tlStop = () => { if (TL_PLAY) tlPlay(false); };

    // ── Demo timeline ─────────────────────────────────────────────────────────────────
    // Opened on its own, this file has no timeline: the wizard is what hands one over, so the
    // year slider moved and nothing converted (measured 260729 — 0 rules, 0 beats, `converted`
    // 0 at every year). A page that cannot demonstrate itself is no use in front of an audience.
    //
    // So: with no handover, derive a scenario from whatever program IS loaded. This is a DEMO,
    // not a prediction, and it says so in the panel. The wizard's version is dated from the M3
    // transition DB's cited conversions; there is no DB here, so the years below are round
    // numbers chosen to make the mechanism legible. Never present them as a forecast.
    let TL_DEMO = false;
