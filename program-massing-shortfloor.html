<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Program Massing — SHORT-floor variant (8'-6" plug-in storeys)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #F5F5F5; --blue: #172FC7; --orange: #E67033; --yellow: #EEC341;
      --panel-bg: rgba(255, 255, 255, 0.90);
      --border: rgba(23, 47, 199, 0.28); --border-dim: rgba(23, 47, 199, 0.12);
      --text-hi: #172FC7; --text-mid: rgba(23, 47, 199, 0.66); --text-lo: rgba(23, 47, 199, 0.42);
      --radius-lg: 12px; --radius-md: 8px; --radius-sm: 5px;
      /* one bar height for the whole viewport furniture: the mode switch over the model, the core
         options and the chat bar are all this tall. 57 px on a 950 px screen. */
      --floor-h: clamp(56px, 6vh, 66px);
      --bar-w: min(560px, calc(100vw - 620px));   /* the chat bar's width; the palette starts where it does */
    }
    body { background: var(--bg); font-family: 'Montserrat', Helvetica, Arial, sans-serif; overflow: hidden; color: var(--text-hi); }
    #canvas-container { position: fixed; inset: 0; }
    #title-block { position: fixed; top: 20px; left: 20px; z-index: 10; }
    /* The mark, cut out and inlined. NEXA-logo.png is fully opaque — 107,502 pixels, none
       transparent, 65,961 of them white — so it drew a white box over the viewport. The cut-out
       exists as NEXA-logo-mask.png, but a CSS mask (which is what the other pages use) loads
       nothing when the page is opened over file://, and these pages are meant to open by
       double-click: the mark simply vanished. So the mask's alpha is baked into a brand-blue PNG,
       trimmed to the artwork, and inlined as a data URI. No external file, no mask support needed,
       identical over file:// and http://. */
    #title-block .mark { height: 24px; width: auto; display: block; }   /* the data URI is trimmed to the artwork, so this height is all mark, no margin */
    /* The mark is the way back to the wizard, at its first question. Hover is the only
       affordance it needs: the cursor and a small fade say it is a link. */
    #title-block a { display: block; transition: opacity 0.15s; }
    #title-block a:hover { opacity: 0.55; }
    /* Nothing in this UI casts a shadow — panels, toolbar, chat bar, add-block strip, tooltip.
       Border plus blur is the whole separation. The `--shadow` token went with it, so a new
       element cannot pick one up by habit. */
    .panel { position: fixed; background: var(--panel-bg); border: 1px solid var(--border); border-radius: var(--radius-lg); z-index: 10; backdrop-filter: blur(16px); }
    /* Left column: Layout · Program and Adaptive use are two tabs of one stack, same left edge,
       same width, and only one of them is open at a time (the #right-stack idiom, mirrored). */
    #left-stack { position: fixed; top: 70px; left: 20px; bottom: 20px; width: 248px; display: flex; flex-direction: column; gap: 10px; z-index: 11; pointer-events: none; }
    #left-stack > * { pointer-events: auto; }
    /* The panel itself never scrolls: the layout controls are fixed under the header and the
       program list below them takes the rest of the column and scrolls on its own. */
    #left-panel { position: static; width: 100%; flex: 0 1 auto; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
    #left-panel > #layout-section { display: flex; flex-direction: column; min-height: 0; flex: 1 1 auto; }
    #left-body { display: flex; flex-direction: column; min-height: 0; flex: 1 1 auto; }
    #layout-body { flex: none; }
    #prog-section { display: flex; flex-direction: column; min-height: 0; flex: 1 1 auto; border-top: 1px solid var(--border-dim); margin-top: 8px; }
    /* With its body closed the Layout panel is just a tab header, and a tab header must never be
       the thing that gives up room to the panel below it. Measured 260730: it was being squeezed
       from 35 px to 15 px and clipped, while Program and Adaptive sat at their full 38 px. */
    #left-panel.collapsed { flex: none; overflow: visible; }
    .acc-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; background: none; border: none; cursor: pointer; font-family: inherit; font-size: 8px; letter-spacing: 0.22em; text-transform: uppercase; font-weight: 600; color: var(--text-lo); padding: 14px 16px 10px; }
    .acc-head:hover { color: var(--text-mid); }
    .acc-head.open { color: var(--text-hi); }
    .acc-head .chev { font-size: 9px; letter-spacing: 0; transition: transform 0.15s; }
    .acc-head.open .chev { transform: rotate(180deg); }
    #right-stack { position: fixed; top: 20px; right: 20px; width: 248px; display: flex; flex-direction: column; gap: 12px; max-height: calc(100vh - 40px); z-index: 10; }
    #right-panel, #export-panel { position: static; width: 100%; min-height: 0; flex: 0 1 auto; overflow-y: auto; }
    .panel h2 { font-size: 8px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--text-lo); padding: 14px 16px 10px; font-weight: 600; }
    .panel-section { border-top: 1px solid var(--border-dim); }
    .ctrl-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; padding: 4px 16px 12px; }
    .ctrl-field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
    .ctrl-field.full { grid-column: 1 / -1; }
    #move-controls { display: contents; }
    .ctrl-field label { font-size: 8.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-lo); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ctrl-field input, .ctrl-field select { width: 100%; min-width: 0; background: rgba(23,47,199,0.05); border: 1px solid var(--border-dim); border-radius: var(--radius-sm); color: var(--text-hi); padding: 6px 8px; font-family: inherit; font-size: 11px; outline: none; }
    .seg { display: flex; width: 100%; border: 1px solid var(--border-dim); border-radius: var(--radius-sm); overflow: hidden; }
    .seg button { flex: 1 1 0; min-width: 0; padding: 6px 4px; border: none; border-left: 1px solid var(--border-dim); background: rgba(23,47,199,0.05); color: var(--text-mid); font-family: inherit; font-size: 9.5px; letter-spacing: 0.03em; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .seg button:first-child { border-left: none; }
    .seg button.active { background: #172FC7; color: #fff; }
    .btn { display: block; width: calc(100% - 32px); margin: 0 16px 14px; padding: 10px; border: none; border-radius: var(--radius-md); background: #E67033; color: #fff; font-family: inherit; font-size: 10px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer; }
    .btn.ghost { background: rgba(23,47,199,0.06); color: var(--text-hi); border: 1px solid var(--border-dim); }
    .btn:hover { opacity: 0.88; }
    .btn.small { width: auto; flex: 1 1 0; margin: 0; padding: 6px; font-size: 9px; }
    .exp-grp { font-size: 8px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--text-lo); font-weight: 600; padding: 8px 16px 2px; }
    .struct-chk-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 10px; padding: 4px 16px 8px; }
    .struct-chk-grid label { display: flex; align-items: center; gap: 6px; font-size: 10px; color: var(--text-mid); cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .struct-chk-grid input[type=checkbox] { accent-color: var(--blue); width: 13px; height: 13px; cursor: pointer; flex-shrink: 0; }
    .struct-chk-btns { display: flex; gap: 8px; margin: 0 16px 12px; }
    textarea#paste { width: calc(100% - 32px); margin: 0 16px 12px; height: 90px; resize: vertical; background: rgba(23,47,199,0.05); border: 1px solid var(--border-dim); border-radius: var(--radius-sm); color: var(--text-hi); font-family: monospace; font-size: 10px; padding: 8px; outline: none; }
    input[type=file] { display: none; }
    #legend { padding: 4px 16px 14px; }
    #stats { padding: 4px 16px 14px; }
    /* Site leads the panel, so it carries the divider below it rather than above */
    #site-section { border-bottom: 1px solid var(--border-dim); }
    #site-info { padding: 4px 16px 14px; }
    .site-row { font-size: 10px; color: var(--text-mid); margin-bottom: 6px; line-height: 1.45; }
    .site-row .sk { display: block; font-size: 8px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--text-lo); font-weight: 600; margin-bottom: 1px; }
    .site-row b { color: var(--text-hi); }
    #site-info .site-note { font-size: 8px; letter-spacing: 0.06em; color: var(--text-lo); line-height: 1.6; margin-top: 8px; }
    /* one fact per line, label left and value right, so the column can be scanned down */
    #site-info .site-kv { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; font-size: 10px; color: var(--text-lo); margin-bottom: 5px; line-height: 1.4; }
    #site-info .site-kv > span:first-child { white-space: nowrap; }
    #site-info .site-kv .v { color: var(--text-hi); font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; }
    #site-info .site-kv .v.hot { color: var(--orange); }
    #site-info .site-kv .v.dim { color: var(--text-lo); font-weight: 400; font-style: italic; }
    #site-info .site-gap { height: 7px; }
    /* the address IS the disclosure: closed, the panel is one line that says where you are */
    #site-details summary { list-style: none; cursor: pointer; padding: 2px 0 0; }
    #site-details summary::-webkit-details-marker { display: none; }
    #site-details .site-addr { margin-bottom: 0; }
    #site-details .site-addr b { display: block; padding-left: 11px; text-indent: -11px; }
    #site-details .site-addr b::before { content: '▸ '; color: var(--text-lo); }
    #site-details[open] .site-addr b::before { content: '▾ '; }
    #site-details summary:hover .sk, #site-details summary:hover .site-addr b::before { color: var(--text-mid); }
    #site-details .site-det { padding-top: 9px; }
    #site-info .site-sep { border-top: 1px solid var(--border-dim); margin: 10px 0 9px; }
    #site-info .site-map { display: inline-block; font-size: 9px; color: var(--text-mid); text-decoration: none; border-bottom: 1px solid var(--border-dim); }
    #site-info .site-map:hover { color: var(--text-hi); }
    .stat-row { display: flex; justify-content: space-between; font-size: 10px; color: var(--text-mid); margin-bottom: 5px; }
    .stat-row b { color: var(--text-hi); font-variant-numeric: tabular-nums; }
    .stat-total { border-top: 1px solid var(--border-dim); margin-top: 6px; padding-top: 7px; font-size: 11px; }
    .code-cap { font-size: 8.5px; line-height: 1.5; color: var(--text-lo); margin-bottom: 8px; }
    .code-cap .flag { color: var(--orange); }
    .code-status { display: flex; justify-content: space-between; align-items: center; font-size: 11px; margin-bottom: 8px; padding-bottom: 8px; border-bottom: 1px solid var(--border-dim); }
    .code-status b { font-variant-numeric: tabular-nums; letter-spacing: 0.02em; }
    .code-sub { font-size: 8px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--text-lo); font-weight: 600; margin: 11px 0 5px; }
    .code-row span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-right: 10px; }
    .code-row b { flex-shrink: 0; white-space: nowrap; }
    #tooltip { position: fixed; pointer-events: none; z-index: 20; display: none; background: rgba(255,255,255,0.96); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 6px 10px; font-size: 10px; color: var(--text-hi); white-space: nowrap; }
    #drop-overlay { position: fixed; inset: 0; z-index: 50; display: none; background: rgba(23,47,199,0.08); backdrop-filter: blur(3px); align-items: center; justify-content: center; border: 3px dashed var(--border); }
    #drop-overlay span { font-size: 16px; letter-spacing: 0.1em; }
    /* Floating viewport toolbar (VORO bottombar idiom): the two switches that change what the
       model IS live over the model, not in the parameter list. Top of the viewport, render mode
       first and core option under it, both centred and both cut to the same size. */
    /* Same height as the chat bar and the core options (--floor-h), so the three pieces of
       furniture around the model read as one system. The inner sizes still follow the viewport. */
    #viewbar { position: fixed; top: clamp(12px, 2.2vh, 26px); left: 50%; transform: translateX(-50%); z-index: 12; display: flex; flex-direction: column; align-items: center; gap: clamp(5px, 0.8vh, 10px); }
    #viewbar .vb-group { height: var(--floor-h); display: flex; align-items: stretch; gap: 2px; padding: clamp(3px, 0.45vh, 6px); background: var(--panel-bg); border: 1px solid var(--border-dim); border-radius: 999px; backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
    #viewbar button { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: clamp(3px, 0.45vh, 6px); border: none; background: none; border-radius: 999px; cursor: pointer; color: var(--text-lo); font-family: inherit; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; white-space: nowrap; transition: background 0.18s, color 0.18s; }
    #viewbar button svg { fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
    #viewbar button:hover { color: var(--text-hi); background: rgba(23, 47, 199, 0.07); }
    #viewbar button.active { color: #fff; background: var(--blue); }
    /* the group carries the height now, so the button only sets its width */
    #viewbar button { padding: 0 clamp(16px, 2.9vh, 34px); font-size: clamp(7px, 0.9vh, 10px); }
    #viewbar svg { width: clamp(14px, 2vh, 24px); height: clamp(14px, 2vh, 24px); }
    /* narrow screens squeeze the sides only */
    @media (max-width: 1100px) { #viewbar button { padding: 0 clamp(10px, 1.6vh, 18px); } }
    /* Core option, same kit at the foot of the left column: three equal thirds of 248 px, so the
       label has to be tighter than the two-button row over the model. */
    /* Not a panel: the play button and the year, straight on the background, over the three core
       options. Both are pinned to the bottom — margin-top:auto on the year pushes the pair down. */
    #year-badge { display: none; position: static; width: 100%; flex: none; margin-top: auto; align-items: center; gap: 8px; padding-left: 2px; }
    #year-badge.open { display: flex; }
    #year-badge .lab, #year-badge b { font-size: 44px; line-height: 1; font-weight: 600; color: var(--blue); letter-spacing: -0.01em; }
    #year-badge b { font-variant-numeric: tabular-nums; }
    /* whichever of the two is on top carries the auto margin, so the pair always sits on the floor */
    #year-badge:not(.open) + #seg-core { margin-top: auto; }
    #seg-core { width: 100%; height: var(--floor-h); flex: none; display: flex; align-items: stretch; gap: 2px; padding: 4px; background: var(--panel-bg); border: 1px solid var(--border); border-radius: 999px; backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
    #seg-core button { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 9px 4px; border: none; background: none; border-radius: 999px; cursor: pointer; color: var(--text-lo); font-family: inherit; font-size: 7px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; white-space: nowrap; transition: background 0.18s, color 0.18s; }
    #seg-core button svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
    #seg-core button:hover { color: var(--text-hi); background: rgba(23, 47, 199, 0.07); }
    #seg-core button.active { color: #fff; background: var(--blue); }
    /* ── Adaptive-use chat + timeline ── */
    /* Program and Adaptive use are two separate tabs of the left column, same as Layout: one
       header each, one body each, and only one of the three open at a time. */
    .acc-tab { position: static; width: 100%; flex: none; display: flex; align-items: center; gap: 8px; text-align: left; background: var(--panel-bg); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 13px 16px; backdrop-filter: blur(16px); font-family: inherit; font-size: 8px; font-weight: 600; letter-spacing: 0.22em; text-transform: uppercase; color: var(--text-lo); cursor: pointer; }
    .acc-tab:hover { color: var(--text-mid); }
    .acc-tab.open { color: var(--text-hi); border-bottom-left-radius: 0; border-bottom-right-radius: 0; border-bottom-color: transparent; margin-bottom: -10px; }
    .acc-tab .dot { color: var(--orange); }
    /* An open tab is as tall as it needs to be, and no taller than the column has room for: it
       runs down to the year readout when the list is long (the old 560 px cap left a gap on a tall
       screen), and stays short when there is little in it. flex 0 1 auto = size to content, shrink
       if it does not fit; the lists inside scroll (#prog-list, #chat-log). */
    #chat-panel { position: static; width: 100%; flex: 0 1 auto; min-height: 0; display: none; flex-direction: column; }
    #chat-panel.open { display: flex; border-top-left-radius: 0; border-top-right-radius: 0; }
    #chat-view { display: flex; flex-direction: column; min-height: 0; flex: 1 1 auto; }
    #prog-list { flex: 1 1 auto; overflow-y: auto; min-height: 60px; padding: 4px 14px 6px; }
    /* One row per floor, closed until clicked: a full building is 90 rows and nobody reads them
       all at once. The floor's own area stays on the header, so the list is useful shut. */
    .prog-lv { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 6px; background: none; border: none; border-top: 1px solid var(--border-dim); cursor: pointer; text-align: left; font-family: inherit; font-size: 8px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--text-lo); font-weight: 600; padding: 8px 0 7px; }
    .prog-lv:first-child { border-top: none; }
    .prog-lv:hover { color: var(--text-mid); }
    .prog-lv.open { color: var(--text-hi); }
    .prog-lv b { margin-left: auto; color: var(--text-mid); letter-spacing: 0; text-transform: none; font-variant-numeric: tabular-nums; }
    .prog-lv .chev { flex-shrink: 0; width: 10px; text-align: center; font-size: 8px; letter-spacing: 0; transition: transform 0.15s; }
    .prog-lv.open .chev { transform: rotate(180deg); }
    .prog-lv-body { padding: 2px 0 8px; }
    .prog-row { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; font-size: 10px; color: var(--text-hi); }
    .prog-row .nm { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .prog-row .nm i { color: var(--text-lo); font-style: normal; font-size: 9px; }
    /* the same key as everywhere else: blue is what stays, orange is what re-plugs */
    .prog-row .sp { flex-shrink: 0; font-size: 8px; letter-spacing: 0.08em; font-weight: 600; color: var(--text-lo); }
    .prog-row .sp.long { color: var(--blue); }
    .prog-row .sp.short { color: var(--orange); }
    .prog-row.long .nm { color: var(--blue); }
    .prog-row.short .nm { color: var(--orange); }
    .prog-row input { width: 58px; flex-shrink: 0; background: rgba(23,47,199,0.05); border: 1px solid var(--border-dim); border-radius: var(--radius-sm); color: var(--text-hi); padding: 3px 5px; font-family: inherit; font-size: 10px; text-align: right; outline: none; }
    .prog-row .del { background: none; border: none; color: var(--text-lo); cursor: pointer; font-family: inherit; font-size: 12px; line-height: 1; padding: 0 1px; flex-shrink: 0; }
    .prog-add { display: flex; gap: 5px; margin: 5px 0 2px; }
    .prog-add select { flex: 1 1 auto; min-width: 0; }
    .prog-add select, .prog-add input { background: rgba(23,47,199,0.05); border: 1px solid var(--border-dim); border-radius: var(--radius-sm); color: var(--text-hi); padding: 3px 5px; font-family: inherit; font-size: 10px; outline: none; }
    .prog-add input { width: 52px; text-align: right; }
    .prog-add button { border: none; border-radius: var(--radius-sm); background: rgba(23,47,199,0.08); color: var(--text-hi); font-family: inherit; font-size: 10px; padding: 0 8px; cursor: pointer; }
    /* the panel is a 248px column tab now, so the footer stacks instead of wrapping the button
       onto three lines beside the total */
    .prog-foot { border-top: 1px solid var(--border-dim); padding: 9px 14px 11px; display: flex; flex-direction: column; align-items: stretch; gap: 7px; }
    .prog-foot .btn { white-space: nowrap; }
    .prog-total { flex: 1 1 auto; display: flex; justify-content: space-between; font-size: 10px; color: var(--text-mid); }
    .prog-total b { color: var(--text-hi); font-variant-numeric: tabular-nums; }
    .prog-foot .btn { margin: 0; width: auto; flex-shrink: 0; }
    .chat-time { padding: 2px 14px 10px; border-bottom: 1px solid var(--border-dim); }
    .chat-time-row { display: flex; justify-content: space-between; align-items: baseline; font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-lo); margin-bottom: 4px; }
    .chat-time-row b { color: var(--text-hi); font-size: 13px; letter-spacing: 0; font-variant-numeric: tabular-nums; text-transform: none; }
    /* The timeline as a drawing: one hairline, a tick standing on it at every year a rule fires,
       and the thumb running along it. The ticks are inset by half a thumb so a tick and the thumb
       that lands on it line up — a range input's thumb centre travels from thumbW/2 to W−thumbW/2,
       not 0 to W. TICK_HALF in syncTicks() is the same number. */
    .tl-track { position: relative; padding-top: 23px; }
    #chat-ticks { position: absolute; left: 6px; right: 6px; top: 0; height: 23px; pointer-events: none; }
    #chat-ticks i { position: absolute; bottom: 0; width: 1px; height: 7px; margin-left: -0.5px; background: var(--text-lo); }
    #chat-ticks i.past { height: 10px; background: var(--orange); }
    #chat-ticks b { position: absolute; top: 0; transform: translateX(-50%); font-size: 8px; font-weight: 600; letter-spacing: 0.04em; color: var(--text-lo); font-variant-numeric: tabular-nums; white-space: nowrap; }
    #chat-ticks b.past { color: var(--orange); }
    #chat-slider { width: 100%; margin: 0; -webkit-appearance: none; appearance: none; background: none; height: 12px; cursor: pointer; }
    #chat-slider::-webkit-slider-runnable-track { height: 1px; background: var(--border); }
    #chat-slider::-moz-range-track { height: 1px; background: var(--border); }
    #chat-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; margin-top: -5.5px; border-radius: 999px; background: var(--orange); border: none; }
    #chat-slider::-moz-range-thumb { width: 12px; height: 12px; border: none; border-radius: 999px; background: var(--orange); }
    /* demo playback: the timeline runs itself */
    #tl-play {
      width: 30px; height: 30px; align-self: center; flex-shrink: 0;
      border: 1px solid var(--border-dim); border-radius: 50%; background: rgba(23,47,199,0.08);
      color: var(--blue); font-family: inherit; font-size: 11px; line-height: 1;
      cursor: pointer; padding: 0; flex-shrink: 0;
    }
    #tl-play:hover { background: var(--blue); color: #fff; border-color: var(--blue); }
    #tl-play.on { background: var(--orange); color: #fff; border-color: var(--orange); }
    .chat-time-row > span { display: inline-flex; align-items: center; }
    #chat-horizon { display: inline-flex; align-items: center; gap: 8px; margin-left: auto; }   /* the year left the row, so the switch keeps to the right */
    #chat-change:empty { display: none; }
    #chat-change { margin-top: 5px; font-size: 9.5px; line-height: 1.55; color: var(--text-mid); }
    #chat-change b { color: var(--orange); font-variant-numeric: tabular-nums; }
    #chat-change b.blue { color: var(--blue); }
    #chat-change .none { color: var(--text-lo); }
    /* sentence left, button right, and the button is one line of that sentence tall */
    #chg-see { flex-shrink: 0; display: inline-flex; align-items: center; height: 15px; border: 1px solid var(--border-dim); border-radius: 3px; background: rgba(230,112,51,0.10); color: var(--orange); font-family: inherit; font-size: 8.5px; letter-spacing: 0.06em; text-transform: uppercase; padding: 0 6px; cursor: pointer; }
    #chg-see:hover { background: var(--orange); color: #fff; border-color: var(--orange); }
    #chat-ctx:empty { display: none; }
    #chat-ctx { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border-dim); font-size: 9px; line-height: 1.65; color: var(--text-lo); }
    #chat-ctx .k { display: block; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 3px; }
    #chat-ctx b { color: var(--text-mid); font-variant-numeric: tabular-nums; }
    /* the greeting went, so an empty log is just a hole: collapse it and let the rules fill the panel */
    #chat-log:empty { display: none; }
    #chat-log { flex: 1 1 auto; overflow-y: auto; min-height: 0; padding: 10px 14px; display: flex; flex-direction: column; gap: 7px; }
    .chat-msg { font-size: 10.5px; line-height: 1.55; padding: 7px 10px; border-radius: var(--radius-md); max-width: 93%; }
    .chat-msg.you { align-self: flex-end; background: rgba(23,47,199,0.08); }
    .chat-msg.bot { align-self: flex-start; background: rgba(230,112,51,0.10); }
    .chat-msg .sub { display: block; color: var(--text-lo); font-size: 9px; margin-top: 3px; }
    /* the building-type answer, offered as chips so the three valid answers are visible.
       The question takes the full column: at 93% the three chips wrap onto two rows. */
    .chat-msg.ask { max-width: 100%; }
    .chat-chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 7px; }
    .chat-chips button { font: inherit; font-size: 9.5px; padding: 4px 8px; cursor: pointer; color: var(--text-mid); background: rgba(255,255,255,0.7); border: 1px solid var(--border-dim); border-radius: 999px; }
    .chat-chips button:hover { color: var(--text-hi); border-color: var(--border); }
    .chat-chips button.on { color: #fff; background: var(--blue); border-color: var(--blue); }
    #chat-rules:empty { display: none; }
    /* no 116 px cap: with a long rule list the panel is what runs out of room, not this — so the
       tab reaches the year readout and the rules scroll inside it */
    /* capped: a long rule list (the demo timeline files 20+) used to squeeze the log until the
       first message opened already scrolled. The rules scroll inside their own half instead. */
    #chat-rules { border-top: 1px solid var(--border-dim); padding: 9px 14px 5px; flex: 1 1 auto; min-height: 0; max-height: 45%; overflow-y: auto; }
    .chat-rule { display: flex; align-items: center; gap: 8px; font-size: 9.5px; color: var(--text-mid); margin-bottom: 5px; }
    .chat-rule.pending { opacity: 0.42; }
    /* the two colours the 3D uses in Change mode: orange = the kit re-plugged, blue = a room
       changing use or a use the building did not have before */
    .chat-rule .yr { flex-shrink: 0; background: rgba(23,47,199,0.12); color: var(--blue); border-radius: 999px; padding: 2px 7px; font-weight: 600; font-variant-numeric: tabular-nums; }
    .chat-rule.replug .yr { background: rgba(230,112,51,0.16); color: var(--orange); }
    .chat-rule .txt { flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    /* likelihood tier on a predicted rule — a label, never a number */
    .chat-rule .tier { display: inline-block; margin-right: 6px; padding: 1px 5px; border: 1px solid var(--border-dim); border-radius: 3px; font-size: 8px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-lo); }
    .chat-rule .del { background: none; border: none; color: var(--text-lo); cursor: pointer; font-family: inherit; font-size: 12px; line-height: 1; padding: 0 2px; }
    /* Site Forecast track: same row idiom as the chat rules, but the ACTIVE scenario at the
       current year is the one that reads solid */
    #chat-track { margin: 8px 0 2px; padding-top: 8px; border-top: 1px solid var(--border-dim); }
    #chat-track .chat-rule.on { color: var(--text-hi); font-weight: 600; }
    #chat-track .chat-rule.on .yr { background: var(--orange); color: #fff; }
    /* the chat bar under the model: one line, an arrow, nothing else */
    /* Centred on the window at the very bottom: the year and the core options own the left column
       now, so nothing sits in the middle for it to run under. Wide enough to be the thing you type
       in — at 360 px it read as a leftover. */
    #chat-bar { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); width: var(--bar-w); height: var(--floor-h); z-index: 12; display: flex; align-items: center; gap: 8px; padding: 6px 6px 6px 18px; background: var(--panel-bg); border: 1px solid var(--border); border-radius: 999px; backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
    /* Program Mode replaces the right column with this: same footprint as #right-stack, one card
       per row, scrolling down. While you are editing the program, the palette is what the right
       side is for — the statistics come back the moment you switch the mode off. */
    #add-palette { position: fixed; top: 20px; right: 20px; bottom: 20px; width: 248px; z-index: 12; display: none; flex-direction: column; padding: 8px; background: var(--panel-bg); border: 1px solid var(--border); border-radius: var(--radius-lg); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
    /* two to a row, under a heading each: the same LONG blue / SHORT orange key as the program
       list and the 3D, so what you are about to place is already colour-coded by timespan */
    #palette-row { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; align-content: start; width: 100%; flex: 1 1 auto; min-height: 0; overflow-y: auto; overflow-x: hidden; padding: 2px; }
    /* pale tint under brand-blue type, the way every other label on the page is set */
    #palette-row .pal-card { width: 100%; line-height: 1.3; padding: 6px 8px; text-align: left; color: var(--blue); border: none; }
    #palette-row .pal-card .ar { font-size: 9px; color: rgba(23, 47, 199, 0.7); }
    #palette-row .pal-card:hover { opacity: 1; outline: 2px solid var(--blue); outline-offset: 1px; }
    .pal-head { grid-column: 1 / -1; font-size: 8px; letter-spacing: 0.16em; text-transform: uppercase; font-weight: 600; padding: 8px 2px 0; }
    .pal-head:first-child { padding-top: 2px; }
    .pal-head.long { color: var(--blue); }
    .pal-head.short { color: var(--orange); }
    #chat-input { flex: 1 1 auto; min-width: 0; background: none; border: none; color: var(--text-hi); padding: 9px 0; font-family: inherit; font-size: 13px; outline: none; }
    #chat-input::placeholder { color: var(--text-lo); }
    #chat-send { flex-shrink: 0; width: 43px; height: 43px; display: flex; align-items: center; justify-content: center; border: none; border-radius: 999px; background: var(--orange); color: #fff; cursor: pointer; transition: background 0.18s; }
    #chat-send:hover { background: var(--blue); }
    #chat-send svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    ::-webkit-scrollbar { width: 7px; } ::-webkit-scrollbar-thumb { background: rgba(23,47,199,0.25); border-radius: 4px; }
  </style>
</head>

  <div id="left-stack">
  <div id="left-panel" class="panel">
    <!-- Site context from the wizard's address lookup. Hidden unless localStorage carries
         one; it is reference information and sizes nothing in the model. Sits first so it
         is visible without scrolling the panel. -->
    <div id="site-section" style="display:none;">
      <h2>Site</h2>
      <div id="site-info"></div>
    </div>

    <!-- One panel, two parts: the layout controls sit fixed at the top, the program list scrolls
         under them. They are the same job — what the building is made of — so they stopped being
         two tabs you had to swap between. -->
    <div id="layout-section">
      <button class="acc-head open" id="acc-layout" aria-expanded="true">Layout &middot; Program <span class="chev">&#9650;</span></button>
      <div id="left-body">
      <div class="ctrl-grid" id="layout-body">
        <div class="ctrl-field full"><label>Full flr (ft)</label><input type="number" id="ctl-fh" value="12.75" step="0.25" /></div>
        <div class="ctrl-field full"><label>Approach bearing · <span id="ap-val">not set</span></label><input type="range" id="ctl-approach" min="0" max="345" step="15" value="0" /></div>
        <div class="ctrl-field full"><label>Site rotation · <span id="gr-val">0°</span></label><input type="range" id="ctl-grid" min="-90" max="90" step="1" value="0" /></div>
        <div class="ctrl-field full"><label>Program Mode</label>
          <div class="seg" id="seg-program"><button data-v="off" class="active">Off</button><button data-v="on">On</button></div>
        </div>
        <div id="move-controls" style="display:none;">
          <div class="ctrl-field full"><label>Move snap (&times; module)</label>
            <div class="seg" id="seg-move"><button data-v="1" class="active">1</button><button data-v="2/3">&#8532;</button><button data-v="1/2">&#189;</button></div>
          </div>
          <div class="ctrl-field full">
            <button class="btn ghost small" id="btn-reset-moves">Reset moves</button>
            <div id="move-readout" style="font-size:9px;color:var(--text-lo);margin-top:4px;"></div>
          </div>
        </div>
      </div>

      <!-- Program: the year-0 program exactly as the wizard handed it over, editable. Every edit
           rewrites BASE_PROGRAM and re-packs the frame, which is the only thing allowed to. One
           collapsible menu per floor — the list is 90 rows on a full building, so nothing opens
           until it is asked for. -->
      <div id="prog-section">
        <div id="prog-list"></div>
        <div class="prog-foot">
          <div class="prog-total"><span>Total GFA</span><b id="prog-total">0 m&sup2;</b></div>
          <button class="btn ghost small" id="prog-reset">Reset to input</button>
        </div>
      </div>
      </div>
    </div>

  </div>

    <!-- Adaptive use: plain-language "in N years this becomes that" scenarios. Parsed locally
         (no API); each accepted sentence is a conversion rule replayed by the timeline slider,
         so the massing itself reacts to the year. The slider lives here, with the rules it runs. -->
    <button id="chat-toggle" class="acc-tab" aria-expanded="false"><span class="dot">&#9679;</span> Adaptive use</button>
    <div id="chat-panel" class="panel">
      <div class="chat-time">
        <!-- Two readings of the same handover, shown only when the wizard sends both: one
             building evolving (conversion rules) or the recorded transitions as parallel
             whole-program futures. They cannot share a slider, so they share a switch. -->
        <div class="seg" id="tl-mode" style="display:none;margin-bottom:8px;">
          <button data-m="evolution" class="active">One building over time</button><button data-m="futures">Parallel futures</button>
        </div>
        <!-- the year itself is not here: it is the big readout at the foot of the column -->
        <div class="chat-time-row">
          <span id="chat-horizon"></span>
        </div>
        <!-- one line, with a tick standing on it at every year something happens -->
        <div class="tl-track"><div id="chat-ticks"></div><input type="range" id="chat-slider" min="0" max="10" step="1" value="0" /></div>
        <!-- What this year did, in numbers. A Tier 1 conversion keeps the room, so the massing
             can look identical while 16 rooms have changed use; this row is the signal that
             does not depend on the colour mode. -->
        <div id="chat-change"></div>
        <!-- Site Forecast scenarios on the same axis as the chat rules; filled only when the
             wizard hands a track over -->
        <div id="chat-track" style="display:none;"></div>
        <!-- The site reading the wizard used to order these futures. Composition of a 500 m
             ring, not a catchment and not demand. -->
        <div id="chat-ctx"></div>
      </div>
      <div id="chat-view">
        <div id="chat-log"></div>
        <div id="chat-rules"></div>
      </div>
    </div>

    <!-- The year, big and unboxed, sitting straight on the core options at the foot of the column.
         It is the one number a presenter reads out, so it is not a 13 px label in a panel. -->
    <div id="year-badge">
      <button id="tl-play" title="Play the timeline">&#9654;</button>
      <span class="lab">Year</span><b id="chat-year">0</b>
    </div>

    <!-- Core option: three massing variants, at the foot of the column. Same id and data-v values
         it had in the viewport toolbar, so `seg()`, ?core= and the tests are untouched. -->
    <div class="vb-group" id="seg-core">
      <button data-v="compact" class="active" title="Core option 1 · compact pair">
        <svg viewBox="0 0 18 18"><rect x="2" y="3" width="14" height="12" rx="1" /><rect x="3.5" y="4.5" width="3" height="9" rx="0.6" fill="currentColor" stroke="none" /></svg>
        <span>1 Compact</span>
      </button>
      <button data-v="pinwheel" title="Core option 2 · pinwheel">
        <svg viewBox="0 0 18 18"><rect x="2" y="3" width="14" height="12" rx="1" /><rect x="3.5" y="4.5" width="3" height="4" rx="0.6" fill="currentColor" stroke="none" /><rect x="11.5" y="9.5" width="3" height="4" rx="0.6" fill="currentColor" stroke="none" /></svg>
        <span>2 Pinwheel</span>
      </button>
      <button data-v="inset" title="Core option B · centre core">
        <svg viewBox="0 0 18 18"><rect x="2" y="3" width="14" height="12" rx="1" /><rect x="7" y="6.5" width="4" height="5" rx="0.6" fill="currentColor" stroke="none" /></svg>
        <span>B Centre</span>
      </button>
    </div>

  </div>

  <!-- The chat itself, under the model: one line to type in and an arrow to send. The reply and
       the rule it files land in the Adaptive use tab, which sending opens if it is closed. -->
  <div id="chat-bar">
    <input id="chat-input" type="text" autocomplete="off" placeholder="in 8 years turn L3 into housing" />
    <button id="chat-send" title="Send">
      <svg viewBox="0 0 18 18"><path d="M9 15V3M4 8l5-5 5 5" /></svg>
    </button>
  </div>

  <div id="right-stack">
  <div id="right-panel" class="panel">
    <h2>Statistics</h2>
    <div id="stats"></div>
    <div class="panel-section" style="padding-top:8px;">
      <h2>Code check &middot; CBC 10/11B</h2>
      <div id="code-violations" style="padding:4px 16px 14px;"></div>
    </div>
  </div>

  <div id="export-panel" class="panel">
    <h2 id="export-title">Export &middot; Massing</h2>
    <div id="export-massing">
      <div class="struct-chk-grid" style="grid-template-columns:1fr;padding-top:4px;">
        <label><input type="checkbox" class="mass-chk" data-k="short" checked /> Short-duration program</label>
        <label><input type="checkbox" class="mass-chk" data-k="long" checked /> Long-duration program</label>
      </div>
      <button class="btn" id="exp-massing">Export massing (.obj)</button>
    </div>
    <div id="export-structure" style="display:none;">
      <div class="exp-grp">Permanent structure</div>
      <div class="struct-chk-grid" id="struct-chk-grid">
        <label><input type="checkbox" class="struct-chk" data-k="col" checked /> Columns</label>
        <label><input type="checkbox" class="struct-chk" data-k="gird" checked /> Girders</label>
