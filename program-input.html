  // The brief writes the later steps' defaults. A step the architect has ALREADY answered is
  // left alone: coming back to fix a typo in the address must not silently undo their own
  // GFA or their activity picks. An unanswered step is only prefilled, and it still asks.
  const stepIdx = type => steps.findIndex(s => s.type === type);
  function applySiteBrief(b) {
    if (!b) return;
    if (b.buildingType && !answered[stepIdx('chips')]) wiz.buildingType = b.buildingType;
    if (b.gfa && !answered[stepIdx('number')]) { wiz.gfa = b.gfa; gfaPrefill = b.gfa; }
    if (!answered[stepIdx('floors')]) {
      if (b.floorsAbove) wiz.floorsAbove = b.floorsAbove;
      if (b.basementLevels != null) wiz.basementLevels = b.basementLevels;
    }
    if (b.activities && b.activities.length && !answered[stepIdx('multi')]) {
      selectedActivities.clear();
      for (const k of b.activities) selectedActivities.add(k);
      wiz.activities = [...selectedActivities];
    }
  }

  let siteBusy = false;
  // Settles when the surroundings of the current site have landed (or failed). Build awaits
  // it, so the massing view is still never handed a site with the ring missing.
  let ringDone = Promise.resolve();
  async function lookupSite() {
    const q = inputSite.value.trim();
    if (!q || siteBusy) return;
    // A Demo site chip fills this field and calls straight through here, so putting the check on
    // the address rather than on the click covers the chip and a hand-typed address at once.
    if (isIntelAddress(q)) revealForecastLink();
    siteBusy = true;
    btnSite.disabled = true;
    sitePanel.className = 'busy';
    sitePanel.style.display = 'block';
    sitePanel.textContent = 'locating…';
    analyzing('locating the address');

    try {
      const g = await geocodeAddress(q);
      const site = {
        query: q, label: g.label, lat: g.lat, lng: g.lng, source: g.source,
        shortLabel: g.label.split(',').slice(0, 2).join(',').trim(),
        parcel: null, zoning: null, parcelNote: null, zoningNote: null,
      };
      renderSitePanel(site);

      // parcel first — its centroid is a better probe for the zoning polygon than the
      // street-centerline geocode point
      analyzing('reading the parcel');
      try {
        site.parcel = await findParcel({ lat: g.lat, lng: g.lng }, q);
        if (!site.parcel) site.parcelNote = 'no LA County parcel within 45 m. Outside LA County, or unparcelled.';
      } catch (e) {
        site.parcelNote = 'county parcel layer unreachable from this origin';
      }
      renderSitePanel(site);

      const zPt = (site.parcel && site.parcel.centroid) || { lat: g.lat, lng: g.lng };

      // The ring around the parcel is started HERE and waited for at the bottom, so it runs
      // under the zoning call instead of after it. Volumes + linework for the two massing-view
      // context modes, and the movement generators the program rules read. Independent:
      // whichever resolves is available, and the viewer says which mode has no data.
      const ringP = Promise.all([
        findNeighbours(zPt).catch(() => null),
        findLotLines(zPt).catch(() => null),
        findRoads(zPt).catch(() => null),
        findGenerators(zPt).catch(() => null),
      ]);

      analyzing('reading the zoning');
      try {
        site.zoning = await findZoning(zPt);
        if (!site.zoning) site.zoningNote = 'no LA City zoning polygon at this point';
      } catch (e) {
        site.zoningNote = 'zoning layer unreachable';
      }

      wiz.site = site;
      renderSitePanel(site);

      const zoneInfo = interpretZone(site.zoning && site.zoning.code);
      // What the address permits is known now. What surrounds it is still in the air, and it
      // travels on Overpass, which is regularly ten seconds and sometimes never answers. The
      // step used to hold the panel, the Continue button and the whole wizard behind that for
      // as long as it took, and a failed ring meant the user waited the full deadline to be
      // handed the defaults anyway. Both halves are still fetched; only the first one blocks.
      // carried into the massing view so it can state the drawn GFA against what the lot
      // permits. farAssumed = the code gave no FAR and 3 is a placeholder, which the viewer
      // must say out loud rather than present as a limit.
      site.far = (zoneInfo && zoneInfo.far) || null;
      site.farAssumed = !(zoneInfo && zoneInfo.far);
      // The site now sets the wizard's starting answers as well as reporting on them. It
      // rides on the payload so the massing view and a reloaded draft can both say why the
      // program looks the way it does.
      analyzing('setting the program from the site');
      const writeBrief = () => {
        wiz.siteBrief = siteBrief(site, zoneInfo);
        site.brief = wiz.siteBrief;
        applySiteBrief(wiz.siteBrief);        // only ever fills a step the user has not answered
        renderSitePanel(site);
      };
      writeBrief();                           // the zoning half: type, GFA, floors
      forecastState = {
        site, zoneInfo,
        far: (zoneInfo && zoneInfo.far) || 3,
        farAssumed: !(zoneInfo && zoneInfo.far),
        fromKey: detectFrom((site.parcel && (site.parcel.useDesc || '')) + ' ' + site.label),
      };
      renderForecast();
      btnSite.disabled = false;
      siteBusy = false;
      siteContinue.style.display = 'inline-block';

      // and the ring, whenever it lands. Build waits on this if it is somehow still running.
      ringDone = ringP.then(([nb, lots, roads, gens]) => {
        site.neighbours = nb;
        site.lots = lots;
        site.roads = roads;
        site.generators = gens;               // M6b: rail/bus/crossing/retail/food/institution
        if (wiz.site !== site) return;        // a second lookup overtook this one
        writeBrief();                         // parking, ground retail, band share, activities
        renderForecast();
      }).catch(() => {});
    } catch (e) {
      wiz.site = null;
      forecastState = null;
      siteContinue.style.display = 'none';
      document.getElementById('site-forecast').style.display = 'none';
      sitePanel.className = '';
      sitePanel.innerHTML = `<div class="sp-row"><span class="sp-k">error</span><span class="sp-v">${escapeHtml(e.message || 'lookup failed')}</span></div>` +
        '<div class="sp-note">Check the spelling, or skip this step. The site is optional.</div>';
      btnSite.disabled = false;
    } finally {
      siteBusy = false;
      analyzingDone();
    }
  }

  inputSite.addEventListener('input', () => { btnSite.disabled = !inputSite.value.trim() || siteBusy; });
  inputSite.addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    e.preventDefault();
    // first Enter looks the address up; a second Enter on a resolved site moves on
    if (wiz.site && wiz.site.query === inputSite.value.trim()) submit('site');
    else lookupSite();
  });
  btnSite.addEventListener('click', () => {
    if (wiz.site && wiz.site.query === inputSite.value.trim()) submit('site');
    else lookupSite();
  });
  // demo chip = type the address for the user, then run the same lookup
  siteDemos.querySelectorAll('.sd-chip').forEach(b => b.addEventListener('click', () => {
    if (siteBusy) return;
    inputSite.value = b.dataset.addr;
    btnSite.disabled = false;
    lookupSite();
  }));

  siteContinue.addEventListener('click', () => submit('site'));

  document.getElementById('site-skip').addEventListener('click', () => {
    wiz.site = null;
    forecastState = null;
    siteContinue.style.display = 'none';
    sitePanel.style.display = 'none';
    document.getElementById('site-forecast').style.display = 'none';
    submit('site');
  });

  loadStep(0);

  // ══════════════════════════════════════════════════════════════════
  // DRAFT GENERATOR (deterministic — no randomness)
  // ══════════════════════════════════════════════════════════════════
  function dims(area) {
    const w = Math.max(1, Math.round(Math.sqrt(area)));
    const h = Math.max(1, Math.round(area / w));
    return [w, h];
  }

  function generateEntries(buildingType, gfaTarget, floorsAbove, basementLevels, activityKeys, brief) {
    // The profile may grow floorsAbove (stack up, never spread out). The SHORT_FLOOR retry
    // below must recurse with the ANSWERED count, or each retry grows on top of the last
    // one's growth: measured, a 3-floor brief compounded to 18 floors and 3.1× its GFA.
    const floorsAnswered = floorsAbove;
    // ── what the site moves, and nothing else (260814) ──
    // The four wizard answers still decide the shape of the building. The site decides three
    // numbers inside it, each from one measured figure (see siteBrief). Without a site, or
    // with a site whose payload lacked the figure, every one of them falls back to the
    // constant it has always been, so a skipped address generates exactly the old program.
    const PARK_GROUPS = (brief && brief.parkingPerLevel) || 3;   // bays per parking level
    const GROUND_SHORT = (brief && brief.groundRetail) || 220;   // sales and display, SHORT and on the ground
    const SHORT_TARGET_SHARE = (brief && brief.shortShare) || SHORT_BASE;

    // Three-tier area model (replaces the old uniform gfa/rawTotal scale):
    //   • RIGID   — exact preset, never scaled (life-safety cores, circulation,
    //               toilets, parking, mech/elec rooms, loading dock).
    //   • CALIB   — scaled by a factor clamped to [0.85, 1.15] (activities,
    //               apartment plates, lobby, sales, staff, it, storage).
    //   • SPONGE  — absorbs the remainder (office plates ≥300; band LONG filler,
    //               which is instead fixed by the >0.5 share guarantee below).
    // Each line carries a `tier` tag used by the deterministic solve at the end.
    const out = []; // {type, area, level, category, wh, tier, rawA(preset)}
    function add(type, area, level, category, tier) {
      const a = Math.max(1, Math.round(area));
      const rec = { type, area: a, level, category, wh: null, tier, rawA: a };
      out.push(rec);
      return rec;
    }

    // ── adaptive core count (rule B): passenger core b only when the average
    //    above-grade plate (gfa / floorsAbove) is ≥ 1400 m²; otherwise two cores
    //    (freight + passenger a), matching the shortfloor SAMPLE's 2-core recipe
    //    and relieving the rigid budget. 12000/8F → 1500 ≥ 1400 → 3 cores;
    //    12000/10F → 1200 < 1400 → 2 cores.
    // KNOWN, measured, deliberately left as the average (260817). The right statistic is the
    // PEAK above-grade plate: 12,001 m² over 9 floors averages 1,333 and gets two cores, while
    // the ground floor is 1,889 and the code check asks for three (E-2 L2, 2 of 3 stairs).
    // Switching to the peak WAS implemented and measured, and it is a circulation regression:
    // the extra shaft docks at the east end of its active floors and the spine is extended to
    // reach it, so compact went 179 → 202 corridor modules and inset's envelope 26 → 34, while
    // pinwheel did not improve at all. Fewer violations, longer corridors. Do not switch it back
    // without first changing where coreX docks.
    const plateAvg = floorsAbove > 0 ? gfaTarget / floorsAbove : 0;
    const threeCore = plateAvg >= 1400;
    function addCores(level) {
      add('fire stair & freight elevator core', 40, level, 'circulation', 'rigid');   // 17'×25'-6" = 2×3 modules (6 cells ≈ 40 m²); 25' rounded up to module-true 25'-6"
      add('fire stair & passenger elevator core a', 40, level, 'circulation', 'rigid'); // 17'×25'-6" = 2×3 modules
      if (threeCore) add('fire stair & passenger elevator core b', 40, level, 'circulation', 'rigid'); // 17'×25'-6" = 2×3 modules
      add('circulation', 107, level, 'circulation', 'rigid');
    }

    // ── basements ──
    for (let i = 1; i <= basementLevels; i++) {
      const level = -i;
      if (i === 1) {
        add('loading dock', 161, level, 'private', 'rigid');
        add('storage', 107, level, 'private', 'calib');
        add('storage', 107, level, 'private', 'calib');
        add('mechanical room', 161, level, 'private', 'rigid');
        add('electrical room', 54, level, 'private', 'rigid');
        add('staff area', 80, level, 'private', 'calib');
        add('it support', 54, level, 'private', 'calib');
      } else {
        for (let p = 0; p < PARK_GROUPS; p++) add('parking bay group', 322, level, 'private', 'rigid');
        add('mechanical room', 161, level, 'private', 'rigid');
        add('storage', 107, level, 'private', 'calib');
        add('electrical room', 54, level, 'private', 'rigid');
      }
      addCores(level);
    }

    // ── ground floor: public anchors ──
    add('lobby', 180, 0, 'public', 'calib');
    add('sales and display', GROUND_SHORT, 0, 'public', 'calib');
    add('toilets', 80, 0, 'public', 'rigid');
    addCores(0);

    // ── SHORT activity floors: a taper of "plug-in" storeys on the lower levels ──
    // Mirrors program-massing-shortfloor.html's SAMPLE: SHORT programs sit on the
    // lowest floors and taper as you climb. The hard constraint is the visualizer's
    // computeShortFloors rule — a floor collapses to an 8'-6" SHORT storey only when
    // its SHORT share of packed (non-core, non-corridor) area is STRICTLY > 0.5. So
    // every level that receives SHORT lines must clear 0.5, or it simply won't
    // collapse. Two former assumptions broke that: (1) the fixed 480 m² ground
    // anchors and (2) a fixed ~400 m² LONG filler on every SHORT level diluted the
    // share below 0.5 for all but the densest selections. The logic below fixes both:
    //   • whole SHORT lines are split into n bins (n≤4) with STRICTLY-decreasing raw
    //     area, choosing the largest n whose split is strictly decreasing;
    //   • the ground (level 0, carrying the fixed 480 anchors) leads the band ONLY
    //     when its SHORT bin clears the anchors with room to taper — otherwise the
    //     band starts at level 1 and the ground keeps just its anchors;
    //   • LONG filler on each non-ground SHORT level is ADAPTIVE: capped by a
    //     per-level target share (a gentle decreasing taper, all > 0.5) and funded
    //     by the sponge budget (see the tiered solve below), so the floor always
    //     clears the threshold — even at zero filler, since every band level also
    //     carries a rigid 80 m² toilets line and keeps SHORT strictly above 80.
    // Lines are ordered by floor affinity: coffee + Show&event first, then Learning,
    // then Wellness, then lounge bar last. Result: SHORT raw area AND share both
    // strictly decrease up the band and every used level collapses in the massing.
    let upperCount = Math.max(0, floorsAbove - 1);   // recomputed if the profile grows the building
    // Ground anchors at preset, split by span since 260805: sales and display is retail, so it
    // is SHORT and counts toward the ground's plug-in share instead of diluting it. What is left
    // holding the ground down is the lobby and the toilets.
    const ANCHORS = 180 + 80;          // ground LONG anchors (lobby + toilets)
    // GROUND_SHORT is set at the top of this function: the site can size it, so it is no
    // longer a constant here, but it is the same figure this taper has always used.

    // affinity rank per activity key, derived from ACTIVITY_GROUPS (no type strings):
    // coffee → 0 (ground social), the four groups → 1..4, lounge bar → 5 (top social).
    const affinity = key => {
      if (key === 'coffee') return 0;
      if (key === 'lounge bar') return 5;
      const gi = ACTIVITY_GROUPS.findIndex(([, keys]) => keys.includes(key));
      return gi < 0 ? 4 : gi + 1;
    };
    const actItems = [];
    let ord = 0;
    for (const key of activityKeys)
      for (const [t, a] of (ACTIVITY_DEFS[key] || [])) actItems.push({ t, a, rank: affinity(key), ord: ord++ });
    // ── SHORT TARGET (260810) ─────────────────────────────────────────────────────────────
    // The activity band used to be whatever the chosen presets happened to add up to, and the
    // calibScale clamp below could only stretch it by 15%. Measured: 592 m² of plug-in program
    // in a 12,000 m² brief with two activities, 5.7% of the building; six activities reached
    // 16.5%. Everything else fell through to the office and housing plates. The SAMPLE, for
    // comparison, runs 23%.
    // So the band is now sized to a target share of the GFA, and it gets there by adding SEATS
    // rather than by inflating rooms: a second coffee shop, a third gallery. Preset areas are
    // the realistic ones and they stay exact — a 161 m² coffee shop stretched to 800 would be
    // a number, not a room. The ground's own retail anchor already counts toward the target.
    // SHORT_TARGET_SHARE is set at the top of this function: 0.25 unless the site moved it.
    {
      const baseTotal = actItems.reduce((s, x) => s + x.a, 0);
      // Seats are counted in PRE-scale area. The activity lines are the `calib` tier, so the
      // solve below multiplies them again by calibScale, which sits at its 1.15 ceiling
      // whenever the band is small against the brief — aiming the raw total straight at the
      // target overshot it by a third. Divide it back out.
      const wantAct = gfaTarget * SHORT_TARGET_SHARE / 1.15 - GROUND_SHORT;
      if (baseTotal > 0 && wantAct > baseTotal) {
        const base = actItems.slice();
        let tot = baseTotal, seat = 1;
        // one more seat of each activity per pass, in the same affinity order, so the band
        // grows evenly instead of filling up with whichever preset happens to be largest
        while (tot < wantAct && seat < 40) {
          for (const x of base) {
            if (tot >= wantAct) break;
            actItems.push({ t: x.t, a: x.a, rank: x.rank, ord: x.ord, seat });
            tot += x.a;
          }
          seat++;
        }
      }
    }
    // seats of the same activity stay together, so a floor reads as one kind of place
    actItems.sort((x, y) => x.rank - y.rank || x.ord - y.ord || (x.seat || 0) - (y.seat || 0));
    const actLines = actItems.map(x => [x.t, x.a]);

    // ── DESCENDING SHORT PROFILE SOLVE (260817, SHORT-CONSOLIDATION-PLAN-4) ──────────────────
    // The 260814 taper sized each band floor from its SHORT bin (total = shortI / share), which
    // decouples the band floors from the plates above them: mixed floors came out wider and
    // deeper than the tower, and BOTH spans rode out to the band edge (the skirt was measured
    // 58% LONG, 260817(f)). Here every band floor targets the SAME packed area T as a plate,
    // and only the mix inside it walks the ladder r(i): PROFILE_L0 at the ground down to
    // PROFILE_MIN. The floor count n is what the ladder needs to hold the SHORT total; when the
    // answered floors cannot hold it, the building grows upward (≤ +3) with the GFA conserved,
    // which is the user's rule: stack up, never spread out.
    //   T(F)      = (gfa − basements − F · coreSet) / F      packed m² per above-grade floor
    //                (cores are in the GFA but outside the massing's packed basis)
    //   r(i)      = r0 − (r0 − PROFILE_MIN) · i/(n−1)         r0 = 1 − ANCHORS/T, clamped:
    //                the ground has no filler, so its share is set by the fixed LONG anchors
    //   n         = smallest n ≤ F−1 with Σ r(i)·T ≥ S_est    (≥1 plate floor always remains)
    //   S_est     = min(gfa · SHORT_TARGET_SHARE, (raw band + ground retail) · 1.15)
    // The filler cap in the tiered solve below already enforces total ≤ shortI/share per level;
    // funded to its cap that is EXACTLY shortI/r = T, so the uniform plate needs no new
    // machinery, only the right shares. Legacy path (?profile=0) skips all of this.
    let PROFILE = null;
    if (PROFILE_ON && gfaTarget > 0 && floorsAbove >= 2 && actLines.length) {
      const basementArea = out.reduce((s, e) => s + (e.level < 0 ? e.area : 0), 0);
      const coreSetArea = 40 + 40 + (threeCore ? 40 : 0) + 107;
      const packedT = F => Math.max(1, (gfaTarget - basementArea - F * coreSetArea) / F);
      const rawAct = actLines.reduce((s, x) => s + x[1], 0);
      // What will actually be there, in final m²: the target share, capped by what the presets
      // (with their 1.15 calib ceiling) can deliver.
      const sEst = Math.min(gfaTarget * SHORT_TARGET_SHARE, (rawAct + GROUND_SHORT) * 1.15);
      // Closed-form ladder: r0 comes from the fixed ground anchors (the ground has no filler,
      // so its share can only be what the anchors leave of T), rEnd from area conservation
      // Σ r(i)·T = sEst, both clamped to [PROFILE_MIN, r0]. No capacity search: given n, the
      // ladder that holds sEst is solved directly, so the band is never crammed onto too few
      // floors (which is how the skirt got its area) and never spread onto empty ones.
      const ladderFor = (n, T) => {
        const r0 = Math.min(PROFILE_L0, Math.max(PROFILE_MIN + 0.02, 1 - ANCHORS / T));
        const rEnd = n === 1 ? Math.max(PROFILE_MIN, Math.min(r0, sEst / T))
          : Math.max(PROFILE_MIN, Math.min(r0, 2 * sEst / (n * T) - r0));
        return n === 1 ? [rEnd]
          : Array.from({ length: n }, (_, i) => r0 - (r0 - rEnd) * i / (n - 1));
      };
      const solveAt = F => {
        const T = packedT(F);
        const nMax = Math.min(F - 1, actLines.length);
        let best = null;
        for (let n = 1; n <= nMax; n++) {
          const shares = ladderFor(n, T);
          const hold = shares.reduce((s, r) => s + r * T, 0);
          if (hold >= sEst * 0.995) return { n, shares, T, F, hold };
          if (!best || hold > best.hold) best = { n, shares, T, F, hold };
        }
        return best;
      };
      // Growth (≤ +3 floors, the user's "stack up, never spread out") is tried only when the
      // answered floors cannot hold the band, and each extra floor pays a core set and a plate
      // minimum out of the SAME conserved GFA, so a grown F wins only when its ladder actually
      // holds MORE. On a small brief growing shrinks T and loses; the guard keeps F put.
      let pick = null;
      for (let F = floorsAbove; F <= floorsAbove + 3; F++) {
        const s = solveAt(F);
        if (!s) continue;
        if (!pick || s.hold > pick.hold * 1.02) pick = s;
        if (pick.hold >= sEst * 0.995) break;
      }
      if (pick) {
        // raw-space bin targets, proportional to the ladder: GROUND_SHORT is calib like the
        // activity lines, so the offset lives in the same (pre-scale) space. Whole-line
        // granularity can defeat the decreasing check at the chosen n, so fall through to
        // smaller ladders rather than to the legacy taper.
        for (let n = pick.n; n >= 1 && !PROFILE; n--) {
          const shares = ladderFor(n, pick.T);
          const sumR = shares.reduce((s, r) => s + r, 0);
          const c = (rawAct + GROUND_SHORT) / sumR;
          const targets = shares.map((r, i) => Math.max(1, c * r - (i === 0 ? GROUND_SHORT : 0)));
          const bins = splitBins(actLines, n, { targets, ground0: GROUND_SHORT });
          if (bins) PROFILE = { n, shares, T: pick.T, F: pick.F, bins };
        }
        if (PROFILE && PROFILE.F !== floorsAbove) { floorsAbove = PROFILE.F; upperCount = Math.max(0, floorsAbove - 1); }
      }
    }

    // ── MIXED USE STACKS, IT DOES NOT ALTERNATE (260810) ──────────────────────────────────
    // This used to read ((f - 1) % 2 === 1), which put housing on every other floor: office,
    // flats, office, flats up the building. No one builds that. The two uses want opposite
    // things from a floor — offices want visitors, a lift lobby that strangers use and a
    // service route; flats want none of it — so they stack, visitor-facing use underneath and
    // dwellings on top, with one boundary between them to run two lift groups off.
    // The SPLIT KEEPS THE OLD COUNT: housing starts far enough up that exactly as many floors
    // are dwellings as the alternating rule produced, so this reorders the floors without
    // reallocating them. Assigned below, once bandTop is known — see the plate loop.
    let housingFrom = Infinity;
    const useHousingAt = f =>
      buildingType === 'office' ? false :
      buildingType === 'housing' ? true :
      f >= housingFrom;   // mixed-use: office below, dwellings above

    // Greedy whole-line split into exactly n non-empty bins against 4:3:2:1 area
    // targets, then accept only if bin raw areas are STRICTLY decreasing. Returns
    // the bins (each {area, lines}) or null (→ caller tries a smaller n).
    // `prof` (profile path only): {targets, ground0} — absolute raw-area cut targets from the
    // descending-share ladder, and the ground retail offset the decreasing check must count
    // (level-0 SHORT is its bin PLUS the ground anchor, so bins alone under-state the ground).
    function splitBins(lines, n, prof) {
      if (n < 1 || lines.length < n) return null;
      const tot = lines.reduce((s, x) => s + x[1], 0);
      // ── THE RAMP IS BOUNDED, NOT n:1 (260814) ───────────────────────────────────────────
      // It used to run n, n-1, … 1, so the top of a six-level band got a twenty-first of the
      // band while the plate directly above it took a full floor. Measured on the stack: the
      // top plug-in level came out at 290 m² under a 654 m² plate, and 581 under 2,324 in a
      // four-storey brief. That reads as the building growing as it rises, which is not what
      // a plug-in taper means and is not buildable without a transfer.
      // The level total cannot answer it either: rule C holds SHORT above half the packed
      // area, so a band level is capped at about twice its SHORT lines however much sponge is
      // left. The taper itself has to be bounded. TAPER_RATIO is the top-to-bottom span of the
      // ramp: still visibly decreasing, no longer a stub under a slab.
      // Stays at 2. Flattening it was tried (260817) against "too much SHORT outside the mass on a
      // single floor" and it MOVES the apron rather than removing it. At 1.4, measured:
      //   ground apron  116 cells (52%) → 40 (14%)      but L2  24 (17%) → 68 (51%)
      //   total apron   151 cells → 166
      // and the ground's own SHORT went UP, 224 cells → 296, because a flatter ramp let `splitBins`
      // fit only three band levels instead of four and the same band area landed on fewer floors.
      // The level count is a discrete jump, so this knob does not tune smoothly. ?taper=n overrides
      // for A/B; the apron is measured by TEST/_apron-probe.html.
      const TAPER_RATIO = TAPER_OVERRIDE || 2;
      const weights = n === 1 ? [1]
        : Array.from({ length: n }, (_, i) => TAPER_RATIO - (TAPER_RATIO - 1) * i / (n - 1));
      const sumW = weights.reduce((s, w) => s + w, 0);
      const targets = prof ? prof.targets : weights.map(w => tot * w / sumW);
      if (prof) {
        // PROFILE PATH: the ladder's targets are nearly equal (adjacent floors differ by a few
        // per cent), and the greedy cumulative cut below cannot land that close with whole
        // lines: measured, it failed the decreasing check at every n from 7 down to 4 and
        // crammed the whole band onto 3 floors, which is the area imbalance the profile exists
        // to remove. An ordered-partition DP (lines keep their floor-affinity order) against
        // the absolute targets lands each boundary optimally; the decrease is then checked
        // with a 10% tolerance on the LEVEL's SHORT, since share order is enforced by the
        // filler caps (share_i = r_i at full funding), not by the raw bins.
        const m = lines.length;
        const pre = [0]; for (const [, a] of lines) pre.push(pre[pre.length - 1] + a);
        const seg = (i, j, t) => { const d = (pre[j] - pre[i]) - t; return d * d; };  // lines i..j-1 vs target t
        const INF = Infinity;
        const cost = Array.from({ length: n + 1 }, () => new Array(m + 1).fill(INF));
        const cut = Array.from({ length: n + 1 }, () => new Array(m + 1).fill(0));
        cost[0][0] = 0;
        for (let k = 1; k <= n; k++)
          for (let j = k; j <= m - (n - k); j++)
            for (let i = k - 1; i < j; i++) {
              const c = cost[k - 1][i] + seg(i, j, targets[k - 1]);
              if (c < cost[k][j]) { cost[k][j] = c; cut[k][j] = i; }
            }
        if (cost[n][m] === INF) return null;
        const bounds = new Array(n + 1); bounds[n] = m;
        for (let k = n; k >= 1; k--) bounds[k - 1] = cut[k][bounds[k]];
        const bins = [];
        for (let k = 0; k < n; k++) {
          const ls = lines.slice(bounds[k], bounds[k + 1]);
          bins.push({ area: ls.reduce((s, x) => s + x[1], 0), lines: ls });
        }
        // 25%, not 10%: preset lines run 161-322 m² against per-level targets near 500, so a
        // tighter bar rejects every n the ladder actually needs (measured: dtla fell 7 → 3 and
        // re-crammed the band). Small inversions are quantization noise; the massing page's
        // APRON_RELIEF already polices the run's step, and the filler caps hold the shares.
        const lvl = i => bins[i].area + (i === 0 ? prof.ground0 : 0);
        for (let i = 1; i < n; i++) if (lvl(i) > lvl(i - 1) * 1.25) return null;
        return bins;
      }
      // Cut on the CUMULATIVE target, not on each bin's own. Advancing when one bin passes its
      // own target lets every overshoot fall through to the next bin, and the drift lands
      // entirely on the last one: with the bounded ramp above, a top bin owed 512 m² came out
      // at 183. Comparing the running total against the cumulative target puts each boundary
      // at its nearest line instead, and the half-line term picks the closer side of it.
      const cum = []; { let c = 0; for (const t of targets) { c += t; cum.push(c); } }
      const bins = Array.from({ length: n }, () => ({ area: 0, lines: [] }));
      let li = 0, acc = 0;                                       // acc = area placed so far, all bins
      for (let k = 0; k < lines.length; k++) {
        const [t, a] = lines[k];
        const higherEmpty = n - 1 - li;                          // SHORT bins still above current
        const started = bins[li].lines.length >= 1;              // never leave a bin empty
        const mustAdvance = started && (lines.length - k) <= higherEmpty;
        const wantAdvance = started && li < n - 1 && (acc + a / 2) > cum[li];
        if (mustAdvance || wantAdvance) li++;
        bins[li].lines.push([t, a]); bins[li].area += a; acc += a;
      }
      if (bins.some(b => b.lines.length === 0)) return null;     // an empty bin → n too big
      // decreasing is judged on the LEVEL's SHORT, so bin 0 carries its ground-anchor offset
      const off = i => (prof && i === 0 ? prof.ground0 : 0);
      for (let i = 1; i < n; i++) if (!(bins[i].area < bins[i - 1].area + off(i - 1))) return null;
      return bins;
    }

    // pick the largest feasible n (≤4, ≤floorsAbove, ≤lines); n=1 always splits.
    let bins = null, nLev = 0;
    // Raised from 4 with the SHORT target above: the band now carries several times the area
    // it used to and four levels would make each one enormous. It still has to leave floors for
    // the main-use plates, which the nLev > upperCount check further down enforces.
    //
    // The band also may not be TALLER THAN IT CAN FILL (260814). Rule C caps a band level at
    // about twice its SHORT lines, so a band spread over too many storeys leaves a waist: the
    // capped plug-in levels come out smaller than the plates stacked above them, and a floor
    // wider than the floor below it hangs there. Measured on a 9,000 m² brief over four
    // floors: three capped levels under one 2,324 m² plate, 40% of that plate standing on
    // nothing.
    //   band level ≈ 2 · band / n        (rule C ceiling)
    //   plate      ≈ (gfa − band) / (F − n)
    // Asking the first to be at least the second gives n ≤ 2sF / (1 + s). Past that the band
    // is taller than the program can fill, and fewer fuller plug-in floors stack better than
    // more, emptier ones.
    if (PROFILE) {
      // profile path: n and the bins were solved with the ladder above; the fillable cap is
      // the legacy taper's arithmetic (band level ≈ 2× its SHORT) and does not apply here,
      // because every profile floor is funded to the full plate T by its filler cap.
      bins = PROFILE.bins; nLev = PROFILE.n;
    } else {
      const fillable = Math.max(1, Math.floor(2 * SHORT_TARGET_SHARE * floorsAbove / (1 + SHORT_TARGET_SHARE)));
      const maxLev = Math.min(6, floorsAbove, actLines.length, fillable);
      for (let n = maxLev; n >= 1; n--) { const b = splitBins(actLines, n); if (b) { bins = b; nLev = n; break; } }
    }

    const bins0 = bins, nLev0 = nLev;

    // ══════════════════════════════════════════════════════════════════
    // DETERMINISTIC TIERED SOLVE — two-pass build
    // ══════════════════════════════════════════════════════════════════
    // Pass 1 lets the existing machinery decide whether the ground leads the band.
    // When the sponge is squeezed the band filler shrinks toward 0, which RAISES
    // upper SHORT shares — a ground-led band can then break the strictly-decreasing
    // share taper (the ground's share is diluted by its fixed anchors). If the final
    // POST-SCALING check fails, pass 2 rebuilds with the band forced to start at L1
    // (off-ground, filler = ratio·cap keeps shares provably strictly decreasing:
    // both 80/short_i and (1−s_i)/s_i grow up the band).
    const baseLen = out.length;   // basements + ground anchors + their cores
    const PLATE_MIN = 300;        // sponge per-plate minimum (office plate ≥ 300)
    // office plate split — keep ≥2 rooms/floor so the massing packs a double-loaded
    // bar, not a core-wrapping plate (shortfloor plate gate: single room OR >70%).
    // 280 m² ≈ a large office suite; tuneable.
    const OFFICE_ROOM_MAX = 280;

    function decomposeHousing(area) {  // greedy 134/107/67 largest-first; leftover <67 absorbed
      const units = []; let rem = area;
      for (const u of [134, 107, 67]) while (rem >= u) { units.push(u); rem -= u; }
      return units;
    }
    const sumTier = tier => out.reduce((s, e) => s + (e.tier === tier ? e.area : 0), 0);

    function buildAttempt(forceNoGround) {
      out.length = baseLen;                 // rewind to the shared base
      for (const e of out) e.area = e.rawA; // restore presets (idempotent rescale)

      // ── SHORT band placement (machinery preserved; force flag only pins ground off) ──
      const bandLevels = [];  // {lv, isGround, shortRecs, targetShare} ascending
      let bandTop = 0;
      if (bins0) {
        let bins = bins0.map(b => ({ area: b.area, lines: b.lines.slice() }));
        let nLev = nLev0;
        // the ground's plug-in area is its bin PLUS the retail anchor that sits there anyway
        const b0 = bins[0].area + GROUND_SHORT;
        // ground leads the band only if its SHORT bin clears the anchors with enough
        // headroom to keep every upper SHORT level strictly below it and above 0.5.
        let includeGround = b0 > ANCHORS;
        const gShare = b0 / (b0 + ANCHORS);
        const uppersIfGround = nLev - 1;
        if (includeGround && uppersIfGround > 0 && gShare <= 0.5 + uppersIfGround * 0.03 + 0.02)
          includeGround = false;
        // profile path: the ladder starts AT the ground (user 260817, ground ≈ 75% SHORT) and
        // bin 0 was cut with the ground anchors already subtracted, so the headroom test above
        // does not apply. forceNoGround (pass 2) still wins as the last-resort fallback.
        if (PROFILE) includeGround = true;
        if (forceNoGround) includeGround = false;
        // if the band excludes the ground it needs nLev upper levels; fall back to
        // ground-led (or trim) when there aren't enough above-grade floors.
        if (!includeGround && nLev > upperCount) {
          if (!forceNoGround && b0 > ANCHORS && (nLev - 1) <= upperCount) includeGround = true;
          else { nLev = Math.max(1, upperCount); bins = bins.slice(0, nLev); }
        }

        const startLevel = includeGround ? 0 : 1;
        const uppers = includeGround ? nLev - 1 : nLev;
        // upper-level target shares: a gentle decreasing taper, all strictly > 0.5.
        // These are NOT the knob for the building's SHORT proportion, measured 260810: raising
        // them to 0.82 / 0.65 moved one level in one configuration and nothing else. They cap
        // the LONG filler, and the filler is already at zero on most band levels — what fixes a
        // level's ceiling is the rigid 80 m² toilets line, so the best it can reach is
        // shortI / (shortI + 80). The building's SHORT share is set by how much area the
        // activity band gets in the first place, which is the calibScale clamp below.
        const topT = includeGround ? Math.min(0.70, gShare - 0.02) : 0.70;
        const botT = 0.53;
        const upperShare = j => uppers <= 1 ? topT : Math.max(0.505, topT - (topT - botT) * j / (uppers - 1));

        for (let idx = 0; idx < nLev; idx++) {
          const lv = startLevel + idx;
          const shortRecs = bins[idx].lines.map(([t, a]) => add(t, a, lv, 'public', 'calib'));
          const isGround = includeGround && idx === 0;
          const j = includeGround ? idx - 1 : idx;              // upper index within the taper
          // profile path: each level's share IS the ladder value, which makes the filler cap
          // in step 3 fund the level to shortI/r = the uniform plate T. Legacy keeps its taper.
          const tgt = PROFILE ? PROFILE.shares[idx] : upperShare(j);
          bandLevels.push({ lv, isGround, shortRecs, targetShare: isGround ? null : tgt });
        }
        bandTop = startLevel + nLev - 1;
      }

      // ── toilets on every band level (rule C): rigid 80 m², public. Ground already
      //    carries its single toilets; upper band levels each get one.
      for (const bl of bandLevels) if (!bl.isGround) add('toilets', 80, bl.lv, 'public', 'rigid');

      // ── remaining upper floors: main-use plates. Office AND housing plates are the
      //    SPONGE: office as one resizable line (≥ PLATE_MIN); housing as a greedy
      //    decomposition of the per-plate target into standard units (rule D — no
      //    residential line over 160 m²). Only their per-plate target varies; unit
      //    presets stay exact.
      const officePlates = [];   // recs (area set by the solve)
      const housingFloors = [];  // floor numbers (lines emitted by the solve)
      // Where dwellings take over. Counted over the MAIN-USE PLATES only, for two reasons.
      // One: a plate carries an order of magnitude more area than a band level's LONG filler,
      // so counting the band levels in would shift the office / housing balance instead of
      // just reordering it. Two: the activity band is the outward-facing part of the building,
      // and a flat does not belong on a floor with a classroom and a gallery. A short building
      // that is all band therefore gets NO dwellings at all rather than one wedged in beside
      // the teaching rooms — the area stays, as office filler.
      const pStart = Math.max(1, bandTop + 1);
      let nHousing = 0;
      for (let f = pStart; f <= upperCount; f++) if ((f - 1) % 2 === 1) nHousing++;
      housingFrom = nHousing > 0 ? upperCount - nHousing + 1 : upperCount + 1;
      // A ground floor that the band did not take gets a plate like any other floor (260814).
      // It used to keep the lobby, the shopfront and the toilets and nothing else, so where
      // the band started at L1 the street level came out at 467 m² under a 995 m² plug-in
      // floor: the building stepping OUT as it left the pavement. The main use is on the
      // ground in every real version of this building anyway, behind the lobby.
      const plateFloors = [];
      if (!bandLevels.some(b => b.lv === 0)) plateFloors.push(0);
      for (let f = pStart; f <= upperCount; f++) plateFloors.push(f);
      for (const f of plateFloors) {
        if (useHousingAt(f)) housingFloors.push(f);
        else officePlates.push(add('office', 900, f, 'private', 'sponge'));
      }
      // cores on every upper floor (SHORT + main)
      for (let f = 1; f <= upperCount; f++) addCores(f);

      const nPlates = officePlates.length + housingFloors.length;

      // 1) calibrated scale: clamp((gfa − rigid − spongeMin) / calibRaw, 0.85, 1.15).
      const rigidTotal = sumTier('rigid');
      const calibRaw = sumTier('calib');
      let calibScale = 1;
      if (gfaTarget > 0 && calibRaw > 0)
        calibScale = Math.min(1.15, Math.max(0.85, (gfaTarget - rigidTotal - nPlates * PLATE_MIN) / calibRaw));
      for (const e of out) if (e.tier === 'calib') e.area = Math.max(1, Math.round(e.rawA * calibScale));

      // 2) band shrink (rule C, POST-SCALING): a level whose SHORT ≤ 80 can't clear
      //    0.5 even with zero filler (its rigid toilet alone is 80 LONG) — merge its
      //    SHORT lines into the neighbour bin below and drop its toilet.
      const upperBand = bandLevels.filter(b => !b.isGround);
      for (let guard = 0; guard < 8; guard++) {
        let merged = false;
        for (let i = upperBand.length - 1; i >= 0; i--) {
          const bl = upperBand[i];
          const shortI = bl.shortRecs.reduce((s, r) => s + r.area, 0);
          if (shortI <= 80) {
            const below = i >= 1 ? upperBand[i - 1] : (bandLevels.find(b => b.isGround) || null);
            if (!below) continue;               // lone un-clearable level: leave as-is
            for (const r of bl.shortRecs) { r.level = below.lv; below.shortRecs.push(r); }
            const ti = out.findIndex(e => e.type === 'toilets' && e.level === bl.lv && e.tier === 'rigid');
            if (ti >= 0) out.splice(ti, 1);
            upperBand.splice(i, 1);
            bandLevels.splice(bandLevels.indexOf(bl), 1);
            merged = true; break;
          }
        }
        if (!merged) break;
      }

      // 3) band LONG filler is SPONGE: per-level MAX is the taper target
      //    (floor(shortI·(1−s)/s) − 80, LONG counted as toilet+filler); MIN is 0
      //    (post-merge every level has SHORT > 80, so the toilet alone keeps the
      //    share > 0.5). Fund filler up to a uniform ratio of its caps AFTER
      //    reserving every plate's minimum.
      const fillerLevels = upperBand.map(bl => {
        const shortI = bl.shortRecs.reduce((s, r) => s + r.area, 0);
        const cap = Math.max(0, Math.floor(shortI * (1 - bl.targetShare) / bl.targetShare) - 80);
        return { bl, cap };
      });
      const fillerMax = fillerLevels.reduce((s, f) => s + f.cap, 0);
      const S = gfaTarget - sumTier('rigid') - sumTier('calib');
      const ratio = gfaTarget <= 0 ? 1 :
        (fillerMax > 0 ? Math.max(0, Math.min(fillerMax, S - nPlates * PLATE_MIN)) / fillerMax : 0);
      const fillerRecs = [];
      for (const f of fillerLevels) {
        const filler = Math.round(f.cap * ratio);
        if (filler <= 0) continue;
        if (useHousingAt(f.bl.lv)) {
          for (const u of decomposeHousing(filler))    // realistic units, each ≤ 160
            fillerRecs.push(add(u === 134 ? '2b2b apartment' : u === 107 ? '1b1b apartment' : 'studio apartment',
              u, f.bl.lv, 'private', 'sponge'));
        } else if (filler >= 54) {                     // office filler minimum (rule D)
          fillerRecs.push(add('office', filler, f.bl.lv, 'private', 'sponge'));
        }
      }

      // ── final band check on POST-SCALING areas: every level > 0.5 and SHORT raw
      //    AND share strictly decreasing up the band.
      const bandStats = () => bandLevels.map(bl => {
        let shrt = 0, tot = 0;
        for (const e of out) {
          if (e.level !== bl.lv || isCore(e.type) || isCorridor(e.type)) continue;
          tot += e.area;
          if (isShort(e.type)) shrt += e.area;
        }
        return { shrt, share: tot > 0 ? shrt / tot : 0 };
      });
      const bandOk = () => {
        const st = bandStats();
        // profile path: the ladder may be clamped flat (rEnd hits r0 on a small brief), and the
        // shares are enforced by the filler caps rather than by the raw bins, so equality and
        // rounding-sized inversions are legal. The taper path keeps its strict rule.
        const shareTol = PROFILE ? 0.05 : 0, shrtTol = PROFILE ? 1.25 : 1;
        for (let i = 1; i < st.length; i++)
          if (PROFILE
            ? !(st[i].shrt <= st[i - 1].shrt * shrtTol && st[i].share <= st[i - 1].share + shareTol)
            : !(st[i].shrt < st[i - 1].shrt && st[i].share < st[i - 1].share)) return false;
        return st.every(x => x.share > 0.5);
      };
      let ok = bandOk();
      // Zero-filler is a legacy rescue only: on the profile path the filler IS the mechanism
      // that lifts every band floor to the uniform plate T, so stripping it would collapse the
      // band floors to shortI + 80 and re-open the step this path exists to close.
      if (!ok && fillerRecs.length && !PROFILE) {  // rounding blip → retry with zero filler
        for (const rec of fillerRecs) out.splice(out.indexOf(rec), 1);
        fillerRecs.length = 0;
        ok = bandOk();
      }

      // 4) plates absorb the actual remainder down to PLATE_MIN. Housing plates are
      //    emitted first (quantized to units); office plates then absorb what housing
      //    quantization dropped. When the remainder can't even fund the minimums, the
      //    plates sit at the floor and the total overshoots — the clamps, not a bug,
      //    explain the residual.
      const fillerEmitted = fillerRecs.reduce((s, e) => s + e.area, 0);
      const budget = gfaTarget > 0
        ? gfaTarget - sumTier('rigid') - sumTier('calib') - fillerEmitted
        : nPlates * 900;                      // no target → presets
      let housingEmitted = 0;
      if (housingFloors.length) {
        const perH = Math.max(PLATE_MIN, Math.round(budget / Math.max(1, nPlates)));
        for (const f of housingFloors)
          for (const u of decomposeHousing(perH)) {
            add(u === 134 ? '2b2b apartment' : u === 107 ? '1b1b apartment' : 'studio apartment',
              u, f, 'private', 'sponge');
            housingEmitted += u;
          }
      }
      if (officePlates.length) {
        const perO = Math.max(PLATE_MIN, Math.round((budget - housingEmitted) / officePlates.length));
        for (const p of officePlates) {
          // split each floor's office target into k >= 2 rooms, none over
          // OFFICE_ROOM_MAX, summing exactly to perO — escapes the shortfloor
          // plate gate (rs.length===1 || mx/tot>0.70) so office floors pack as
          // a compact double-loaded bar instead of a core-wrapping plate.
          const k = Math.max(2, Math.ceil(perO / OFFICE_ROOM_MAX));
          const base = Math.floor(perO / k);
          const extra = perO - base * k;   // first `extra` rooms get +1
          p.area = base + (extra > 0 ? 1 : 0);           // room 0 reuses p
          for (let i = 1; i < k; i++) add('office', base + (i < extra ? 1 : 0), p.level, 'private', 'sponge');
        }
      }

      return { ok, groundLed: bandLevels.some(b => b.isGround) };
    }

    const first = buildAttempt(false);
    // Pass 2 (band forced off the ground) contradicts the profile's mandate outright: the user
    // put the ground at the TOP of the ladder (≈75% SHORT), so a profile band that misses the
    // taper check by a rounding step keeps its ground and records it, rather than rebuilding
    // with a 0% SHORT ground floor. Measured before this gate: quiet and thin both fell to
    // pass 2 and came out with the band starting at L1 and a plate at the street.
    if (!first.ok && first.groundLed && upperCount >= 1 && !PROFILE) buildAttempt(true);
    if (PROFILE) window.__profileDiag = {
      F: PROFILE.F, n: PROFILE.n, T: Math.round(PROFILE.T),
      shares: PROFILE.shares.map(r => +r.toFixed(3)),
      bins: PROFILE.bins.map(b => b.area), bandOk: first.ok,
    };

    // ── FLOOR ON THE REALISED SHORT SHARE (user 260816: "short 的比例必須超過 20%") ──
    // `shortShare` is a TARGET applied to the brief GFA. What comes out is always lower, because
    // the rigid lines (cores, toilets, parking, mech, loading) are never scaled and inflate the
    // built total underneath the band. Measured before this, site-driven:
    //   dtla 39.0%   tall 35.6%   noring 31.5%   thin 27.3%   quiet 22.2%
    // All already over 20%, but by arithmetic luck rather than by rule, and `quiet` is the
    // small-building case where the rigid floor bites hardest: it asks 25% and realises 22.2%.
    // The requirement is on the REALISED number, so it is measured here, after the build, and the
    // target is raised and the program rebuilt until it clears.
    // Bounded and deterministic: +0.03 per attempt, at most 4. The 0.32 ceiling `siteBrief`
    // applies is deliberately NOT re-applied to these retries, because a floor that cannot be met
    // is worse than a band slightly over the tuned ceiling.
    const realisedShort = rows => {
      let s = 0, l = 0;
      for (const e of rows) {
        if (isCore(e.type) || isCorridor(e.type)) continue;   // same basis as computeStats
        if (isShort(e.type)) s += e.area; else l += e.area;
      }
      return s + l > 0 ? s / (s + l) : 0;
    };
    const retry = (brief && brief._shortRetry) || 0;
    if (realisedShort(out) <= SHORT_FLOOR && retry < 4) {
      const bumped = { ...(brief || {}), shortShare: SHORT_TARGET_SHARE + 0.03, _shortRetry: retry + 1 };
      return generateEntries(buildingType, gfaTarget, floorsAnswered, basementLevels, activityKeys, bumped);
    }

    for (const e of out) { delete e.tier; delete e.rawA; }
    out.sort((a, b) => a.level - b.level);
    return out;
  }

  // ══════════════════════════════════════════════════════════════════
  // REVIEW STAGE — per-floor card editor over entries[]
  // ══════════════════════════════════════════════════════════════════
  let entries = [];          // {type, area, level, category, wh} — single source of truth
  let editingIdx = null;     // index into entries[] currently being edited
  let addingLevel = null;    // level whose add-form is open
  let rawOpen = false;
  // The raw text is folded away until the reader asks for it with the tab-strip icon.
  let rawShown = false;

  const dialogEl = document.getElementById('dialog');
  const stepIndicatorEl = document.getElementById('step-indicator');
  const reviewEl = document.getElementById('review');
  const floorsEl = document.getElementById('floors');
  const rawPanel = document.getElementById('raw-panel');
  const rawText = document.getElementById('raw-text');
  const rawErrors = document.getElementById('raw-errors');
  const btnRawApply = document.getElementById('btn-raw-apply');
  const btnRawRevert = document.getElementById('btn-raw-revert');
  const rawNote = document.getElementById('raw-note');
  let rawEdited = false;   // typed into and not yet applied — fillRaw() leaves it alone
  const btnBuild = document.getElementById('btn-build');

  const VOCAB = [
    // SHORT activities
    'exhibition gallery', 'event hall', 'showroom', 'pop-up retail',
    'classroom', 'seminar room', 'computer lab', 'project review room',
    'yoga studio', 'pilates studio', 'fitness center', 'meditation room', 'recovery lounge',
    'coffee shop', 'lounge bar',
    // main uses / service
    'office', 'studio apartment', '1b1b apartment', '2b2b apartment',
    'lobby', 'sales and display', 'toilets', 'storage', 'mechanical room',
    'electrical room', 'loading dock', 'parking bay group', 'staff area', 'it support',
    // cores / circulation
    'fire stair & freight elevator core', 'fire stair & passenger elevator core a',
    'fire stair & passenger elevator core b', 'circulation',
  ];
  document.getElementById('vocab-list').innerHTML = VOCAB.map(v => `<option value="${v}">`).join('');

  function serialize(list) {
    const levels = [...new Set(list.map(e => e.level))].sort((a, b) => a - b);
    let out = '';
    for (const lv of levels) {
      out += `# Level ${lv}${lv < 0 ? ' (basement)' : lv === 0 ? ' (ground)' : ''}\n`;
      for (const e of list.filter(x => x.level === lv)) {
        const [w, h] = e.wh || dims(e.area);
        out += `{${e.type}}/{${e.area}}/{${e.level}}/{${e.category}}/{${w},${h}}\n`;
      }
    }
    return out;
  }

  // Display is 1-indexed (ground = L1); internal e.level stays 0-indexed.
  function levelLabel(lv) { return lv >= 0 ? 'L' + (lv + 1) : 'B' + (-lv); }
  function levelSub(lv) { return lv > 0 ? 'floor ' + (lv + 1) : lv === 0 ? 'ground' : 'basement'; }
  // what the floor is called in the draft table. One line, said the way a person says it.
  function floorName(lv) { return lv > 0 ? 'Floor ' + (lv + 1) : lv === 0 ? 'Ground' : 'Basement ' + (-lv); }
  function escapeHtml(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

  // Defaults to the live draft. The argument is for probing a generated program that has not
  // been committed to `entries` yet, which is how the SHORT split is measured in TEST/.
  function computeStats(list = entries) {
    let total = 0, longArea = 0, shortArea = 0;
    let minL = Infinity, maxL = -Infinity;
    const perFloor = new Map(); // level -> {tot, shrt}
    for (const e of list) {
      total += e.area;
      if (e.level < minL) minL = e.level;
      if (e.level > maxL) maxL = e.level;
      if (isCore(e.type) || isCorridor(e.type)) continue; // SHORT-share counts packed programs only
      if (!perFloor.has(e.level)) perFloor.set(e.level, { tot: 0, shrt: 0 });
      const pf = perFloor.get(e.level);
      pf.tot += e.area;
      if (isShort(e.type)) { pf.shrt += e.area; shortArea += e.area; } else { longArea += e.area; }
    }
    const shortFloors = [...perFloor.entries()]
      .filter(([lv, pf]) => pf.tot > 0 && pf.shrt / pf.tot > SHORT_THRESHOLD)
      .map(([lv]) => lv).sort((a, b) => a - b);
    return { total, minL, maxL, longArea, shortArea, perFloor, shortFloors };
  }

  function pillClass(e) {
    if (isCore(e.type) || isCorridor(e.type)) return 'circ';
    return isShort(e.type) ? 'short' : 'long';
  }

  function inlineEditorHtml(e) {
    return `<div class="inline-form" id="pill-editor">
      <span class="if-name">${escapeHtml(e.type)}</span>
      <span class="if-lab">area</span>
      <input type="number" id="edit-area" min="1" value="${e.area}">
      <span class="if-lab">m²</span>
      <span class="if-lab" style="margin-left:6px;">category</span>
      <select id="edit-cat">
        ${VALID_CATEGORIES.map(c => `<option value="${c}"${c === e.category ? ' selected' : ''}>${c}</option>`).join('')}
      </select>
      <button class="if-btn" id="edit-save">Save</button>
      <button class="if-btn danger" id="edit-delete">Delete</button>
      <button class="if-btn ghost" id="edit-cancel">Cancel</button>
    </div>`;
  }

  function addFormHtml(lv) {
    return `<div class="inline-form" id="add-form">
      <span class="if-lab">add to ${levelLabel(lv)}</span>
      <input type="text" id="add-type" list="vocab-list" placeholder="program type…">
      <input type="number" id="add-area" min="1" placeholder="area m²">
      <select id="add-cat">
        ${VALID_CATEGORIES.map(c => `<option value="${c}"${c === 'private' ? ' selected' : ''}>${c}</option>`).join('')}
      </select>
      <button class="if-btn" id="add-confirm">Add</button>
      <button class="if-btn ghost" id="add-cancel">Cancel</button>
    </div>`;
  }

  // ══════════════════════════════════════════════════════════════════
  // PROGRAM FORECAST — the manual input path's timeline
  // ══════════════════════════════════════════════════════════════════
  // Site Forecast answers "what happens on this parcel". This answers "what happens to
  // this program", so the wizard path arrives at the massing view with a timeline too
  // instead of an empty slider. Same discipline as the site half: rule-based, offline,
  // and nothing here invents a number.
  //
  //   SHORT rows  are plug-in tenancies. They recompose on a churn interval, which is a
  //               stated user assumption, editable, and never presented as measured.
  //   LONG rows   are the permanent use. Where the program's dominant use maps into the
  //               M3 transition DB, each recorded transition becomes a dated event, and
  //               the date is the median duration of that transition's OWN cited
  //               conversions — the only figure the data actually carries.
  //
  // Two outputs from one prediction, because they answer different questions:
  //   evolution — one building over time, as conversion rules (Tier 1/2/3 in the massing)
  //   futures   — the same transitions as parallel whole-program alternatives, on the
  //               Site Forecast track the massing view already scrubs
  // ══════════════════════════════════════════════════════════════════

  // copied from program-massing-shortfloor.html — keep in sync
  const isFixedUse = t => /toilet|restroom|wc\b|mechanical|electrical|storage|loading|parking|\bplant\b|laundry|package room|it support/i.test(t);

  // Program type → use family. Order matters: the specific activity families are tested
  // before office/housing so "recovery lounge" reads as wellness, not as a residence.
  const USE_FAMILY = [
    { key: 'wellness',  re: /yoga|pilates|fitness|meditation|recovery|therapy|\bgym\b/i,        label: 'wellness' },
    { key: 'learning',  re: /classroom|seminar|computer lab|project review|library|training/i,  label: 'learning' },
    { key: 'culture',   re: /exhibition|gallery|museum|event hall|\bdemo\b/i,                   label: 'culture and events' },
    { key: 'food',      re: /coffee|lounge bar|restaurant|dining|community kitchen/i,           label: 'food and drink' },
    { key: 'retail',    re: /pop[- ]?up|showroom|sales and display|\bretail\b|\bshop\b/i,       label: 'retail' },
    { key: 'hotel',     re: /hotel/i,                                                           label: 'hotel' },
    { key: 'office',    re: /office|co[- ]?working|workplace/i,                                 label: 'office' },
    { key: 'housing',   re: /apartment|dwelling|housing|residential/i,                          label: 'housing' },
    { key: 'logistics', re: /storage|loading dock|warehouse/i,                                  label: 'logistics' },
    { key: 'parking',   re: /parking/i,                                                         label: 'parking' },
  ];
  const familyOf = t => USE_FAMILY.find(f => f.re.test(t)) || null;

  // A whole BUILDING of this family, in the transition DB's own `from` vocabulary. Only
  // families the DB actually records transitions out of are mapped; everything else falls
  // through to "not in the DB" and the user picks the closest entry by hand. Housing is
  // deliberately absent: the DB has no `from: housing`, and guessing one would be a claim.
  const FAMILY_TO_FROM = {
    office: 'office', logistics: 'warehouse', parking: 'parking structure',
    hotel: 'hotel / motel', retail: 'department store',
  };

  // The SHORT rotation. A plug-in tenancy is replaced first by a sibling in its own
  // activity group (a wellness floor stays wellness, the studio changes), and only then by
  // the lead activity of another group.
  const SHORT_RING = ACTIVITY_GROUPS.map(([g, keys]) => ({
    group: g, types: [...new Set(keys.flatMap(k => (ACTIVITY_DEFS[k] || []).map(d => d[0])))],
  }));
  function nextShortType(cur, taken) {
    const gi = SHORT_RING.findIndex(r => r.types.includes(cur));
    let order;
    if (gi < 0) order = SHORT_RING.flatMap(r => r.types);
    else {
      const ts = SHORT_RING[gi].types, at = ts.indexOf(cur);
      order = [...ts.slice(at + 1), ...ts.slice(0, at), ...SHORT_RING.filter((_, i) => i !== gi).map(r => r.types[0])];
    }
    return order.find(t => t !== cur && !taken.has(t)) || order.find(t => t !== cur) || cur;
  }

  // The DB's `to` vocabulary → one program type the massing view already draws. Compound
  // targets ("museum / education / creative office") are read left to right, so the first
  // named use wins.
  const TO_TARGET = [
    [/artist studio|\bloft\b/i,                     { type: 'studio apartment', category: 'private' }],
    [/supportive|affordable|housing|residential/i,  { type: '1b1b apartment', category: 'private' }],
    [/creative office|innovation|office/i,          { type: 'office', category: 'private' }],
    [/food hall/i,                                  { type: 'coffee shop', category: 'public' }],
    [/museum|gallery/i,                             { type: 'exhibition gallery', category: 'public' }],
    [/event|music|venue/i,                          { type: 'event hall', category: 'public' }],
    [/education|campus|school/i,                    { type: 'classroom', category: 'public' }],
    [/retail|market/i,                              { type: 'pop-up retail', category: 'public' }],
    [/medical|clinic|health/i,                      { type: 'physical therapy suite', category: 'private' }],
    [/hotel|amenity/i,                              { type: 'hotel room', category: 'private' }],
    [/logistics|fulfillment|warehous/i,             { type: 'storage', category: 'private' }],
    [/church|religio/i,                             { type: 'event hall', category: 'public' }],
  ];
  function targetOf(to) {
    for (const part of String(to).split('/').map(s => s.trim()).filter(Boolean))
      for (const [re, v] of TO_TARGET) if (re.test(part)) return v;
    return null;
  }

  const pfMedian = a => { const s = [...a].sort((x, y) => x - y), m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };
  const exDurations = t => (t.examples || []).filter(e => e.yearFrom && e.yearTo).map(e => e.yearTo - e.yearFrom);
  let _dbYears = undefined;
  function dbMedianYears() {
    if (_dbYears === undefined) {
      const all = ((window.NEXA_INTEL && window.NEXA_INTEL.transitions) || []).flatMap(exDurations);
      _dbYears = all.length ? { yr: Math.max(1, Math.round(pfMedian(all))), n: all.length } : null;
    }
    return _dbYears;
  }
  // How long this kind of conversion has taken, from the transition's own cited examples.
  // Where it has none dated, the DB-wide median stands in and says so.
  function transitionYears(t) {
    const own = exDurations(t);
    if (own.length) return { yr: Math.max(1, Math.round(pfMedian(own))), n: own.length, own: true };
    const db = dbMedianYears();
    return db ? { yr: db.yr, n: db.n, own: false } : null;
  }

  // ══════════════════════════════════════════════════════════════════
  // SITE CONTEXT (M7-lite) — what the surroundings say about the futures
  // ══════════════════════════════════════════════════════════════════
  // The M3 transition DB describes how a building type usually changes. It says nothing
  // about THIS site. Every transition, though, states its own preconditions and blockers in
  // prose, and several of them are about the district: "district amenity mass (food,
  // transit)", "district foot traffic below threshold", "window access for deep plates".
  // Those are the hook. This reads the site payload the address lookup already fetched and
  // answers, per transition, whether the surroundings supply what it asks for.
  //
  // Every number below is counted, not modelled. Hard limits, and they are printed on screen
  // rather than kept here:
  //   · OSM POI composition is WHAT IS MAPPED. It is not a census of what exists, and it is
  //     certainly not demand. Categories are mapped at very different rates.
  //   · 500 m is the same ring `findGenerators` fetches. It is a radius, not a catchment.
  //   · Nothing here becomes a percentage, a score shown to the user, or a likelihood. The
  //     tier stays the DB's; context is reported beside it, never folded into it.
  // The T-10y comparison M7 calls for is not here: it needs Overpass attic queries and a
  // control ring, and without them nothing may be described as growth or decline.
  const CTX_RADIUS = 500;   // must match GEN_RADIUS in findGenerators()

  // raw OSM tag → the composition bucket the forecast reasons about. `kind` is too coarse:
  // a cinema and a taco stand are both `food` to M6.
  const CTX_BUCKET = [
    [/^(cinema|theatre|arts_centre|nightclub|marketplace)$/, 'culture'],
    [/^(college|university|school|library|kindergarten)$/, 'learning'],
    [/^(restaurant|cafe|bar|fast_food|pub|food_court|ice_cream)$/, 'food'],
    [/^shop:/, 'retail'],
    [/^(clinic|doctors|hospital|pharmacy|dentist)$/, 'medical'],
  ];
  const ctxBucket = g => {
    const t = String(g.tag || '');
    for (const [re, b] of CTX_BUCKET) if (re.test(t)) return b;
    return g.kind === 'retail' ? 'retail' : g.kind === 'institution' ? 'learning' : g.kind === 'food' ? 'food' : null;
  };

  function readContext(site, drawnGfa) {
    if (!site) return null;
    const c = { radius: CTX_RADIUS, label: site.shortLabel || site.label || null, notes: [] };

    // ── what is around ──
    const gens = site.generators;                 // null = the call failed, [] = nothing mapped
    if (gens) {
      const kind = {}, mix = {};
      for (const g of gens) {
        kind[g.kind] = (kind[g.kind] || 0) + 1;
        const b = ctxBucket(g); if (b) mix[b] = (mix[b] || 0) + 1;
      }
      c.kinds = kind; c.mix = mix; c.gens = gens.length;
      const rail = kind.rail || 0, bus = kind.bus || 0;
      // A tier with a stated rule, not a score. Presence of a mapped stop, never frequency:
      // no free source in this pipeline carries service level.
      c.transit = rail ? { tier: 'high', basis: `${rail} rail or tram stop${rail === 1 ? '' : 's'} mapped within ${CTX_RADIUS} m` }
        : bus >= 5 ? { tier: 'medium', basis: `${bus} bus stops mapped within ${CTX_RADIUS} m, no rail` }
        : { tier: 'low', basis: bus ? `${bus} bus stop${bus === 1 ? '' : 's'} and no rail within ${CTX_RADIUS} m` : `no transit stop mapped within ${CTX_RADIUS} m` };
      c.amenity = (mix.food || 0) + (mix.retail || 0);
    } else {
      c.notes.push('The surroundings query did not return, so nothing here is weighed by context.');
    }

    // ── how it is reached ──
    if (site.roads && site.roads.length) {
      const best = [...site.roads].sort((a, b) => a.rank - b.rank)[0];
      c.street = { cls: best.cls, rank: best.rank, name: best.name, src: best.src };
    }

    // ── what is already built around it ──
    if (site.neighbours && site.neighbours.length) {
      const hs = site.neighbours.map(n => n.h || n.height || 0).filter(h => h > 0).sort((a, b) => a - b);
      c.neighbours = { n: site.neighbours.length, tallestM: hs.length ? Math.round(hs[hs.length - 1]) : null,
        medianM: hs.length ? Math.round(hs[hs.length >> 1]) : null };
    }

    // ── what the parcel is zoned for ──
    // Class only, from the legacy LAMC use code. The DTLA 2040 bracket format is not decoded
    // here, so those parcels abstain rather than being guessed at.
    const zi = interpretZone(site.zoning && site.zoning.code);
    if (zi && zi.format === 'legacy' && zi.useCode) {
      const u = zi.useCode;
      const cls = /^(CM|M\d)/.test(u) ? 'industrial' : /^(C\d|C|RAS)/.test(u) ? 'commercial'
        : /^R/.test(u) ? 'residential' : /^(PF|OS|A\d)/.test(u) ? 'civic or open' : null;
      c.zone = { code: u, cls, use: zi.use || null, height: zi.height || null, dLimit: !!zi.dLimit };
    } else if (zi && zi.format === 'dtla2040') {
      c.zone = { code: zi.parts.join(' · '), cls: null, use: null };
      c.notes.push('The parcel carries a DTLA 2040 code, whose use and form tables are not decoded here, so no transition is judged against its zoning.');
    }

    // ── what the code still allows ──
    const lot = site.parcel && site.parcel.lotAreaM2, far = site.far;
    if (lot && far) {
      const allowed = Math.round(lot * far);
      // "assumed" is decided here from the zone itself rather than trusting the flag on the
      // payload: only a legacy code with a height district yields a FAR from the LAMC table,
      // and a placeholder shown as a limit is exactly the fake precision C5 forbids.
      const farFromCode = !!(zi && zi.format === 'legacy' && zi.far);
      c.capacity = { lotM2: lot, far, farAssumed: !farFromCode, allowedM2: allowed,
        drawnM2: Math.round(drawnGfa || 0), headroomM2: Math.round(allowed - (drawnGfa || 0)) };
    }
    return c;
  }

  // Each rule reads one recurring phrase in the DB's own preconditions and blockers and
  // answers it from the measured ring. Unmatched prose stays unanswered rather than being
  // guessed at, which is why `contextSupport` can return an empty verdict.
  // Written against the DB's actual vocabulary (dumped from transitions.js, not guessed).
  // A rule fires only where the site payload measures the thing the phrase is about;
  // everything else abstains, which is why a transition can come back with no verdict.
  const CTX_RULES = [
    // ── "other" preconditions ──
    { re: /amenity mass|food, transit/i,
      ok: c => c.amenity >= 20,
      yes: c => `${c.amenity} food and retail points mapped within ${c.radius} m`,
      no: c => `only ${c.amenity} food and retail points mapped within ${c.radius} m` },
    { re: /tourism|nightlife/i,
      ok: c => (c.mix.food || 0) + (c.mix.culture || 0) >= 12,
      yes: c => `${(c.mix.food || 0) + (c.mix.culture || 0)} food and culture points within ${c.radius} m`,
      no: c => `only ${(c.mix.food || 0) + (c.mix.culture || 0)} food and culture points within ${c.radius} m` },
    { re: /institutional anchor|institutional buyer/i,
      ok: c => (c.mix.learning || 0) >= 2,
      yes: c => `${c.mix.learning} education points within ${c.radius} m`,
      no: c => `${c.mix.learning || 0} education points within ${c.radius} m, so no anchor is visible from here` },
    { re: /health-system tenant/i,
      ok: c => (c.mix.medical || 0) >= 3,
      yes: c => `${c.mix.medical} health points within ${c.radius} m`,
      no: c => `${c.mix.medical || 0} health points within ${c.radius} m` },
    { re: /highway access/i,
      ok: c => c.street && c.street.rank <= 3,
      yes: c => `the best frontage is a ${c.street.cls}`,
      no: c => c.street ? `the best frontage is a ${c.street.cls}, not an arterial` : null },
    // ── blockers (inverted by the caller: a blocker the site answers counts FOR) ──
    { re: /district foot traffic below threshold/i,
      ok: c => c.amenity >= 20,
      yes: c => `${c.amenity} food and retail points within ${c.radius} m`,
      no: c => `only ${c.amenity} food and retail points within ${c.radius} m, which is what this blocker is about` },
    { re: /industrial adjacency|noise, trucks/i,
      ok: c => !!(c.zone && c.zone.cls && c.zone.cls !== 'industrial'),
      yes: c => `the parcel is zoned ${c.zone.code}, not industrial`,
      no: c => c.zone && c.zone.cls ? `the parcel is zoned ${c.zone.code} (${c.zone.cls})` : null },
    { re: /office demand cycle|hospitality demand cycle|district cycle|low rent phase/i, skip: true },
  ];

  // zoningClass is its own test: it names a class, and the parcel has one.
  function zoneVerdict(want, c) {
    if (!c.zone || !c.zone.cls) return null;
    const w = String(want).toLowerCase();
    if (/rezone|ordinance|specific-plan|master-plan|conditional|by-right under/.test(w))
      return { note: `this transition assumes ${want}; the parcel is zoned ${c.zone.code}, so it is an entitlement step rather than a by-right one` };
    const wants = /industrial/.test(w) ? 'industrial' : /commercial|civic/.test(w) ? 'commercial' : /any|flexible/.test(w) ? null : null;
    if (!wants) return null;
    const good = c.zone.cls === wants || (wants === 'commercial' && c.zone.cls === 'civic or open');
    return { good, line: good ? `the parcel is zoned ${c.zone.code}, which is the ${wants} class this assumes`
      : `the parcel is zoned ${c.zone.code} (${c.zone.cls}); this assumes ${wants} zoning` };
  }

  // Reads a transition's stated preconditions and blockers against the measured ring.
  // Blockers invert: a blocker the site answers is a point FOR, one it does not is against.
  function contextSupport(t, c) {
    if (!c || c.amenity == null) return null;
    const For = [], against = [], notes = [];
    const p = t.preconditions || {};
    const texts = [p.other, ...(t.blockers || [])].filter(Boolean);
    const push = (good, line) => {
      if (!line) return;
      const list = good ? For : against;
      if (!list.includes(line)) list.push(line);
    };
    // preconditions read straight; a blocker counts FOR when the site does not have it
    if (p.other) for (const r of CTX_RULES) {
      if (r.skip || !r.re.test(p.other)) continue;
      let good; try { good = !!r.ok(c); } catch (e) { break; }
      push(good, (good ? r.yes : r.no)(c));
      break;
    }
    for (const b of t.blockers || []) for (const r of CTX_RULES) {
      if (r.skip || !r.re.test(b)) continue;
      let good; try { good = !!r.ok(c); } catch (e) { break; }
      push(good, (good ? r.yes : r.no)(c));
      break;
    }
    if (p.zoningClass) {
      const z = zoneVerdict(p.zoningClass, c);
      if (z && z.note) notes.push(z.note);
      else if (z) push(z.good, z.line);
    }
    if (!For.length && !against.length && !notes.length) return null;
    // A standing, not a score: the DB's tier is the only ranking the user is shown as such.
    // A transition with only a zoning note has no standing — nothing was weighed either way,
    // and labelling that "mixed" would read as a judgement the site did not make.
    const standing = !For.length && !against.length ? null
      : !against.length ? 'supported' : !For.length ? 'unsupported' : 'mixed';
    return { for: For, against, notes, standing };
  }
  const CTX_RANK = { supported: 0, mixed: 1, unsupported: 2 };

  // ── M9 SITE-SIGNALS ─────────────────────────────────────────────────────────────────
  // contextSupport above reads what is measurably AROUND the site. This reads what is being
  // SAID and DECIDED about it: ordinances, press, landmarks, district trend. Schema and the
  // rules it lives under: NEXA/intel/INTEL-DATA.md §6.
  //
  // Nothing in this layer is a measurement. No free source sells social-media attention,
  // footfall or trade area at parcel resolution, so a `trend` item is a claim somebody
  // published about a district. A signal therefore never changes a DB tier and never becomes
  // a number: it orders futures INSIDE a tier, beside the measured read, and the panel prints
  // the two standings separately so it stays visible which one carried the ordering.
  const SIG_STALE_DAYS = 180;

  // the same local-metres approximation the parcel maths uses; exact enough at ring scale
  function metresBetween(aLat, aLng, bLat, bLng) {
    const mLat = 111320, mLng = 111320 * Math.cos(aLat * Math.PI / 180);
    return Math.hypot((aLat - bLat) * mLat, (aLng - bLng) * mLng);
  }

  // "YYMMDD" → days since. Unparseable returns null rather than a guessed age.
  function daysSinceStamp(s) {
    if (!/^\d{6}$/.test(String(s || ''))) return null;
    const d = new Date(2000 + +String(s).slice(0, 2), +String(s).slice(2, 4) - 1, +String(s).slice(4, 6));
    return isNaN(d.getTime()) ? null : Math.round((Date.now() - d.getTime()) / 86400000);
  }

  // Which compiled signal set covers a geocoded address. Nearest containing circle wins, so
  // two overlapping districts never both claim one address. No circle contains it = no
  // signal read, which is the honest answer for every site nobody has researched.
  function signalsFor(site) {
    const ALL = (window.NEXA_INTEL && window.NEXA_INTEL.signals) || {};
    if (!site || site.lat == null || site.lng == null) return null;
    let best = null;
    for (const key of Object.keys(ALL)) {
      const set = ALL[key], w = set && set.meta && set.meta.where;
      if (!w || !(set.items || []).length) continue;
      const dist = metresBetween(site.lat, site.lng, w.lat, w.lon);
      if (dist <= (w.radiusM || 800) && (!best || dist < best.dist)) {
        const age = daysSinceStamp(set.meta.compiled);
        best = { key, set, dist: Math.round(dist), age, stale: age != null && age > SIG_STALE_DAYS };
      }
    }
    return best;
  }

  // Does this signal bear on this transition? Matched on the DB's own slash-separated parts,
  // the way the `from` lookups already are, so "food hall / creative retail" answers to either.
  function signalHits(item, t) {
    const parts = s => String(s || '').toLowerCase().split('/').map(x => x.trim()).filter(Boolean);
    const a = item.affects || {};
    const to = (a.to || []).map(x => String(x).toLowerCase());
    const from = (a.from || []).map(x => String(x).toLowerCase());
    return parts(t.to).some(p => to.includes(p)) ||
      (!!from.length && parts(t.from).some(p => from.includes(p)));
  }

  // A standing from the discourse layer, in the shape contextSupport returns, so the sort and
  // the renderer treat the two reads identically.
  function signalSupport(t, sig) {
    if (!sig) return null;
    const For = [], against = [], context = [];
    for (const it of sig.set.items || []) {
      if (!signalHits(it, t)) continue;
      (it.direction === 'for' ? For : it.direction === 'against' ? against : context).push(it);
    }
    if (!For.length && !against.length && !context.length) return null;
    // A rule change settles a split against a market mood — the weighting stated in
    // INTEL-DATA §6, not one invented here. Structural on both sides, or on neither,
    // leaves the standing mixed rather than picking a winner.
    const hard = list => list.filter(r => r.strength === 'structural').length;
    const standing = For.length && !against.length ? 'supported'
      : against.length && !For.length ? 'unsupported'
      : !For.length && !against.length ? null
      : hard(For) > hard(against) ? 'supported'
      : hard(against) > hard(For) ? 'unsupported' : 'mixed';
    return { for: For, against, context, standing, set: sig };
  }

  // A signal is printed in three parts so the caller can put the long detail between the
  // claim and its citation. Always dated and always tagged: an undated claim about a
  // district is worth less than a dated one and the panel has to show which it is.
  function signalHead(it) {
    return '<b>' + escapeHtml(it.label) + '</b> <span class="pf-sig-tag">' +
      escapeHtml(it.date || 'undated') + ' · ' + escapeHtml(it.channel) + ' · ' +
      escapeHtml(it.strength) + ' · ' + escapeHtml(it.confidence || 'unknown') + '</span>' +
      (it.basis ? '<div class="pf-sig-basis">' + escapeHtml(it.basis) + '</div>' : '');
  }
  function signalCite(it) {
    if (!it.source && !it.url) return '';
    const t = escapeHtml(it.source || it.url);
    return '<div class="pf-cite">' + (it.url
      ? '<a href="' + escapeHtml(it.url) + '" target="_blank" rel="noopener">' + t + '</a>' : t) + '</div>';
  }
  function signalLine(it) { return signalHead(it) + signalCite(it); }

  // The signal read for one transition. `context` items are printed even though they rank
  // nothing — they carry the caveats (a boundary that was never verified, an ordinance that
  // does not reach this parcel), and dropping them would drop the honest part.
  function sigBlock(s) {
