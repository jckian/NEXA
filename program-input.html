  // copied from program-massing-shortfloor.html — keep in sync (families: F&B · retail · show
  // and event · learning · wellness). Everything unmatched is LONG.
  const SHORT_RE = new RegExp([
    'coffee|caf[eé]|restaurant|food hall|\\bbar\\b',
    '\\bretail\\b|sales and display|\\bdisplay\\b|showroom|pop[- ]?up|\\bshop\\b|market',
    'exhibition|event hall|\\bdemo\\b',
    'classroom|seminar|computer lab|project review',
    'yoga|pilates|fitness|\\bgym\\b|recovery lounge|physical therapy|meditation|health coaching',
  ].join('|'), 'i');
  const isShort = t => SHORT_RE.test(t);
  const isCorridor = t => /circulation|corridor|hallway/i.test(t); // copied from program-massing-shortfloor.html — keep in sync
  const VALID_CATEGORIES = ['public', 'private', 'circulation'];
  const SHORT_THRESHOLD = 0.5; // copied from program-massing-shortfloor.html — keep in sync

  // Validates one raw line the same way shortfloor's parse() reads it, plus an
  // "unknown category" check parse() does not enforce (it silently accepts any
  // string) but which authors should fix before handoff.
  function validateLine(raw) {
    const t = raw.trim();
    if (!t || t.startsWith('#')) return { skip: true };

    const parts = t.split('/').map(s => s.replace(/[{}]/g, '').trim());
    if (parts.length < 3) return { error: 'too few parts (need type/area/level)' };

    const type = parts[0].toLowerCase();
    const area = parseFloat(parts[1]);
    const level = parseInt(parts[2], 10);
    let category = 'private';
    if (parts[3] && !parts[3].includes(',')) category = parts[3].toLowerCase();
    else if (parts[4] && !parts[4].includes(',')) category = parts[4].toLowerCase();

    if (!type) return { error: 'missing type' };
    if (isNaN(area)) return { error: 'NaN area' };
    if (isNaN(level)) return { error: 'NaN level' };
    if (!VALID_CATEGORIES.includes(category)) return { error: 'unknown category "' + category + '"' };

    let w = 0, h = 0, hasWH = false;
    for (let i = 3; i < parts.length; i++) {
      if (parts[i] && parts[i].includes(',')) {
        const [a, b] = parts[i].split(',').map(parseFloat);
        if (!isNaN(a) && !isNaN(b)) { w = a; h = b; hasWH = true; }
        break;
      }
    }

    return { type, area, level, category, wh: hasWH ? [w, h] : null };
  }

  // ══════════════════════════════════════════════════════════════════
  // WIZARD
  // ══════════════════════════════════════════════════════════════════
  // Every chip label below matches the isShort regex above (verified per label).
  const ACTIVITY_GROUPS = [
    ['Show & event', ['exhibition', 'event hall', 'showroom', 'pop-up']],
    ['Learning',     ['classroom', 'seminar', 'computer lab', 'project review']],
    ['Wellness',     ['yoga', 'pilates', 'fitness', 'meditation', 'recovery lounge']],
    ['Social',       ['coffee', 'lounge bar']],
  ];

  // Per-activity emitted program lines [type, area m²]. Type names all satisfy
  // isShort. Areas: mostly taken from the shortfloor SAMPLE's own instances
  // (coffee shop 161, showroom 214, pop-up retail 107, exhibition gallery 268,
  // event hall 241, lounge bar 134); fitness uses the AREA-TABLE "gym" 242;
  // the rest are presets in the 90–215 m² band by activity kind.
  const ACTIVITY_DEFS = {
    'exhibition':      [['exhibition gallery', 268]],
    'event hall':      [['event hall', 241]],
    'showroom':        [['showroom', 214]],
    'pop-up':          [['pop-up retail', 107], ['pop-up retail', 107]],
    'classroom':       [['classroom', 107], ['classroom', 107]],
    'seminar':         [['seminar room', 107]],
    'computer lab':    [['computer lab', 107]],
    'project review':  [['project review room', 107]],
    'yoga':            [['yoga studio', 134]],
    'pilates':         [['pilates studio', 107]],
    'fitness':         [['fitness center', 242]],
    'meditation':      [['meditation room', 90]],
    'recovery lounge': [['recovery lounge', 107]],
    'coffee':          [['coffee shop', 161]],
    'lounge bar':      [['lounge bar', 134]],
  };

  const steps = [
    {
      type: 'site',
      question: 'Where is your <em>site</em>?',
      label: 'Site',
      placeholder: 'e.g. 130 W College St, Los Angeles, CA 90012',
    },
    {
      type: 'chips',
      question: '<em>What building type</em><br>are we programming?',
      label: 'Type',
      chips: ['Mixed-Use', 'Office', 'Housing'],
    },
    {
      type: 'number',
      question: 'What is the<br>total <em>GFA</em>?',
      label: 'GFA',
      chips: ['12,000 m²', '20,000 m²', '32,000 m²'],
      placeholder: 'e.g. 20000',
    },
    {
      type: 'floors',
      question: 'How many <em>floors</em><br>above and below grade?',
      label: 'Floors',
    },
    {
      type: 'multi',
      question: 'What <em>activities</em><br>plug into the building?',
      label: 'Activities',
    },
  ];

  // Step type → the siteBrief reason that filled it in (the `k` siteBrief's say() writes).
  // Only these steps carry a site-set answer; parking, ground retail and the plug-in band are
  // set inside the generator and have no question of their own.
  // 'floors' is deliberately absent (user 260821). Its reason reads "12,000 m² over a plate of
  // 1,400 m², which is 70% of the lot" — and the GFA in it is sitting three lines above in the
  // answered list. The site still sets the floor count; it just does not explain it back.
  const SITE_FILLED = { chips: 'type', number: 'GFA', multi: 'activities' };

  let step = 0;
  const selectedActivities = new Set();
  // wiz.site stays null until step 1 resolves an address (or forever, if it is skipped).
  // It is carried for CONTEXT only — nothing downstream sizes geometry from it.
  // siteBrief: what the resolved address sets in the program (see siteBrief()). Null until
  // an address resolves, and null forever if the step is skipped, which is what makes a
  // site-less run generate exactly the program it always did.
  const wiz = { buildingType: 'mixed-use', gfa: 20000, floorsAbove: 12, basementLevels: 2, activities: [], site: null, siteBrief: null };

  // Where the review stage was entered from, so its "← back" returns to the right place.
  // Set by submit() (wizard) and by applyScenario() (forecast); persisted in the draft.
  let reviewOrigin = 'wizard';
  let openForecast = null; // assigned by initSiteForecast when intel data is present
  // Assigned by initSiteForecast too. The Site Forecast entry used to stand at the bottom of
  // every wizard step reading "site forecast · 2 sites" — a door to a layer that has something
  // to say about exactly two addresses in Los Angeles, advertised on every screen to everyone
  // else as a dead end. It now stays down until the reader goes into one of those two sites,
  // and this is what puts it up.
  let revealForecastLink = () => {};
  // Which addresses the intel layer covers: the Demo site chips ARE those two sites, so the list
  // is read off them rather than written out a second time here and left to drift. Exact address
  // match, loosened only for case, spacing and punctuation — no fuzzy geocode guessing.
  function isIntelAddress(q) {
    const norm = t => String(t || '').toLowerCase().replace(/[\s,.]+/g, ' ').trim();
    const a = norm(q);
    if (!a) return false;
    return [...document.querySelectorAll('#site-demos .sd-chip')].some(b => norm(b.dataset.addr) === a);
  }

  // Which view is on screen, and where the site-forecast overlay's close button lands.
  // Closing it always claimed "back to wizard", which dumped you into the wizard with a live
  // draft sitting behind it. It now returns to whatever it was opened over.
  let curView = 'wizard';
  let fcReturn = 'wizard';
  function setFcReturn(where) {
    fcReturn = where;
    const b = document.getElementById('fc-close');
    if (b) b.textContent = where === 'review' ? '✕ back to draft' : '✕ back to wizard';
  }

  const qEl = document.getElementById('question');
  const chipsEl = document.getElementById('chips');
  const answeredEl = document.getElementById('answered');
  const hintEl = document.getElementById('hint');
  const rowNumber = document.getElementById('row-number');
  const rowFloors = document.getElementById('row-floors');
  const inputNumber = document.getElementById('input-number');
  const btnNumber = document.getElementById('btn-number');
  const floorsAboveEl = document.getElementById('floors-above');
  const floorsBasementEl = document.getElementById('floors-basement');
  const btnFloors = document.getElementById('btn-floors');
  const btnActivities = document.getElementById('btn-activities');
  const btnBack = document.getElementById('btn-back');
  const rowSite = document.getElementById('row-site');
  const inputSite = document.getElementById('input-site');
  const btnSite = document.getElementById('btn-site');
  const sitePanel = document.getElementById('site-panel');
  const siteActions = document.getElementById('site-actions');
  const siteDemos = document.getElementById('site-demos');
  const siteContinue = document.getElementById('site-continue');
  const rowBrief = document.getElementById('row-brief');
  const inputBrief = document.getElementById('input-brief');
  const btnBrief = document.getElementById('btn-brief');
  const briefPanel = document.getElementById('brief-panel');

  // ── ANALYSING OVERLAY ────────────────────────────────────────────────────────────────
  // analyzing(msg) puts it up or changes the line under the mark; analyzingDone() takes it
  // away. It stays for AN_MIN_MS even when the work returns at once: a 90 ms flash of a
  // turning logo reads as a glitch rather than as an answer.
  const AN_MIN_MS = 650;
  const anEl = document.getElementById('analyzing');
  const anStepEl = document.getElementById('an-step');
  // The overlay covers the page, so anything that leaves it up leaves the wizard unusable.
  // Every caller hides it on both paths, and this is the belt: no stage of this flow takes
  // 25 s, so if one ever does, the page comes back rather than staying locked behind a mark
  // that turns forever. Navigating away (Build) unloads the page long before it fires.
  const AN_WATCHDOG_MS = 25000;
  let anShownAt = 0, anHideTimer = null, anWatchdog = null;
  function analyzing(msg) {
    if (anHideTimer) { clearTimeout(anHideTimer); anHideTimer = null; }
    anStepEl.textContent = msg || '';
    if (!anEl.classList.contains('on')) { anShownAt = Date.now(); anEl.classList.add('on'); }
    clearTimeout(anWatchdog);
    anWatchdog = setTimeout(() => anEl.classList.remove('on'), AN_WATCHDOG_MS);
  }
  function analyzingDone() {
    clearTimeout(anWatchdog);
    if (!anEl.classList.contains('on')) return;
    const wait = Math.max(0, AN_MIN_MS - (Date.now() - anShownAt));
    if (anHideTimer) clearTimeout(anHideTimer);
    anHideTimer = setTimeout(() => { anEl.classList.remove('on'); anHideTimer = null; }, wait);
  }
  // Straight off, no minimum: for a screen that is already stale by the time anyone sees it.
  function analyzingHide() {
    clearTimeout(anWatchdog);
    if (anHideTimer) { clearTimeout(anHideTimer); anHideTimer = null; }
    anEl.classList.remove('on');
  }

  // The Back button, from the massing page. This document is not reloaded on that trip: the
  // browser hands back the bfcache copy exactly as it was left, which is mid-handover, with
  // "building the massing" over the whole page and no script still running to take it down.
  // The draft underneath is intact and the overlay is the only thing wrong, so the one event
  // that fires on a restore takes it off. Nothing else about the page needs re-running.
  window.addEventListener('pageshow', e => { if (e.persisted) analyzingHide(); });

  // pips are built once from steps.length so a new step needs no markup change
  const stepNumEl = document.getElementById('step-num');
  (function buildPips() {
    const bar = document.getElementById('step-indicator');
    for (let i = steps.length - 1; i >= 0; i--) {
      const pip = document.createElement('div');
      pip.className = 'step-pip';
      pip.id = 'pip-' + i;
      bar.insertBefore(pip, bar.firstChild);
    }
  })();

  function updatePips(s) {
    for (let i = 0; i < steps.length; i++) {
      const pip = document.getElementById('pip-' + i);
      pip.className = 'step-pip' + (i < s ? ' done' : i === s ? ' active' : '');
    }
    stepNumEl.textContent = String(s + 1).padStart(2, '0') + ' / ' + String(steps.length).padStart(2, '0');
  }

  function loadStep(i) {
    const s = steps[i];
    step = i;            // keep the pointer and the view in sync (goBack relies on this)
    updatePips(i);
    renderAnswered();

    qEl.classList.add('hidden');
    setTimeout(() => { qEl.innerHTML = s.question; qEl.classList.remove('hidden'); }, 200);

    chipsEl.classList.add('hidden');
    setTimeout(() => {
      chipsEl.innerHTML = '';
      if (s.type === 'multi') {
        for (const [groupName, keys] of ACTIVITY_GROUPS) {
          const lab = document.createElement('span');
          lab.className = 'chip-group-label';
          lab.textContent = groupName;
          chipsEl.appendChild(lab);
          for (const key of keys) {
            const c = document.createElement('button');
            c.className = 'chip' + (selectedActivities.has(key) ? ' selected' : '');
            c.textContent = key;
            c.dataset.activity = key;
            c.onclick = () => {
              if (selectedActivities.has(key)) selectedActivities.delete(key); else selectedActivities.add(key);
              c.classList.toggle('selected', selectedActivities.has(key));
            };
            chipsEl.appendChild(c);
          }
        }
      } else {
        // The site's answer is drawn already picked, and on the GFA step it is added as a chip
        // of its own: the three presets are round numbers for a run with no site, and beside a
        // measured 1,400 m² they read as the only choices unless the measured one is with them.
        // Nothing is committed either way — the step is answered when a chip is clicked.
        const useSite = !answered[i] && wiz.siteBrief;
        const recType = s.type === 'chips' && useSite ? wiz.siteBrief.buildingType : null;
        let labels = s.chips || [];
        let recLabel = null;
        if (s.type === 'number' && useSite && wiz.siteBrief.gfa) {
          recLabel = wiz.siteBrief.gfa.toLocaleString() + ' m²';
          labels = [recLabel, ...labels.filter(l => l !== recLabel)];
        }
        labels.forEach(label => {
          const c = document.createElement('button');
          const isRec = (recLabel && label === recLabel) ||
            (recType && label.toLowerCase().replace(/\s+/g, '-') === recType);
          c.className = 'chip' + (isRec ? ' rec' : '');
          c.textContent = label;
          c.onclick = () => submit(label);
          chipsEl.appendChild(c);
        });
      }
      chipsEl.classList.remove('hidden');
    }, 180);

    hintEl.textContent = s.hint || '';
    // A box the site filled says which measured figure it was filled from. Without this the
    // number reads as a guess the wizard made up, and the architect cannot tell whether it is
    // worth keeping. It goes as soon as the step is answered: from then on the value is theirs.
    const sbKey = SITE_FILLED[s.type];
    if (sbKey && !answered[i] && wiz.siteBrief) {
      const r = (wiz.siteBrief.reasons || []).find(x => x.k === sbKey);
      if (r) hintEl.textContent = 'from the site · ' + r.why;
    }
    btnBack.style.display = i > 0 ? 'flex' : 'none'; // .btn-send centres its svg with flex

    rowNumber.style.display = 'none';
    rowFloors.style.display = 'none';
    rowSite.style.display = 'none';
    rowBrief.style.display = 'none';
    briefPanel.style.display = 'none';
    btnActivities.style.display = 'none';
    siteActions.style.display = 'none';
    siteDemos.style.display = 'none';
    sitePanel.style.display = 'none';
    document.getElementById('site-forecast').style.display = 'none';

    if (s.type === 'chips' && !LLM_OFF) {
      rowBrief.style.display = 'flex';
      btnBrief.disabled = !inputBrief.value.trim();
      if (briefState) renderBrief();          // a revisit keeps what the model already read
      setTimeout(() => inputBrief.focus(), 250);
    }

    if (s.type === 'site') {
      rowSite.style.display = 'flex';
      siteActions.style.display = 'flex';
      siteDemos.style.display = 'flex';
      inputSite.placeholder = s.placeholder || '';
      // revisiting the step: show the address, the result and the forecast already found
      inputSite.value = (wiz.site && wiz.site.query) || inputSite.value;
      btnSite.disabled = !inputSite.value.trim();
      if (wiz.site) renderSitePanel(wiz.site);
      if (forecastState) renderForecast();
      siteContinue.style.display = wiz.site ? 'inline-block' : 'none';
      setTimeout(() => inputSite.focus(), 250);
    } else if (s.type === 'number') {
      rowNumber.style.display = 'flex';
      // prefill on a revisit (coming back), so the previous answer is not retyped
      // a forecast "use this" prefills the GFA even though the step is not yet answered
      inputNumber.value = answered[i] ? String(Math.round(wiz.gfa)) : (gfaPrefill ? String(gfaPrefill) : '');
      inputNumber.placeholder = s.placeholder || '';
      btnNumber.disabled = !inputNumber.value;
      setTimeout(() => inputNumber.focus(), 250);
    } else if (s.type === 'floors') {
      rowFloors.style.display = 'flex';
      floorsAboveEl.value = wiz.floorsAbove;
      floorsBasementEl.value = wiz.basementLevels;
      setTimeout(() => floorsAboveEl.focus(), 250);
    } else if (s.type === 'multi') {
      btnActivities.style.display = 'inline-block';
    }
  }

  // Answers are kept as data, not only as DOM rows, so "← back" can re-ask a step and a
  // revisited step can prefill its previous value. Answers past the current step are kept
  // (not deleted) — stepping forward re-confirms and overwrites them.
  const answered = []; // answered[i] = { key, val } for step i, once answered
  function renderAnswered() { // only the steps already behind the current one are shown
    answeredEl.innerHTML = answered.slice(0, step).map(a => a
      ? `<div class="answered-row"><span class="answered-key">${escapeHtml(a.key)}</span><span class="answered-val">${escapeHtml(a.val)}</span></div>`
      : '').join('');
  }
  function recordAnswer(label) {
    answered[step] = { key: steps[step].label, val: String(label) };
  }

  function goBack() {
    if (step === 0) return;
    step--;
    loadStep(step);
  }
  btnBack.addEventListener('click', goBack);

  // Branches on the step's TYPE, not its index — inserting a step must not renumber this.
  function submit(value) {
    const type = steps[step].type;
    if (type === 'site') {
      value = wiz.site ? (wiz.site.shortLabel || wiz.site.query) : 'no site';
    } else if (type === 'chips') {
      wiz.buildingType = value.toLowerCase().replace(/\s+/g, '-');
    } else if (type === 'number') {
      const n = parseFloat(String(value).replace(/[^\d.]/g, ''));
      wiz.gfa = isNaN(n) || n <= 0 ? 20000 : n;
      value = Math.round(wiz.gfa).toLocaleString() + ' m²';
    } else if (type === 'floors') {
      const a = Math.max(1, parseInt(floorsAboveEl.value, 10) || 8);
      const b = Math.max(0, parseInt(floorsBasementEl.value, 10) || 0);
      wiz.floorsAbove = a; wiz.basementLevels = b;
      value = a + ' above · ' + b + ' basement';
    } else if (type === 'multi') {
      wiz.activities = [...selectedActivities];
      value = selectedActivities.size === 0 ? 'no activities' : selectedActivities.size + ' activities';
    }

    recordAnswer(value);

    if (step + 1 < steps.length) {
      loadStep(step + 1); // loadStep advances `step`
    } else {
      step = steps.length;
      chipsEl.classList.add('hidden');
      qEl.classList.add('hidden');
      btnActivities.style.display = 'none';
      reviewOrigin = 'wizard';
      wiz.scenarioName = null;  // this draft is the wizard's, not a scenario's
      // The overlay goes up first and the draft is generated a frame later, or the synchronous
      // solve would eat the frame the overlay was meant to appear in and nothing would show.
      analyzing('drafting the program');
      setTimeout(() => { enterReview(); analyzingDone(); }, 250);
    }
  }

  inputNumber.addEventListener('input', () => { btnNumber.disabled = !inputNumber.value.trim(); });
  inputNumber.addEventListener('keydown', e => {
    if (e.key === 'Enter' && inputNumber.value.trim()) { e.preventDefault(); submit(inputNumber.value.trim()); }
  });
  btnNumber.addEventListener('click', () => { if (inputNumber.value.trim()) submit(inputNumber.value.trim()); });

  [floorsAboveEl, floorsBasementEl].forEach(el => el.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); btnFloors.click(); }
  }));
  btnFloors.addEventListener('click', () => {
    submit((floorsAboveEl.value || '8') + ' above / ' + (floorsBasementEl.value || '2') + ' basement');
  });

  btnActivities.addEventListener('click', () => submit('activities'));

  // ══════════════════════════════════════════════════════════════════
  // PROGRAM BRIEF (step 2) — one line of plain language, read by a model into
  // the answers the chips and the next three steps collect one at a time.
  //   It fills the wizard, it does not skip it: every value the model reads is
  //   shown, and the remaining steps open prefilled so anything can be changed.
  //   Values the brief does not state are left alone.
  //
  //   Two ways to reach the model, in this order:
  //   1. `node nexa-llm.js`, then open this page over localhost. The page posts to
  //      /llm and the server adds the key from the environment. Nothing to type,
  //      and the key never enters the browser. This is the preferred path.
  //   2. No proxy: the page calls Anthropic directly with a key kept in this
  //      browser's localStorage, under the same name the massing view uses, so
  //      setting it once covers both pages. That key is sent with each sentence.
  //   Neither available means the brief row does nothing and the chips stay the
  //   offline path. `?llm=0` parks the whole layer.
  // ══════════════════════════════════════════════════════════════════
  const LLM_MODEL = 'claude-opus-5';
  const LLM_URL = 'https://api.anthropic.com/v1/messages';
  const LLM_OFF = new URLSearchParams(location.search).get('llm') === '0';
  let LLM_KEY = '';
  try { LLM_KEY = localStorage.getItem('nexaApiKey') || ''; } catch (e) { LLM_KEY = ''; }
  const llmSet = v => {
    LLM_KEY = v;
    try { v ? localStorage.setItem('nexaApiKey', v) : localStorage.removeItem('nexaApiKey'); } catch (e) { }
  };

  // Set once at load: is nexa-llm.js answering? A plain static server 404s /llm, and a
  // file:// page has nowhere to ask, so both fall through to the localStorage key.
  let LLM_PROXY = false;
  (async function probeProxy() {
    if (LLM_OFF || !/^https?:$/.test(location.protocol)) return;
    try {
      const r = await fetch('/llm', { method: 'GET' });
      if (!r.ok) return;
      const d = await r.json();
      LLM_PROXY = !!(d && d.ok);
      if (LLM_PROXY && briefState && briefState.phase === 'key') { briefState = null; renderBrief(); }
    } catch (e) { /* no proxy; the key path stands */ }
  })();

  const ACTIVITY_KEYS = ACTIVITY_GROUPS.reduce((all, g) => all.concat(g[1]), []);

  // Panel state: { raw, phase: 'busy'|'done'|'error'|'key', out, msg }
  let briefState = null;

  const BRIEF_SCHEMA = {
    type: 'object',
    properties: {
      buildingType: { type: 'string', enum: ['mixed-use', 'office', 'housing'] },
      gfa: { type: 'number', description: 'Total gross floor area in m2. 0 if the brief does not give one.' },
      floorsAbove: { type: 'number', description: 'Storeys above grade. 0 if the brief does not give one.' },
      basementLevels: { type: 'number', description: 'Basement levels. -1 if the brief does not say.' },
      activities: {
        type: 'array',
        items: { type: 'string', enum: ACTIVITY_KEYS },
        description: 'Plug-in activities the brief names or clearly implies. Empty if it names none.'
      },
      note: { type: 'string', description: 'One or two short sentences for the user, in the language they wrote in.' }
    },
    required: ['buildingType', 'gfa', 'floorsAbove', 'basementLevels', 'activities', 'note'],
    additionalProperties: false
  };

  const briefSystem = () => [
    'You read a one-line building brief and fill in a program wizard. You do nothing else.',
    '',
    'The wizard asks for: building type, total GFA in m2, floors above and below grade,',
    'and which plug-in activities go into the building.',
    '',
    'Fill in only what the brief states or clearly implies. Never invent a number it does not give:',
    'leave gfa and floorsAbove at 0, and basementLevels at -1, when they are not stated.',
    'buildingType is one of mixed-use, office, housing. A brief that carries more than one use is mixed-use.',
    'activities come from this list only, and only the ones the brief points at: ' + ACTIVITY_KEYS.join(', ') + '.',
    'Convert other units to m2 (1 sq ft = 0.0929 m2). "8 floors" means floorsAbove 8.',
    '',
    'In the note, say what you read and what is still missing. Write it plainly and briefly,',
    'in the language the user wrote in. No em dashes.'
  ].join('\n');

  async function briefRead(raw) {
    const body = JSON.stringify({
      model: LLM_MODEL,
      max_tokens: 8192,   // thinking shares this budget, so leave room above the small answer
      output_config: { effort: 'low', format: { type: 'json_schema', schema: BRIEF_SCHEMA } },
      system: briefSystem(),
      messages: [{ role: 'user', content: raw }]
    });
    // Same request either way; only who holds the key differs.
    const res = LLM_PROXY
      ? await fetch('/llm', { method: 'POST', headers: { 'content-type': 'application/json' }, body })
      : await fetch(LLM_URL, {
        method: 'POST',
        headers: {
          'content-type': 'application/json',
          'x-api-key': LLM_KEY,
          'anthropic-version': '2023-06-01',
          'anthropic-dangerous-direct-browser-access': 'true'   // opts a browser origin into the API
        },
        body
      });
    if (!res.ok) {
      let msg = res.status + ' ' + res.statusText;
      try { const e = await res.json(); if (e && e.error && e.error.message) msg = e.error.message; } catch (err) { }
      throw new Error(msg);
    }
    const data = await res.json();
    if (data.stop_reason === 'refusal') throw new Error('The model declined that one.');
    if (data.stop_reason === 'max_tokens') throw new Error('The answer was cut off.');
    const block = (data.content || []).find(b => b.type === 'text');
    if (!block) throw new Error('Nothing came back.');
    return JSON.parse(block.text);
  }

  function briefRows(out) {
    const rows = [];
    const label = { 'mixed-use': 'Mixed-Use', 'office': 'Office', 'housing': 'Housing' }[out.buildingType] || 'Mixed-Use';
    rows.push(['Type', label]);
    rows.push(['GFA', out.gfa > 0 ? Math.round(out.gfa).toLocaleString() + ' m²' : '<em>not stated</em>']);
    rows.push(['Floors', out.floorsAbove > 0
      ? Math.round(out.floorsAbove) + ' above' + (out.basementLevels >= 0 ? ' · ' + Math.round(out.basementLevels) + ' basement' : '')
      : (out.basementLevels >= 0 ? Math.round(out.basementLevels) + ' basement' : '<em>not stated</em>')]);
    const acts = (out.activities || []).filter(a => ACTIVITY_KEYS.includes(a));
    rows.push(['Activities', acts.length ? escapeHtml(acts.join(', ')) : '<em>none named</em>']);
    return rows.map(r => `<div class="bp-row"><span class="bp-k">${r[0]}</span><span class="bp-v">${r[1]}</span></div>`).join('');
  }

  function renderBrief() {
    if (!briefState) { briefPanel.style.display = 'none'; return; }
    const st = briefState;
    briefPanel.style.display = 'block';
    briefPanel.classList.toggle('busy', st.phase === 'busy');

    if (st.phase === 'key') {
      briefPanel.innerHTML =
        '<div class="bp-note">Reading a brief needs an Anthropic API key.</div>' +
        '<div class="bp-key"><input id="bp-key-input" type="password" autocomplete="off" placeholder="sk-ant-…" spellcheck="false">' +
        '<button class="bp-go" id="bp-key-save">Save</button></div>' +
        '<div class="bp-fine">The key is stored in this browser and sent to Anthropic with each sentence. ' +
        'To keep it out of the browser instead, run <b>node nexa-llm.js</b> and open this page at localhost:8099. ' +
        'The chips above work without either.</div>';
      const keyInput = document.getElementById('bp-key-input');
      const save = () => {
        const v = keyInput.value.trim();
        if (!v) return;
        llmSet(v);
        briefState = null;
        renderBrief();
        if (inputBrief.value.trim()) askBrief(inputBrief.value.trim());
      };
      document.getElementById('bp-key-save').onclick = save;
      keyInput.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); save(); } };
      setTimeout(() => keyInput.focus(), 60);
      return;
    }

    let html = '<div class="bp-you">' + escapeHtml(st.raw) + '</div>';
    if (st.phase === 'busy') {
      html += '<div class="bp-note">Reading that…</div>';
    } else if (st.phase === 'error') {
      html += '<div class="bp-note bp-err">' + escapeHtml(st.msg) + '</div>' +
        (LLM_PROXY ? '' : '<div class="bp-act"><button class="bp-link" id="bp-key-edit">change key</button></div>');
    } else {
      html += '<div class="bp-note">' + escapeHtml(st.out.note || '') + '</div>' + briefRows(st.out) +
        '<div class="bp-act"><button class="bp-go" id="bp-apply">Use this →</button>' +
        '<button class="bp-link" id="bp-drop">discard</button></div>' +
        '<div class="bp-fine">The steps after this one open prefilled, so every value is still yours to change.</div>';
    }
    briefPanel.innerHTML = html;

    const apply = document.getElementById('bp-apply');
    if (apply) apply.onclick = () => applyBrief(st.out);
    const drop = document.getElementById('bp-drop');
    if (drop) drop.onclick = () => { briefState = null; renderBrief(); inputBrief.focus(); };
    const edit = document.getElementById('bp-key-edit');
    if (edit) edit.onclick = () => { briefState = { phase: 'key' }; renderBrief(); };
  }

  async function askBrief(raw) {
    if (!LLM_PROXY && !LLM_KEY) { briefState = { phase: 'key' }; renderBrief(); return; }
    briefState = { raw, phase: 'busy' };
    renderBrief();
    analyzing('reading the brief');
    try {
      const out = await briefRead(raw);
      briefState = { raw, phase: 'done', out };
    } catch (e) {
      briefState = { raw, phase: 'error', msg: 'Could not reach the model. ' + e.message };
    }
    analyzingDone();
    renderBrief();
  }

  // Writes the answers, then hands the step to submit() so the brief takes exactly the
  // path a clicked chip takes. Untouched fields keep the wizard's own defaults.
  function applyBrief(out) {
    const type = ['mixed-use', 'office', 'housing'].includes(out.buildingType) ? out.buildingType : 'mixed-use';
    if (out.gfa > 0) { wiz.gfa = Math.round(out.gfa); gfaPrefill = Math.round(out.gfa); }
    if (out.floorsAbove > 0) wiz.floorsAbove = Math.max(1, Math.round(out.floorsAbove));
    if (out.basementLevels >= 0) wiz.basementLevels = Math.round(out.basementLevels);
    selectedActivities.clear();
    for (const a of out.activities || []) if (ACTIVITY_KEYS.includes(a)) selectedActivities.add(a);
    inputBrief.value = '';
    briefState = null;
    submit({ 'mixed-use': 'Mixed-Use', 'office': 'Office', 'housing': 'Housing' }[type]);
  }

  inputBrief.addEventListener('input', () => { btnBrief.disabled = !inputBrief.value.trim(); });
  inputBrief.addEventListener('keydown', e => {
    if (e.key === 'Enter' && inputBrief.value.trim()) { e.preventDefault(); askBrief(inputBrief.value.trim()); }
  });
  btnBrief.addEventListener('click', () => { if (inputBrief.value.trim()) askBrief(inputBrief.value.trim()); });

  // ══════════════════════════════════════════════════════════════════
  // SITE LOOKUP (step 1) — address → point → LA parcel → LA zoning.
  // Same endpoints and the same parcel-scoring rule as NEXA/intel/site-scout.html;
  // this is the short version that answers "where is it", the scout page is the
  // full dossier. Every leg degrades on its own: a failed parcel or zoning call
  // still leaves a usable geocode, and the whole step is skippable.
  // ══════════════════════════════════════════════════════════════════
  const SITE_EP = {
    census: 'https://geocoding.geo.census.gov/geocoder/locations/onelineaddress',
    nominatim: 'https://nominatim.openstreetmap.org/search',
    parcels: 'https://public.gis.lacounty.gov/public/rest/services/LACounty_Cache/LACounty_Parcel/MapServer/0',
    zoning: 'https://services5.arcgis.com/7nsPwEMP38bSkCjy/arcgis/rest/services/Zoning/FeatureServer/15',
  };
  const SQFT_PER_M2 = 10.763910416709722;

  // Every remote call gets a hard deadline. Without one a hung endpoint leaves siteBusy
  // stuck true, which disables the arrow AND makes Enter a no-op, so the whole step dies.
  function fetchT(url, opts, ms) {
    const ctl = new AbortController();
    const t = setTimeout(() => ctl.abort(), ms || 12000);
    return fetch(url, Object.assign({}, opts, { signal: ctl.signal })).finally(() => clearTimeout(t));
  }

  // Both geocoders are asked at the same time and the Census answer is still preferred: it
  // matches a US street address to a rooftop, where Nominatim often lands on the street. The
  // fallback used to start only after the first one had failed, which put the whole of a slow
  // or blocked Census call in front of it for nothing.
  async function geocodeAddress(addr) {
    const censusP = fetchT(`${SITE_EP.census}?address=${encodeURIComponent(addr)}&benchmark=Public_AR_Current&format=json`)
      .then(r => r.json()).catch(() => null);
    const osmP = fetchT(`${SITE_EP.nominatim}?q=${encodeURIComponent(addr)}&format=json&limit=1`)
      .then(r => r.json()).catch(() => null);
    const j = await censusP;
    const m = j && j.result && j.result.addressMatches && j.result.addressMatches[0];
    if (m) return { lat: m.coordinates.y, lng: m.coordinates.x, label: m.matchedAddress, source: 'US Census Geocoder' };
    const j2 = await osmP;
    if (j2 && j2[0]) return { lat: +j2[0].lat, lng: +j2[0].lon, label: j2[0].display_name, source: 'Nominatim / OSM' };
    throw new Error('address not found by either geocoder');
  }

  const agsPointQuery = (base, pt, extra, ms) =>
    fetchT(`${base}/query?f=json&geometry=${pt.lng},${pt.lat}&geometryType=esriGeometryPoint&inSR=4326` +
      `&spatialRel=esriSpatialRelIntersects&outFields=*&outSR=4326${extra || ''}`, null, ms).then(r => r.json());

  // ring area via the shoelace formula, in a local metres frame — good enough for a lot
  function ringAreaM2(rings, lat) {
    if (!rings || !rings.length) return null;
    const mPerDegLat = 111320, mPerDegLng = 111320 * Math.cos(lat * Math.PI / 180);
    let total = 0;
    for (const rg of rings) {
      let a = 0;
      for (let i = 0, n = rg.length; i < n; i++) {
        const [x1, y1] = rg[i], [x2, y2] = rg[(i + 1) % n];
        a += (x1 * mPerDegLng) * (y2 * mPerDegLat) - (x2 * mPerDegLng) * (y1 * mPerDegLat);
      }
      total += a / 2;
    }
    return Math.abs(total) || null;
  }

  async function findParcel(pt, query) {
    const j = await agsPointQuery(SITE_EP.parcels, pt, '&distance=45&units=esriSRUnit_Meter&returnGeometry=true');
    if (j.error) throw new Error(j.error.message || 'parcel layer error');
    const feats = (j.features || []).slice(0, 8);
    if (!feats.length) return null;
    // the geocoded point sits on the street centerline, so the nearest parcel is often
    // across the road — house number beats street name beats proximity, as in site-scout
    const houseNo = (query.match(/^\s*(\d+)/) || [])[1];
    const streetTok = (query.replace(/^\s*\d+\s*/, '').split(',')[0] || '')
      .toUpperCase().replace(/[^A-Z ]/g, ' ').split(/\s+/)
      .filter(w => w.length > 2 && !/^(THE|AND)$/.test(w))
      .sort((a, b) => b.length - a.length)[0];
    const score = a =>
      (houseNo && String(a.SitusHouseNo).trim() === houseNo ? 0 : 2) +
      (streetTok && String(a.SitusFullAddress || '').toUpperCase().includes(streetTok) ? 0 : 1);
    feats.sort((a, b) => score(a.attributes) - score(b.attributes));
    const f = feats[0], a = f.attributes;
    const geomArea = f.geometry && ringAreaM2(f.geometry.rings, pt.lat);
    return {
      apn: a.APN || null,
      situs: a.SitusFullAddress || null,
      useDesc: a.UseDescription || a.UseType || null,
      lotAreaM2: geomArea ? Math.round(geomArea) : (a.SQFTmain1 ? Math.round(a.SQFTmain1 / SQFT_PER_M2) : null),
      lotAreaSource: geomArea ? 'parcel polygon' : (a.SQFTmain1 ? 'assessor SQFTmain' : null),
      centroid: f.geometry && f.geometry.rings ? ringCentroid(f.geometry.rings[0]) : null,
      // outer ring only, 6dp — enough to draw the lot to scale in the massing view
      ring: f.geometry && f.geometry.rings ? f.geometry.rings[0].map(p => [+p[0].toFixed(6), +p[1].toFixed(6)]) : null,
    };
  }

  // ── surrounding buildings from OSM, for the 3D context ring around the parcel ──
  // Primary source for the context ring: LARIAC 2020 countywide building outlines, on the
  // same LA County ArcGIS server the parcel query already uses. Every outline carries a
  // lidar-measured HEIGHT (in feet), so heights are real rather than guessed from tags —
  // OSM tags them on a minority of buildings. Probed 260727: 7 buildings inside 100 m of
  // the College St site against OSM's 5, heights agreeing to within ~0.4 m where both had one.
  const LARIAC = 'https://public.gis.lacounty.gov/public/rest/services/LACounty_Dynamic/LARIAC_Buildings_2020/MapServer/0';
  const FT_PER_M = 3.280839895;

  async function findNeighboursGIS(pt) {
    // 260818: 110 m → 550 m. Five times the reach means about twenty-five times the outlines,
    // so the deadline goes up with it: the old 6 s was set against a single block and a 550 m
    // query downtown returns hundreds of polygons.
    const j = await agsPointQuery(LARIAC, pt, '&distance=550&units=esriSRUnit_Meter&returnGeometry=true', 14000);
    if (j.error) throw new Error(j.error.message || 'LARIAC layer error');
    return (j.features || [])
      .filter(f => f.geometry && f.geometry.rings && f.geometry.rings[0] && f.geometry.rings[0].length > 2)
      .map(f => {
        const hFt = f.attributes && f.attributes.HEIGHT;
        return {
          ring: f.geometry.rings[0].map(p => [+p[0].toFixed(6), +p[1].toFixed(6)]),
          h: hFt ? +(hFt / FT_PER_M).toFixed(1) : null,
          tagged: !!hFt,
          src: 'LARIAC 2020',
        };
      });
  }

  // GET, not POST: the main Overpass instance answers GET reliably but returns 504 on POST
  // often enough to matter (probed 260727). Mirrors are tried in order.
  const OVERPASS = [
    'https://overpass-api.de/api/interpreter',
    'https://overpass.kumi.systems/api/interpreter',
  ];
  // Overpass is the slow leg of every OSM call on this page: the public mirrors queue, and a
  // query that is never going to be answered still burns the whole deadline. The mirrors used
  // to be tried one after the other, so a bad minute cost 9 s on the first and 9 s again on
  // the second before the caller gave up with nothing. They are raced now: the first usable
  // answer wins and a total failure costs one deadline, not one per mirror.
  async function overpass(q, ms) {
    const tries = OVERPASS.map(base =>
      fetchT(base + '?data=' + encodeURIComponent(q), null, ms || 8000)
        .then(r => { if (!r.ok) throw new Error('overpass ' + r.status); return r.json(); }));
    try { return await Promise.any(tries); } catch (e) { return null; }
  }
  async function findNeighboursOSM(pt) {
    const q = `[out:json][timeout:25];(way(around:500,${pt.lat},${pt.lng})["building"];);out geom;`;
    const j = await overpass(q, 12000);
    if (!j) return null;                     // null = the call failed, [] = genuinely none
    return (j.elements || [])
      .filter(e => e.geometry && e.geometry.length > 2)
      // the cap rises with the radius (90 → 600). Left at 90 it would quietly hand back one
      // block's worth of a five-block query, and the drawing would look arbitrarily cropped.
      .slice(0, 600)
      .map(e => {
        const t = e.tags || {};
        const lv = parseFloat(t['building:levels']);
        const h = parseFloat(t.height);
        return {
          ring: e.geometry.map(g => [+g.lon.toFixed(6), +g.lat.toFixed(6)]),
          // height in metres: tagged height wins, else levels × 3.5, else null (the viewer
          // substitutes a default and says so)
          h: !isNaN(h) ? h : (!isNaN(lv) ? lv * 3.5 : null),
          tagged: !isNaN(h) || !isNaN(lv),
          src: 'OSM',
        };
      });
  }

  // ── linework for the drawing mode: neighbouring lot boundaries + road centrelines ──
  // Lot lines come from the same county parcel layer as the site parcel, so they are
  // CORS-safe everywhere the parcel lookup already works. Roads come from LA City's
  // street centreline layer, which needs an http origin; OSM covers the fallback.
  const CITY_STREETS = 'https://maps.lacity.org/lahub/rest/services/Street_Information/MapServer/36';
  const CITY_PARCELS = 'https://maps.lacity.org/lahub/rest/services/Landbase_Information/MapServer/4';
  const r6 = p => [+p[0].toFixed(6), +p[1].toFixed(6)];

  const ringsOf = j => (j.features || [])
    .filter(f => f.geometry && f.geometry.rings && f.geometry.rings[0] && f.geometry.rings[0].length > 2)
    .map(f => f.geometry.rings[0].map(r6));

  // City parcel outlines first: at 150 m the city layer returned 69 lots against the
  // county layer's 22 for the same point (probed 260727), and "the lot lines around it"
  // is the whole point of the drawing. County is the fallback since it is CORS-safe
  // from any origin, where the city server is not.
  async function findLotLines(pt) {
    try {
      const j = await agsPointQuery(CITY_PARCELS, pt, '&distance=150&units=esriSRUnit_Meter&returnGeometry=true', 8000);
      if (!j.error) {
        const r = ringsOf(j);
        if (r.length) return r;
      }
    } catch (e) { /* fall through to the county layer */ }
    const j2 = await agsPointQuery(SITE_EP.parcels, pt, '&distance=150&units=esriSRUnit_Meter&returnGeometry=true', 8000);
    if (j2.error) throw new Error(j2.error.message || 'parcel layer error');
    return ringsOf(j2);
  }

  // ── street class ──────────────────────────────────────────────────────────────────────
  // Rank is 1 (most major) to 9 (alley/path); it is what the massing page ranks frontages by,
  // so primary/secondary/service entries follow the city's own hierarchy rather than a guess.
  // LA City's centreline layer carries the real designation (Mobility Plan 2035 names, with
  // the pre-2035 "Major Highway Class II" style in OLD_STREET_DESIGNATION). OSM's `highway`
  // tag is the fallback outside LA and is coarser.
  const LA_DESIG_RANK = [
    [/boulevard\s*i\b|major highway.*class\s*i\b/i, 1, 'Boulevard I'],
    [/boulevard\s*ii/i,                             2, 'Boulevard II'],
    [/avenue\s*i\b/i,                               3, 'Avenue I'],
    [/avenue\s*ii\b/i,                              4, 'Avenue II'],
    [/avenue\s*iii/i,                               5, 'Avenue III'],
    [/secondary highway/i,                          4, 'Secondary Highway'],
    [/collector/i,                                  6, 'Collector'],
    [/local/i,                                      7, 'Local Street'],
    [/alley/i,                                      8, 'Alley'],
  ];
  const OSM_HW_RANK = {
    motorway: 1, trunk: 1, motorway_link: 2, trunk_link: 2, primary: 2, primary_link: 3,
    secondary: 3, secondary_link: 4, tertiary: 4, tertiary_link: 5, unclassified: 6,
    residential: 6, living_street: 7, service: 8, pedestrian: 5, footway: 9, path: 9, cycleway: 9,
  };
  const rankLA = a => {
    const s = [a.Street_Designation, a.Street_Designation_WO_Mod, a.OLD_STREET_DESIGNATION].filter(Boolean).join(' | ');
    for (const [re, rank, label] of LA_DESIG_RANK) if (re.test(s)) return { rank, label };
    return { rank: 7, label: a.Street_Designation || 'unclassified' };   // unnamed class reads as local, not as a highway
  };
  const nameLA = a => [a.TDIR, a.STNAME, a.STSFX].filter(v => v && String(v).trim()).join(' ').trim() || null;

  async function findRoadsGIS(pt) {
    const j = await agsPointQuery(CITY_STREETS, pt, '&distance=150&units=esriSRUnit_Meter&returnGeometry=true', 8000);
    if (j.error) throw new Error(j.error.message || 'street layer error');
    return (j.features || [])
      .filter(f => f.geometry && f.geometry.paths)
      .flatMap(f => {
        const a = f.attributes || {}, { rank, label } = rankLA(a);
        return f.geometry.paths.filter(p => p.length > 1)
          .map(p => ({ path: p.map(r6), name: nameLA(a), cls: label, rank, src: 'LACity' }));
      });
  }

  async function findRoadsOSM(pt) {
    // `out geom` carries the tags too, so class costs nothing extra here
    const q = `[out:json][timeout:25];(way(around:150,${pt.lat},${pt.lng})["highway"];);out geom;`;
    const j = await overpass(q, 8000);
    if (!j) return null;
    return (j.elements || [])
          .filter(e => e.geometry && e.geometry.length > 1)
          .map(e => {
            const t = e.tags || {}, hw = t.highway || '';
            return {
              path: e.geometry.map(g => [+g.lon.toFixed(6), +g.lat.toFixed(6)]),
              name: t.name || null,
              cls: hw === 'service' && t.service === 'alley' ? 'alley' : (hw || 'road'),
              rank: hw === 'service' && t.service === 'alley' ? 8 : (OSM_HW_RANK[hw] ?? 7),
              src: 'OSM',
            };
          });
  }

  // ── movement generators (M6b) ────────────────────────────────────────────────────────────
  // The things that put people on one side of a parcel rather than another: rail and bus
  // stops, marked crossings, and the ground-floor uses that draw a trip. This is a PROXY for
  // where arrival comes from, not a count of anyone. No free source gives footfall for a
  // parcel, so nothing derived from this may be described as pedestrian volume.
  const GEN_RADIUS = 500;
  async function findGenerators(pt) {
    const r = GEN_RADIUS, ll = `${pt.lat},${pt.lng}`;
    const q = `[out:json][timeout:25];(` +
      `node(around:${r},${ll})[railway~"^(station|halt|tram_stop)$"];` +
      `node(around:${r},${ll})[station];` +
      `node(around:${r},${ll})[highway=bus_stop];` +
      `node(around:${r},${ll})[highway=crossing];` +
      `node(around:${r},${ll})[amenity~"^(restaurant|cafe|bar|fast_food|cinema|theatre|marketplace|college|university|school)$"];` +
      `node(around:${r},${ll})[shop];` +
      `);out tags center;`;
    const j = await overpass(q, 8000);
    if (!j) return null;                      // null = the call failed, [] = genuinely nothing
    const out = [];
    for (const e of j.elements || []) {
      const t = e.tags || {}, lat = e.lat ?? (e.center && e.center.lat), lng = e.lon ?? (e.center && e.center.lon);
      if (typeof lat !== 'number' || typeof lng !== 'number') continue;
      let kind = null;
      if (/^(station|halt|tram_stop)$/.test(t.railway || '') || t.station) kind = 'rail';
      else if (t.highway === 'bus_stop') kind = 'bus';
      else if (t.highway === 'crossing') kind = 'crossing';
      else if (t.shop) kind = 'retail';
      else if (/college|university|school/.test(t.amenity || '')) kind = 'institution';
      else if (t.amenity) kind = 'food';
      if (!kind) continue;
      // `kind` is M6's vocabulary and must not gain values: its weights and caps are
      // tuned per kind, and a new bucket would change the frontage scores. The raw tag
      // rides alongside so the program forecast can read composition more finely
      // (cinema and theatre both land in `food` above, which is too coarse for that).
      out.push({ ll: [+lng.toFixed(6), +lat.toFixed(6)], kind, name: t.name || null,
        tag: t.amenity || (t.shop ? 'shop:' + t.shop : null) || t.railway || t.highway || null });
    }
    return out;
  }

  async function findRoads(pt) {
    try {
      const g = await findRoadsGIS(pt);
      if (g && g.length) return g;
    } catch (e) { /* city layer is origin-sensitive; fall through */ }
    try { return await findRoadsOSM(pt); } catch (e) { return null; }
  }

  // GIS first, OSM only where the county layer has nothing to say (outside LA County).
  // Both legs are already deadline-bounded by fetchT, so this cannot hang the step.
  async function findNeighbours(pt) {
    try {
      const gis = await findNeighboursGIS(pt);
      if (gis && gis.length) return gis;
    } catch (e) { /* fall through to OSM */ }
    try { return await findNeighboursOSM(pt); } catch (e) { return null; }
  }

  function ringCentroid(ring) {
    if (!ring || !ring.length) return null;
    let sx = 0, sy = 0;
    for (const p of ring) { sx += p[0]; sy += p[1]; }
    return { lng: sx / ring.length, lat: sy / ring.length };
  }

  async function findZoning(pt) {
    const z = await agsPointQuery(SITE_EP.zoning, pt, '&returnGeometry=false');
    const zf = (z.features || [])[0];
    if (!zf) return null;
    return { code: zf.attributes.Zoning || null, category: zf.attributes.CATEGORY || null };
  }

  // One line per rule that fired, each carrying the figure it was read from. Shown on the
  // site step and again at review, so the program is never a number without a source.
  function briefHtml(b) {
    if (!b) return '';
    const rows = (b.reasons || []).map(r =>
      `<div class="sb-row"><span class="sb-k">${escapeHtml(r.k)}</span>` +
      `<span class="sb-v"><b>${escapeHtml(r.v)}</b><span class="sb-why">${escapeHtml(r.why)}</span></span></div>`).join('');
    return '<div class="sb-block"><div class="sb-head">program set from this site</div>' + rows +
      (b.ringPending ? '<div class="sb-note">Still reading what is around the parcel. Parking, ground retail, the plug-in band and the activity mix land here when it does. You can carry on.</div>' : '') +
      (b.note ? `<div class="sb-note">${escapeHtml(b.note)}</div>` : '') + '</div>';
  }

  function renderSitePanel(site) {
    if (!site) { sitePanel.style.display = 'none'; return; }
    const row = (k, v) => `<div class="sp-row"><span class="sp-k">${escapeHtml(k)}</span><span class="sp-v">${v}</span></div>`;
    const rows = [];
    rows.push(row('located', escapeHtml(site.label)));
    rows.push(row('coords', `${site.lat.toFixed(5)}, ${site.lng.toFixed(5)} <em>· ${escapeHtml(site.source)}</em>`));
    if (site.parcel) {
      const p = site.parcel;
      rows.push(row('parcel', (p.apn ? '<b>' + escapeHtml(p.apn) + '</b>' : '<em>no APN</em>') +
        (p.situs ? ' · ' + escapeHtml(p.situs) : '')));
      if (p.lotAreaM2) rows.push(row('lot area', `${p.lotAreaM2.toLocaleString()} m² <em>· ${escapeHtml(p.lotAreaSource)}</em>`));
      if (p.useDesc) rows.push(row('current use', escapeHtml(p.useDesc)));
    } else if (site.parcelNote) {
      rows.push(row('parcel', `<em>${escapeHtml(site.parcelNote)}</em>`));
    }
    if (site.zoning) {
      rows.push(row('zoning', (site.zoning.code ? '<b>' + escapeHtml(site.zoning.code) + '</b>' : '') +
        (site.zoning.category ? '<br><em>' + escapeHtml(site.zoning.category) + '</em>' : '')));
    } else if (site.zoningNote) {
      rows.push(row('zoning', `<em>${escapeHtml(site.zoningNote)}</em>`));
    }
    sitePanel.className = '';
    sitePanel.innerHTML = rows.join('') + briefHtml(site.brief) +
      '<div class="sp-note">Reported tier, verify in ZIMAS. These are defaults; what you type is what builds.</div>';
    sitePanel.style.display = 'block';
  }

  // ══════════════════════════════════════════════════════════════════
  // SITE FORECAST — rule-based, offline, no API.
  // Two independent halves, so one failing does not silence the other:
  //   capacity  — zoning code → FAR/height → buildable GFA from the measured lot
  //   direction — the parcel's current use → NEXA_INTEL.transitions (M3 DB), each
  //               match rendered with the DB's own likelihood tier and stated basis
  // Nothing here invents a number: where the code's standards are not encoded (the
  // DTLA 2040 bracket format), FAR becomes a labelled user assumption, not a claim.
  // ══════════════════════════════════════════════════════════════════
  const USE_ZONES = { R1: 'single-family residential', R2: 'two-family residential', RD: 'restricted-density multiple residential', R3: 'multiple dwelling · medium density', R4: 'multiple dwelling · high density', R5: 'multiple dwelling · highest density', RAS3: 'residential/accessory services', RAS4: 'residential/accessory services', C1: 'limited commercial', C2: 'commercial (broad retail/office; R4 residential uses allowed)', C4: 'commercial', C5: 'commercial (central area)', CM: 'commercial manufacturing', M1: 'limited industrial', M2: 'light industrial', M3: 'heavy industrial', P: 'automobile parking', PF: 'public facilities', OS: 'open space', A1: 'agricultural', A2: 'agricultural' };
  const HEIGHT_DISTRICTS = { '1': { far: 3, h: 'no fixed height cap (zone/overlay rules govern)' }, '1L': { far: 3, h: '75 ft / 6 stories' }, '1VL': { far: 3, h: '45 ft / 3 stories' }, '1XL': { far: 3, h: '30 ft / 2 stories' }, '2': { far: 6, h: 'no fixed height cap' }, '3': { far: 10, h: 'no fixed height cap' }, '4': { far: 13, h: 'no fixed height cap' } };

  // DTLA 2040 FORM DISTRICTS — read from the adopted New Zoning Code, Art. 2 (Form),
  // zoning.lacity.gov/browse/2, on 260729. Only the districts actually read are listed: an
  // unlisted form district still falls through to "no FAR encoded" rather than being guessed.
  // Naming convention (Sec. 2A.1.4): FAR category letter + width category letter + variation.
  // Base is what the district gives outright; bonus is the ceiling reachable through the
  // Public Benefit System, so the honest planning figure is BASE unless a bonus is pursued.
  const DTLA_FORM = {
    DM1: { base: 3.0, bonus: 8.0, width: 210, cover: 90, name: 'Moderate-Rise Medium 1' },
    DM2: { base: 3.0, bonus: 8.5, width: 160, cover: 90, name: 'Moderate-Rise Medium 2' },
    DM3: { base: 3.0, bonus: 8.5, width: 160, cover: 100, name: 'Moderate-Rise Medium 3' },
    DM4: { base: 6.0, bonus: 8.5, width: 160, cover: 100, name: 'Moderate-Rise Medium 4' },
    DM5: { base: 6.0, bonus: 13.0, width: 160, cover: 100, name: 'Moderate-Rise Medium 5' },
  };
  // Use districts, same source (Art. 5). `dwelling` is the permission level for Dwelling.
  const DTLA_USE = {
    CX2: { name: 'Commercial-Mixed 2', dwelling: 'S', note: 'Housing permitted through the Inclusionary Housing Program. Commercial generally up to 50,000 sq ft establishments on the ground story. No manufacturing pairing.' },
    IX3: { name: 'Industrial-Mixed 3', dwelling: 'S*', note: 'Housing permitted ONLY in conjunction with Light Manufacturing (General / Artistic & Artisanal / Garment & Accessory) at a minimum 1.0 FAR, plus the Inclusionary Housing Program. Campus Unified Development exempt. 50 ft separation from heavy industrial.' },
  };
  const DTLA_DENSITY = {
    FA: 'Floor Area: floor area is the only practical density cap, minimum lot area per dwelling unit is zero.',
    N: 'Not Permitted: no dwelling units allowed in this density district.',
  };

  function interpretZone(z) {
    if (!z) return null;
    if (z.trim().startsWith('[')) {
      const parts = (z.match(/\[([^\]]+)\]/g) || []).map(s => s.slice(1, -1));
      // form district is the first token of the first bracket, e.g. [DM1-SH1-5] -> DM1
      const form = DTLA_FORM[(parts[0] || '').split('-')[0]] || null;
      // use + density live in the second bracket, e.g. [IX3-FA] -> IX3 + FA
      const useSeg = (parts[1] || '').split('-');
      const use = DTLA_USE[useSeg[0]] || null;
      const density = DTLA_DENSITY[useSeg[1]] || null;
      return {
        format: 'dtla2040', parts, form, use, density,
        far: form ? form.base : null,
        farBonus: form ? form.bonus : null,
        height: form ? `no maximum height; governed by FAR, building width (${form.width} ft max) and coverage (${form.cover}% max)` : null,
        note: form
          ? `FAR read from the adopted DTLA 2040 code (Art. 2, ${form.name}). Base ${form.base} is what the district gives outright; ${form.bonus} is the ceiling through the Public Benefit System, not an entitlement.`
          : 'DTLA 2040 new-format code. This form district is not among the ones read from the code, so the figure below is your assumption, not a zoning claim.',
      };
    }
    const seg = z.replace(/[()\s]/g, '').split('-');
    const use = seg[0], hdRaw = seg[1] || '';
    const hdKey = (hdRaw.match(/^(1XL|1VL|1L|[1-4])/) || [])[1] || null;
    const hd = hdKey && HEIGHT_DISTRICTS[hdKey];
    return { format: 'legacy', useCode: use, use: USE_ZONES[use] || null,
      far: hd ? hd.far : null, height: hd ? hd.h : null, dLimit: /D/.test(hdRaw),
      note: 'FAR from the LAMC 12.21.1 height-district table. Estimated: a "D" limitation, specific plan or CPIO can override. Verify in ZIMAS.' };
  }

  // ══════════════════════════════════════════════════════════════════
  // SITE → PROGRAM DEFAULTS (260814)
  // ══════════════════════════════════════════════════════════════════
  // The address already fetched a parcel, a zoning code, a 500 m ring of mapped generators,
  // the street classes and the neighbouring heights. Until now all of it was read BESIDE the
  // program and never into it: the wizard's five answers were the only thing generateEntries
  // saw. This turns the same measured payload into the wizard's starting answers, plus three
  // numbers the generator uses.
  //
  // The discipline is the one the forecast layer already runs on:
  //   · Every value comes from ONE measured figure and names it. No score, no blend, no
  //     weighting of one source against another.
  //   · Nothing here is a limit. Each value lands in its field as a default the architect
  //     types over, and it is the typed value that builds. Zoning headroom is still reported
  //     separately, as capacity, not enforced here.
  //   · A rule whose figure is missing does not fire, and the wizard keeps its own default.
  //     Half the payload absent is normal outside LA City and must not produce a guess.
  //   · OSM composition is WHAT IS MAPPED. It is not a census and it is not demand, so it
  //     only picks which plug-in activities are offered, never how much of anything is built.
  const ZONE_TYPE = [
    [/^(R[1-5]|RD\d*|RAS\d*|RW\d*)$/, 'housing',   'a residential zone'],
    [/^(C[1-5]|C|CR)$/,               'mixed-use', 'a commercial zone, where housing is allowed above'],
    [/^(CM|M[1-3])$/,                 'office',    'a manufacturing or commercial-manufacturing zone, where dwellings are not permitted by right'],
    [/^(PF|OS|A[12]|P|PB)$/,          'office',    'a civic, parking or open-space zone'],
  ];
  // ring composition bucket → the activity chips that bucket supports. Joining what a
  // district already carries, not filling a gap: agglomeration is the readable claim from a
  // count of mapped POIs, "the area lacks X" is not.
  const BUCKET_ACTS = [
    ['culture',  ['exhibition', 'event hall']],
    ['learning', ['classroom', 'seminar']],
    ['retail',   ['showroom', 'pop-up']],
    ['food',     ['coffee']],
    ['medical',  ['recovery lounge']],
  ];
  const STOREY_M = 4.2;   // floor-to-floor used only where a height cap is given in feet
  const COVERAGE = 0.7;   // plate as a share of the lot, the same figure applyDirection uses
  // The tuned plug-in share, and the floor under every site-driven program: a site may add to
  // the band, never subtract from it. Keep in step with SHORT_TARGET_SHARE's fallback in
  // generateEntries, which is the same number for a run with no site at all.
  let TAPER_OVERRIDE = 0;   // ?taper=n forces the plug-in band ramp, for A/B
  { const q = new URLSearchParams(location.search); if (q.get('taper')) TAPER_OVERRIDE = Math.max(1, Math.min(3, parseFloat(q.get('taper')) || 0)); }
  const SHORT_BASE = 0.25;
  // Hard floor on the REALISED SHORT share, enforced at the end of generateEntries.
  // ?shortfloor=0.30 raises it, which is how the retry path is tested.
  let SHORT_FLOOR = 0.20;
  { const q = new URLSearchParams(location.search); if (q.get('shortfloor')) SHORT_FLOOR = Math.max(0, Math.min(0.6, parseFloat(q.get('shortfloor')) || 0.20)); }
  // ── DESCENDING SHORT PROFILE (260817, SHORT-CONSOLIDATION-PLAN-4) ──
  // Every band floor is sized to the same packed area as the plates above it (a straight
  // extrusion, so the skirt has no program to stand on), and the SHORT share walks a ladder:
  // PROFILE_L0 at the ground, linearly down to PROFILE_MIN at the top of the band. The band's
  // floor count comes from the area the ladder can hold; when the given floors cannot hold it,
  // the building grows a floor (up to +3) instead of growing outward. PROFILE_MIN stays above
  // the massing page's SHORT_THRESHOLD (0.5) so every band floor keeps its 8'-6" storey.
  // ?profile=0 restores the 260814 taper path (TAPER_RATIO / fillable) unchanged.
  let PROFILE_ON = true;
  const PROFILE_L0 = 0.75;
  const PROFILE_MIN = 0.55;
  { const q = new URLSearchParams(location.search); if (q.get('profile') !== null) PROFILE_ON = q.get('profile') !== '0'; }
  // Used when the ring names no activities, so the band is never empty. One ground-affinity
  // social line and one upper-floor event line, which is the shape the taper expects.
  const DEFAULT_ACTS = ['coffee', 'exhibition'];

  function siteBrief(site, zi) {
    if (!site) return null;
    const b = { reasons: [] };
    const say = (k, v, why) => b.reasons.push({ k, v, why });

    // ── building type ← the zoning code's use class ──
    if (zi && zi.format === 'legacy' && zi.useCode) {
      for (const [re, t, label] of ZONE_TYPE) {
        if (!re.test(zi.useCode)) continue;
        b.buildingType = t;
        say('type', t, `${zi.useCode} is ${label}`);
        break;
      }
    } else if (zi && zi.format === 'dtla2040' && zi.use) {
      const dw = zi.use.dwelling || '';
      b.buildingType = dw && dw !== 'N' ? 'mixed-use' : 'office';
      say('type', b.buildingType, `DTLA 2040 ${zi.use.name} carries dwelling permission "${dw || 'none'}"`);
    }

    // ── GFA ← lot area × FAR ──
    const lot = site.parcel && site.parcel.lotAreaM2;
    const far = site.far || (zi && zi.far) || null;
    b.lotM2 = lot || null;
    b.far = far;
    if (lot && far) {
      b.gfa = Math.round(lot * far / 100) * 100;
      say('GFA', b.gfa.toLocaleString() + ' m²',
        `${Math.round(lot).toLocaleString()} m² lot × FAR ${far}` +
        (site.farAssumed ? ', and that FAR is an assumption the code did not state' : ', from the height district table'));
    }

    // ── floors ← the GFA over a plate, capped by a stated storey limit ──
    if (b.gfa && lot) {
      const byPlate = Math.max(1, Math.round(b.gfa / (lot * COVERAGE)));
      const hs = zi && zi.height ? String(zi.height) : '';
      const capStorey = (hs.match(/(\d+)\s*stor/) || [])[1];
      const capFt = (hs.match(/(\d+)\s*ft/) || [])[1];
      const cap = capStorey ? +capStorey : (capFt ? Math.floor(+capFt * 0.3048 / STOREY_M) : null);
      b.floorsAbove = cap ? Math.min(byPlate, Math.max(1, cap)) : byPlate;
      say('floors', b.floorsAbove + ' above grade',
        cap && b.floorsAbove === cap
          ? `the height district stops at ${cap} storeys`
          : `${b.gfa.toLocaleString()} m² over a plate of ${Math.round(lot * COVERAGE).toLocaleString()} m², which is ${Math.round(COVERAGE * 100)}% of the lot`);
    } else if (site.neighbours && site.neighbours.length) {
      const hs = site.neighbours.map(n => n.h || 0).filter(h => h > 0).sort((a, c) => a - c);
      if (hs.length) {
        const med = hs[hs.length >> 1];
        b.floorsAbove = Math.max(1, Math.round(med / STOREY_M));
        say('floors', b.floorsAbove + ' above grade',
          `no FAR to size the building, so it matches its neighbours: median mapped height ${Math.round(med)} m at ${STOREY_M} m per floor`);
      }
    }

    // ── ring composition, counted once and read by the four rules below ──
    // undefined = the ring is still in flight, null = the query failed, [] = genuinely nothing
    // around. The first is not a finding and must not be written up as one: the rules below
    // simply do not fire yet, and this function is called again when the ring lands.
    const ringPending = site.generators === undefined;
    const gens = site.generators;
    const kind = {}, mix = {};
    if (gens) for (const g of gens) {
      kind[g.kind] = (kind[g.kind] || 0) + 1;
      const k = ctxBucket(g); if (k) mix[k] = (mix[k] || 0) + 1;
    }
    const rail = kind.rail || 0, bus = kind.bus || 0;
    const street = site.roads && site.roads.length ? [...site.roads].sort((a, c) => a.rank - c.rank)[0] : null;

    // ── parking ← mapped transit, not a demand model ──
    // AB 2097 removed the city's parking minimum within half a mile of major transit, so a
    // railhead in the ring is the one measured fact that legitimately moves the bay count.
    // It moves the BAYS and not the basement count: the generator puts service on B1 and
    // parking on B2 down, so cutting a level to one basement removes every bay at once and
    // leaves a 12,000 m² building with no parking, which is not what the rule is claiming.
    if (gens) {
      b.parkingPerLevel = rail ? 1 : bus >= 5 ? 2 : 3;
      say('parking', b.parkingPerLevel + ' bay group' + (b.parkingPerLevel === 1 ? '' : 's') + ' per parking level',
        rail ? `${rail} rail or tram stop${rail === 1 ? '' : 's'} mapped within ${GEN_RADIUS} m, where AB 2097 removes the parking minimum`
          : bus >= 5 ? `${bus} bus stops and no rail within ${GEN_RADIUS} m`
          : bus ? `${bus} bus stop${bus === 1 ? '' : 's'} and no rail within ${GEN_RADIUS} m` : `no transit stop mapped within ${GEN_RADIUS} m`);
    }

    // ── ground-floor retail ← what the ring already sells, and the street it faces ──
    // Three preset shopfront sizes, never an interpolation: a frontage is a room, and 221 m²
    // would be a number pretending to be one. A major street moves it one preset up.
    if (gens) {
      const RETAIL_STEPS = [161, 220, 320];
      const trade = (mix.retail || 0) + (mix.food || 0);
      const major = street && street.rank <= 3;
      let si = trade >= 25 ? 2 : trade >= 8 ? 1 : 0;
      if (major) si = Math.min(RETAIL_STEPS.length - 1, si + 1);
      b.groundRetail = RETAIL_STEPS[si];
      say('ground retail', b.groundRetail + ' m²',
        `${trade} shop and food premises mapped within ${GEN_RADIUS} m` +
        (major ? `, on a ${street.cls}${street.name ? ' (' + street.name + ')' : ''}` : ''));
    }

    // ── activity band share ← arrival at the door ──
    // 0.25 is the tuned baseline AND THE FLOOR. The site may add to the band, never take from
    // it: the plug-in program is the point of this platform, and a quiet ring is a reason to
    // ask what the building brings to the street, not a reason to delete it. An earlier cut
    // subtracted 0.05 for a local street with no transit and produced 20% bands, which is why
    // the rule is one-directional now.
    if (gens) {
      let s = SHORT_BASE;
      const notes = [];
      if (rail) { s += 0.04; notes.push('a railhead in the ring'); }
      if (street && street.rank <= 2) { s += 0.03; notes.push('a major street frontage'); }
      b.shortShare = Math.min(0.32, Math.max(SHORT_BASE, +s.toFixed(2)));
      say('plug-in band', Math.round(b.shortShare * 100) + '% of the GFA',
        notes.length ? notes.join(' and ') + ', on top of the ' + Math.round(SHORT_BASE * 100) + '% floor'
          : 'nothing in the ring adds to the ' + Math.round(SHORT_BASE * 100) + '% floor, which the site never lowers');
    }

    // ── which activities plug in ← what the ring is made of ──
    // The band is never left empty. A site that cannot name its activities still gets the
    // default mix, because an empty selection is not a smaller band, it is no band at all:
    // measured, a program with no activity lines comes out at 3.3% SHORT and not one 8'-6"
    // floor, which is a different building, not a quieter one. The chips arrive selected and
    // visible, so deselecting them stays the architect's decision and not a silent default.
    let use = [];
    if (gens && gens.length) {
      const classified = Object.values(mix).reduce((s, n) => s + n, 0);
      const ranked = BUCKET_ACTS
        .map(([k, acts]) => ({ k, acts, n: mix[k] || 0 }))
        .filter(x => x.n > 0)
        .sort((x, y) => y.n - x.n);
      const picked = ranked.filter(x => x.n >= 5 || (classified && x.n / classified >= 0.15)).slice(0, 3);
      use = picked.length ? picked : ranked.slice(0, 1);
    }
    if (use.length) {
      const acts = use.flatMap(x => x.acts);
      if ((mix.food || 0) >= 20) acts.push('lounge bar');
      b.activities = [...new Set(acts)];
      say('activities', b.activities.join(', '),
        use.map(x => `${x.n} ${x.k}`).join(', ') + ` mapped within ${GEN_RADIUS} m, which is what the plug-in floors join`);
    } else if (ringPending) {
      b.ringPending = true;                  // said once, by briefHtml, not four times over
    } else {
      b.activities = DEFAULT_ACTS.slice();
      say('activities', b.activities.join(', '),
        (gens ? `nothing is mapped within ${GEN_RADIUS} m` : 'the surroundings query did not return') +
        ', so this is the default mix and not a reading of the site. Change it on the activities step.');
    }

    return b.reasons.length || b.note || b.ringPending ? b : null;
  }

  // LA County Assessor use text → the transition DB's `from` vocabulary. Deliberately
  // conservative: no confident keyword means no match, and the user picks instead.
  const USE_TO_FROM = [
    [/wholesale|produce market|market/i, 'wholesale market'],
    [/warehous|distribution|storage/i, 'warehouse'],
    [/manuf|factory|refiner/i, 'factory'],
    // the assessor also returns coarse UseType values, not only the fine UseDescription
    [/industrial/i, 'factory'],
    [/office|bank/i, 'office'],
    [/department store/i, 'department store'],
    [/shopping (center|centre|mall)|mall/i, 'shopping mall'],
    [/parking struct|garage/i, 'parking structure'],
    [/hotel|motel/i, 'hotel / motel'],
    [/church|religio|temple|synagog|worship/i, 'church / religious'],
    [/theat|cinema|auditorium/i, 'theater / cinema'],
    [/depot|rail|transit station/i, 'train station'],
    [/power plant|substation|refinery/i, 'power plant'],
    [/jail|prison|correctional|institution/i, 'jail / institutional'],
  ];
  const detectFrom = txt => {
    if (!txt) return null;
    for (const [re, key] of USE_TO_FROM) if (re.test(txt)) return key;
    return null;
  };

  const TIER_RANK = { high: 0, medium: 1, low: 2 };
  let forecastState = null; // { site, far, farAssumed, fromKey }
  let gfaPrefill = null;    // set by "use this", read by loadStep's number prefill

  function renderForecast() {
    const fc = document.getElementById('site-forecast');
    const st = forecastState;
    if (!st) { fc.style.display = 'none'; return; }
    const DB = (window.NEXA_INTEL && window.NEXA_INTEL.transitions) || [];
    const lot = st.site.parcel && st.site.parcel.lotAreaM2;
    const zi = st.zoneInfo;
    const esc = escapeHtml;
    const out = ['<div class="sf-head">Development potential</div>'];

    // ── capacity ──
    const cap = [];
    if (zi && zi.format === 'legacy') {
      cap.push(`<b>${esc(zi.useCode)}</b>${zi.use ? ' · ' + esc(zi.use) : ''}`);
      if (zi.height) cap.push('<br>height limit: ' + esc(zi.height));
      if (zi.dLimit) cap.push('<br>a "D" limitation is present, so a lower site-specific FAR governs');
    } else if (zi && zi.format === 'dtla2040') {
      cap.push('<b>' + zi.parts.map(esc).join('</b> · <b>') + '</b><br>form district · use district · overlay');
    } else {
      cap.push('<em>no zoning polygon at this parcel</em>');
    }
    if (lot) {
      const gfa = Math.round(lot * st.far);
      const floors = Math.max(1, Math.round(gfa / (lot * 0.7)));
      cap.push(`<br><br>lot <b>${lot.toLocaleString()} m²</b> × FAR <b>${st.far}</b> = buildable <b>${gfa.toLocaleString()} m²</b>` +
        `<br>about <b>${floors}</b> floors at 70% lot coverage`);
    } else {
      cap.push('<br><br><em>no measured lot area, so no buildable figure</em>');
    }
    cap.push(`<div class="sf-far"><label>FAR</label><input id="sf-far-input" type="number" min="0.5" max="20" step="0.5" value="${st.far}">` +
      `<span class="sf-src">${st.farAssumed ? 'your assumption, not from the code' : 'LAMC height-district table'}</span></div>`);
    out.push('<div class="sf-cap">' + cap.join('') + '</div>');

    // ── direction ──
    const froms = [...new Set(DB.map(t => t.from))].sort();
    out.push('<div class="sf-from"><label>Current use</label><select id="sf-from-select">' +
      '<option value="">not in the transition DB</option>' +
      froms.map(f => `<option value="${esc(f)}"${f === st.fromKey ? ' selected' : ''}>${esc(f)}</option>`).join('') +
      '</select></div>');

    // the DB spells some origins as compounds ("factory / refinery", "office / bank hall"),
    // so match on the slash-separated parts rather than the whole string
    const parts = s => String(s).toLowerCase().split('/').map(x => x.trim()).filter(Boolean);
    const want = st.fromKey ? parts(st.fromKey) : [];
    const matches = (st.fromKey ? DB.filter(t => parts(t.from).some(p => want.includes(p))) : [])
      .sort((a, b) => TIER_RANK[a.likelihood] - TIER_RANK[b.likelihood]);
    if (!st.fromKey) {
      out.push('<div class="sf-note">The assessor use' + (st.site.parcel && st.site.parcel.useDesc ? ' (' + esc(st.site.parcel.useDesc) + ')' : '') +
        ' is not in the transition DB. Pick the closest current use above.</div>');
    } else if (!matches.length) {
      out.push('<div class="sf-note">No transitions recorded from this use.</div>');
    } else {
      const gfa = lot ? Math.round(lot * st.far) : null;
      const sig = signalsFor(st.site);
      const dyn = dynamicsFor(st.site);
      matches.forEach((t, i) => {
        const blockers = (t.blockers || []).length ? 'blockers: ' + t.blockers.map(esc).join(' · ') : '';
        // the signal read is one line here, not the full block: this step is about picking a
        // direction, and the cited detail waits for the program forecast
        const ss = signalSupport(t, sig);
        // the moving read gets the same one-line treatment, and only the metrics that actually
        // rank are named here: a single-observation metric on a picker card would read as
        // evidence for a direction it is not allowed to argue
        const ds = dynamicSupport(t, dyn);
        const dsRank = ds ? [...ds.for, ...ds.against] : [];
        out.push(
          '<div class="sf-card">' +
            '<div>' +
              `<span class="sf-tier ${esc(t.likelihood)}">${esc(t.likelihood)} likelihood</span>` +
              (ss && ss.standing ? `<span class="sf-sig ${esc(ss.standing)}">${esc(ss.standing)} by district signals</span>` : '') +
              (ds && ds.standing ? `<span class="sf-sig ${esc(ds.standing)}">${esc(ds.standing)} by market movement</span>` : '') +
              `<div class="sf-name">${esc(t.to)}</div>` +
              `<div class="sf-basis">${esc(t.basis)}</div>` +
              (ss && (ss.for.length || ss.against.length)
                ? `<div class="sf-sigline">${[...ss.for, ...ss.against].slice(0, 3).map(it => esc(it.label) + ' (' + esc(it.date) + ')').join(' · ')}</div>` : '') +
              (dsRank.length
                ? `<div class="sf-sigline">${dsRank.slice(0, 3).map(m => esc(m.label) + ' (' + esc(m.change || m.trend) + ')').join(' · ')}</div>` : '') +
              (blockers ? `<div class="sf-block">${blockers}</div>` : '') +
            '</div>' +
            `<button class="sf-use" data-i="${i}">use this${gfa ? ' →' : ' →'}</button>` +
          '</div>');
      });
      // One line each. All three used to spell out their provenance here AND again in the
      // program forecast at the end of the wizard, where the full citations live; this step is
      // for picking a direction, so it carries the label and the count, not the essay.
      out.push('<div class="sf-note">Tiers come from the transition DB, not from this parcel.</div>');
      if (sig) out.push('<div class="sf-note">Signals · ' + (sig.set.items || []).length + ' published items for ' +
        esc(sig.set.meta.district || sig.key) + ', ' + (sig.age == null ? 'compile date unreadable' : sig.age + ' days old') +
        '. Claims, not measurements.' + (sig.stale ? ' Past ' + SIG_STALE_DAYS + ' days: re-check.' : '') + '</div>');
      if (dyn) {
        const mets = dyn.set.metrics || [], ranks = mets.filter(dynRanks).length;
        out.push('<div class="sf-note">Movement · ' + ranks + ' of ' + mets.length + ' metrics rank a direction, ' +
          esc(dyn.set.meta.district || dyn.key) + '. District scale, never this parcel.' +
          (dyn.stale ? ' Past ' + DYN_STALE_DAYS + ' days: re-check.' : '') + '</div>');
      }
    }
    if (zi && zi.note) out.push('<div class="sf-note" style="margin-top:6px;">' + esc(zi.note) + '</div>');

    fc.innerHTML = out.join('');
    fc.style.display = 'block';

    const farEl = document.getElementById('sf-far-input');
    if (farEl) farEl.addEventListener('change', () => {
      const v = parseFloat(farEl.value);
      if (!isNaN(v) && v > 0) { st.far = v; st.farAssumed = true; renderForecast(); }
    });
    const selEl = document.getElementById('sf-from-select');
    if (selEl) selEl.addEventListener('change', () => { st.fromKey = selEl.value || null; renderForecast(); });
    fc.querySelectorAll('.sf-use').forEach(b => b.addEventListener('click', () => applyDirection(matches[+b.dataset.i])));
  }

  // "use this" prefills the later wizard steps rather than jumping to review, so the
  // architect still answers type, floors and activities themselves.
  function applyDirection(t) {
    if (!t) return;
    const st = forecastState;
    const lot = st.site.parcel && st.site.parcel.lotAreaM2;
    if (lot) {
      gfaPrefill = Math.round(lot * st.far);
      wiz.gfa = gfaPrefill;
      wiz.floorsAbove = Math.max(1, Math.round(gfaPrefill / (lot * 0.7)));
    }
    // the transition's target vocabulary → wizard activity chips, where they overlap
    const tmap = (window.NEXA_INTEL && window.NEXA_INTEL.typeMap) || {};
    const known = new Set(Object.values(ACTIVITY_GROUPS ? Object.fromEntries(ACTIVITY_GROUPS) : {}).flat());
    selectedActivities.clear();
    for (const [vocab, types] of Object.entries(tmap)) {
      if (!t.to.toLowerCase().includes(vocab.split('/')[0].trim().toLowerCase())) continue;
      for (const ty of types) if (known.has(ty)) selectedActivities.add(ty);
    }
    wiz.activities = [...selectedActivities];
    wiz.siteDirection = { from: t.from, to: t.to, likelihood: t.likelihood };
    if (wiz.site) wiz.site.direction = wiz.siteDirection;
    submit('site');
  }
