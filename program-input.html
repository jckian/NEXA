        const parsed = [];
        (sc.programFormatDraft || '').split('\n').forEach((raw, i) => {
          const v = validateLine(raw);
          if (v.skip) return;
          if (v.error) { errs.push(sc.id + ' line ' + (i + 1) + ': ' + v.error); return; }
          parsed.push({ type: v.type, area: v.area, level: v.level, category: v.category, wh: v.wh });
        });
        if (!parsed.length) { errs.push(sc.id + ': no valid program lines'); continue; }
        parsed.sort((a, b) => a.level - b.level);
        track.push({ id: sc.id, name: sc.name || '', horizon: sc.horizon || null, text: serialize(parsed) });
      }
      if (!track.length) { alert('No scenario draft could be parsed:\n' + errs.join('\n')); return; }
      track.sort((a, b) => (a.horizon || 0) - (b.horizon || 0));

      // year 0 is the earliest scenario; the rest sit at their offset from it, so the
      // slider spans the real spread of the forecast rather than an arbitrary decade
      const baseYear = track[0].horizon || new Date().getFullYear();
      for (const t of track) t.year = Math.max(0, (t.horizon || baseYear) - baseYear);

      localStorage.setItem('programForecastTrack', JSON.stringify({ baseYear, entries: track }));
      // these are the site's dated scenarios, not one program evolving — a program-forecast
      // payload left over from a wizard run must not ride along and offer a second reading
      localStorage.removeItem('programEvolution');
      localStorage.setItem('programInputText', track[0].text);
      if (wiz.site) localStorage.setItem('programInputSite', JSON.stringify(wiz.site));
      // the scenarios name their own uses, so no wizard building type applies here; a stale
      // one left in storage would make the chat claim an answer nobody gave
      localStorage.removeItem('programBuildingType');
      analyzing('building the timeline');
      location.href = 'program-massing-shortfloor.html?src=input&timeline=1';
    }

    function applyScenario(sc) {
      const parsed = [], errs = [];
      (sc.programFormatDraft || '').split('\n').forEach((raw, i) => {
        const v = validateLine(raw);
        if (v.skip) return;
        if (v.error) { errs.push('line ' + (i + 1) + ': ' + v.error); return; }
        parsed.push({ type: v.type, area: v.area, level: v.level, category: v.category, wh: v.wh });
      });
      if (errs.length || !parsed.length) { // drafts are validated before shipping — this means a broken data file
        alert('Scenario draft failed validation:\n' + (errs.join('\n') || 'no valid program lines'));
        return;
      }
      parsed.sort((a, b) => a.level - b.level);
      entries = parsed;
      wiz.buildingType = 'forecast-' + (sc.id || 'scenario');
      reviewOrigin = 'forecast'; // so review's "← back" returns here, not into the wizard
      // named in the draft, and carried in wiz so a reload still knows which scenario it is
      wiz.scenarioName = sc.name || ('scenario ' + (sc.id || ''));
      enterReview(false); // render the scenario draft — user edits, then Build hands off as usual
      saveDraft();
    }

    // exposed so the review stage's "← back" can reopen this panel (see btn-back-review)
    // the draft stays live behind it, so closing has to come back to the draft, not the wizard
    openForecast = () => { setFcReturn('review'); showView('forecast'); };

    link.addEventListener('click', () => { setFcReturn('wizard'); showView('forecast'); });
    document.getElementById('fc-close').addEventListener('click', () => showView(fcReturn));

    // URL hooks (demo links + headless verification):
    //   ?site=<key>              select the site (default: first loaded)
    //   ?forecast=1              open the overlay
    //   ?forecast=<scenario id>  apply that scenario of the selected site straight into review
    const q = new URLSearchParams(location.search);
    const wanted = q.get('site');
    renderSite(keys.includes(wanted) ? wanted : keys[0]);
    // ?site= / ?forecast= is someone asking for one of these sites by name, so the entry comes
    // up with them — otherwise closing the overlay would leave no way back into it
    if (wanted !== null || q.get('forecast') !== null) revealForecastLink();

    const fcq = q.get('forecast');
    // ?forecast=1 normally opens over the wizard, but restoreDraft ran before this and may
    // already have put a draft on screen — closing must not strand it
    if (fcq === '1' || fcq === 'open') { setFcReturn(curView === 'review' ? 'review' : 'wizard'); showView('forecast'); }
    else if (fcq) {
      const sc = scenarios.find(s => String(s.id).toLowerCase() === fcq.toLowerCase());
      if (sc) applyScenario(sc);
    }

    // restoreDraft runs before this block, so a restored scenario draft was rendered while
    // openForecast was still null. Now that it exists, the back label and the provenance
    // line can name where they go.
    updateBackLabel();
    renderOriginLine();
  })();

  // test hook (read-only accessors for the headless verification pipeline)
  // siteBrief and generateEntries are exposed so the site → program rules can be probed with a
  // synthetic payload, without a live geocoder or Overpass in the loop.
  // previewSite drives the same tail lookupSite runs once the fetches return, from a payload
  // handed in rather than fetched. The intel layer is offline-first by design and the site
  // rules are the one part of it that used to need a live geocoder to look at.
  function previewSite(site, zoneCode) {
    const zi = interpretZone(zoneCode || (site.zoning && site.zoning.code));
    site.far = site.far || (zi && zi.far) || null;
    site.farAssumed = !(zi && zi.far);
    wiz.site = site;
    wiz.siteBrief = siteBrief(site, zi);
    site.brief = wiz.siteBrief;
    applySiteBrief(wiz.siteBrief);
    renderSitePanel(site);
    siteContinue.style.display = 'inline-block';
    return wiz.siteBrief;
  }
  window.__debug = { entries: () => entries, serialize: () => serialize(entries), site: () => wiz.site, interpretZone,
    siteBrief, generateEntries, brief: () => wiz.siteBrief, previewSite, review: () => enterReview(), computeStats,
    analyzing, analyzingDone };
</script>
