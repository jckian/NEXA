    const rows = [];
    if (s.standing) rows.push('<span class="pf-stand ' + escapeHtml(s.standing) + '">' +
      escapeHtml(s.standing) + ' by what is being said and decided</span>');
    // grouped and labelled: four items for and one against read as five identical items
    // otherwise, which is exactly the reading the standing above is a summary of
    const group = (list, cls, label) => list.length
      ? '<div class="pf-sig-gh">' + label + '</div>' +
        list.map(it => '<div class="' + cls + '">' + signalLine(it) + '</div>').join('') : '';
    rows.push(group(s.for, 'pf-for', 'for'));
    rows.push(group(s.against, 'pf-agn', 'against'));
    rows.push(group(s.context, 'pf-ctxrow', 'context, takes no side'));
    return '<div class="pf-sup pf-sig">' + rows.join('') + '</div>';
  }

  // ── M10 SITE-DYNAMICS ───────────────────────────────────────────────────────────────
  // M7-lite reads what is measurably AROUND the site. M9 reads what is being SAID about it.
  // Neither of those moves. This one does: every observation carries a date, so where there
  // are two of them there is a direction of travel. Schema: NEXA/intel/INTEL-DATA.md §7.
  //
  // THE TWO-OBSERVATION RULE is enforced here, not just documented. A metric with fewer than
  // two dated observations cannot rank anything, whatever its data file claims: one dated
  // number is a fact about today, which M1 and M9 already carry. Enforcing it in code rather
  // than trusting the file means a future compile cannot quietly promote a snapshot.
  //
  // Nothing here was measured at the parcel. A district visitation panel covers a hundred
  // blocks, a submarket vacancy rate covers all of Downtown, a boarding count is one station.
  // The scale is printed beside every number for that reason.
  const DYN_STALE_DAYS = 180;

  function dynamicsFor(site) {
    const ALL = (window.NEXA_INTEL && window.NEXA_INTEL.dynamics) || {};
    if (!site || site.lat == null || site.lng == null) return null;
    let best = null;
    for (const key of Object.keys(ALL)) {
      const set = ALL[key], w = set && set.meta && set.meta.where;
      if (!w || !(set.metrics || []).length) continue;
      const dist = metresBetween(site.lat, site.lng, w.lat, w.lon);
      if (dist <= (w.radiusM || 800) && (!best || dist < best.dist)) {
        const age = daysSinceStamp(set.meta.compiled);
        best = { key, set, dist: Math.round(dist), age, stale: age != null && age > DYN_STALE_DAYS };
      }
    }
    return best;
  }

  // Does this metric rank anything? Two dated observations, a direction that takes a side, and
  // at least one program type it bears on. Everything else is printed and counted as context.
  function dynRanks(m) {
    return (m.series || []).length >= 2 &&
      (m.direction === 'for' || m.direction === 'against') &&
      !!((m.affects && m.affects.to) || []).length;
  }

  // Same slash-part matching the DB's `from` lookups and M9 use, so "food hall / creative
  // retail" answers to either half.
  function dynHits(m, t) {
    const parts = s => String(s || '').toLowerCase().split('/').map(x => x.trim()).filter(Boolean);
    const a = m.affects || {};
    const to = (a.to || []).map(x => String(x).toLowerCase());
    const from = (a.from || []).map(x => String(x).toLowerCase());
    return parts(t.to).some(p => to.includes(p)) ||
      (!!from.length && parts(t.from).some(p => from.includes(p)));
  }

  // A standing from the moving layer, in the shape contextSupport returns, so the sort and the
  // renderer treat all three reads identically.
  function dynamicSupport(t, dyn) {
    if (!dyn) return null;
    const For = [], against = [], context = [];
    for (const m of dyn.set.metrics || []) {
      if (!dynHits(m, t)) continue;
      if (!dynRanks(m)) { context.push(m); continue; }
      (m.direction === 'for' ? For : against).push(m);
    }
    if (!For.length && !against.length && !context.length) return null;
    // Same weighting M9 lives under and for the same reason: a structural movement settles a
    // split against a cyclical one. A market cycle turns; a population that has grown for
    // fourteen years is a different kind of claim.
    const hard = list => list.filter(m => m.strength === 'structural').length;
    const standing = For.length && !against.length ? 'supported'
      : against.length && !For.length ? 'unsupported'
      : !For.length && !against.length ? null
      : hard(For) > hard(against) ? 'supported'
      : hard(against) > hard(For) ? 'unsupported' : 'mixed';
    return { for: For, against, context, standing, set: dyn };
  }

  // The series, printed as dated values with a bar each. Bars are scaled against the series'
  // own range, never a shared one: two metrics in different units share nothing, and a common
  // axis across them would invent a comparison. A single-point series draws no bars at all —
  // one bar with nothing to compare it to is a decoration pretending to be a chart.
  function dynSeries(m) {
    const pts = (m.series || []).filter(p => typeof p.v === 'number');
    if (pts.length < 2) return '';
    const vs = pts.map(p => p.v), lo = Math.min(...vs, 0), hi = Math.max(...vs, 0);
    const span = (hi - lo) || 1;
    const fmt = v => Math.abs(v) >= 1000000 ? (v / 1000000).toFixed(1) + 'm'
      : Math.abs(v) >= 10000 ? Math.round(v / 1000) + 'k'
      : String(v);
    return '<div class="pf-series">' + pts.map(p => {
      const h = Math.max(3, Math.round(Math.abs(p.v - Math.min(lo, 0)) / span * 34));
      return '<div class="pf-sp"><span class="pf-sp-v">' + escapeHtml(fmt(p.v)) + '</span>' +
        '<div class="pf-sp-bar' + (p.v < 0 ? ' neg' : '') + '" style="height:' + h + 'px"></div>' +
        '<span class="pf-sp-t">' + escapeHtml(p.t) + '</span></div>';
    }).join('') + '</div>';
  }

  function dynHead(m) {
    const n = (m.series || []).length;
    return '<b>' + escapeHtml(m.label) + '</b>' +
      '<span class="pf-tr ' + escapeHtml(m.trend || 'unknown') + '">' + escapeHtml(m.trend || 'unknown') + '</span>' +
      '<span class="pf-geo">' + escapeHtml(m.geography || 'scale unstated') + '</span>' +
      '<span class="pf-dyn-tag">' + escapeHtml(m.stream) + ' · ' + escapeHtml(m.strength || 'unknown') + ' · ' +
      (n === 0 ? 'no observation' : n === 1 ? '1 observation' : n + ' observations') + '</span>' +
      (m.change ? '<div class="pf-sig-basis">' + escapeHtml(m.change) + '</div>' : '');
  }

  // One line naming what the number counts. This is not decoration: a metric called
  // "pedestrian movement" that counts rail boardings has to say so where it is read.
  function dynMeasures(m) {
    return m.measures ? '<div class="pf-dyn-cav">counts: ' + escapeHtml(m.measures) + '</div>' : '';
  }
  function dynCite(m) {
    const seen = [], rows = [];
    for (const p of m.series || []) {
      const key = (p.source || '') + '|' + (p.url || '');
      if (!p.source && !p.url) continue;
      if (seen.includes(key)) continue;
      seen.push(key);
      const t = escapeHtml(p.source || p.url);
      rows.push(p.url ? '<a href="' + escapeHtml(p.url) + '" target="_blank" rel="noopener">' + t + '</a>' : t);
    }
    return rows.length ? '<div class="pf-cite">' + rows.join('<br>') + '</div>' : '';
  }
  function dynLine(m) {
    return dynHead(m) + dynSeries(m) +
      (m.reading ? '<div class="pf-dyn-read">' + escapeHtml(m.reading) + '</div>' : '') +
      dynMeasures(m) +
      (m.caveat ? '<div class="pf-dyn-cav">' + escapeHtml(m.caveat) + '</div>' : '') +
      dynCite(m);
  }

  // The dynamic read for one transition. Context metrics are printed even though they rank
  // nothing: the single-observation ones are often the most relevant thing in the set, and
  // dropping them would hide exactly what the two-observation rule is holding back.
  function dynBlock(d) {
    const rows = [];
    if (d.standing) rows.push('<span class="pf-stand ' + escapeHtml(d.standing) + '">' +
      escapeHtml(d.standing) + ' by which way the district is moving</span>');
    const group = (list, cls, label) => list.length
      ? '<div class="pf-sig-gh">' + label + '</div>' +
        list.map(m => '<div class="' + cls + '">' + dynLine(m) + '</div>').join('') : '';
    rows.push(group(d.for, 'pf-for', 'moving toward it'));
    rows.push(group(d.against, 'pf-agn', 'moving away from it'));
    rows.push(group(d.context, 'pf-ctxrow', 'related, but ranks nothing: fewer than two dated observations'));
    return '<div class="pf-sup pf-dyn">' + rows.join('') + '</div>';
  }

  // What the ring is thin on, and which plug-in programs would answer it. Stated as
  // composition, never as demand: OSM maps categories at very different rates, and an
  // unmapped category is not an absent one.
  const DEMAND_MAP = [
    { key: 'learning', label: 'learning', acts: ['classroom', 'seminar room', 'computer lab'] },
    { key: 'culture', label: 'culture and events', acts: ['exhibition gallery', 'event hall'] },
    { key: 'food', label: 'food and drink', acts: ['coffee shop', 'lounge bar'] },
    { key: 'retail', label: 'retail', acts: ['pop-up retail', 'showroom'] },
    { key: 'medical', label: 'health', acts: ['recovery lounge', 'meditation room'] },
  ];
  function demandRead(c) {
    if (!c || !c.mix) return null;
    const rows = DEMAND_MAP.map(d => ({ ...d, n: c.mix[d.key] || 0 })).sort((a, b) => a.n - b.n);
    const present = rows.filter(r => r.n > 0);
    const thin = rows.filter(r => r.n <= Math.max(1, Math.round((present.reduce((s, r) => s + r.n, 0) / Math.max(1, present.length)) * 0.25)));
    return { rows, thin: thin.slice(0, 3) };
  }

  let pfChurn = 3;        // years between SHORT re-plugs — the one assumption, user-editable
  let pfFromKey = null;   // DB `from` chosen by hand; null = use the auto-detected one
  let pfFromAuto = true;

  function predictEvolution() {
    const DB = (window.NEXA_INTEL && window.NEXA_INTEL.transitions) || [];
    const rows = entries
      .map((e, i) => ({ i, type: e.type, level: e.level, area: e.area }))
      .filter(r => !isCore(r.type) && !isCorridor(r.type) && !isFixedUse(r.type));
    const ctx = readContext(wiz.site, entries.reduce((s, e) => s + e.area, 0));
    const demand = demandRead(ctx);
    const sig = signalsFor(wiz.site);
    const dyn = dynamicsFor(wiz.site);

    // ── the permanent half: which use the building mostly is ──
    const byFam = new Map();
    for (const r of rows) {
      if (isShort(r.type)) continue;
      const f = familyOf(r.type); if (!f) continue;
      const g = byFam.get(f.key) || { fam: f, area: 0, types: new Set(), levels: new Set() };
      g.area += r.area; g.types.add(r.type); g.levels.add(r.level);
      byFam.set(f.key, g);
    }
    const dom = [...byFam.values()].sort((a, b) => b.area - a.area)[0] || null;
    const autoFrom = dom ? (FAMILY_TO_FROM[dom.fam.key] || null) : null;
    const fromKey = pfFromAuto ? autoFrom : pfFromKey;

    // slash-separated origins ("factory / refinery") match on their parts, same as the
    // site-side forecast does
    const parts = s => String(s).toLowerCase().split('/').map(x => x.trim()).filter(Boolean);
    const want = fromKey ? parts(fromKey) : [];
    const matches = (fromKey ? DB.filter(t => parts(t.from).some(p => want.includes(p))) : [])
      .sort((a, b) => TIER_RANK[a.likelihood] - TIER_RANK[b.likelihood]);

    const futures = [], usedYear = new Set(), unmapped = [];
    for (const t of matches) {
      const tgt = targetOf(t.to), dur = transitionYears(t);
      if (!tgt || !dur || !dom) { if (!tgt) unmapped.push(t.to); continue; }
      let y = dur.yr;
      while (usedYear.has(y)) y++;   // two transitions must not land on the same year
      usedYear.add(y);
      futures.push({ t, tgt, dur, year: y, support: contextSupport(t, ctx),
        signals: signalSupport(t, sig), dynamics: dynamicSupport(t, dyn) });
    }
    // Which future LEADS is where the site earns its keep. The DB's tier still ranks first,
    // because it is the only evidence-backed ordering; within a tier, the site decides. The
    // standing never becomes a tier and never becomes a number.
    //
    // Three site reads now share that job and they are added, not nested: what is measurably
    // around the parcel (M7-lite), what is being said and decided about it (M9), and which way
    // it is moving (M10). Adding them means a future that policy argues for and the market is
    // moving toward can lead one the ring merely tolerates, which is the whole point of the
    // layers. A missing read counts as neutral, so a site with no signals and no dynamics ranks
    // exactly as it did before either module.
    const siteRank = f => CTX_RANK[(f.support && f.support.standing) || 'mixed'] +
                          CTX_RANK[(f.signals && f.signals.standing) || 'mixed'] +
                          CTX_RANK[(f.dynamics && f.dynamics.standing) || 'mixed'];
    futures.sort((a, b) =>
      TIER_RANK[a.t.likelihood] - TIER_RANK[b.t.likelihood] ||
      siteRank(a) - siteRank(b) ||
      a.year - b.year);

    // ── the plug-in half: SHORT tenancies, grouped by type ──
    const byType = new Map();
    for (const r of rows) {
      if (!isShort(r.type)) continue;
      const g = byType.get(r.type) || { type: r.type, area: 0, levels: new Set() };
      g.area += r.area; g.levels.add(r.level);
      byType.set(r.type, g);
    }
    const pool = [...byType.values()].sort((a, b) => b.area - a.area);

    // ── the sequential story: one building, one permanent change, many re-plugs ──
    // Only the highest-tier transition becomes an event: a building converts once. The
    // rest are alternatives, not a sequence, so they go to the futures track instead.
    const primary = futures[0] || null;
    const churnSpan = pool.length ? pfChurn * Math.max(3, Math.min(6, pool.length * 2)) : 0;
    const horizon = Math.max(10, Math.min(30, Math.max(primary ? primary.year + 3 : 0, churnSpan)));

    const events = [];
    if (pool.length && pfChurn > 0) {
      const taken = new Set(pool.map(g => g.type));
      const cur = new Map(pool.map(g => [g, g.type]));
      // The whole plug-in stock turns over once across the horizon. Re-plugging strictly one
      // tenancy per interval only ever reached the first few, and the pool is sorted by area, so
      // "the first few" meant the big ground-floor tenancies: a small one on a top floor was
      // never reached and that part of the massing never moved (user 260729). Covering them one
      // at a time is not an option either — 17 tenancies at 3 years each is 51 years. So the pool
      // is DEALT into SLOTS by rank: the interval stays the beat of the timeline, a third of the
      // stock re-plugs on each beat, and a given tenancy's turn comes round every third beat. Not
      // sliced into contiguous blocks: the pool is sorted by area, and blocks would still put the
      // big ground-floor tenancies first and the small upper-floor ones last. The interval is
      // unchanged and it is still the same single assumption; what changed is that it now reaches
      // every tenancy instead of a queue that runs out of horizon.
      const beats = Math.max(1, Math.floor(horizon / pfChurn)), SLOTS = Math.min(3, beats);
      for (let k = 1; k * pfChurn <= horizon; k++) {
        for (let n = (k - 1) % SLOTS; n < pool.length; n += SLOTS) {
          const g = pool[n];
          const from = cur.get(g), to = nextShortType(from, taken);
          if (to === from) continue;
          taken.add(to); cur.set(g, to);
          events.push({
            year: k * pfChurn, kind: 'short',
            levels: [...g.levels].sort((a, b) => a - b),
            fromTypes: [from], fromLabel: from,
            toType: to, toCategory: 'public',
            area: g.area,          // carried so the work each change represents can be counted
          });
        }
      }
    }
    // Ground-floor rule: a conversion may not land dwellings on level 0. The ground is the
    // street face, and the wizard's own stack starts housing at level 1 for the same reason
    // (useHousingAt). The massing view holds the matching rule for chat-written conversions.
    const dwelling = /apartment|dwelling|residential/i;
    const convLevels = [...dom.levels].sort((a, b) => a - b)
      .filter(lv => !(lv === 0 && primary && dwelling.test(primary.tgt.type)));
    // the converted area is what sits on the levels that actually convert, not the family's
    // whole area: the ground is dropped from a dwelling conversion two lines above
    const convSet = new Set(convLevels);
    const convArea = rows.reduce((s, r) =>
      s + (!isShort(r.type) && dom && dom.types.has(r.type) && convSet.has(r.level) ? r.area : 0), 0);
    if (primary && convLevels.length) events.push({
      year: primary.year, kind: 'long',
      levels: convLevels,
      area: convArea,
      fromTypes: [...dom.types], fromLabel: dom.fam.label,
      toType: primary.tgt.type, toCategory: primary.tgt.category,
      likelihood: primary.t.likelihood, basis: primary.t.basis,
      dbFrom: primary.t.from, dbTo: primary.t.to,
      dur: primary.dur,
      support: primary.support,
      signals: primary.signals,
      dynamics: primary.dynamics,
      examples: (primary.t.examples || []).slice(0, 2).map(e =>
        e.project + (e.yearFrom ? ' (' + e.yearFrom + (e.yearTo ? '–' + e.yearTo : '') + ')' : '')),
      blockers: primary.t.blockers || [],
    });
    events.sort((a, b) => a.year - b.year || (a.kind === 'long' ? 1 : -1));

    // the slider runs two years past the last event, so the settled building is reachable
    // instead of the timeline ending on the frame of its own final conversion
    const span = Math.min(35, Math.max(horizon, ...events.map(e => e.year), 0) + 2);

    return { events, horizon: span, dom, fromKey, autoFrom, futures, pool, matches, unmapped, churn: pfChurn, ctx, demand, sig, dyn };
  }

  // The same transitions as parallel whole-program alternatives. Year 0 is the program as
  // designed; each future retypes the dominant permanent use and leaves everything else,
  // so the massing view's frame logic sees one site with several outcomes.
  function futuresTrack(pred) {
    if (!pred.dom || !pred.futures.length) return null;
    const domKey = pred.dom.fam.key;
    const list = [{ year: 0, id: 'now', name: 'as designed', horizon: null, text: serialize(entries) }];
    for (const f of pred.futures) {
      const swapped = entries.map(e => {
        if (isCore(e.type) || isCorridor(e.type) || isFixedUse(e.type) || isShort(e.type)) return e;
        const fam = familyOf(e.type);
        if (!fam || fam.key !== domKey) return e;
        return { ...e, type: f.tgt.type, category: f.tgt.category, wh: null };
      });
      // the track renders as "id · name", so the name says what the id does not:
      // the tier it is filed under and the program type it actually lands as
      list.push({
        year: f.year, id: String(f.t.to).split('/')[0].trim(), horizon: null,
        name: f.t.likelihood + ' likelihood · lands as ' + f.tgt.type,
        text: serialize(swapped),
      });
    }
    return { baseYear: null, entries: list };
  }

  // Why a program produces no timeline. Travels with the handover so the massing view can
  // say it too: a slider that does nothing and explains nothing is the same bug twice.
  function emptyReason(p) {
    const head = 'Nothing changes on this timeline. ';
    const noShort = p.pool.length ? '' : 'There is no short-duration program to re-plug, and ';
    if (!p.dom) return head + noShort + 'no permanent use dominates the program.';
    if (!p.fromKey) return head + noShort + 'the permanent use reads as ' + p.dom.fam.label +
      ', which the transition DB records no transitions out of. Pick the closest recorded use in the wizard to see one.';
    return head + noShort + 'the recorded transitions from ' + p.fromKey + ' have no target this massing can draw.';
  }

  // The savings analysis moved to the massing view (260815): the walk is site, program,
  // massing, analysis, and it is the last step of it. See renderAnalysis() in
  // program-massing-shortfloor.html. What stays here is the `area` on each event, which the
  // handoff carries and the analysis counts.

  function renderProgramForecast() {
    const host = document.getElementById('prog-forecast');
    if (!host) return;
    if (!entries.length) { pfReady = false; host.style.display = 'none'; return; }
    const p = predictEvolution();
    const esc = escapeHtml;
    const DB = (window.NEXA_INTEL && window.NEXA_INTEL.transitions) || [];
    const froms = [...new Set(DB.map(t => t.from))].sort();

    const out = ['<div class="pf-head"><span class="pf-t">Program forecast</span>' +
      '<span class="pf-sub">what this program does over the next ' + p.horizon + ' years' +
      // only claim the surroundings were read when the ring actually came back; Overpass
      // fails often enough that this would otherwise be a routine lie (live run, 260729)
      (p.ctx && p.ctx.mix ? ', read against ' + esc(p.ctx.label || 'the site') + ' and its surroundings'
        : p.ctx ? ', read against ' + esc(p.ctx.label || 'the site') : '') +
      (p.sig ? ' and against what is being said about ' + esc(p.sig.set.meta.district || 'the district') : '') +
      '</span></div>'];

    const ctl = ['<div class="pf-ctl">' +
      '<div><label>Re-plug every</label><input id="pf-churn" type="number" min="1" max="12" step="1" value="' + p.churn + '">' +
      '<span class="pf-src">years · your assumption, not a measured figure</span></div>'];
    if (froms.length) {
      ctl.push('<div><label>Reads as</label><select id="pf-from">' +
        '<option value="">not in the transition DB</option>' +
        froms.map(f => '<option value="' + esc(f) + '"' + (f === p.fromKey ? ' selected' : '') + '>' + esc(f) + '</option>').join('') +
        '</select><span class="pf-src">' + (p.fromKey && pfFromAuto ? 'from the program' : p.fromKey ? 'your choice' : '—') + '</span></div>');
    }
    ctl.push('</div>');

    const body = [ctl.join('')];

    // ── the horizon at a glance ────────────────────────────────────────────────────────
    // Four figures and one axis, every one of them read straight off `p`. This states no
    // claim the cards below do not already make; it only makes the shape of the horizon
    // visible before the reader is asked to work through twenty screens of reasoning for it.
    {
      const conv = p.events.filter(e => e.kind === 'long');
      const repl = p.events.filter(e => e.kind === 'short');
      const areaOf = a => Math.round(a.reduce((s, e) => s + (+e.area || 0), 0));
      const gCell = (v, k, b, cls) => '<div class="pf-g"><div class="g-v' + (cls ? ' ' + cls : '') + '">' + v + '</div>' +
        '<div class="g-k">' + esc(k) + '</div>' + (b ? '<div class="g-b">' + esc(b) + '</div>' : '') + '</div>';
      const g = [gCell(p.horizon + ' yr', 'horizon', p.events.length + ' change' + (p.events.length === 1 ? '' : 's') + ' filed')];
      if (conv.length) g.push(gCell(areaOf(conv).toLocaleString() + ' m²', 'converted once',
        'year ' + conv[0].year + ' → ' + conv[0].toType, 'long'));
      if (repl.length) g.push(gCell(areaOf(repl).toLocaleString() + ' m²', repl.length + ' re-plug' + (repl.length === 1 ? '' : 's'),
        'plug-in floor, re-let every ' + p.churn + ' years', 'short'));
      const cap = p.ctx && p.ctx.capacity;
      if (cap && cap.allowedM2) g.push(gCell(Math.round(cap.drawnM2 / cap.allowedM2 * 100) + '%',
        'of code capacity', cap.drawnM2.toLocaleString() + ' of ' + cap.allowedM2.toLocaleString() + ' m²',
        cap.headroomM2 < 0 ? 'short' : ''));
      body.push('<div class="pf-glance">' + g.join('') + '</div>');

      // the axis. A year with two changes on it stacks them rather than hiding one under
      // the other, so the count on screen is the count in the list.
      if (p.events.length && p.horizon > 0) {
        const at = y => 'calc(6px + (100% - 12px) * ' + (Math.max(0, Math.min(1, y / p.horizon))).toFixed(4) + ')';
        const lanes = [];
        const seen = new Map();
        for (const e of [...p.events].sort((a, b) => a.year - b.year)) {
          const k = seen.get(e.year) || 0;
          seen.set(e.year, k + 1);
          (lanes[k] = lanes[k] || []).push(e);
        }
        const laneHtml = lanes.map(row => '<div class="pf-tl-lane">' + row.map(e =>
          '<span class="pf-tl-mk" style="left:' + at(e.year) + '" title="Y+' + e.year + ' · ' + esc(e.fromLabel) + ' → ' + esc(e.toType) + '">' +
          '<i class="pf-tl-dot' + (e.kind === 'short' ? ' short' : '') + '"></i></span>').join('') + '</div>').join('');
        const step = p.horizon >= 10 ? 5 : 2;
        const ticks = [];
        for (let y = 0; y <= p.horizon; y += step) ticks.push(y);
        if (ticks[ticks.length - 1] !== p.horizon) ticks.push(p.horizon);
        const altRow = p.futures.length > 1 ? '<div class="pf-tl-lane" style="margin-top:6px">' +
          [...p.futures.slice(1)].map(f => '<span class="pf-tl-mk" style="left:' + at(f.year) + '" title="Y+' + f.year + ' · ' + esc(f.t.to) + '">' +
            '<i class="pf-tl-dot alt"></i></span>').join('') + '</div>' : '';
        body.push('<div class="pf-tl"><div class="pf-tl-in" style="position:relative">' + laneHtml +
          '<div class="pf-tl-axis">' + ticks.map(y => '<span class="pf-tl-tick" style="left:' + at(y) + '"><span>Y+' + y + '</span></span>').join('') + '</div>' +
          altRow +
          '<div class="pf-tl-key"><span><i class="pf-tl-dot"></i>permanent conversion</span>' +
          '<span><i class="pf-tl-dot short"></i>plug-in re-let</span>' +
          (altRow ? '<span><i class="pf-tl-dot alt"></i>other recorded future, not on this line</span>' : '') +
          '</div></div></div>');
      }
    }

    // ── §1 what the surroundings actually are, before anything is concluded from them ──
    // The ring's composition used to sit at the very bottom of the panel, two long sections
    // after the parcel figures it belongs with. It is the same 500 m read, so it is drawn here
    // with them and the trailing section is gone.
    const c = p.ctx;
    const sec = (n, t, s) => '<div class="pf-sec"><span class="s-n">' + n + '</span><span class="s-t">' + esc(t) + '</span>' +
      (s ? '<span class="s-s">' + esc(s) + '</span>' : '') + '</div>';
    let ringHtml = '';
    if (c && p.demand && p.demand.rows && p.demand.rows.length) {
      const d = p.demand;
      const rows = d.rows.slice().sort((a, b) => b.n - a.n);
      const max = Math.max(1, ...rows.map(r => r.n));
      const thin = new Map((d.thin || []).map(r => [r.label, r]));
      ringHtml = '<div class="pf-b-head" style="margin:16px 0 7px">What the ring is made of, and what it is thin on</div>' +
        rows.map(r => {
          const t = thin.get(r.label);
          return '<div class="cbar' + (t ? ' thin' : '') + '"><span class="cb-k">' + esc(r.label) + '</span>' +
            '<span class="cb-t"><i style="width:' + (r.n / max * 100).toFixed(1) + '%"></i></span>' +
            '<span class="cb-v">' + r.n + '</span></div>' +
            (t ? '<div class="pf-cite" style="margin:1px 0 6px 142px">thinnest · served by ' + t.acts.map(esc).join(', ') + '</div>' : '');
        }).join('') +
        '<div class="pf-cite" style="margin-top:7px">What is mapped, not a census and not demand. A prompt to check, not a finding.</div>';
    }
    if (c) {
      // Every leg of the lookup fails on its own, so the block renders whatever came back and
      // says plainly which half is missing. A failed ring must read as missing, not as zero.
      const cells = [];
      if (c.mix) {
        const mixRow = DEMAND_MAP.map(d => '<span class="ctx-n"><b>' + (c.mix[d.key] || 0) + '</b> ' + esc(d.label) + '</span>').join('');
        cells.push('<div class="ctx-cell"><label>Within ' + c.radius + ' m</label><div class="ctx-mix">' + mixRow + '</div></div>',
          '<div class="ctx-cell"><label>Transit</label><div class="ctx-v">' + esc(c.transit.tier) + '</div><div class="ctx-b">' + esc(c.transit.basis) + '</div></div>');
      } else {
        cells.push('<div class="ctx-cell"><label>Within ' + c.radius + ' m</label><div class="ctx-v">not returned</div>' +
          '<div class="ctx-b">the OpenStreetMap surroundings query did not answer, so no future below is weighed by what is around it</div></div>');
      }
      if (c.zone) cells.push('<div class="ctx-cell"><label>Zoning</label><div class="ctx-v">' + esc(c.zone.code) + '</div>' +
        '<div class="ctx-b">' + esc(c.zone.cls ? c.zone.cls + (c.zone.use ? ' · ' + c.zone.use : '') : 'DTLA 2040 format, not decoded here') + '</div></div>');
      if (c.street) cells.push('<div class="ctx-cell"><label>Best frontage</label><div class="ctx-v">' + esc(c.street.cls) + '</div><div class="ctx-b">' + esc(c.street.name || 'unnamed') + ' · ' + esc(c.street.src) + '</div></div>');
      if (c.capacity) {
        // one track scaled to whichever is larger, with the allowance marked: over the line
        // and under it are the same picture, and which one it is should not need reading.
        const cap = c.capacity, over = cap.headroomM2 < 0;
        const scale = Math.max(cap.drawnM2, cap.allowedM2) || 1;
        cells.push('<div class="ctx-cell" style="grid-column:1/-1"><label>Code capacity</label>' +
          '<div class="cap-t"><i class="' + (over ? 'over' : '') + '" style="width:' + (cap.drawnM2 / scale * 100).toFixed(1) + '%"></i>' +
          '<u style="left:' + (cap.allowedM2 / scale * 100).toFixed(1) + '%"></u></div>' +
          '<div class="cap-l"><span>drawn ' + cap.drawnM2.toLocaleString() + ' m²</span>' +
          '<span>' + (over ? Math.abs(cap.headroomM2).toLocaleString() + ' m² over' : cap.headroomM2.toLocaleString() + ' m² left') + '</span>' +
          '<span>code ' + cap.allowedM2.toLocaleString() + ' m²</span></div>' +
          '<div class="ctx-b">' + cap.lotM2.toLocaleString() + ' m² lot × FAR ' + cap.far + (cap.farAssumed ? ', and that FAR is your assumption' : '') + '</div></div>');
      }
      if (c.neighbours) cells.push('<div class="ctx-cell"><label>Neighbours</label><div class="ctx-v">' + c.neighbours.n + ' buildings</div>' +
        '<div class="ctx-b">' + (c.neighbours.medianM ? 'median ' + c.neighbours.medianM + ' m, tallest ' + c.neighbours.tallestM + ' m (lidar)' : 'no measured heights') + '</div></div>');
      body.push(sec('01', 'The parcel and its ring', 'Measured. Counts and code figures.') +
        '<div class="pf-ctx"><div class="ctx-grid">' + cells.join('') + '</div>' + ringHtml + '</div>');
    } else if (!wiz.site) {
      body.push(sec('01', 'The parcel and its ring', 'No address was given.') +
        '<div class="pf-ctx"><div class="pf-nosite">No site was given, so the futures below are read from the program alone. Go back and enter an address to weigh them against the surroundings.</div></div>');
    }

    body.push(sec('02', 'What changes, and when',
      'One card per change, in order.'));

    if (!p.events.length) body.push('<div class="pf-empty">' + esc(emptyReason(p)) + '</div>');
    // Measured 260729: with no plug-in program, scrubbing the whole timeline moves 0 of 127
    // rects and changes 0% of the rendered pixels. Every event is a Tier 1 conversion, which
    // keeps the room exactly where it is, so there is nothing for the massing to show. Say it
    // here rather than let it be discovered by staring at an unchanging model.
    else if (!p.pool.length) body.push('<div class="pf-flat">No plug-in (SHORT) program, so the timeline changes what the rooms <b>are</b>, never where they are, and the massing looks identical at every year. Add activities in the wizard.</div>');

    for (const e of p.events) {
      const where = e.levels.length ? e.levels.map(levelLabel).join(', ') : 'all floors';
      const tier = e.kind === 'long'
        ? '<span class="pf-tier ' + esc(e.likelihood) + '">' + esc(e.likelihood) + ' likelihood</span>'
        : '<span class="pf-tier short">re-plug</span>';
      const rows = ['<div class="pf-what">' + tier + '<b>' + esc(e.fromLabel) + '</b> → <b>' + esc(e.toType) + '</b></div>',
        '<div class="pf-where">' + esc(where) + ' · ' + (e.kind === 'long' ? 'permanent use, same rooms' : 'plug-in modules, re-placed') + '</div>'];
      if (e.basis) rows.push('<div class="pf-basis">' + esc(e.basis) + '</div>');
      if (e.dur) rows.push('<div class="pf-cite">year ' + e.year + ' · median ' + e.dur.yr + ' yr · ' +
        (e.dur.own ? e.dur.n + ' cited case' + (e.dur.n === 1 ? '' : 's')
          : 'no case for this transition, DB-wide across ' + e.dur.n) + '</div>');
      // The backing, folded under the claim it backs. A conversion card was carrying four
      // separate reads plus its examples and blockers, and at ten of them on one page the
      // claim itself stopped being findable. The three verdicts are lifted onto the summary
      // line, so what each read CONCLUDED is on screen and only its working is a click away.
      const tail = [], verdicts = [];
      const supChips = (arr, cls, sign) => (arr && arr.length)
        ? '<div class="pf-chips">' + arr.map(v => '<span class="pf-chip ' + cls + '">' + sign + ' ' + esc(v) + '</span>').join('') + '</div>'
        : '';
      if (e.support) {
        if (e.support.standing) verdicts.push(e.support.standing + ' by what is around it');
        tail.push('<div class="pf-sup">' +
          (e.support.standing ? '<span class="pf-stand ' + esc(e.support.standing) + '">' + esc(e.support.standing) + ' by what is around it</span>' : '') +
          // for / against were two labelled word lists reading as prose. Same items, as chips:
          // the sign carries the label, so 'for:' and 'against:' are not written out per card.
          supChips(e.support.for, '', '+') + supChips(e.support.against, 'neg', '−') +
          ((e.support.notes || []).length ? '<div class="pf-cite">' + e.support.notes.map(esc).join('<br>') + '</div>' : '') + '</div>');
      }
      // The signal read stays its OWN block, never merged into the one above: one is measured
      // composition, the other is published opinion, and folding them together would let a
      // travel guide read as a count. Same for the moving read below it. Measured composition,
      // published opinion and a direction of travel are three different kinds of claim, and
      // the panel only stays honest while they are printed apart.
      if (e.signals) {
        if (e.signals.standing) verdicts.push(e.signals.standing + ' by what is said');
        tail.push(sigBlock(e.signals));
      }
      if (e.dynamics) {
        if (e.dynamics.standing) verdicts.push(e.dynamics.standing + ' by which way it is moving');
        tail.push(dynBlock(e.dynamics));
      }
      if (e.examples && e.examples.length) tail.push('<div class="pf-cite">' + e.examples.map(esc).join(' · ') + '</div>');
      if (e.blockers && e.blockers.length) tail.push('<div class="pf-cite">blockers: ' + e.blockers.map(esc).join(' · ') + '</div>');
      if (tail.length) rows.push('<details class="pf-more"><summary>' +
        esc(verdicts.length ? verdicts.join(' · ') : 'what this rests on') + '</summary>' + tail.join('') + '</details>');
      body.push('<div class="pf-ev"><div class="pf-yr">Y+' + e.year + '<span>' + (e.kind === 'long' ? 'long' : 'short') + '</span></div>' +
        '<div>' + rows.join('') + '</div></div>');
    }

    if (p.futures.length > 1) {
      body.push('<div class="pf-branch"><div class="pf-b-head">Other recorded futures for ' + esc(p.fromKey) +
        ' · scrub these as parallel alternatives in the massing view</div>' +
        [...p.futures.slice(1)].sort((a, b) => a.year - b.year).map(f =>
          '<div class="pf-b-row"><span class="pf-b-yr">Y+' + f.year + '</span>' +
          '<span><b>' + esc(f.t.to) + '</b> · ' + esc(f.t.likelihood) + ' likelihood · lands as ' + esc(f.tgt.type) +
          (f.support && f.support.standing ? ' · <span class="pf-stand ' + esc(f.support.standing) + '">' + esc(f.support.standing) + ' by what is around it</span>' : '') +
          (f.signals && f.signals.standing ? ' · <span class="pf-stand ' + esc(f.signals.standing) + '">' + esc(f.signals.standing) + ' by what is said</span>' : '') +
          (f.dynamics && f.dynamics.standing ? ' · <span class="pf-stand ' + esc(f.dynamics.standing) + '">' + esc(f.dynamics.standing) + ' by which way it is moving</span>' : '') +
          '</span></div>').join('') +
        '</div>');
    }

    // ── what is being said and decided about this district ──────────────────────────────
    // The whole compiled set, not only the items that matched a transition: the ones that
    // matched nothing are still what the architect is walking into.
    if (p.sig) {
      const S = p.sig, meta = S.set.meta;
      const byChannel = new Map();
      for (const it of S.set.items || []) {
        if (!byChannel.has(it.channel)) byChannel.set(it.channel, []);
        byChannel.get(it.channel).push(it);
      }
      const order = ['policy', 'civic', 'market', 'news', 'landmark', 'trend'];
      const chans = [...byChannel.keys()].sort((a, b) => order.indexOf(a) - order.indexOf(b));
      body.push(sec('03', 'What is being said and decided',
        'Published claims, not counts.') +
        '<div class="pf-signals">' +
        '<div class="pf-basis" style="margin:0 0 9px">' + (S.set.items || []).length + ' compiled items, ' +
        (S.age == null ? 'compile date unreadable' : 'compiled ' + S.age + ' days ago') +
        ', matched to this address at ' + S.dist + ' m from the set centre.' +
        (S.stale ? ' <b>This set is over ' + SIG_STALE_DAYS + ' days old, so treat every item as a lead to re-check.</b>' : '') +
        '</div>' +
        // which way the compiled set leans, as one bar. Published claims, not counts of
        // anything, which is why the bar is of ITEMS and says so.
        (function () {
          const it = S.set.items || [], n = it.length || 1;
          const f = it.filter(x => x.direction === 'for').length;
          const a = it.filter(x => x.direction === 'against').length;
          const o = it.length - f - a;
          const seg = (v, cls) => v ? '<i class="' + cls + '" style="width:' + (v / n * 100).toFixed(1) + '%"></i>' : '';
          return '<div class="stk">' + seg(f, 'ok') + seg(a, 'no') + seg(o, 'gap') + '</div>' +
            '<div class="stk-key"><span><b class="ok"></b>' + f + ' point at it</span>' +
            '<span><b class="no"></b>' + a + ' point away</span>' +
            '<span><b class="gap"></b>' + o + ' context only</span></div>';
        })() +
        // The set in full, folded. Every item that matched a transition is already printed
        // under that change; this is the whole compiled set including the items that matched
        // nothing, which is reference rather than reading, and open it was two screens of it.
        '<details class="pf-set"><summary>read all ' + (S.set.items || []).length + ' items · ' + esc(chans.join(' · ')) + '</summary>' +
        chans.map(ch => '<div class="pf-sig-ch"><div class="pf-sig-chname">' + esc(ch) + '</div>' +
          // claim, then why it points where it does, then the detail, then the citation —
          // the citation reads as the end of the item rather than an interruption
          byChannel.get(ch).map(it => '<div class="pf-sig-item pf-dir-' + esc(it.direction) + '">' +
            signalHead(it) +
            (it.detail ? '<div class="pf-sig-detail">' + esc(it.detail) + '</div>' : '') +
            signalCite(it) +
            '</div>').join('') + '</div>').join('') +
        '<div class="pf-cite" style="margin-top:9px">' + esc(meta.limits || '') + '</div></details>' +
        '</div>');
    } else if (wiz.site) {
      body.push(sec('03', 'What is being said and decided', 'Nothing compiled for this address.') +
        '<div class="pf-signals">' +
        '<div class="pf-basis" style="margin:0">No signal set has been compiled for this address, so nothing below was weighed against policy, press or district trend. Signals are researched by hand per site and live in <code>NEXA/intel/data/signals-*.js</code>.</div></div>');
    }

    // ── which way the district is moving ───────────────────────────────────────────────
    // The whole compiled set, grouped by stream, gaps last. A compile date is not enough for
    // this layer: a market series is only as good as its newest point, so the newest OBSERVATION
    // is printed too. A set compiled yesterday out of year-old readings is a year-old set.
    if (p.dyn) {
      const D = p.dyn, meta = D.set.meta, mets = D.set.metrics || [];
      const yearOf = t => { const m = String(t || '').match(/(\d{4})/); return m ? +m[1] : 0; };
      let newest = null;
      for (const m of mets) for (const s of m.series || [])
        if (!newest || yearOf(s.t) > yearOf(newest) || (yearOf(s.t) === yearOf(newest) && String(s.t) > String(newest))) newest = s.t;
      const ranks = mets.filter(dynRanks).length, gaps = mets.filter(m => !(m.series || []).length).length;
      const STREAMS = ['pedestrian', 'events', 'retail-turnover', 'leasing', 'demographic',
        'gentrification', 'social', 'market', 'business-mix'];
      const byStream = new Map();
      for (const m of mets) {
        if (!byStream.has(m.stream)) byStream.set(m.stream, []);
        byStream.get(m.stream).push(m);
      }
      const order = [...byStream.keys()].sort((a, b) => STREAMS.indexOf(a) - STREAMS.indexOf(b));
      body.push(sec('04', 'Which way the district is moving',
        'District scale, never this parcel.') +
        '<div class="pf-signals">' +
        '<div class="pf-basis" style="margin:0 0 9px">' + mets.length + ' compiled metrics across ' +
        byStream.size + ' streams, matched to this address at ' + D.dist + ' m from the set centre. ' +
        (newest ? 'Newest observation ' + esc(newest) + '. ' : '') +
        (D.age == null ? 'Compile date unreadable. ' : 'Compiled ' + D.age + ' days ago. ') +
        '<b>' + ranks + '</b> of them rank a future: the rest carry fewer than two dated ' +
        'observations, and ' + gaps + ' are declared gaps with no number at all.' +
        (D.stale ? ' <b>This set is over ' + DYN_STALE_DAYS + ' days old, so treat every series as a lead to re-check.</b>' : '') +
        '</div>' +
        // The two-observation rule, drawn. The sentence above states it; this makes the
        // proportion of the set that argues nothing impossible to skim past.
        (function () {
          const n = mets.length || 1, one = mets.length - ranks - gaps;
          const seg = (v, cls) => v ? '<i class="' + cls + '" style="width:' + (v / n * 100).toFixed(1) + '%"></i>' : '';
          return '<div class="stk">' + seg(ranks, 'ok') + seg(one, 'no') + seg(gaps, 'gap') + '</div>' +
            '<div class="stk-key"><span><b class="ok"></b>' + ranks + ' rank a future</span>' +
            '<span><b class="no"></b>' + one + ' under two dated observations</span>' +
            '<span><b class="gap"></b>' + gaps + ' declared gaps</span></div>';
        })() +
        '<details class="pf-set"><summary>read all ' + mets.length + ' metrics · ' + esc(order.join(' · ')) + '</summary>' +
        order.map(st => '<div class="pf-sig-ch"><div class="pf-sig-chname">' + esc(st) + '</div>' +
          byStream.get(st).map(m => '<div class="pf-dyn-item' + ((m.series || []).length ? '' : ' pf-gap') + '">' +
            dynLine(m) +
            (m.outlook ? '<div class="pf-dyn-cav">outlook, not an observation, and it never enters the trend: ' +
              esc(m.outlook.text) + (m.outlook.horizon ? ' (' + esc(m.outlook.horizon) + ')' : '') + '</div>' +
              (m.outlook.url ? '<div class="pf-cite"><a href="' + esc(m.outlook.url) + '" target="_blank" rel="noopener">' +
                esc(m.outlook.source || m.outlook.url) + '</a></div>' : '') : '') +
            '</div>').join('') + '</div>').join('') +
        '<div class="pf-cite" style="margin-top:9px">' + esc(meta.limits || '') + '</div></details>' +
        '</div>');
    } else if (wiz.site) {
      body.push(sec('04', 'Which way the district is moving', 'Nothing compiled for this address.') +
        '<div class="pf-signals">' +
        '<div class="pf-basis" style="margin:0">No dynamics set has been compiled for this address, so nothing below was weighed against footfall, leasing, demography or the market cycle. Dynamics are researched by hand per site and live in <code>NEXA/intel/data/dynamics-*.js</code>.</div></div>');
    }


    const notes = [];
    if (p.dom) notes.push('Permanent use read from the program: ' + p.dom.fam.label + ', ' + Math.round(p.dom.area).toLocaleString() + ' m² over ' + p.dom.levels.size + ' level' + (p.dom.levels.size === 1 ? '' : 's') + '.');
    if (p.pool.length) {
      const nRe = p.events.filter(e => e.kind === 'short').length;
      notes.push(p.pool.length + ' plug-in program type' + (p.pool.length === 1 ? '' : 's') + ' in the building. About a third re-plug on each interval and every one gets a turn, so the top of the building changes as often as the base: ' +
        nRe + ' re-plug' + (nRe === 1 ? '' : 's') + ' over ' + p.horizon + ' years. The interval is an assumption; the transition years are not.');
    }
    if (p.unmapped.length) notes.push('Not shown, no program type in this massing draws them: ' + [...new Set(p.unmapped)].join(' · ') + '.');
    notes.push('Likelihood tiers and their basis come from the NEXA Intel program-transition DB (M3). They describe how this building type usually changes, not what happens here.');
    if (p.ctx && p.ctx.mix) notes.push('The site reading orders futures WITHIN a tier; it never changes the tier. It answers each transition\'s own stated preconditions and blockers from a 500 m ring of mapped points, which is a radius, not a catchment.');
    if (p.dyn) notes.push('Three site reads order futures inside a tier and they are added, never merged: what is measurably around the parcel, what is being said and decided about it, and which way it is moving. A metric needs two dated observations before it may argue a direction at all.');
    if (p.ctx) p.ctx.notes.forEach(n => notes.push(n));
    // Folded, not cut. Every line here qualifies a figure above it and none of them may be
    // dropped; open they were a screen of grey type competing with the findings, closed they
    // are one click from any reader who wants to know what the panel is not claiming.
    // Printed once, for the whole panel. Every section used to carry its own version of this
    // in its subtitle, which is how a page ends up arguing with itself in four places.
    body.push('<div class="pf-foot">Counts are what is mapped; claims are published, not measured. ' +
      'Neither changes a likelihood tier: the DB sets it, the site reads only order futures inside it.</div>');
    body.push('<details class="pf-fold"><summary>What these figures are, and are not · ' +
      notes.length + ' note' + (notes.length === 1 ? '' : 's') + '</summary>' +
      '<div class="pf-note">' + notes.map(esc).join('<br>') + '</div></details>');

    host.innerHTML = out.join('') + '<div class="pf-body">' + body.join('') + '</div>';
    pfReady = true;
    host.style.display = reviewTab === 'forecast' ? 'block' : 'none';

    const churnEl = document.getElementById('pf-churn');
    if (churnEl) churnEl.addEventListener('change', () => {
      const v = parseInt(churnEl.value, 10);
      if (v > 0) { pfChurn = Math.min(12, v); renderProgramForecast(); }
    });
    const fromEl = document.getElementById('pf-from');
    if (fromEl) fromEl.addEventListener('change', () => {
      pfFromAuto = false; pfFromKey = fromEl.value || null; renderProgramForecast();
    });
  }

  // ── REVIEW STAGE TABS ────────────────────────────────────────────────────────────────
  // Two stages, not three panes. The floor cards and the raw text are the SAME program in
  // two notations, so they share one pane: read the cards, or paste a program file over
  // them. The forecast is what that program turns into later, so it is the stage after it.
  // No block moved out of #review-inner and no id changed, so renderReview /
  // renderProgramForecast / applyRaw still write to exactly what they wrote to before.
  // The Forecast tab hides itself when there is no forecast, rather than opening on nothing.
  let reviewTab = 'floors', basisReady = false, pfReady = false;
  function setReviewTab(t) {
    if (t === 'raw') t = 'floors';   // the raw text is part of the draft pane now
    if (t === 'forecast' && !pfReady) t = 'floors';
    reviewTab = t;
    // each pane's shown value is its own CSS display, not a blanket 'block': #floors is a
    // flex column, and #prog-forecast / #raw-panel are display:none in the stylesheet.
    const show = (id, v, on) => { const el = document.getElementById(id); if (el) el.style.display = on ? v : 'none'; };
    show('site-basis', '', t === 'floors' && basisReady);
    show('floors', '', t === 'floors');
    show('raw-panel', 'block', t === 'floors' && rawShown);
    show('prog-forecast', 'block', t === 'forecast' && pfReady);
    rawOpen = t === 'floors' && rawShown;
    if (rawOpen) fillRaw();
    const strip = document.getElementById('rv-tabs');
    if (strip) {
      strip.querySelectorAll('button[data-rv]').forEach(b => b.classList.toggle('active', b.dataset.rv === t));
      const fc = strip.querySelector('[data-rv="forecast"]');
      if (fc) fc.style.display = pfReady ? '' : 'none';
    }
    paintRawToggle(t);
  }

  // The icon sits on the draft pane only, and carries a dot while text is typed but not
  // applied, so folding the panel away cannot hide unapplied work.
  function paintRawToggle(t) {
    const btn = document.getElementById('rv-raw-toggle');
    if (!btn) return;
    btn.style.display = t === 'floors' ? '' : 'none';
    btn.classList.toggle('open', rawShown);
    const flag = document.getElementById('rv-raw-flag');
    if (flag) flag.textContent = (!rawShown && rawEdited) ? '•' : '';
  }

  // Open or close the raw panel. Opening refills it from the cards and scrolls to it, so the
  // click always lands on something visible.
  function setRawShown(on) {
    rawShown = !!on;
    setReviewTab(reviewTab);
    if (rawShown) {
      const panel = document.getElementById('raw-panel');
      if (panel) panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }
  }
  {
    const strip = document.getElementById('rv-tabs');
    if (strip) strip.addEventListener('click', e => {
      if (e.target.closest('#rv-raw-toggle')) { setRawShown(!rawShown); return; }
      const b = e.target.closest('button[data-rv]');
      if (b) setReviewTab(b.dataset.rv);
    });
  }

  function renderReview() {
    const st = computeStats();
    // Only a wizard-generated draft was built by these rules. A forecast scenario carries its
    // own prebuilt entries, so claiming the site set them would be false.
    const basisEl = document.getElementById('site-basis');
    const showBasis = wiz.siteBrief && reviewOrigin === 'wizard';
    basisEl.innerHTML = showBasis ? briefHtml(wiz.siteBrief) : '';
    basisReady = !!showBasis;
    renderOriginLine();
    const levels = [...new Set(entries.map(e => e.level))].sort((a, b) => b - a); // top floor first

    // printed once, not on every row. Below 900px the row stacks and each cell prints its
    // own caption instead, so the head hides there.
    // Long and short first, the core after them. The two program bands are what the reader is
    // deciding about and what the short-share column at the end is measured on; the core is the
    // fixed cost that comes with the floor, so it reads better once, at the end, than as the
    // first thing between the floor number and the program.
    let html = `<div class="floor-head">
      <div></div><div>long</div><div>short</div><div>stairs</div><div></div><div>short share</div>
    </div>`;
    for (const lv of levels) {
      const pf = st.perFloor.get(lv) || { tot: 0, shrt: 0 };
      const share = pf.tot > 0 ? pf.shrt / pf.tot : 0;
      const isSF = pf.tot > 0 && share > SHORT_THRESHOLD;

      // one column per band. Which column a row lands in is read from its TYPE by
      // pillClass, the same call the colour came from, so nothing new decides it here.
      const col = { circ: '', long: '', short: '' };
      entries.forEach((e, idx) => {
        if (e.level !== lv) return;
        col[pillClass(e)] += `<span class="pill ${pillClass(e)}" data-idx="${idx}">${escapeHtml(e.type)}<b>${e.area} m²</b></span>`;
      });

      let form = '';
      if (editingIdx !== null && entries[editingIdx] && entries[editingIdx].level === lv) form = inlineEditorHtml(entries[editingIdx]);
      else if (addingLevel === lv) form = addFormHtml(lv);

      // the add pill keeps its own cell: a program's band follows from the type you enter,
      // so parking it inside one of the three would promise a choice it does not make
      html += `<div class="floor-card" data-level="${lv}">
        <div class="floor-label">${floorName(lv)}</div>
        <div class="pills"><span class="cell-cap">long</span>${col.long}</div>
        <div class="pills"><span class="cell-cap">short</span>${col.short}</div>
        <div class="pills"><span class="cell-cap">stairs</span>${col.circ}</div>
        <div class="add-col"><span class="pill add" data-add-level="${lv}" title="add a program to this floor">+ add</span></div>
        <div class="share-col">
          <div class="share-head"><span class="share-cap">short share</span><span class="share-pct">${Math.round(share * 100)}%</span></div>
          <div class="share-bar"><div class="share-fill" style="width:${Math.min(100, share * 100)}%"></div><div class="share-tick"></div></div>
          ${isSF ? `<span class="sftag">8'-6" floor</span>` : ''}
        </div>
        ${form}
      </div>`;
    }
    floorsEl.innerHTML = html;

    // footer stats
    const packable = st.longArea + st.shortArea;
    const shortPct = packable > 0 ? st.shortArea / packable * 100 : 0;
    document.getElementById('ft-gfa').textContent = Math.round(st.total).toLocaleString() + ' m²';
    document.getElementById('ft-range').textContent = isFinite(st.minL) ? `${levelLabel(st.minL)} … ${levelLabel(st.maxL)}` : '—';
    document.getElementById('ft-split').textContent = `${(100 - shortPct).toFixed(0)}% / ${shortPct.toFixed(0)}%`;
    document.getElementById('ft-shortfloors').textContent = st.shortFloors.length
      ? `${st.shortFloors.length} (${st.shortFloors.map(levelLabel).join(', ')})` : '0';

    // wire pill + form events (full re-render each mutation keeps this simple)
    floorsEl.querySelectorAll('.pill[data-idx]').forEach(p => {
      p.onclick = () => { editingIdx = parseInt(p.dataset.idx, 10); addingLevel = null; renderReview(); };
    });
    floorsEl.querySelectorAll('.pill[data-add-level]').forEach(p => {
      p.onclick = () => { addingLevel = parseInt(p.dataset.addLevel, 10); editingIdx = null; renderReview(); document.getElementById('add-type').focus(); };
    });
    const eSave = document.getElementById('edit-save');
    if (eSave) {
      eSave.onclick = () => {
        const a = parseFloat(document.getElementById('edit-area').value);
        if (!isNaN(a) && a > 0) entries[editingIdx].area = Math.round(a);
        entries[editingIdx].category = document.getElementById('edit-cat').value;
        editingIdx = null; renderReview(); syncRaw();
      };
      document.getElementById('edit-delete').onclick = () => {
        entries.splice(editingIdx, 1);
        editingIdx = null; renderReview(); syncRaw();
      };
      document.getElementById('edit-cancel').onclick = () => { editingIdx = null; renderReview(); };
    }
    const aConfirm = document.getElementById('add-confirm');
    if (aConfirm) {
      aConfirm.onclick = () => {
        const type = document.getElementById('add-type').value.trim().toLowerCase();
        const area = parseFloat(document.getElementById('add-area').value);
        const cat = document.getElementById('add-cat').value;
        if (!type || isNaN(area) || area <= 0) return;
        entries.push({ type, area: Math.round(area), level: addingLevel, category: cat, wh: null });
        entries.sort((a, b) => a.level - b.level);
        addingLevel = null; renderReview(); syncRaw();
      };
      document.getElementById('add-cancel').onclick = () => { addingLevel = null; renderReview(); };
    }
    renderProgramForecast();   // the timeline follows the program, so it re-reads on every edit
    setReviewTab(reviewTab);   // renderProgramForecast has just settled pfReady
    saveDraft();
  }

  // The cards and the textarea are on screen together, so entries can change under text the
  // reader typed and has not applied. Typed text is never overwritten: the cards keep their
  // own truth, the note says the two have drifted, and Apply or Revert decides which wins.
  function fillRaw(force) {
    if (rawEdited && !force) { rawNote.textContent = 'edited. Apply to use it, or Revert'; return; }
    rawText.value = serialize(entries);
    rawEdited = false; rawNote.textContent = ''; rawErrors.innerHTML = '';
    btnRawRevert.style.display = 'none';
  }
  function syncRaw() { if (rawOpen) fillRaw(); }

  // ── draft persistence: Back from the massing page reloads this page from scratch,
  //    so review state must survive in localStorage or every retry re-runs the wizard ──
  const DRAFT_KEY = 'programInputDraft';
  // Stamp of the rules that BUILT the entries in a draft. A draft holds a generated program,
  // and restoreDraft renders it without regenerating, so a change to the generator is invisible
  // to anyone with a draft in their browser: they reopen the wizard, see the old program, and
  // reasonably conclude nothing was fixed. Bump this whenever generateEntries changes what it
  // emits — a draft with an older stamp keeps the answers and re-runs the generator.
  const DRAFT_RULES = '260814-site-defaults';
  function saveDraft() { try { localStorage.setItem(DRAFT_KEY, JSON.stringify({ rules: DRAFT_RULES, wiz, entries, reviewOrigin, answered })); } catch (e) {} }

  // ── commit-on-build: values typed into a still-open inline/add form must not be
  //    silently dropped when the user clicks Build without the small save button.
  //    Same rules as the edit-save / add-confirm handlers above — keep in sync. ──
  function commitInlineEdit() {
    if (editingIdx === null || !entries[editingIdx]) { editingIdx = null; return; }
    const areaEl = document.getElementById('edit-area');
    if (areaEl) {
      const a = parseFloat(areaEl.value);
      if (!isNaN(a) && a > 0) entries[editingIdx].area = Math.round(a);
      entries[editingIdx].category = document.getElementById('edit-cat').value;
    }
    editingIdx = null;
  }
  function commitAddForm() {
    if (addingLevel === null) return;
    const typeEl = document.getElementById('add-type');
    if (typeEl) {
      const type = typeEl.value.trim().toLowerCase();
      const area = parseFloat(document.getElementById('add-area').value);
      if (type && !isNaN(area) && area > 0) {
        entries.push({ type, area: Math.round(area), level: addingLevel, category: document.getElementById('add-cat').value, wh: null });
        entries.sort((a, b) => a.level - b.level);
      }
    }
    addingLevel = null; // an empty or invalid add form is discarded, never blocks Build
  }

  // ── ONE VIEW SWITCHER ────────────────────────────────────────────────
  // The page holds three full-screen views. They used to swap by raw display writes in seven
  // places, each with its own idea of what the other two should be doing, which is how the
  // overlay could close onto the wizard while a draft was still live. This owns all four
  // writes plus the review-active class; nothing else touches them. loadStep()'s row toggles
  // are inside the wizard and are not a view change.
  function showView(name) {
    curView = name;
    dialogEl.style.display = name === 'wizard' ? 'flex' : 'none';
    stepIndicatorEl.style.display = name === 'wizard' ? 'flex' : 'none';
    reviewEl.style.display = name === 'review' ? 'block' : 'none';
    const fcEl = document.getElementById('forecast');
    if (fcEl) fcEl.style.display = name === 'forecast' ? 'block' : 'none';
    document.body.classList.toggle('review-active', name === 'review');
    // the wizard names the step it is on; the other two said nothing about where you were
    const lab = document.getElementById('view-label');
    if (lab) {
      const t = name === 'review' ? 'draft program' : name === 'forecast' ? 'site forecast' : '';
      lab.textContent = t;
      lab.style.display = t ? 'block' : 'none';
    }
    updateBackLabel();
  }

  // review's back arrow goes to one of two places. It says which one.
  function updateBackLabel() {
    const el = document.getElementById('bb-dest');
    if (el) el.textContent = (reviewOrigin === 'forecast' && openForecast) ? 'scenarios' : 'wizard';
  }

  // A scenario draft used to be indistinguishable from a wizard draft: same title, no trace
  // of the scenario it came out of. Hidden entirely on a wizard-built one.
  function renderOriginLine() {
    const el = document.getElementById('rv-origin');
    if (!el) return;
    const show = reviewOrigin === 'forecast' && wiz.scenarioName;
    el.innerHTML = show
      ? 'from site forecast · <b>' + escapeHtml(wiz.scenarioName) + '</b>' +
        (openForecast ? '<a id="rv-origin-back">change scenario</a>' : '')
      : '';
    el.style.display = show ? 'block' : 'none';
    const a = document.getElementById('rv-origin-back');
    if (a) a.addEventListener('click', () => openForecast());
  }

  function enterReview(regenerate = true) {
    showView('review');
    if (regenerate) entries = generateEntries(wiz.buildingType, wiz.gfa, wiz.floorsAbove, wiz.basementLevels, wiz.activities, wiz.siteBrief);
    reviewTab = 'floors';   // a new draft opens on the cards, never on the raw text
    rawShown = false;       // and with the raw text folded back up
    renderReview();
  }

  // ── raw text panel (escape hatch) ──
  // Lives under the floor cards in the draft pane. Two ways in: type over what is there, or
  // load a .txt written elsewhere. Both end at applyRaw(), which is the only thing that
  // replaces the entries, so a bad file leaves the draft standing and prints its line numbers.
  function applyRaw() {
    const lines = rawText.value.split('\n');
    const parsed = [];
    const errs = [];
    lines.forEach((raw, i) => {
      const v = validateLine(raw);
      if (v.skip) return;
      if (v.error) { errs.push(`line ${i + 1}: ${v.error} — ${raw.trim()}`); return; }
      parsed.push({ type: v.type, area: v.area, level: v.level, category: v.category, wh: v.wh });
    });
    if (errs.length) {
      rawErrors.innerHTML = errs.map(escapeHtml).join('<br>');
      return false; // entries untouched
    }
    if (!parsed.length) { rawErrors.textContent = 'no valid program lines'; return false; }
    parsed.sort((a, b) => a.level - b.level);
    entries = parsed;
    editingIdx = null; addingLevel = null;
    rawErrors.innerHTML = '';
    rawEdited = false;                  // applied: the cards and the text agree again
    rawText.value = serialize(entries); // canonicalise
    renderReview();
    return true;
  }
  btnRawApply.addEventListener('click', applyRaw);
  btnRawRevert.addEventListener('click', () => fillRaw(true));
  rawText.addEventListener('input', () => {
    rawEdited = true;
    rawNote.textContent = 'not applied yet';
    btnRawRevert.style.display = '';
    paintRawToggle(reviewTab);
  });

  // ── load a program file ──
  // The picker only fills the textarea and runs the same Apply the button runs; nothing here
  // trusts the file. The input is reset so picking the same file twice still fires.
  {
    const upBtn = document.getElementById('btn-raw-upload');
    const upIn = document.getElementById('raw-file');
    if (upBtn && upIn) {
      upBtn.addEventListener('click', () => upIn.click());
      upIn.addEventListener('change', () => {
        const f = upIn.files && upIn.files[0];
        upIn.value = '';
        if (!f) return;
        const rd = new FileReader();
        rd.onerror = () => { rawErrors.textContent = 'could not read ' + f.name; };
        rd.onload = () => {
          setReviewTab('floors');   // the draft pane owns the textarea; land there before writing it
          setRawShown(true);        // a loaded file must be visible, applied or not
          rawText.value = String(rd.result || '').replace(/\r?\n/g, '\n');
          rawErrors.innerHTML = '';
          // marked edited first, so a file that fails validation stays on screen to be fixed
          // instead of being wiped by the next render
          rawEdited = true; rawNote.textContent = 'loaded ' + f.name; btnRawRevert.style.display = '';
          if (!applyRaw()) rawErrors.innerHTML = '<b>' + escapeHtml(f.name) + '</b> was not applied:<br>' + rawErrors.innerHTML;
          else rawNote.textContent = 'loaded ' + f.name;
        };
        rd.readAsText(f);
      });
    }
  }

  // ── build ──
  btnBuild.addEventListener('click', async () => {
    // The surroundings no longer hold the site step up, so on a very fast run they can still
    // be in flight here. This is the one place that must not sail without them: the massing
    // view draws the context ring from what it is handed.
    if (wiz.site && wiz.site.generators === undefined) { analyzing('reading the surroundings'); await ringDone; }
    // raw dirtiness must be judged BEFORE committing forms, or a just-committed
    // edit would make the (stale) textarea look dirty and applyRaw would revert it
    const rawDirty = rawText.value.trim() !== '' && rawText.value.trim() !== serialize(entries).trim();
    commitInlineEdit();
    commitAddForm();
    if (rawDirty && !applyRaw()) { setRawShown(true); renderReview(); return; } // bad raw text blocks Build, errors shown
    renderReview(); syncRaw();
    localStorage.setItem('programInputText', serialize(entries));
    // The timeline travels with the program: the sequential evolution as conversion rules,
    // and the same transitions as parallel futures on the track the massing already scrubs.
    // Both keys are rewritten (or cleared) on every Build, so a past run never leaks in.
    try {
      const pred = predictEvolution();
      // written even when empty: the massing view needs the reason, not silence
      const cx = pred.ctx;
      localStorage.setItem('programEvolution', JSON.stringify({
        horizon: pred.events.length ? pred.horizon : 0, churn: pred.churn, source: 'wizard',
        dominant: pred.dom ? pred.dom.fam.label : null, from: pred.fromKey || null,
        reason: pred.events.length ? null : emptyReason(pred),
        // no plug-in program means every event is a Tier 1 repaint: the massing cannot move
        flat: !!(pred.events.length && !pred.pool.length),
        // the site reading travels too, so the massing view can say why this future leads
        context: cx && cx.mix ? {
          label: cx.label, radius: cx.radius, mix: cx.mix, transit: cx.transit,
          street: cx.street ? cx.street.cls : null,
          capacity: cx.capacity || null,
          thin: pred.demand ? pred.demand.thin.map(r => ({ label: r.label, n: r.n, acts: r.acts })) : [],
        } : null,
        events: pred.events,
      }));
      const track = futuresTrack(pred);
      if (track) localStorage.setItem('programForecastTrack', JSON.stringify(track));
      else localStorage.removeItem('programForecastTrack');
    } catch (e) {
      localStorage.removeItem('programEvolution');
      localStorage.removeItem('programForecastTrack');
    }
    // site travels beside the program text as context for the massing view's info card.
    // Cleared when absent, so a skipped site never shows a stale address from a past run.
    if (wiz.site) localStorage.setItem('programInputSite', JSON.stringify(wiz.site));
    else localStorage.removeItem('programInputSite');
    // step 2's answer travels too: the massing view's chat asks the same question, and it
    // should not ask twice. A forecast-sourced draft sets buildingType to a scenario id,
    // which is not an answer, so only the three wizard values are passed on.
    if (['mixed-use', 'office', 'housing'].includes(wiz.buildingType)) localStorage.setItem('programBuildingType', wiz.buildingType);
    else localStorage.removeItem('programBuildingType');
    // stays up until the massing page takes over: that page packs the modules and builds the
    // scene before it paints, which is the longest wait in the whole flow
    analyzing('building the massing');
    location.href = 'program-massing-shortfloor.html?src=input';
  });

  // ── back from review (keeps the draft) ──
  //    forecast-sourced draft → back to the scenario list it came from;
  //    wizard-sourced draft   → back to the last wizard step, answers intact.
  document.getElementById('btn-back-review').addEventListener('click', () => {
    commitInlineEdit(); commitAddForm(); saveDraft(); // don't lose an open edit on the way out
    if (reviewOrigin === 'forecast' && openForecast) { openForecast(); return; }
    showView('wizard');
    loadStep(steps.length - 1); // re-ask the last question; Continue rebuilds the draft
  });

  // ── restart (discard draft, back to wizard step 1) ──
  document.getElementById('btn-restart').addEventListener('click', () => {
    localStorage.removeItem(DRAFT_KEY);
    location.reload();
  });

  // ── draft restore: reopening the page (typically Back from the massing view)
  //    resumes the review stage instead of resetting to wizard step 1.
  //    ?new=1 asks for the first question instead — that is what the massing view's mark
  //    links to. The draft is left in storage rather than deleted: starting a new program is
  //    not the same as discarding the old one, and "start over" already does that. ──
  (function restoreDraft() {
    if (new URLSearchParams(location.search).get('new') === '1') return;
    let d = null;
    try { d = JSON.parse(localStorage.getItem(DRAFT_KEY) || 'null'); } catch (e) {}
    if (!d || !Array.isArray(d.entries) || !d.entries.length) return;
    Object.assign(wiz, d.wiz || {});
    entries = d.entries;
    if (d.reviewOrigin) reviewOrigin = d.reviewOrigin; // "back" must still know where it came from
    if (Array.isArray(d.answered)) { answered.length = 0; d.answered.forEach(a => answered.push(a)); }
    (wiz.activities || []).forEach(a => selectedActivities.add(a));
    step = steps.length;
    // A draft written under older generator rules carries an old program. Keep the answers,
    // throw the program away and build it again, so a fix to generateEntries actually reaches
    // someone who has used the wizard before. Hand edits made to that old program go with it;
    // that is the point, since the rules they were made under no longer hold.
    enterReview(d.rules !== DRAFT_RULES);   // same rules → render the saved entries, do NOT regenerate
  })();

  // ── NEXA Intel: Site Forecast (additive layer — wizard and review flows above are
  //    untouched; if no NEXA/intel/data/site-*.js loaded, the entry link stays hidden).
  //    Every site in window.NEXA_INTEL.sites is offered; adding a site = adding a
  //    <script src> tag above, nothing here changes. ──
  (function initSiteForecast() {
    const fv = x => (x && typeof x === 'object' && 'value' in x) ? x.value : x; // unwrap confidence-tagged facts
    const SITES = (window.NEXA_INTEL && window.NEXA_INTEL.sites) || {};
    const keys = Object.keys(SITES);
    if (!keys.length) return;

    const link = document.getElementById('forecast-link');
    const titleEl = document.getElementById('fc-title');
    const tabsEl = document.getElementById('fc-tabs');
    const spineEl = document.getElementById('fc-spine');
    const optsEl = document.getElementById('fc-options');
    const MIX_COLORS = ['#172FC7', '#E67033', '#EEC341', '#5A6478', '#9BA5B5', '#141820'];

    // meta.name can carry a parenthetical qualifier ("… (currently a surface parking lot)")
    // that is right for the dossier and far too long for a tab or a title
    const nameOf = k => {
      const raw = String(fv(SITES[k].dossier && SITES[k].dossier.meta && SITES[k].dossier.meta.name) || k);
      const short = raw.split('(')[0].trim().replace(/[,;]$/, '');
      return short.length > 4 ? short : raw;
    };

    link.textContent = '▸ site forecast' + (keys.length === 1 ? ' · ' + nameOf(keys[0]) : ' · ' + keys.length + ' sites');
    revealForecastLink = () => { link.style.display = 'inline-block'; };
    // a restored draft, or stepping back to the site step, can arrive with one of them already
    // looked up — the entry was earned on that earlier visit and should still be there
    if (wiz.site && isIntelAddress(wiz.site.query)) revealForecastLink();

    // site tabs (hidden when only one site is loaded)
    tabsEl.innerHTML = keys.length > 1
      ? keys.map(k => '<button class="fc-tab" data-key="' + escapeHtml(k) + '">' + escapeHtml(nameOf(k)) + '</button>').join('')
      : '';
    tabsEl.querySelectorAll('.fc-tab').forEach(b =>
      b.addEventListener('click', () => renderSite(b.dataset.key)));

    let scenarios = []; // scenarios of the currently rendered site — applyScenario reads this

    function renderSite(key) {
      const site = SITES[key];
      if (!site) return;
      tabsEl.querySelectorAll('.fc-tab').forEach(b => b.classList.toggle('active', b.dataset.key === key));
      titleEl.innerHTML = 'Site <em>forecast</em> — ' + escapeHtml(nameOf(key));

      // The history is a LANE CHART of the site's observed programs, not one line.
      // Two programs that overlapped in time (a district program still running, a rival
      // development, a parking lot and the proposal meant to replace it) are NOT a
      // sequence — chaining them with arrows would assert a succession the record does
      // not contain. So: column = rank of the start year, row = first lane with no time
      // overlap, arrow = only where a succeeded_by edge actually links two neighbours.
      // Future-epoch nodes are excluded — a projected build-out is itself a scenario.
      const NOW = new Date().getFullYear();
      const allNodes = (site.timeline && site.timeline.nodes) || [];
      const allEdges = (site.timeline && site.timeline.edges) || [];
      const succEdges = allEdges.filter(e => e.relation === 'succeeded_by');
      const succ = new Set(succEdges.map(e => e.from + '>' + e.to));
      const inChain = new Set();
      succEdges.forEach(e => { inChain.add(e.from); inChain.add(e.to); });

      const tlNodes = allNodes
        .filter(n => n.kind === 'program' && n.epoch !== 'future')
        .sort((a, b) => (a.tStart || 0) - (b.tStart || 0) || ((a.tEnd || NOW) - (b.tEnd || NOW)));
      const endOf = n => (n.tEnd != null ? n.tEnd : NOW);
      const startYears = [...new Set(tlNodes.map(n => n.tStart))].sort((a, b) => a - b);

      // Lane assignment. Two rules that matter:
      //  1. Succession-chain nodes are placed FIRST, so the site's actual lineage holds the
      //     top row and a rival that merely coexisted (China City) cannot displace it.
      //  2. Overlap is a real interval test in both directions — an earlier, shorter node
      //     may legitimately share a row with a much later one.
      const lanes = []; // lanes[i] = nodes already placed on row i
      const placed = [];
      const place = n => {
        const free = row => row.every(m => endOf(m) <= n.tStart || endOf(n) <= m.tStart);
        let lane = lanes.findIndex(free);
        if (lane === -1) { lanes.push([]); lane = lanes.length - 1; }
        lanes[lane].push(n);
        placed.push({ n, lane, col: startYears.indexOf(n.tStart) });
      };
      tlNodes.filter(n => inChain.has(n.id)).forEach(place);
      tlNodes.filter(n => !inChain.has(n.id)).forEach(place);

      spineEl.innerHTML = placed.map(({ n, lane, col }) => {
        const span = (n.tStart != null ? n.tStart : '…') + '–' + (n.tEnd != null ? n.tEnd : 'now');
        // arrow only to a documented successor sitting on the same row, one column along
        const hasArrow = placed.some(p => p.lane === lane && p.col === col + 1 && succ.has(n.id + '>' + p.n.id));
        const cls = 'fc-tl-node'
          + (endOf(n) >= NOW ? ' present' : '')
          + (inChain.has(n.id) ? '' : ' parallel')
          + (hasArrow ? ' succ' : '');
        return '<div class="' + cls + '" style="grid-column:' + (col + 1) + ';grid-row:' + (lane + 1) + '"' +
          (inChain.has(n.id) ? '' : ' title="coexisted with the site\'s program — not a step in its succession"') + '>' +
          '<div class="t">' + escapeHtml(String(span)) + '</div>' +
          '<div class="n">' + escapeHtml(n.label || '') + '</div></div>';
      }).join('');

      // Scenarios are PARALLEL OPTIONS from today, not a sequence — stacked, not chained.
      scenarios = (site.scenarios || []).slice().sort((a, b) => (a.horizon || 0) - (b.horizon || 0));
      if (!scenarios.length) {
        optsEl.innerHTML = '<p style="color:var(--ink-mid);font-size:12px;padding:20px 0;">No forecast scenarios generated yet for this site — dossier and timeline only.</p>';
        return;
      }
      optsEl.innerHTML = scenarios.map((sc, i) => {
        const mix = sc.programMix || [];
        const bar = mix.map((m, j) =>
          '<span style="width:' + (m.share * 100).toFixed(1) + '%;background:' + MIX_COLORS[j % MIX_COLORS.length] + '"></span>').join('');
        const legend = mix.map((m, j) =>
          '<span><i style="display:inline-block;width:7px;height:7px;background:' + MIX_COLORS[j % MIX_COLORS.length] + ';margin-right:4px;"></i>' +
          escapeHtml(m.type) + ' ' + (m.share * 100).toFixed(0) + '%</span>').join('');
        return '<div class="fc-opt-row"><span class="fc-opt-tick"></span>' +
          '<div class="fc-card">' +
            '<div class="sc-head">' +
              '<div class="sc-meta">scenario ' + escapeHtml(String(sc.id || i + 1)) + ' · horizon ' + escapeHtml(String(sc.horizon || '—')) + '</div>' +
              '<div class="sc-name">' + escapeHtml(sc.name || '') + '</div>' +
            '</div>' +
            '<div class="sc-note">' + escapeHtml(sc.likelihoodNote || '') + '</div>' +
            '<div class="sc-right">' +
              '<div class="fc-mix">' + bar + '</div>' +
              '<div class="fc-mix-legend">' + legend + '</div>' +
              '<span class="fc-when" data-idx="' + i + '">on the timeline at ' + escapeHtml(String(sc.horizon || '—')) + '</span>' +
            '</div>' +
          '</div></div>';
      }).join('');

      // One entry point for the whole set instead of one apply per card: the scenarios are
      // parallel futures of the SAME site, so they belong on one timeline in the 3D view
      // rather than as four separate one-way trips into the program editor.
      const withDraft = scenarios.filter(sc => (sc.programFormatDraft || '').trim());
      const btn = document.getElementById('fc-timeline');
      if (btn) {
        btn.style.display = withDraft.length ? 'inline-block' : 'none';
        btn.textContent = '▸ open timeline in 3D · ' + withDraft.length + ' scenarios';
        btn.onclick = () => openTimeline(withDraft);
      }
    }

    // Parses every scenario draft, packs them as a year-keyed track and hands the whole
    // thing to the massing view, which scrubs it with the year slider it already has.
    function openTimeline(list) {
      const track = [], errs = [];
      for (const sc of list) {
