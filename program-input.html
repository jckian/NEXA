  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEXA — Program Input</title>
  <link rel="icon" type="image/png" href="NEXA/NEXA-favicon.png" />

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #172FC7;
      --surface:  #FFFFFF;
      --border:   rgba(20,24,32,0.09);
      --border-hi:rgba(20,24,32,0.15);
      --text-hi:  #141820;
      --text-mid: #5A6478;
      --text-lo:  #9BA5B5;
      --accent:   #172FC7;
      --accent-dim: rgba(23,47,199,0.08);
      --accent-glow: rgba(23,47,199,0.18);
      /* --bg at 0.62: the analysing veil. Enough to push the step behind it back and carry
         white type, not so much that the page you are waiting on disappears. */
      --bg-veil:  rgba(23,47,199,0.62);
      --font:     'DM Sans', system-ui, sans-serif;
      --mono:     'JetBrains Mono', monospace;
      --short:    #E67033;
      --short-dim: rgba(230,112,51,0.10);
      --yellow:   #EEC341;
      --yellow-dim: rgba(238,195,65,0.16);
      --err:      #d1373f;
      /* foreground set for content sitting directly on --bg (blue); the --text-hi/mid/lo and --border-hi set above stay dark, used only inside white --surface cards */
      --ink:      #FFFFFF;
      --ink-mid:  rgba(255,255,255,0.72);
      --ink-lo:   rgba(255,255,255,0.46);
      --ink-border: rgba(255,255,255,0.24);
      --ink-border-hi: rgba(255,255,255,0.4);
      --ink-hover-dim: rgba(255,255,255,0.12);
    }

    html { background: var(--bg); }

    html, body {
      width: 100%; height: 100%;
      font-family: var(--font);
      -webkit-font-smoothing: antialiased;
      color: var(--ink);
      overflow: hidden;
    }
    body { background: transparent; }
    body.review-active { overflow: auto; }

      display: flex; align-items: center; gap: 10px;
      z-index: 45;
    }

    }
    #brand-name {
      font-family: var(--mono); font-size: 13px; font-weight: 500;
      letter-spacing: 0.24em; color: var(--ink);
    }

    /* ── ANALYSING ──
       Every step that goes away and thinks lays a blue veil over the page it is on, with the
       mark folding above it and one line naming the stage. The step stays visible underneath:
       the wait belongs to the question you just answered, and replacing the whole screen with
       a logo loses that. The address lookup is four network calls deep and used to show one
       grey "locating…" line in the panel, which reads as a hang rather than as work.
       Whether it is THERE is `display`, and nothing else. A covering element whose presence
       depends on a transition finishing is a page that locks if the transition never runs, and
       transitions measurably were not firing when this was read back inside a throttled frame.
       The fade-in is a keyframe animation instead, which does run there, and it fills forwards
       so it settles opaque and stays. */
    #analyzing {
      position: fixed; inset: 0; z-index: 60;
      display: none; flex-direction: column; align-items: center; justify-content: center; gap: 24px;
      background: var(--bg-veil);
      /* the blur is what stops the type behind from reading as part of the mark; where it is
         unsupported the veil alone still does the job */
      backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
    }
    #analyzing.on { display: flex; animation: an-in 0.22s ease both; }
    @keyframes an-in { from { opacity: 0; } to { opacity: 1; } }
    /* ── the mark, drawn and animated rather than the raster brand PNG ──
       Same construction as the NEXA-LOGO motion study: four identical capsules placed by
       cx/cy and rotated about their own centres, so the mark reads as one stroke folding
       rather than as a logo being spun. Numbers are the study's own:
         geometry   bar 30×108, x = cx − 15, y = cy − 54, cy defaults to 85
         stages     N  P0(65,+40) P1(115,−40) P2(165,+40) P3(165,+40)  P3 hidden behind P2
                    X  P3 rotates to −40°, crossing P2
                    M  P3 stands up at cx 190, cy 88, scaleY 0.843
         sequence   N → X → M → X, 950 ms held, 700 ms of travel, cubic-bezier(.4,0,.2,1)
       so one turn of the study's cycle is 4 × 1650 = 6600 ms and the travel is 700/6600 =
       10.606% of it, which is where the keyframe percentages come from. It is played at twice
       that speed here, on the duration below. P0 to P2 never move, which is why only P3
       carries an animation. */
    /* The blue halo is invisible on the blue ground and only does anything where the veil is
       thin enough to let something light through, which on the review stage is a white floor
       card sitting right under the mark. White on white is the one way this can fail. */
    #an-mark { width: 172px; height: auto; filter: drop-shadow(0 0 16px rgba(23,47,199,0.9)); }
    #an-mark path { fill: #fff; }
    #an-mark g { transform-box: fill-box; transform-origin: 50% 50%; }
    .an-b0 { transform: translate(50px, 31px)  rotate(40deg); }
    .an-b1 { transform: translate(100px, 31px) rotate(-40deg); }
    .an-b2 { transform: translate(150px, 31px) rotate(40deg); }
    /* Twice the study's speed: 475 ms held, 350 ms of travel, 3.3 s to the cycle. The keyframe
       percentages below are proportions, so they carry over untouched. */
    .an-b3 { animation: an-p3 3.3s linear infinite; }
    /* --ink-mid, not --ink-lo: it is the only text on the screen and the panel greys are meant
       for rows that sit beside brighter ones */
    #an-step {
      font-family: var(--mono); font-size: 10px; font-weight: 500;
      letter-spacing: 0.2em; text-transform: uppercase; color: var(--ink-mid);
      text-shadow: 0 0 10px rgba(23,47,199,0.9);   /* same reason as the mark's halo */
      animation: an-fade 1.6s ease-in-out infinite;
    }
    /* Each stage holds, then travels. The easing is declared on the keyframe that STARTS a
       leg, which is how a per-segment ease is expressed in CSS; the holds are flat, so their
       timing function never shows. */
    @keyframes an-p3 {
      0%       { transform: translate(150px, 31px) rotate(40deg)  scaleY(1);     animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1); }
      10.606%  { transform: translate(150px, 31px) rotate(-40deg) scaleY(1); }
      25%      { transform: translate(150px, 31px) rotate(-40deg) scaleY(1);     animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1); }
      35.606%  { transform: translate(175px, 34px) rotate(0deg)   scaleY(0.843); }
      50%      { transform: translate(175px, 34px) rotate(0deg)   scaleY(0.843); animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1); }
      60.606%  { transform: translate(150px, 31px) rotate(-40deg) scaleY(1); }
      75%      { transform: translate(150px, 31px) rotate(-40deg) scaleY(1);     animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1); }
      85.606%  { transform: translate(150px, 31px) rotate(40deg)  scaleY(1); }
      100%     { transform: translate(150px, 31px) rotate(40deg)  scaleY(1); }
    }
    @keyframes an-fade { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }
    /* less motion: the mark stops folding and rests on the N it starts from */
    @media (prefers-reduced-motion: reduce) {
      .an-b3 { animation: none; transform: translate(150px, 31px) rotate(40deg); }
      #an-step { animation: none; opacity: 0.8; }
    }

    /* ── STEP INDICATOR (top right) ── */
    #step-indicator {
      position: fixed; top: 36px; right: 40px;
      display: flex; align-items: center; gap: 8px;
      z-index: 30;
    }
    .step-pip {
      width: 20px; height: 2px;
      background: var(--ink-border);
      border-radius: 2px;
      transition: background 0.4s, width 0.4s;
    }
    .step-pip.done { background: var(--ink); }
    .step-pip.active { background: var(--ink); width: 32px; }
    #step-num {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--ink-lo);
      letter-spacing: 0.08em;
      margin-left: 4px;
    }

    /* The wizard says which step you are on. The other two views said nothing at all, so a
       draft and the scenario list looked like the same page with different content. Same
       corner, same type as the step counter: a name for where you are, nothing more.
       Written by showView(); z-index matches #brand so the overlay does not cover it. */
    #view-label {
      position: fixed; top: 36px; right: 40px; z-index: 45;
      display: none;
      font-family: var(--mono); font-size: 10px; letter-spacing: 0.08em;
      color: var(--ink-lo); text-transform: lowercase;
    }

    /* ── MAIN DIALOG ── */
    /* The wizard stage does not scroll the body (html/body are overflow:hidden, and only the
       review stage turns that off), so a step taller than the viewport used to have nowhere
       to go: the site step with a resolved address, its program defaults and the forecast
       below it ran off the bottom and could not be reached. The column scrolls inside itself
       instead, which keeps the fixed brand, step pips and footer where they are.
       `safe center` keeps the centring while making the top reachable once the content
       overflows; a browser that does not know the keyword drops the line and keeps the plain
       `center` above it, which is exactly the old behaviour. */
    #dialog {
      position: relative; z-index: 1;
      width: 100%; height: 100%;
      display: flex; flex-direction: column;
      align-items: flex-start; justify-content: center;
      justify-content: safe center;
      overflow-y: auto; overscroll-behavior: contain;
      padding: 80px 0 80px max(40px, calc((100vw - 640px) / 2));
      max-width: 100vw;
    }
    /* A flex item that may shrink gets squashed below its own content once the column
       overflows, which printed the answered history on top of the question on the taller
       steps. Nothing here shrinks; the column scrolls. */
    #dialog > * { flex-shrink: 0; }

    /* ── ANSWERED HISTORY ── */
    #answered { display: flex; flex-direction: column; gap: 2px; margin-bottom: 40px; }
    .answered-row { display: flex; align-items: baseline; gap: 12px; opacity: 0; animation: fadeUp 0.3s ease forwards; }
    .answered-key {
      font-family: var(--mono); font-size: 9px; font-weight: 500;
      letter-spacing: 0.16em; text-transform: uppercase;
      color: var(--ink-lo); white-space: nowrap; min-width: 110px;
    }
    .answered-val { font-size: 13px; font-weight: 400; color: var(--ink-mid); }

    /* ── QUESTION ── */
    #question {
      font-size: clamp(32px, 4.5vw, 52px);
      font-weight: 300; line-height: 1.18; letter-spacing: -0.02em;
      color: var(--ink); max-width: 640px; margin-bottom: 36px;
      transition: opacity 0.22s, transform 0.22s; text-wrap: balance;
    }
    #question em { font-style: normal; color: var(--ink); }
    #question.hidden { opacity: 0; transform: translateY(-10px); }

    /* ── CHIPS ── */
    #chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 28px; max-width: 640px; transition: opacity 0.2s; align-items: center; }
    #chips.hidden { opacity: 0; pointer-events: none; }
    .chip {
      padding: 7px 16px; border: 1px solid var(--ink-border); border-radius: 20px;
      background: transparent; font-family: var(--font); font-size: 12px; font-weight: 400;
      color: var(--ink-mid); cursor: pointer; user-select: none;
      transition: background 0.14s, border-color 0.14s, color 0.14s; letter-spacing: 0.01em;
    }
    .chip:hover { background: var(--ink-hover-dim); border-color: var(--ink-border-hi); color: var(--ink); }
    .chip.selected { background: var(--ink); border-color: var(--ink); color: var(--accent); }
    .chip.selected:hover { background: var(--ink); color: var(--accent); opacity: 0.88; }
    /* the chip the site's zoning points at, drawn already picked so the step opens on the
       site's answer. A default, not a lock: every other chip is still one click away, and
       the step is only committed when a chip is actually clicked. */
    .chip.rec { background: var(--ink); border-color: var(--ink); color: var(--accent); }
    .chip.rec:hover { background: var(--ink); color: var(--accent); opacity: 0.88; }
    .chip.rec::after {
      content: 'site'; margin-left: 8px; font-family: var(--mono); font-size: 8px;
      letter-spacing: 0.14em; text-transform: uppercase; color: rgba(23,47,199,0.5);
    }
    .chip-group-label {
      width: 100%; font-family: var(--mono); font-size: 9px; font-weight: 500;
      letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink-lo);
      margin-top: 10px;
    }
    .chip-group-label:first-child { margin-top: 0; }

    /* ── INPUT ROW ── */
    /* the back arrow sits to the LEFT of whichever input row is active, mirroring the
       send arrow on the right — so the row reads: ← back | [ input ] | enter → */
    #input-wrap { max-width: 640px; width: 100%; display: flex; align-items: center; gap: 12px; }
    #input-wrap > .input-row, #input-wrap > #btn-activities { flex: 0 1 auto; }
    .input-row {
      display: flex; align-items: center; gap: 10px;
      background: var(--surface); border: 1px solid var(--border-hi); border-radius: 0px;
      padding: 6px 6px 6px 18px; transition: border-color 0.2s, box-shadow 0.2s;
      max-width: 580px;
    }
    .input-row:focus-within { border-color: rgba(23,47,199,0.35); box-shadow: 0 0 0 3px rgba(23,47,199,0.08); }
    .input-row input {
      flex: 1; border: none; outline: none; background: none;
      font-family: var(--font); font-size: 13px; font-weight: 400; color: var(--text-hi);
    }
    .input-row input::placeholder { color: var(--text-lo); }

    .size-fields { display: flex; align-items: center; gap: 6px; }
    .size-label { font-family: var(--mono); font-size: 11px; font-weight: 500; color: var(--text-mid); letter-spacing: 0.05em; }
    .size-fields input[type="number"] {
      width: 64px; height: 30px; background: rgba(20,24,32,0.04);
      border: 1px solid var(--border-hi); border-radius: 3px; text-align: center;
      font-family: var(--mono); font-size: 12px; color: var(--text-hi); outline: none;
      transition: border-color 0.2s;
    }
    .size-fields input[type="number"]:focus { border-color: var(--accent); }
    .size-unit { font-family: var(--mono); font-size: 10px; color: var(--text-lo); }

    /* ── SITE row (step 1: "Where is your site?") ── */
    /* the address row is wider than the numeric ones — a full street address needs it */
    #row-site { max-width: 580px; width: 100%; }
    #row-site input { min-width: 0; }
    /* demo shortcuts sit directly under the address row */
    #site-demos { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin-top: 12px; max-width: 580px; }
    #site-demos .sd-label {
      font-family: var(--mono); font-size: 9px; letter-spacing: 0.14em;
      text-transform: uppercase; color: var(--ink-lo); margin-right: 2px;
    }
    .sd-chip {
      padding: 5px 12px; border: 1px solid var(--ink-border); border-radius: 20px;
      background: transparent; font-family: var(--font); font-size: 11.5px;
      color: var(--ink-mid); cursor: pointer;
      transition: background 0.14s, border-color 0.14s, color 0.14s;
    }
    .sd-chip:hover { background: var(--ink-hover-dim); border-color: var(--ink-border-hi); color: var(--ink); }

    /* sits on the blue field under the input row, so it uses the --ink scale, not --text */
    #site-panel {
      display: none; max-width: 580px; margin-top: 14px;
      border: 1px solid var(--ink-border); padding: 12px 16px;
      font-size: 12px; color: var(--ink-mid); line-height: 1.55;
    }
    #site-panel.busy { color: var(--ink-lo); }
    #site-panel .sp-row { display: flex; gap: 12px; padding: 3px 0; }
    #site-panel .sp-k {
      flex: 0 0 88px; font-family: var(--mono); font-size: 9px; letter-spacing: 0.12em;
      text-transform: uppercase; color: var(--ink-lo); padding-top: 2px;
    }
    #site-panel .sp-v { flex: 1; min-width: 0; color: var(--ink); word-break: break-word; }
    #site-panel .sp-v em { font-style: normal; color: var(--ink-lo); }
    #site-panel .sp-note {
      margin-top: 8px; font-family: var(--mono); font-size: 9px; letter-spacing: 0.06em;
      color: var(--ink-lo); line-height: 1.6;
    }
    /* ── what the site set in the program (site → wizard defaults) ──
       Deliberately quieter than the measured rows above it: these are derived values, and
       they must not read like the parcel record they were derived from. */
    .sb-block { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--ink-border); }
    .sb-head {
      font-family: var(--mono); font-size: 9px; font-weight: 500; letter-spacing: 0.16em;
      text-transform: uppercase; color: var(--ink-lo); margin-bottom: 6px;
    }
    .sb-row { display: flex; gap: 12px; padding: 3px 0; align-items: baseline; }
    .sb-k {
      flex: 0 0 92px; font-family: var(--mono); font-size: 9px; letter-spacing: 0.1em;
      text-transform: uppercase; color: var(--ink-lo);
    }
    .sb-v { flex: 1; min-width: 0; font-size: 12px; color: var(--ink-mid); line-height: 1.5; }
    .sb-v b { color: var(--ink); font-weight: 500; }
    .sb-why { display: block; font-size: 11px; color: var(--ink-lo); }
    .sb-note { margin-top: 8px; font-size: 11px; color: var(--ink-lo); line-height: 1.55; }
    /* the review stage repeats the same block above the floor cards */
    #site-basis { max-width: 640px; margin: 0 0 22px; }
    #site-basis .sb-block { border-top: none; padding-top: 0; margin-top: 0; }

    /* ── development potential (rule-based Site Forecast for the looked-up parcel) ── */
    #site-forecast { display: none; max-width: 580px; margin-top: 10px; }
    #site-forecast .sf-head {
      font-family: var(--mono); font-size: 9px; letter-spacing: 0.14em;
      text-transform: uppercase; color: var(--ink-lo); margin-bottom: 8px;
    }
    .sf-cap {
      border: 1px solid var(--ink-border); padding: 12px 16px; margin-bottom: 10px;
      font-size: 12px; color: var(--ink-mid); line-height: 1.55;
    }
    .sf-cap b { color: var(--ink); }
    .sf-far { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
    .sf-far label { font-family: var(--mono); font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-lo); }
    .sf-far input {
      width: 62px; background: rgba(255,255,255,0.1); border: 1px solid var(--ink-border);
      color: var(--ink); font-family: var(--mono); font-size: 11px; padding: 3px 6px; outline: none; text-align: center;
    }
    .sf-far input:focus { border-color: var(--ink-border-hi); }
    .sf-far .sf-src { font-family: var(--mono); font-size: 9px; color: var(--ink-lo); }

    .sf-from { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
    .sf-from label { font-family: var(--mono); font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-lo); }
    .sf-from select {
      background: rgba(255,255,255,0.1); border: 1px solid var(--ink-border); color: var(--ink);
      font-family: var(--font); font-size: 12px; padding: 4px 8px; outline: none;
    }
    .sf-from select option { color: #111; }

    .sf-card {
      border: 1px solid var(--ink-border); padding: 12px 16px; margin-bottom: 8px;
      display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: start;
    }
    .sf-card .sf-name { font-size: 14px; color: var(--ink); margin-bottom: 4px; }
    .sf-card .sf-basis { font-size: 11.5px; color: var(--ink-mid); line-height: 1.5; }
    .sf-card .sf-block { font-family: var(--mono); font-size: 9px; letter-spacing: 0.04em; color: var(--ink-lo); margin-top: 6px; line-height: 1.6; }
    .sf-tier {
      display: inline-block; font-family: var(--mono); font-size: 8px; letter-spacing: 0.14em;
      text-transform: uppercase; border: 1px solid var(--ink-border); padding: 2px 7px; margin-bottom: 6px; color: var(--ink-mid);
    }
    .sf-tier.high { background: var(--ink); border-color: var(--ink); color: var(--accent); }
    .sf-use {
      background: none; border: 1px solid var(--ink-border); color: var(--ink-mid);
      font-family: var(--mono); font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase;
      padding: 7px 12px; cursor: pointer; white-space: nowrap;
    }
    .sf-use:hover { background: var(--ink); border-color: var(--ink); color: var(--accent); }
    #site-forecast .sf-note {
      font-family: var(--mono); font-size: 9px; letter-spacing: 0.06em; color: var(--ink-lo); line-height: 1.6;
    }
    /* M9 — the district signal read, deliberately styled apart from the DB tier chip so the
       two never look like the same kind of claim */
    .sf-sig {
      display: inline-block; font-family: var(--mono); font-size: 8px; letter-spacing: 0.14em;
      text-transform: uppercase; border: 1px dashed var(--ink-border); padding: 2px 7px;
      margin: 0 0 6px 6px; color: var(--ink-mid);
    }
    .sf-sig.supported { border-color: var(--ink); color: var(--ink); }
    .sf-sig.unsupported { border-color: rgba(230,112,51,0.7); color: #b25620; }
    .sf-sigline {
      font-family: var(--mono); font-size: 9px; letter-spacing: 0.04em; line-height: 1.7;
      color: var(--ink-lo); margin-top: 4px;
    }

    #site-actions { display: flex; align-items: center; gap: 16px; margin-top: 12px; }
    #site-skip, #site-scout-link {
      background: none; border: none; padding: 0;
      font-family: var(--mono); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--ink-lo); cursor: pointer; text-decoration: none;
    }
    #site-skip:hover, #site-scout-link:hover { color: var(--ink); }
    /* the one unambiguous way forward once a site resolves — the send arrow doubling as
       "continue" was not readable as such */
    #site-continue {
      background: var(--ink); border: 1px solid var(--ink); color: var(--accent);
      font-family: var(--mono); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase;
      padding: 7px 14px; cursor: pointer;
    }
    #site-continue:hover { opacity: 0.85; }

    .btn-send {
      width: 34px; height: 34px; flex-shrink: 0; border-radius: 3px;
      background: var(--accent); border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: opacity 0.15s, transform 0.12s;
    }
    .btn-send svg { width: 14px; height: 14px; stroke: #F5F5F5; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .btn-send:hover { opacity: 0.85; }
    .btn-send:active { transform: scale(0.93); }
    .btn-send:disabled { background: var(--text-lo); cursor: default; opacity: 0.5; }

    /* same geometry as .btn-send, but it sits on the blue field, not inside the white
       card — so it is outlined rather than filled, and never competes with Enter */
    .btn-back-arrow { background: transparent; border: 1px solid var(--ink-border); }
    .btn-back-arrow svg { stroke: var(--ink-mid); }
    .btn-back-arrow:hover { background: var(--ink-hover-dim); border-color: var(--ink-border-hi); opacity: 1; }
    .btn-back-arrow:hover svg { stroke: var(--ink); }

    /* Activity confirm button (step 4) */
    #btn-activities {
      display: none;
      font-family: var(--font); font-size: 13px; font-weight: 500; color: var(--accent);
      background: var(--ink); border: none; padding: 11px 22px; cursor: pointer;
      transition: opacity 0.15s;
    }
    #btn-activities:hover { opacity: 0.85; }

    /* ── BRIEF CHAT (step 2) ── */
    /* a sentence instead of four steps of chips; same white row idiom as the address row */
    #row-brief { max-width: 580px; width: 100%; }
    #row-brief input { min-width: 0; }
    #brief-panel {
      display: none; max-width: 580px; margin-top: 14px;
      border: 1px solid var(--ink-border); padding: 12px 16px;
      font-size: 12px; color: var(--ink-mid); line-height: 1.55;
      max-height: 32vh; overflow-y: auto;
    }
    #brief-panel.busy { color: var(--ink-lo); }
    .bp-you { color: var(--ink-lo); margin-bottom: 8px; }
    .bp-note { color: var(--ink); margin-bottom: 10px; }
    .bp-err { color: var(--yellow); }
    .bp-row { display: flex; gap: 12px; padding: 3px 0; }
    .bp-k {
      flex: 0 0 88px; font-family: var(--mono); font-size: 9px; letter-spacing: 0.12em;
      text-transform: uppercase; color: var(--ink-lo); padding-top: 2px;
    }
    .bp-v { flex: 1; min-width: 0; color: var(--ink); }
    .bp-v em { font-style: normal; color: var(--ink-lo); }
    .bp-act { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-top: 12px; }
    .bp-go {
      background: var(--ink); border: 1px solid var(--ink); color: var(--accent);
      font-family: var(--mono); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase;
      padding: 7px 14px; cursor: pointer;
    }
    .bp-go:hover { opacity: 0.85; }
    .bp-link {
      background: none; border: none; padding: 0;
      font-family: var(--mono); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--ink-lo); cursor: pointer;
    }
    .bp-link:hover { color: var(--ink); }
    .bp-key { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
    .bp-key input {
      flex: 1; min-width: 0; background: rgba(255,255,255,0.1); border: 1px solid var(--ink-border);
      color: var(--ink); font-family: var(--mono); font-size: 11px; padding: 5px 8px; outline: none;
    }
    .bp-key input:focus { border-color: var(--ink-border-hi); }
    .bp-fine { margin-top: 8px; font-family: var(--mono); font-size: 9px; letter-spacing: 0.06em; color: var(--ink-lo); line-height: 1.6; }
    .bp-fine b { color: var(--ink-mid); font-weight: 500; }

    #hint { margin-top: 14px; font-size: 11px; color: var(--ink-lo); font-family: var(--mono); letter-spacing: 0.04em; max-width: 600px; }


    @keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

    #noise-canvas { position: fixed; inset: 0; z-index: 0; pointer-events: none; width: 100%; height: 100%; background: var(--bg); display: none; /* all-white bg: noise shader off; remove this to restore */ }

    /* ══════════════ REVIEW STAGE — floor card editor ══════════════ */
    #review {
      position: relative; z-index: 1; display: none;
      width: 100%; min-height: 100%;
      padding: 110px 40px 150px;
    }
    #review-inner { max-width: 1020px; margin: 0 auto; }
    #review-title { font-size: clamp(26px, 3.2vw, 38px); font-weight: 300; letter-spacing: -0.02em; color: var(--ink); margin-bottom: 20px; }
    #review-title em { font-style: normal; }
    /* only on a draft that came out of a scenario: which one, and a way back to the list.
       This block sits on the blue field, so it uses the --ink scale, not --text */
    #rv-origin {
      display: none; margin: 0 0 18px;
      font-family: var(--mono); font-size: 10px; letter-spacing: 0.06em; color: var(--ink-lo);
    }
    #rv-origin b { font-weight: 500; color: var(--ink); }
    #rv-origin a {
      margin-left: 12px; color: var(--ink-mid); cursor: pointer;
      border-bottom: 1px solid var(--ink-border);
    }
    #rv-origin a:hover { color: var(--ink); border-bottom-color: var(--ink-border-hi); }
    #rv-tabs { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-bottom: 24px; }
    /* the raw-text fold: sits at the end of the tab strip. Reads as a real way in, not a
       hint, so it carries the same weight as the tabs beside it. */
    #rv-raw-toggle {
      margin-left: auto;
      display: inline-flex; align-items: center; gap: 9px;
      background: rgba(255,255,255,0.07); border: 1px solid var(--ink-border-hi); color: var(--ink);
      font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase;
      padding: 9px 18px; cursor: pointer;
      transition: background 0.12s, border-color 0.12s;
    }
    #rv-raw-toggle:hover { background: rgba(255,255,255,0.14); border-color: var(--surface); }
    #rv-raw-toggle.open { background: var(--ink); border-color: var(--ink); color: var(--accent); }
    #rv-raw-toggle svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    #rv-raw-toggle em { font-style: normal; font-size: 15px; line-height: 0; color: var(--short); }
    #rv-raw-toggle em:empty { display: none; }

    #floors { display: flex; flex-direction: column; gap: 8px; }

    /* One table: the floor on the left, then a column per band. The columns are the same
       three the pill colours already named, so the eye stops sorting them by hue. */
    .floor-head {
      display: grid; grid-template-columns: 92px 1fr 1fr 1.25fr 56px 138px; gap: 14px;
      padding: 0 17px 3px;
      font-family: var(--mono); font-size: 8px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-lo);
    }
    .floor-card {
      background: var(--surface); border: 1px solid var(--border-hi);
      padding: 12px 16px;
      display: grid; grid-template-columns: 92px 1fr 1fr 1.25fr 56px 138px; gap: 14px;
      align-items: start;
    }
    .add-col { padding-top: 2px; }
    .cell-cap { display: none; }   /* the head carries the captions until the row stacks */

    .floor-label {
      padding-top: 3px;
      font-family: var(--mono); font-size: 13px; font-weight: 500; color: var(--text-hi);
    }

    .pills { display: flex; flex-wrap: wrap; gap: 5px; align-content: flex-start; min-width: 0; }
    .floor-card .pill { padding: 3px 10px; }
    .pill {
      display: inline-flex; align-items: baseline; gap: 7px;
      padding: 4px 12px; border-radius: 14px; border: 1px solid;
      font-size: 11px; cursor: pointer; user-select: none;
      transition: box-shadow 0.12s, opacity 0.12s;
    }
    .pill:hover { box-shadow: 0 0 0 2px var(--accent-dim); }
    .pill b { font-family: var(--mono); font-weight: 500; font-size: 10px; opacity: 0.8; }
    .pill.long  { background: var(--accent-dim); border-color: rgba(23,47,199,0.30); color: #172FC7; }
    .pill.short { background: var(--short-dim); border-color: rgba(230,112,51,0.45); color: #b25620; }
    .pill.circ  { background: var(--yellow-dim); border-color: rgba(238,195,65,0.6); color: #8a6a10; }
    .pill.add   { background: transparent; border-style: dashed; border-color: var(--border-hi); color: var(--text-lo); }
    .pill.add:hover { color: var(--accent); border-color: rgba(23,47,199,0.35); }

    @media (max-width: 900px) {
      .floor-head { display: none; }
      .floor-card { grid-template-columns: 1fr; gap: 10px; }
      .cell-cap {
        display: block; width: 100%;
        font-family: var(--mono); font-size: 8px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-lo);
      }
      .pills:not(:has(.pill)) { display: none; }   /* an empty band says nothing when stacked */
      .floor-card .share-head .share-cap { display: inline; }  /* no head to carry it down here */
    }

    .share-col { padding-top: 3px; }
    .share-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 5px; }
    .share-head .share-cap { display: none; }   /* printed once in .floor-head */
    .share-head .share-pct { font-family: var(--mono); font-size: 10px; color: var(--text-mid); }
    .share-head .share-cap { font-family: var(--mono); font-size: 8px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-lo); }
    .share-bar { position: relative; height: 4px; background: rgba(20,24,32,0.07); border-radius: 2px; overflow: visible; }
    .share-fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--short); border-radius: 2px; }
    .share-tick { position: absolute; left: 50%; top: -3px; bottom: -3px; width: 1px; background: var(--text-lo); }
    .sftag {
      display: inline-block; margin-top: 7px;
      font-family: var(--mono); font-size: 9px; letter-spacing: 0.08em;
      padding: 2px 8px; border-radius: 3px;
      background: var(--short-dim); color: #b25620; border: 1px solid rgba(230,112,51,0.4);
    }

    /* inline editor / add form inside a card */
    .inline-form {
      grid-column: 1 / -1;
      display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
      border-top: 1px dashed var(--border-hi); margin-top: 4px; padding-top: 10px;
    }
    .inline-form .if-name { font-family: var(--mono); font-size: 11px; color: var(--text-hi); }
    .inline-form input[type="number"], .inline-form input[type="text"] {
      height: 28px; background: rgba(20,24,32,0.04);
      border: 1px solid var(--border-hi); border-radius: 3px;
      font-family: var(--mono); font-size: 11px; color: var(--text-hi);
      padding: 0 8px; outline: none;
    }
    .inline-form input[type="number"] { width: 78px; text-align: center; }
    .inline-form input[type="text"] { width: 240px; }
    .inline-form input:focus { border-color: var(--accent); }
    .inline-form select {
      height: 28px; border: 1px solid var(--border-hi); border-radius: 3px;
      background: var(--surface); font-family: var(--mono); font-size: 11px;
      color: var(--text-hi); outline: none; padding: 0 6px;
    }
    .if-btn {
      height: 28px; padding: 0 14px; border-radius: 3px; border: none; cursor: pointer;
      font-family: var(--font); font-size: 11px; font-weight: 500;
      background: var(--accent); color: #F5F5F5; transition: opacity 0.15s;
    }
    .if-btn:hover { opacity: 0.85; }
    .if-btn.ghost { background: transparent; color: var(--text-mid); border: 1px solid var(--border-hi); }
    .if-btn.danger { background: transparent; color: var(--err); border: 1px solid rgba(209,55,63,0.4); }
    .if-lab { font-family: var(--mono); font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-lo); }

    /* ── RAW TEXT PANEL ──
       Sits under the floor cards in the same pane, ruled off so it reads as the other view
       of the same program rather than a second program. */
    #raw-panel { display: none; margin-top: 26px; padding-top: 18px; border-top: 1px solid var(--ink-border); }
    #raw-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 9px; }
    #raw-head .rh-t { font-family: var(--mono); font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-lo); }
    #raw-head .rh-sub { font-size: 11.5px; color: var(--ink-mid); }
    #raw-head .rh-up {
      margin-left: auto; align-self: center;
      display: inline-flex; align-items: center; gap: 6px;
      background: none; border: 1px solid var(--ink-border); color: var(--ink-mid);
      font-family: var(--mono); font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase;
      padding: 5px 11px; cursor: pointer;
    }
    #raw-head .rh-up:hover { border-color: var(--ink-border-hi); color: var(--ink); }
    #raw-head .rh-up svg { width: 13px; height: 13px; fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
    #raw-text {
      width: 100%; height: 300px; resize: vertical;
      background: var(--surface); border: 1px solid var(--border-hi);
      font-family: var(--mono); font-size: 11.5px; line-height: 1.55; color: var(--text-hi);
      padding: 14px; outline: none;
    }
    #raw-text:focus { border-color: rgba(23,47,199,0.35); box-shadow: 0 0 0 3px rgba(23,47,199,0.08); }
    #raw-actions { display: flex; gap: 12px; align-items: center; margin-top: 8px; }
    #raw-errors { font-family: var(--mono); font-size: 10.5px; color: var(--err); margin-top: 8px; line-height: 1.6; }
    #raw-note { font-family: var(--mono); font-size: 9px; letter-spacing: 0.06em; color: var(--ink-lo); }
    #raw-actions .if-btn { background: var(--surface); color: var(--accent); border: 1px solid var(--surface); }
    #raw-actions .if-btn:hover { opacity: 1; box-shadow: 0 0 0 2px rgba(255,255,255,0.25); }
    #raw-actions .if-btn.ghost { background: transparent; color: var(--ink-mid); border-color: var(--ink-border); }
    #raw-actions .if-btn.ghost:hover { color: var(--ink); border-color: var(--ink-border-hi); box-shadow: none; }
    #btn-raw-revert { display: none; }

    /* ── PROGRAM FORECAST (review stage) ──
       Same year axis the Site Forecast entry gets, derived from this program instead of a
       parcel. Sits on the blue field like the floor cards, so its head uses the --ink scale
       and its body the white --surface one. */
    #prog-forecast { display: none; margin-top: 24px; }
    .pf-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 9px; }
    .pf-head .pf-t { font-family: var(--mono); font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-lo); }
    .pf-head .pf-sub { font-size: 11.5px; color: var(--ink-mid); }
    .pf-body { background: var(--surface); border: 1px solid var(--border-hi); padding: 15px 18px 16px; }
    .pf-ctl { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 20px; padding-bottom: 13px; border-bottom: 1px solid var(--border-hi); margin-bottom: 4px; }
    .pf-ctl > div { display: flex; align-items: center; gap: 7px; }
    .pf-ctl label { font-family: var(--mono); font-size: 8px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-lo); }
    .pf-ctl input[type="number"] {
      width: 54px; height: 26px; text-align: center; background: rgba(20,24,32,0.04);
      border: 1px solid var(--border-hi); border-radius: 3px;
      font-family: var(--mono); font-size: 11px; color: var(--text-hi); outline: none;
    }
    .pf-ctl select {
      height: 26px; max-width: 220px; background: var(--surface); border: 1px solid var(--border-hi);
      border-radius: 3px; font-family: var(--font); font-size: 11.5px; color: var(--text-hi);
      outline: none; padding: 0 6px;
    }
    .pf-ctl input:focus, .pf-ctl select:focus { border-color: var(--accent); }
    .pf-ctl .pf-src { font-family: var(--mono); font-size: 9px; color: var(--text-lo); }

    .pf-ev { display: grid; grid-template-columns: 56px 1fr; gap: 14px; padding: 11px 0; border-top: 1px dashed var(--border-hi); }
    .pf-ev:first-of-type { border-top: none; }   /* the control row already rules off above it */
    .pf-yr { font-family: var(--mono); font-size: 12px; font-weight: 500; color: var(--text-hi); padding-top: 1px; }
    .pf-yr span { display: block; font-size: 8px; font-weight: 400; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-lo); margin-top: 1px; }
    .pf-what { font-size: 12.5px; color: var(--text-hi); line-height: 1.5; }
    .pf-what b { font-weight: 500; }
    .pf-where { font-family: var(--mono); font-size: 9px; letter-spacing: 0.06em; color: var(--text-lo); margin-top: 4px; }
    .pf-basis { font-size: 11.5px; color: var(--text-mid); line-height: 1.55; margin-top: 6px; }
    .pf-cite { font-family: var(--mono); font-size: 9px; letter-spacing: 0.04em; color: var(--text-lo); line-height: 1.7; margin-top: 5px; }
    .pf-tier {
      display: inline-block; font-family: var(--mono); font-size: 8px; letter-spacing: 0.14em;
      text-transform: uppercase; border: 1px solid var(--border-hi); border-radius: 2px;
      padding: 1px 6px; margin-right: 7px; color: var(--text-mid); vertical-align: 1px;
    }
    .pf-tier.high { background: var(--accent); border-color: var(--accent); color: #fff; }
    .pf-tier.short { background: var(--short-dim); border-color: rgba(230,112,51,0.45); color: #b25620; }

    /* site reading: measured facts, laid out as facts */
    .pf-ctx { padding: 12px 0 4px; border-bottom: 1px solid var(--border-hi); margin-bottom: 4px; }
    .ctx-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px 20px; }
    .ctx-cell label { display: block; font-family: var(--mono); font-size: 8px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-lo); margin-bottom: 4px; }
    .ctx-cell .ctx-v { font-size: 13px; color: var(--text-hi); }
    .ctx-cell .ctx-b { font-family: var(--mono); font-size: 9px; color: var(--text-lo); line-height: 1.6; margin-top: 2px; }
    .ctx-mix { display: flex; flex-wrap: wrap; gap: 3px 12px; }
    .ctx-n { font-size: 11.5px; color: var(--text-mid); }
    .ctx-n b { font-family: var(--mono); font-size: 12px; color: var(--text-hi); font-weight: 500; }

    /* the three figures the rates produce. Deliberately the only large type in the forecast,
       and deliberately sitting under the sentence that says what they rest on */
    .sv-fig { display: flex; flex-wrap: wrap; gap: 10px; }
    .sv-cell {
      flex: 1 1 150px; background: var(--accent-dim); border: 1px solid rgba(23,47,199,0.22);
      padding: 11px 13px; display: flex; flex-direction: column; gap: 3px;
    }
    .sv-v { font-size: 21px; font-weight: 300; letter-spacing: -0.02em; color: var(--accent); }
    .sv-k {
      font-family: var(--mono); font-size: 8px; letter-spacing: 0.14em;
      text-transform: uppercase; color: var(--text-lo);
    }
    .pf-sup { margin-top: 7px; }
    .pf-stand {
      display: inline-block; font-family: var(--mono); font-size: 8px; letter-spacing: 0.12em;
      text-transform: uppercase; border-radius: 2px; padding: 1px 6px; border: 1px solid var(--border-hi); color: var(--text-mid);
    }
    .pf-stand.supported { background: rgba(23,47,199,0.08); border-color: rgba(23,47,199,0.35); color: var(--accent); }
    .pf-stand.unsupported { background: var(--short-dim); border-color: rgba(230,112,51,0.45); color: #b25620; }
    .pf-for, .pf-agn, .pf-ctxrow { font-size: 11.5px; line-height: 1.55; margin-top: 3px; }
    .pf-chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px; }
    .pf-chip { font-size: 10.5px; line-height: 1.5; padding: 2px 8px; border-radius: 10px;
      border: 1px solid rgba(23,47,199,0.22); background: var(--accent-dim); color: var(--accent); }
    .pf-chip.neg { border-color: rgba(230,112,51,0.45); background: var(--short-dim); color: #b25620; }
    .pf-for { color: var(--text-mid); }
    .pf-agn { color: #b25620; }
    .pf-ctxrow { color: var(--text-lo); }

    /* M9 — the discourse read. Dashed left rule so it never reads as the measured block
       above it: one is a count of what is there, the other is what somebody published. */
    .pf-sig { border-left: 1px dashed var(--border-hi); padding-left: 10px; margin-top: 9px; }
    .pf-sig .pf-for b, .pf-sig .pf-ctxrow b { color: var(--text-hi); font-weight: 500; }
    .pf-sig .pf-agn b { color: #b25620; font-weight: 500; }
    .pf-sig-gh {
      font-family: var(--mono); font-size: 8px; letter-spacing: 0.16em; text-transform: uppercase;
      color: var(--text-lo); margin: 8px 0 3px;
    }
    .pf-sig-tag {
      font-family: var(--mono); font-size: 8.5px; letter-spacing: 0.08em;
      text-transform: uppercase; color: var(--text-lo); margin-left: 6px; white-space: nowrap;
    }
    .pf-sig-basis { font-size: 11px; line-height: 1.6; color: var(--text-lo); margin-top: 2px; }
    /* citations stay in the panel's own citation style — a default browser link here shouts
       louder than the finding it is attached to */
    .pf-cite a { color: inherit; text-decoration: none; border-bottom: 1px solid var(--border-hi); }
    .pf-cite a:hover { color: var(--accent); border-bottom-color: var(--accent); }

    .pf-signals .pf-sig-ch { margin-bottom: 11px; }
    .pf-sig-chname {
      font-family: var(--mono); font-size: 8px; letter-spacing: 0.16em; text-transform: uppercase;
      color: var(--text-lo); border-bottom: 1px solid var(--border-hi); padding-bottom: 3px; margin-bottom: 6px;
    }
    .pf-sig-item { padding: 5px 0 6px 9px; border-left: 2px solid var(--border-hi); margin-bottom: 5px; font-size: 11.5px; color: var(--text-mid); }
    .pf-sig-item.pf-dir-for { border-left-color: rgba(23,47,199,0.4); }
    .pf-sig-item.pf-dir-against { border-left-color: rgba(230,112,51,0.5); }
    .pf-sig-detail { font-size: 11px; line-height: 1.65; color: var(--text-lo); margin-top: 4px; }

    /* M10 — the moving read. Solid left rule, unlike M9's dashed one: these ARE numbers, they
       are just numbers measured somewhere larger than this parcel. The scale they were measured
       at is printed next to every one of them so that never gets lost. */
    .pf-dyn { border-left: 2px solid rgba(23,47,199,0.28); padding-left: 10px; margin-top: 9px; }
    .pf-dyn .pf-for b, .pf-dyn .pf-ctxrow b { color: var(--text-hi); font-weight: 500; }
    .pf-dyn .pf-agn b { color: #b25620; font-weight: 500; }
    .pf-dyn-tag {
      font-family: var(--mono); font-size: 8.5px; letter-spacing: 0.08em;
      text-transform: uppercase; color: var(--text-lo); margin-left: 6px; white-space: nowrap;
    }
    /* the trend chip is the one place a direction of travel is stated as such */
    .pf-tr {
      font-family: var(--mono); font-size: 8.5px; letter-spacing: 0.08em; text-transform: uppercase;
      padding: 1px 5px; border: 1px solid var(--border-hi); border-radius: 2px; margin-left: 6px;
      color: var(--text-lo); white-space: nowrap;
    }
    .pf-tr.rising { border-color: rgba(23,47,199,0.4); color: var(--accent); }
    .pf-tr.falling { border-color: rgba(230,112,51,0.5); color: #b25620; }
    .pf-tr.volatile { border-color: rgba(230,112,51,0.35); color: #b25620; }
    .pf-tr.unknown { border-style: dashed; }
    /* the series itself, printed as dated values so the reader can check the trend chip */
    .pf-series { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 8px; margin: 5px 0 3px; }
    .pf-sp { display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 52px; }
    .pf-sp-bar { width: 20px; background: rgba(23,47,199,0.18); border-top: 2px solid rgba(23,47,199,0.5); }
    .pf-sp-bar.neg { background: var(--short-dim); border-top-color: rgba(230,112,51,0.6); }
    .pf-sp-v { font-family: var(--mono); font-size: 9.5px; color: var(--text-hi); }
    .pf-sp-t { font-family: var(--mono); font-size: 8px; letter-spacing: 0.06em; color: var(--text-lo); }
    .pf-dyn-read { font-size: 11.5px; line-height: 1.6; color: var(--text-mid); margin-top: 3px; }
    .pf-dyn-cav { font-size: 11px; line-height: 1.6; color: var(--text-lo); margin-top: 3px; }
    .pf-dyn-gap { border-left-color: var(--border-hi); }
    .pf-dyn-item { padding: 7px 0 8px 9px; border-left: 2px solid rgba(23,47,199,0.28); margin-bottom: 6px; font-size: 11.5px; color: var(--text-mid); }
    .pf-dyn-item.pf-gap { border-left-style: dashed; border-left-color: var(--border-hi); }
    .pf-geo {
      font-family: var(--mono); font-size: 8px; letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--text-lo); border: 1px solid var(--border-hi); border-radius: 2px; padding: 1px 4px; margin-left: 6px;
    }

    .pf-branch { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--border-hi); }
    .pf-b-head { font-family: var(--mono); font-size: 8px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-lo); margin-bottom: 7px; }
    .pf-b-row { display: flex; gap: 10px; align-items: baseline; font-size: 11.5px; color: var(--text-mid); padding: 3px 0; }
    .pf-b-row .pf-b-yr { font-family: var(--mono); font-size: 10px; color: var(--text-lo); flex: 0 0 42px; }
    .pf-b-row b { color: var(--text-hi); font-weight: 500; }

    .pf-note { font-family: var(--mono); font-size: 9px; letter-spacing: 0.05em; color: var(--text-lo); line-height: 1.7; margin-top: 13px; padding-top: 11px; border-top: 1px solid var(--border-hi); }
    .pf-empty { font-size: 12px; color: var(--text-mid); line-height: 1.6; padding: 2px 0 4px; }
    /* the line a site-less run gets instead of the measured block. It had no rule at all, so
       it inherited the page's white ink onto the white card and was invisible: the run that
       most needs telling why there is nothing here was the one run that was not told. */
    .pf-nosite { font-size: 11.5px; color: var(--text-mid); line-height: 1.6; }
    /* the timeline runs but cannot move anything — say so before it is mistaken for a bug */
    .pf-flat {
      font-size: 12px; color: #b25620; line-height: 1.6; margin: 10px 0 2px;
      background: var(--short-dim); border: 1px solid rgba(230,112,51,0.35); border-radius: 3px; padding: 9px 12px;
    }
    .pf-flat b { font-weight: 500; }

    /* ── forecast charts ──────────────────────────────────────────────────────────────
       The panel was one continuous run of prose at one weight: everything it knew was in
       there and none of it was visible at a glance. Everything below draws figures the
       panel ALREADY had. Nothing here computes a new claim, and every chart sits above the
       prose that says where its numbers came from rather than replacing it. */

    /* the four figures the horizon is, before any of the reasoning for them */
    .pf-glance { display: flex; flex-wrap: wrap; gap: 8px; padding: 13px 0 3px; }
    .pf-g { flex: 1 1 130px; border: 1px solid var(--border-hi); padding: 9px 11px; }
    .pf-g .g-v { font-size: 19px; font-weight: 300; letter-spacing: -0.02em; color: var(--text-hi); }
    .pf-g .g-v.long { color: var(--accent); }
    .pf-g .g-v.short { color: #b25620; }
    .pf-g .g-k {
      font-family: var(--mono); font-size: 8px; letter-spacing: 0.14em;
      text-transform: uppercase; color: var(--text-lo); margin-top: 2px;
    }
    .pf-g .g-b { font-family: var(--mono); font-size: 9px; color: var(--text-lo); margin-top: 3px; line-height: 1.5; }

    /* the horizon drawn once. Same-year events take their own lane so nothing is hidden
       under anything else; the cards below carry what each dot is. */
    .pf-tl { padding: 15px 0 6px; }
    .pf-tl-lane { position: relative; height: 15px; }
    .pf-tl-mk { position: absolute; top: 3px; transform: translateX(-50%); }
    .pf-tl-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); display: block; }
    .pf-tl-dot.short { background: #E67033; border-radius: 1px; }
    .pf-tl-dot.alt { background: var(--surface); border: 1px solid var(--border-hi); }
    /* the bottom margin is the tick labels' room: they hang off the axis absolutely, so
       nothing below it would otherwise know they are there */
    .pf-tl-axis { position: relative; height: 1px; background: var(--border-hi); margin-bottom: 18px; }
    .pf-tl-tick { position: absolute; top: 0; width: 1px; height: 5px; background: var(--border-hi); }
    .pf-tl-tick span {
      position: absolute; top: 7px; left: 50%; transform: translateX(-50%);
      font-family: var(--mono); font-size: 8px; color: var(--text-lo); white-space: nowrap;
    }
    .pf-tl-key { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-top: 6px; }
    .pf-tl-key span { display: flex; align-items: center; gap: 5px; font-family: var(--mono); font-size: 8.5px; letter-spacing: 0.06em; color: var(--text-lo); }

    /* one bar row: label, track, figure. Used for the ring counts and for anything else
       that is a set of counts against the largest of them. */
    .cbar { display: grid; grid-template-columns: 132px 1fr 30px; gap: 10px; align-items: center; padding: 2px 0; }
    .cb-k { font-size: 11.5px; color: var(--text-mid); }
    .cb-t { height: 8px; background: rgba(20,24,32,0.06); }
    .cb-t i { display: block; height: 100%; background: rgba(23,47,199,0.5); }
    .cb-v { font-family: var(--mono); font-size: 10px; color: var(--text-hi); text-align: right; }
    .cbar.thin .cb-k { color: #b25620; }
    .cbar.thin .cb-t i { background: rgba(230,112,51,0.55); min-width: 1px; }

    /* drawn against what the code allows, on one track scaled to whichever is larger, with
       the allowance marked. Over the line is orange, because over the line is the finding. */
    .cap-t { position: relative; height: 10px; background: rgba(20,24,32,0.06); margin: 5px 0 4px; }
    .cap-t i { display: block; height: 100%; background: rgba(23,47,199,0.5); }
    .cap-t i.over { background: rgba(230,112,51,0.6); }
    .cap-t u { position: absolute; top: -3px; width: 1px; height: 16px; background: var(--text-hi); }
    .cap-l { display: flex; justify-content: space-between; gap: 12px; font-family: var(--mono); font-size: 9px; color: var(--text-lo); }

    /* how much of a compiled set actually argues anything, as one bar */
    .stk { display: flex; height: 8px; background: rgba(20,24,32,0.06); margin: 6px 0 5px; }
    .stk i { display: block; height: 100%; }
    .stk i.ok { background: rgba(23,47,199,0.5); }
    .stk i.no { background: rgba(230,112,51,0.5); }
    .stk i.gap { background: rgba(20,24,32,0.14); }
    .stk-key { display: flex; flex-wrap: wrap; gap: 4px 14px; font-family: var(--mono); font-size: 8.5px; color: var(--text-lo); }
    .stk-key span { display: flex; align-items: center; gap: 5px; }
    .stk-key b { width: 8px; height: 8px; display: block; }
    .stk-key b.ok { background: rgba(23,47,199,0.5); }
    .stk-key b.no { background: rgba(230,112,51,0.5); }
    .stk-key b.gap { background: rgba(20,24,32,0.14); }

    /* The methodology block is what the panel rests on, so it is kept in full and folded
       away rather than cut: open it and every claim is qualified, closed and the figures
       above are not competing with a page of grey type. */
    .pf-foot { font-size: 11.5px; line-height: 1.6; color: var(--text-lo); margin-top: 16px; }
    .pf-fold { margin-top: 14px; border-top: 1px solid var(--border-hi); padding-top: 10px; }
    .pf-fold > summary, .pf-more > summary, .pf-set > summary {
      list-style: none; cursor: pointer; font-family: var(--mono); font-size: 8.5px;
      letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-lo);
    }
    .pf-fold > summary::-webkit-details-marker,
    .pf-more > summary::-webkit-details-marker,
    .pf-set > summary::-webkit-details-marker { display: none; }
    .pf-fold > summary::before, .pf-more > summary::before, .pf-set > summary::before { content: '▸ '; }
    .pf-fold[open] > summary::before, .pf-more[open] > summary::before, .pf-set[open] > summary::before { content: '▾ '; }
    .pf-fold > summary:hover, .pf-more > summary:hover, .pf-set > summary:hover { color: var(--accent); }

    /* ── the panel's own parts ─────────────────────────────────────────────────────────
       It ran as one column of same-weight blocks with a small mono label every few screens,
       so there was no way to tell where one part ended or how many were left. A number, a
       title, and one line saying what kind of claim the part makes. */
    .pf-sec {
      display: flex; align-items: baseline; flex-wrap: wrap; gap: 3px 10px;
      margin: 24px 0 11px; padding-top: 15px; border-top: 1px solid var(--border-hi);
    }
    .pf-sec .s-n { font-family: var(--mono); font-size: 9px; letter-spacing: 0.14em; color: var(--accent); }
    .pf-sec .s-t { font-size: 14px; font-weight: 500; color: var(--text-hi); }
    .pf-sec .s-s { flex: 1 1 260px; font-size: 11.5px; line-height: 1.5; color: var(--text-lo); }

    /* the evidence under one change, folded. The claim, where it lands and why it is dated
       there stay on screen; the four kinds of backing behind them are one click down, with
       their verdicts named on the summary so nothing has to be opened to be known. */
    .pf-more { margin-top: 9px; }
    .pf-more[open] { padding-bottom: 2px; }
    /* a whole compiled set, folded. The lead sentence and the bar stay out. */
    .pf-set { margin-top: 10px; }

    /* ── STICKY FOOTER ── */
    #footer-bar {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 25;
      display: none;
      background: rgba(255,255,255,0.92); backdrop-filter: blur(12px);
      border-top: 1px solid var(--border-hi);
      padding: 13px 40px;
    }
    body.review-active #footer-bar { display: block; }
    #footer-inner { max-width: 1020px; margin: 0 auto; display: flex; align-items: center; gap: 26px; flex-wrap: wrap; }
    .ft-stat { display: flex; flex-direction: column; gap: 1px; }
    .ft-stat .k { font-family: var(--mono); font-size: 8px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--text-lo); }
    .ft-stat .v { font-family: var(--mono); font-size: 13px; font-weight: 500; color: var(--text-hi); }
    #btn-restart {
      margin-left: auto;
      font-family: var(--mono); font-size: 11px; letter-spacing: 0.03em;
      background: transparent; border: 1px solid var(--border-hi); border-radius: 3px;
      color: var(--text-mid); padding: 9px 14px; cursor: pointer;
      transition: color 0.15s, border-color 0.15s;
    }
    #btn-restart:hover { color: var(--accent); border-color: rgba(23,47,199,0.35); }

    /* review-footer back: same arrow button as the wizard's, but on the white footer —
       outlined in the dark border colour instead of the light one */
    .btn-back-arrow-light { background: transparent; border: 1px solid var(--border-hi); }
    .btn-back-arrow-light svg { stroke: var(--text-mid); }
    .btn-back-arrow-light:hover { background: var(--accent-dim); border-color: rgba(23,47,199,0.35); opacity: 1; }
    .btn-back-arrow-light:hover svg { stroke: var(--accent); }
    /* the arrow alone went to two different places depending on an invisible variable, so it
       carries the name of the one it is going to */
    #btn-back-review { width: auto; gap: 8px; padding: 0 13px 0 10px; }
    #bb-dest { font-family: var(--mono); font-size: 10px; letter-spacing: 0.08em; color: var(--text-mid); }
    #btn-back-review:hover #bb-dest { color: var(--accent); }
    #btn-build {
      font-family: var(--font); font-size: 13px; font-weight: 500; color: #F5F5F5;
      background: var(--accent); border: none; padding: 11px 24px; cursor: pointer;
      transition: opacity 0.15s;
    }
    #btn-build:hover { opacity: 0.85; }

    /* ══════════════ SITE FORECAST entry ══════════════ */
    /* This is the door to the whole intel layer and it used to be a line of small caps at
       the bottom of the dialog, which reads as a footnote. Same words, drawn as a control,
       in the shape the demo-site chips above it already use. */
    #forecast-link {
      display: none; /* shown by script only when NEXA/intel/data/site-*.js loaded */
      margin-top: 30px; padding: 7px 15px;
      border: 1px solid var(--ink-border); border-radius: 20px;
      font-family: var(--mono); font-size: 10px; letter-spacing: 0.1em;
      text-transform: uppercase; color: var(--ink-mid);
      cursor: pointer; user-select: none;
      transition: background 0.14s, border-color 0.14s, color 0.14s;
    }
    #forecast-link:hover { background: var(--ink-hover-dim); border-color: var(--ink-border-hi); color: var(--ink); }
    body.review-active #forecast-link { display: none !important; }

    #forecast {
      position: fixed; inset: 0; z-index: 40;
      display: none; overflow-y: auto;
      background: var(--bg);
      padding: 96px 0 80px; /* no side inset — the band runs edge to edge */
    }
    #forecast-inner { width: 100%; }
    #fc-head { display: flex; align-items: baseline; justify-content: space-between; gap: 20px; padding: 0 40px; }
    #fc-title { font-size: clamp(26px, 3.2vw, 38px); font-weight: 300; letter-spacing: -0.02em; color: var(--ink); margin-bottom: 8px; }
    #fc-title em { font-style: normal; }
    #fc-close {
      background: none; border: 1px solid var(--ink-border); color: var(--ink-mid);
      font-family: var(--mono); font-size: 10px; letter-spacing: 0.08em;
      padding: 6px 12px; cursor: pointer; flex-shrink: 0;
    }
    #fc-close:hover { border-color: var(--ink-border-hi); color: var(--ink); }
    #fc-scout {
      display: inline-block; background: none; border: 1px solid var(--ink-border); color: var(--ink-mid);
      font-family: var(--mono); font-size: 10px; letter-spacing: 0.08em;
      padding: 6px 12px; cursor: pointer; text-decoration: none;
    }
    #fc-scout:hover { border-color: var(--ink-border-hi); color: var(--ink); }
    /* site switcher — rendered only when more than one site data file is loaded */
    #fc-tabs { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 40px; margin: 16px 0 34px; }
    #fc-tabs:empty { display: none; }
    .fc-tab {
      background: none; border: 1px solid var(--ink-border); color: var(--ink-mid);
      font-family: var(--mono); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase;
      padding: 7px 14px; cursor: pointer;
    }
    .fc-tab:hover { border-color: var(--ink-border-hi); color: var(--ink); }
    .fc-tab.active { background: var(--ink); border-color: var(--ink); color: var(--accent); }

    /* observed history = one horizontal line; the scenarios are PARALLEL OPTIONS off its
       end, so they stack vertically rather than reading as a further sequence */
    #fc-band { display: flex; align-items: stretch; flex-wrap: nowrap; padding: 4px 24px 16px 0; }
    /* The history is a LANE CHART, not a single line: programs that coexisted in time
       (an ongoing district program, a rival development, a lot and the proposal to
       replace it) get their own row. Columns advance only when a new start-year does. */
    #fc-spine {
      flex: 0 0 auto;
      display: grid; grid-auto-columns: 190px; gap: 10px 34px; align-content: center;
    }
    .fc-tl-node {
      position: relative;
      display: flex; flex-direction: column; justify-content: center;
      border: 1px solid var(--ink-border); padding: 12px 14px;
    }
    .fc-tl-node.present { border-color: var(--ink-border-hi); }
    .fc-tl-node.parallel { border-style: dashed; opacity: 0.75; } /* coexisted; not this site's successor */
    /* arrow drawn only between a node and its documented successor in the next column */
    .fc-tl-node.succ::after {
      content: '→'; position: absolute; right: -25px; top: 50%; transform: translateY(-50%);
      font-family: var(--mono); font-size: 14px; color: var(--ink-lo);
    }
    .fc-tl-node .t { font-family: var(--mono); font-size: 9px; letter-spacing: 0.1em; color: var(--ink-lo); text-transform: uppercase; }
    .fc-tl-node .n { font-size: 12px; color: var(--ink); margin-top: 2px; }

    /* branch: one fork rail, then the option stack */
    #fc-fork { flex: 0 0 auto; align-self: stretch; width: 34px; position: relative; }
    #fc-fork::before { /* vertical rail spanning the options */
      content: ''; position: absolute; left: 16px; top: 12%; bottom: 12%;
      border-left: 1px dashed var(--ink-border-hi);
    }
    #fc-fork::after { /* stem from the last history node into the rail */
      content: ''; position: absolute; left: 0; right: 18px; top: 50%;
      border-top: 1px dashed var(--ink-border-hi);
    }
    #fc-options { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
    .fc-opt-row { display: flex; align-items: center; }
    .fc-opt-tick { flex: 0 0 auto; width: 22px; border-top: 1px dashed var(--ink-border-hi); }

    .fc-card {
      flex: 1 1 auto; min-width: 0;
      background: var(--surface); border: 1px solid var(--border-hi);
      padding: 16px 20px;
      /* minmax(0,·) on every track: a plain 1fr takes the paragraph's min-content width
         and overflows the card past the viewport edge */
      display: grid; grid-template-columns: minmax(0, 230px) minmax(0, 1fr) minmax(0, 240px);
      gap: 20px; align-items: center;
    }
    @media (max-width: 1100px) { .fc-card { grid-template-columns: minmax(0, 1fr); gap: 10px; } }
    .fc-card .sc-meta { font-family: var(--mono); font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-lo); }
    .fc-card .sc-name { font-size: 16px; font-weight: 500; color: var(--text-hi); }
    .fc-card .sc-note { font-size: 11.5px; color: var(--text-mid); line-height: 1.5; }
    .fc-card .sc-head { display: flex; flex-direction: column; gap: 4px; }
    .fc-card .sc-right { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
    .fc-mix { display: flex; height: 10px; width: 100%; overflow: hidden; }
    .fc-mix span { height: 100%; }
    .fc-mix-legend { display: flex; flex-wrap: wrap; gap: 4px 10px; font-family: var(--mono); font-size: 9px; color: var(--text-mid); }
    .fc-apply {
      background: var(--accent); color: #fff; border: none;
      font-family: var(--mono); font-size: 10px; letter-spacing: 0.08em;
      padding: 8px 14px; cursor: pointer;
    }
    .fc-apply:hover { opacity: 0.85; }
    /* cards no longer carry their own action — they state where they sit on the timeline */
    .fc-when {
      font-family: var(--mono); font-size: 9px; letter-spacing: 0.1em;
      text-transform: uppercase; color: var(--text-lo);
    }
    #fc-timeline {
      background: var(--ink); border: 1px solid var(--ink); color: var(--accent);
      font-family: var(--mono); font-size: 10px; letter-spacing: 0.08em;
      padding: 6px 12px; cursor: pointer; flex-shrink: 0;
    }
    #fc-timeline:hover { opacity: 0.85; }
  </style>
</head>
<body>

<canvas id="noise-canvas"></canvas>

  <!-- Brand mark -->
  <div id="brand">
    <div id="brand-mark" role="img" aria-label="NEXA"></div>
    <span id="brand-name">NEXA</span>
  </div>

  <!-- Shown by analyzing() while a step is off working. The line under the mark is the stage
       it is on, not a generic "loading". -->
  <div id="analyzing" role="status" aria-live="polite">
    <!-- The mark as four capsules, white, built to the same numbers as the NEXA-LOGO motion
         study (boar-plum-02908881.figma.site): one bar path, 30×108 with fully round ends,
         placed by cx/cy and rotated. Only the fourth bar moves. Geometry and stages are in
         the CSS below. -->
    <svg id="an-mark" viewBox="5 25 210 135" fill="none" role="img" aria-label="NEXA">
      <g class="an-b0"><path d="M30 15C30 6.716 23.284 0 15 0C6.716 0 0 6.716 0 15V93C0 101.284 6.716 108 15 108C23.284 108 30 101.284 30 93V15Z"/></g>
      <g class="an-b1"><path d="M30 15C30 6.716 23.284 0 15 0C6.716 0 0 6.716 0 15V93C0 101.284 6.716 108 15 108C23.284 108 30 101.284 30 93V15Z"/></g>
      <g class="an-b2"><path d="M30 15C30 6.716 23.284 0 15 0C6.716 0 0 6.716 0 15V93C0 101.284 6.716 108 15 108C23.284 108 30 101.284 30 93V15Z"/></g>
      <g class="an-b3"><path d="M30 15C30 6.716 23.284 0 15 0C6.716 0 0 6.716 0 15V93C0 101.284 6.716 108 15 108C23.284 108 30 101.284 30 93V15Z"/></g>
    </svg>
    <div id="an-step"></div>
  </div>

  <!-- Step indicator -->
  <!-- pips are built by updatePips() from steps.length, so adding a step needs no edit here -->
  <div id="step-indicator">
    <span id="step-num">01 / 05</span>
  </div>

  <!-- Where you are, for the two views that have no step pips. Written by showView(). -->
  <div id="view-label"></div>

  <!-- Wizard dialog -->
  <div id="dialog">
    <div id="answered"></div>

    <p id="question"><em>What building type</em><br>are we programming?</p>

    <div id="chips"></div>

    <div id="input-wrap">
      <button class="btn-send btn-back-arrow" id="btn-back" title="Back to the previous question" style="display:none;">
        <svg viewBox="0 0 18 18"><path d="M14 9H4M8 5L4 9l4 4"></path></svg>
      </button>

      <div class="input-row" id="row-site" style="display:none;">
        <input id="input-site" type="text" autocomplete="off" placeholder="e.g. 130 W College St, Los Angeles, CA 90012">
        <button class="btn-send" id="btn-site" disabled>
          <svg viewBox="0 0 18 18"><path d="M4 9h10M10 5l4 4-4 4"></path></svg>
        </button>
      </div>

      <div class="input-row" id="row-number" style="display:none;">
        <input id="input-number" type="number" min="0" autocomplete="off" placeholder="e.g. 20000">
        <span class="size-unit">m²</span>
        <button class="btn-send" id="btn-number" disabled>
          <svg viewBox="0 0 18 18"><path d="M4 9h10M10 5l4 4-4 4"></path></svg>
        </button>
      </div>

      <div class="input-row" id="row-floors" style="display:none;">
        <div class="size-fields">
          <span class="size-label">Above</span>
          <input id="floors-above" type="number" min="1" max="80" value="12">
          <span class="size-label" style="margin-left:10px;">Basement</span>
          <input id="floors-basement" type="number" min="0" max="10" value="2">
        </div>
        <button class="btn-send" id="btn-floors">
          <svg viewBox="0 0 18 18"><path d="M4 9h10M10 5l4 4-4 4"></path></svg>
        </button>
      </div>

      <!-- Step 2 also takes a whole sentence: a model reads it into the answers the chips
           and the three steps after this one would otherwise collect one at a time. -->
      <div class="input-row" id="row-brief" style="display:none;">
        <input id="input-brief" type="text" autocomplete="off" placeholder="or describe it: 8 floors of mixed-use, 12,000 m², a coffee shop and a gallery">
        <button class="btn-send" id="btn-brief" disabled>
          <svg viewBox="0 0 18 18"><path d="M4 9h10M10 5l4 4-4 4"></path></svg>
        </button>
      </div>

      <button id="btn-activities">Continue →</button>
    </div>

    <!-- Demo sites (step 1 only): the two sites the NEXA Intel layer already carries, so a
         click gives a working lookup without needing an LA address to hand -->
    <div id="site-demos" style="display:none;">
      <span class="sd-label">Demo sites</span>
      <button class="sd-chip" data-addr="1057 S San Pedro St, Los Angeles, CA 90015">City Market of LA</button>
      <button class="sd-chip" data-addr="130 W College St, Los Angeles, CA 90012">130 W College St</button>
    </div>

    <!-- Site lookup result (step 1 only) — filled by lookupSite(), hidden otherwise -->
    <div id="site-panel"></div>

    <!-- Rule-based Site Forecast for the found parcel: capacity envelope + the M3
         program-transition DB filtered by the parcel's current use. No API, no LLM. -->
    <div id="site-forecast"></div>
    <div id="site-actions" style="display:none;">
      <button id="site-continue" style="display:none;">continue →</button>
      <button id="site-skip">skip · no site yet</button>
      <a id="site-scout-link" href="NEXA/intel/site-scout.html" target="_blank">▸ full site scout</a>
    </div>

    <!-- What the model read out of the sentence typed at step 2 -->
    <div id="brief-panel"></div>

    <p id="hint"></p>

    <a id="forecast-link">▸ site forecast</a>
  </div>

  <!-- Review stage: floor card editor -->
  <div id="review">
    <div id="review-inner">
      <p id="review-title">Draft <em>program</em></p>
      <!-- Which scenario this draft came out of. Empty for a wizard-built one. -->
      <p id="rv-origin"></p>

      <!-- Which lines below came from the address, and from what figure. Empty when the
           site step was skipped. Filled by renderReview() from wiz.siteBrief. -->
      <!-- The floor cards and the raw text are two views of ONE program, so they sit in one
           pane: edit the cards, or paste a program file over them. The forecast is what that
           program becomes later, so it is the stage after, not a third thing to scroll past. -->
      <!-- The raw text is the escape hatch, not the main view, so it sits folded behind this
           icon and opens only when asked. -->
      <div id="rv-tabs">
        <button class="fc-tab active" data-rv="floors">Draft program</button>
        <button class="fc-tab" data-rv="forecast">Program forecast →</button>
        <button id="rv-raw-toggle" type="button" title="Write or load your own program text">
          <svg viewBox="0 0 18 18"><path d="M9 12V3M5.5 6.5L9 3l3.5 3.5M3.5 12v2.5h11V12"></path></svg>
          <span>upload yours</span>
          <em id="rv-raw-flag"></em>
        </button>
      </div>

      <div id="site-basis"></div>

      <div id="floors"></div>

      <div id="raw-panel">
        <div id="raw-head">
          <span class="rh-t">Raw text</span>
          <span class="rh-sub">Same program as the cards above. Edit it, or load a program file.</span>
          <button id="btn-raw-upload" class="rh-up" title="Load a program .txt file">
            <svg viewBox="0 0 18 18"><path d="M9 12V3M5.5 6.5L9 3l3.5 3.5M3.5 12v2.5h11V12"></path></svg>
            upload
          </button>
          <input type="file" id="raw-file" accept=".txt,text/plain" hidden>
        </div>
        <textarea id="raw-text" spellcheck="false"></textarea>
        <div id="raw-actions">
          <button id="btn-raw-apply" class="if-btn">Apply</button>
          <button id="btn-raw-revert" class="if-btn ghost">Revert</button>
          <span id="raw-note"></span>
        </div>
        <div id="raw-errors"></div>
      </div>

      <!-- What this program becomes over time. Filled by renderProgramForecast(); the same
           events are handed to the massing view's year slider on Build. -->
      <div id="prog-forecast"></div>
    </div>
  </div>

  <!-- Sticky footer (review stage only) -->
  <div id="footer-bar">
    <div id="footer-inner">
      <button class="btn-send btn-back-arrow-light" id="btn-back-review" title="Back. This draft is kept.">
        <svg viewBox="0 0 18 18"><path d="M14 9H4M8 5L4 9l4 4"></path></svg><span id="bb-dest">wizard</span>
      </button>
      <div class="ft-stat"><span class="k">Total GFA</span><span class="v" id="ft-gfa">—</span></div>
      <div class="ft-stat"><span class="k">Levels</span><span class="v" id="ft-range">—</span></div>
      <div class="ft-stat"><span class="k">Long / Short</span><span class="v" id="ft-split">—</span></div>
      <div class="ft-stat"><span class="k">8'-6" floors</span><span class="v" id="ft-shortfloors">—</span></div>
      <button id="btn-restart" title="Discard this draft and restart the wizard">↺ start over</button>
      <button id="btn-build">Build massing →</button>
    </div>
  </div>

  <!-- ── SITE FORECAST overlay (NEXA Intel layer — dormant unless data files loaded) ── -->
  <div id="forecast">
    <div id="forecast-inner">
      <div id="fc-head">
        <p id="fc-title">Site <em>forecast</em></p>
        <div style="display:flex;gap:8px;flex-shrink:0;">
          <button id="fc-timeline" style="display:none;">▸ open timeline in 3D</button>
          <a id="fc-scout" href="NEXA/intel/site-scout.html" target="_blank">▸ scout a new site</a>
          <button id="fc-close">✕ back to wizard</button>
        </div>
      </div>
      <div id="fc-tabs"></div>
      <div id="fc-band">
        <div id="fc-spine"></div>
        <div id="fc-fork"></div>
        <div id="fc-options"></div>
      </div>
    </div>
  </div>

  <datalist id="vocab-list"></datalist>


<!-- NEXA Intel data (optional — a missing file only leaves that site out; no file at all
     leaves the Site Forecast entry hidden). Adding a site = add its two tags here. -->
<script src="NEXA/intel/data/site-citymarket.js"></script>
<script src="NEXA/intel/data/scenarios-citymarket.js"></script>
<script src="NEXA/intel/data/site-collegest.js"></script>
<script src="NEXA/intel/data/scenarios-collegest.js"></script>
<script src="NEXA/intel/data/transitions.js"></script>
<!-- M9 site signals (policy, news, landmarks, district trend). Optional in the same way:
     a missing file just means the forecast has no signal read for that site. -->
<script src="NEXA/intel/data/signals-citymarket.js"></script>
<script src="NEXA/intel/data/signals-collegest.js"></script>
<!-- M10 site dynamics (the moving layer: footfall, events, leasing, demography, market).
     Optional in the same way. A missing file means the forecast has no dynamic read and
     ranks exactly as it did before M10. -->
<script src="NEXA/intel/data/dynamics-citymarket.js"></script>
<script src="NEXA/intel/data/dynamics-collegest.js"></script>

<script>
  // ── WebGL mouse-reactive noise background (verbatim from chat.html) ──
  (function() {
    const canvas = document.getElementById('noise-canvas');
    if (getComputedStyle(canvas).display === 'none') return; // all-white bg: shader disabled via CSS
    const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
    if (!gl) return;

    const vert = `
      attribute vec2 a_pos;
      void main() { gl_Position = vec4(a_pos, 0.0, 1.0); }
    `;
    const frag = `
      precision highp float;
      uniform vec2  u_res;
      uniform vec2  u_mouse;
      uniform float u_time;

      vec2 hash2(vec2 p) {
        p = vec2(dot(p,vec2(127.1,311.7)), dot(p,vec2(269.5,183.3)));
        return fract(sin(p)*43758.5453);
      }

      float voronoi(vec2 p) {
        vec2 i = floor(p), f = fract(p);
        float md = 8.0;
        for(int x=-2;x<=2;x++) for(int y=-2;y<=2;y++){
          vec2 g = vec2(float(x),float(y));
          vec2 o = hash2(i+g);
          o = 0.5 + 0.5*sin(u_time*0.4 + 6.2831*o);
          md = min(md, length(g + o - f));
        }
        return md;
      }

      float fbm(vec2 p) {
        float v=0.0, a=0.5;
        for(int i=0;i<5;i++){
          v += a*voronoi(p);
          p  = p*2.1 + vec2(1.7,9.2);
          a *= 0.5;
        }
        return v;
      }

      void main() {
        vec2 uv    = gl_FragCoord.xy / u_res;
        vec2 mouse = u_mouse / u_res;
        float md   = length(uv - mouse);
        float pull = smoothstep(0.6, 0.0, md) * 0.38;

        vec2 p = uv * 3.5 + vec2(u_time*0.055);
        p += (mouse - 0.5) * pull * 2.2;

        float n = fbm(p);
        n = smoothstep(0.28, 0.78, n);

        vec3 bg   = vec3(0.980, 0.980, 0.984);
        vec3 mark = vec3(0.910, 0.918, 0.960);
        vec3 col  = mix(bg, mark, n*0.85);
        col = mix(col, vec3(0.82, 0.85, 1.0), pull*n*0.55);

        gl_FragColor = vec4(col, 1.0);
      }
    `;

    function mkShader(type, src) {
      const s = gl.createShader(type);
      gl.shaderSource(s, src); gl.compileShader(s); return s;
    }
    const prog = gl.createProgram();
    gl.attachShader(prog, mkShader(gl.VERTEX_SHADER, vert));
    gl.attachShader(prog, mkShader(gl.FRAGMENT_SHADER, frag));
    gl.linkProgram(prog); gl.useProgram(prog);

    const buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,3,-1,-1,3]), gl.STATIC_DRAW);
    const loc = gl.getAttribLocation(prog, 'a_pos');
    gl.enableVertexAttribArray(loc);
    gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

    const uRes   = gl.getUniformLocation(prog, 'u_res');
    const uMouse = gl.getUniformLocation(prog, 'u_mouse');
    const uTime  = gl.getUniformLocation(prog, 'u_time');

    let W=0, H=0, mx=0, my=0, tmx=0, tmy=0;
    function resize() {
      W = canvas.width  = canvas.offsetWidth;
      H = canvas.height = canvas.offsetHeight;
      gl.viewport(0,0,W,H);
      mx=W/2; my=H/2; tmx=mx; tmy=my;
    }
    window.addEventListener('resize', resize);
    resize();
    window.addEventListener('mousemove', e => { tmx=e.clientX; tmy=H-e.clientY; });

    const t0 = performance.now();
    function frame(now) {
      mx += (tmx-mx)*0.06; my += (tmy-my)*0.06;
      gl.clearColor(0.98, 0.98, 0.984, 1.0);
      gl.uniform2f(uRes,   W, H);
      gl.uniform2f(uMouse, mx, my);
      gl.uniform1f(uTime,  (now-t0)*0.001);
      gl.clear(gl.COLOR_BUFFER_BIT);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  })();
</script>

<script>
  // ══════════════════════════════════════════════════════════════════
  // SHARED CLASSIFIERS + LINE VALIDATOR
  // ══════════════════════════════════════════════════════════════════
  const isCore = t => /fire stair|elevator|escalator|\bstair\b|\bcore\b|shaft/i.test(t); // copied from program-massing-shortfloor.html — keep in sync
  const isFreight = t => /freight/i.test(t); // copied from program-massing-shortfloor.html — keep in sync
