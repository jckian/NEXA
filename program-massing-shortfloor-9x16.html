<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- LAYOUT ROUTE. A portrait screen (phone held upright) gets the 9:16 cut of this page,
       a landscape one gets the wide cut. Runs before anything heavy loads, so the wrong
       version is never downloaded. ?layout=tall / ?layout=wide forces a choice and the tab
       remembers it, so a reader who overrides is not bounced back on the next page. -->
  <script>
    (function () {
      var WIDE = "program-massing-shortfloor.html", TALL = "program-massing-shortfloor-9x16.html";
      var here = location.pathname.split("/").pop();
      var pick = new URLSearchParams(location.search).get("layout");
      try {
        if (pick === "tall" || pick === "wide") sessionStorage.setItem("nexaLayout", pick);
        else pick = sessionStorage.getItem("nexaLayout");
      } catch (e) {}
      if (pick !== "tall" && pick !== "wide") pick = innerHeight > innerWidth ? "tall" : "wide";
      var want = pick === "tall" ? TALL : WIDE;
      if (here !== want) location.replace(want + location.search + location.hash);
    })();
  </script>

  <title>Program Massing — SHORT-floor variant (8'-6" plug-in storeys) · 9:16</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #F5F5F5; --blue: #172FC7; --orange: #E67033; --yellow: #EEC341;
      --panel-bg: rgba(255, 255, 255, 0.90);
      --border: rgba(23, 47, 199, 0.28); --border-dim: rgba(23, 47, 199, 0.12);
      --text-hi: #172FC7; --text-mid: rgba(23, 47, 199, 0.66); --text-lo: rgba(23, 47, 199, 0.42);
      --radius-lg: 12px; --radius-md: 8px; --radius-sm: 5px;
      /* one bar height for the whole viewport furniture: the mode switch over the model, the core
         options and the chat bar are all this tall. 57 px on a 950 px screen. */
      --floor-h: clamp(56px, 6vh, 66px);
      --bar-w: min(560px, calc(100vw - 620px));   /* the chat bar's width; the palette starts where it does */
    }
    body { background: var(--bg); font-family: 'Montserrat', Helvetica, Arial, sans-serif; overflow: hidden; color: var(--text-hi); }
    #canvas-container { position: fixed; inset: 0; }
    #title-block { position: fixed; top: 20px; left: 20px; z-index: 10; display: flex; align-items: center; gap: 10px; }
    /* Back to the program this massing was built from. The mark beside it starts a NEW one,
       which is a different thing and used to be the only way out of this page: pressing it to
       go back threw the draft away and reopened the wizard at question one. This returns to
       the draft still sitting in localStorage, so the trip is program -> massing -> program.
       Hidden when there is no draft to return to (the page opened on its own sample). */
    #to-program {
      display: none; align-items: center; gap: 6px; height: 26px; padding: 0 12px;
      background: var(--panel-bg); border: 1px solid var(--border); border-radius: 999px;
      backdrop-filter: blur(16px);
      font-family: inherit; font-size: 8.5px; letter-spacing: 0.14em; text-transform: uppercase;
      color: var(--text-mid); text-decoration: none;
      transition: color 0.15s, border-color 0.15s;
    }
    #to-program.on { display: inline-flex; }
    #to-program:hover { color: var(--text-hi); border-color: var(--text-hi); }
    #to-program svg { width: 12px; height: 12px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    /* The mark, cut out and inlined. NEXA-logo.png is fully opaque — 107,502 pixels, none
       transparent, 65,961 of them white — so it drew a white box over the viewport. The cut-out
       exists as NEXA-logo-mask.png, but a CSS mask (which is what the other pages use) loads
       nothing when the page is opened over file://, and these pages are meant to open by
       double-click: the mark simply vanished. So the mask's alpha is baked into a brand-blue PNG,
       trimmed to the artwork, and inlined as a data URI. No external file, no mask support needed,
       identical over file:// and http://. */
    #title-block .mark { height: 24px; width: auto; display: block; }   /* the data URI is trimmed to the artwork, so this height is all mark, no margin */
    /* The mark starts a NEW program, at the wizard's first question. Hover is the only
       affordance it needs: the cursor and a small fade say it is a link. Scoped to the mark,
       not to every anchor in the block: it used to be #title-block a, which outranks a bare id
       selector and so forced the back link beside it visible whether or not it had a draft. */
    #title-block .tb-mark { display: block; transition: opacity 0.15s; }
    #title-block .tb-mark:hover { opacity: 0.55; }
    /* Nothing in this UI casts a shadow — panels, toolbar, chat bar, add-block strip, tooltip.
       Border plus blur is the whole separation. The `--shadow` token went with it, so a new
       element cannot pick one up by habit. */
    .panel { position: fixed; background: var(--panel-bg); border: 1px solid var(--border); border-radius: var(--radius-lg); z-index: 10; backdrop-filter: blur(16px); }
    /* Left column: Layout · Program and Adaptive use are two tabs of one stack, same left edge,
       same width, and only one of them is open at a time (the #right-stack idiom, mirrored). */
    #left-stack { position: fixed; top: 70px; left: 20px; bottom: 20px; width: 248px; display: flex; flex-direction: column; gap: 10px; z-index: 11; pointer-events: none; }
    #left-stack > * { pointer-events: auto; }
    /* The panel itself never scrolls: the layout controls are fixed under the header and the
       program list below them takes the rest of the column and scrolls on its own. */
    #left-panel { position: static; width: 100%; flex: 0 1 auto; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
    #left-panel > #layout-section { display: flex; flex-direction: column; min-height: 0; flex: 1 1 auto; }
    #left-body { display: flex; flex-direction: column; min-height: 0; flex: 1 1 auto; }
    #layout-body { flex: none; }
    #prog-section { display: flex; flex-direction: column; min-height: 0; flex: 1 1 auto; border-top: 1px solid var(--border-dim); margin-top: 8px; }
    /* With its body closed the Layout panel is just a tab header, and a tab header must never be
       the thing that gives up room to the panel below it. Measured 260730: it was being squeezed
       from 35 px to 15 px and clipped, while Program and Adaptive sat at their full 38 px. */
    #left-panel.collapsed { flex: none; overflow: visible; }
    .acc-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; background: none; border: none; cursor: pointer; font-family: inherit; font-size: 8px; letter-spacing: 0.22em; text-transform: uppercase; font-weight: 600; color: var(--text-lo); padding: 14px 16px 10px; }
    .acc-head:hover { color: var(--text-mid); }
    .acc-head.open { color: var(--text-hi); }
    .acc-head .chev { font-size: 9px; letter-spacing: 0; transition: transform 0.15s; }
    .acc-head.open .chev { transform: rotate(180deg); }
    #right-stack { position: fixed; top: 20px; right: 20px; width: 248px; display: flex; flex-direction: column; gap: 12px; max-height: calc(100vh - 40px); z-index: 10; }
    /* One panel, three folds (Statistics · Code check · Export), one open at a time — the same
       accordion the left column uses. Two stacked panels meant the export checkboxes pushed the
       statistics off a short screen, so reading a number meant scrolling a column. */
    #right-panel { position: static; width: 100%; min-height: 0; flex: 0 1 auto; overflow-y: auto; }
    /* Chatbot, Statistics, Code check and Export are four cards in the column now, so the
       stack lays each of them out instead of .panel positioning itself. */
    #right-stack > .panel { position: static; width: 100%; min-height: 0; flex: 0 1 auto; overflow-y: auto; }
    #right-panel .acc-head { padding: 14px 16px 10px; }
    .panel h2 { font-size: 8px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--text-lo); padding: 14px 16px 10px; font-weight: 600; }
    .panel-section { border-top: 1px solid var(--border-dim); }
    .ctrl-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; padding: 4px 16px 12px; }
    .ctrl-field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
    .ctrl-field.full { grid-column: 1 / -1; }
    #move-controls { display: contents; }
    .ctrl-field label { font-size: 8.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-lo); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ctrl-field input, .ctrl-field select { width: 100%; min-width: 0; background: rgba(23,47,199,0.05); border: 1px solid var(--border-dim); border-radius: var(--radius-sm); color: var(--text-hi); padding: 6px 8px; font-family: inherit; font-size: 11px; outline: none; }
    .seg { display: flex; width: 100%; border: 1px solid var(--border-dim); border-radius: var(--radius-sm); overflow: hidden; }
    .seg button { flex: 1 1 0; min-width: 0; padding: 6px 4px; border: none; border-left: 1px solid var(--border-dim); background: rgba(23,47,199,0.05); color: var(--text-mid); font-family: inherit; font-size: 9.5px; letter-spacing: 0.03em; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .seg button:first-child { border-left: none; }
    .seg button.active { background: #172FC7; color: #fff; }
    .btn { display: block; width: calc(100% - 32px); margin: 0 16px 14px; padding: 10px; border: none; border-radius: var(--radius-md); background: #E67033; color: #fff; font-family: inherit; font-size: 10px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer; }
    .btn.ghost { background: rgba(23,47,199,0.06); color: var(--text-hi); border: 1px solid var(--border-dim); }
    .btn:hover { opacity: 0.88; }
    .btn.small { width: auto; flex: 1 1 0; margin: 0; padding: 6px; font-size: 9px; }
    .exp-grp { font-size: 8px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--text-lo); font-weight: 600; padding: 8px 16px 2px; }
    .struct-chk-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 10px; padding: 4px 16px 8px; }
    .struct-chk-grid label { display: flex; align-items: center; gap: 6px; font-size: 10px; color: var(--text-mid); cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .struct-chk-grid input[type=checkbox] { accent-color: var(--blue); width: 13px; height: 13px; cursor: pointer; flex-shrink: 0; }
    .struct-chk-btns { display: flex; gap: 8px; margin: 0 16px 12px; }
    textarea#paste { width: calc(100% - 32px); margin: 0 16px 12px; height: 90px; resize: vertical; background: rgba(23,47,199,0.05); border: 1px solid var(--border-dim); border-radius: var(--radius-sm); color: var(--text-hi); font-family: monospace; font-size: 10px; padding: 8px; outline: none; }
    input[type=file] { display: none; }
    #legend { padding: 4px 16px 14px; }
    #stats { padding: 4px 16px 14px; }
    /* Site leads the panel, so it carries the divider below it rather than above */
    #site-section { border-bottom: 1px solid var(--border-dim); }
    #site-info { padding: 4px 16px 14px; }
    .site-row { font-size: 10px; color: var(--text-mid); margin-bottom: 6px; line-height: 1.45; }
    .site-row .sk { display: block; font-size: 8px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--text-lo); font-weight: 600; margin-bottom: 1px; }
    .site-row b { color: var(--text-hi); }
    #site-info .site-note { font-size: 8px; letter-spacing: 0.06em; color: var(--text-lo); line-height: 1.6; margin-top: 8px; }
    /* one fact per line, label left and value right, so the column can be scanned down */
    #site-info .site-kv { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; font-size: 10px; color: var(--text-lo); margin-bottom: 5px; line-height: 1.4; }
    #site-info .site-kv > span:first-child { white-space: nowrap; }
    #site-info .site-kv .v { color: var(--text-hi); font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; }
    #site-info .site-kv .v.hot { color: var(--orange); }
    #site-info .site-kv .v.dim { color: var(--text-lo); font-weight: 400; font-style: italic; }
    #site-info .site-gap { height: 7px; }
    /* the address IS the disclosure: closed, the panel is one line that says where you are */
    #site-details summary { list-style: none; cursor: pointer; padding: 2px 0 0; }
    #site-details summary::-webkit-details-marker { display: none; }
    #site-details .site-addr { margin-bottom: 0; }
    #site-details .site-addr b { display: block; padding-left: 11px; text-indent: -11px; }
    #site-details .site-addr b::before { content: '▸ '; color: var(--text-lo); }
    #site-details[open] .site-addr b::before { content: '▾ '; }
    #site-details summary:hover .sk, #site-details summary:hover .site-addr b::before { color: var(--text-mid); }
    #site-details .site-det { padding-top: 9px; }
    #site-info .site-sep { border-top: 1px solid var(--border-dim); margin: 10px 0 9px; }
    #site-info .site-map { display: inline-block; font-size: 9px; color: var(--text-mid); text-decoration: none; border-bottom: 1px solid var(--border-dim); }
    #site-info .site-map:hover { color: var(--text-hi); }
    .stat-row { display: flex; justify-content: space-between; font-size: 10px; color: var(--text-mid); margin-bottom: 5px; }
    .stat-row b { color: var(--text-hi); font-variant-numeric: tabular-nums; }
    .stat-total { border-top: 1px solid var(--border-dim); margin-top: 6px; padding-top: 7px; font-size: 11px; }
    .code-cap { font-size: 8.5px; line-height: 1.5; color: var(--text-lo); margin-bottom: 8px; }
    .code-cap .flag { color: var(--orange); }
    .code-status { display: flex; justify-content: space-between; align-items: center; font-size: 11px; margin-bottom: 8px; padding-bottom: 8px; border-bottom: 1px solid var(--border-dim); }
    .code-status b { font-variant-numeric: tabular-nums; letter-spacing: 0.02em; }
    .code-sub { font-size: 8px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--text-lo); font-weight: 600; margin: 11px 0 5px; }
    .code-row span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-right: 10px; }
    .code-row b { flex-shrink: 0; white-space: nowrap; }
    #tooltip { position: fixed; pointer-events: none; z-index: 20; display: none; background: rgba(255,255,255,0.96); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 6px 10px; font-size: 10px; color: var(--text-hi); white-space: nowrap; }
    #drop-overlay { position: fixed; inset: 0; z-index: 50; display: none; background: rgba(23,47,199,0.08); backdrop-filter: blur(3px); align-items: center; justify-content: center; border: 3px dashed var(--border); }
    #drop-overlay span { font-size: 16px; letter-spacing: 0.1em; }
    /* Floating viewport toolbar (VORO bottombar idiom): the two switches that change what the
       model IS live over the model, not in the parameter list. Top of the viewport, render mode
       first and core option under it, both centred and both cut to the same size. */
    /* Same height as the chat bar and the core options (--floor-h), so the three pieces of
       furniture around the model read as one system. The inner sizes still follow the viewport. */
    /* ── ANALYSIS STAGE ──
       The workflow's last step, so it is allowed to take the screen: site, program, massing,
       then this. It covers the model instead of replacing it, and the mode switch stays on top
       (z 12) so stepping back is one click away from where the eye already is. */
    /* above the side panels (10 / 11) and the chat bar (12); the mode switch is lifted to 14
       so the way back out stays on top of it */
    #analysis-stage {
      position: fixed; inset: 0; z-index: 13; display: none;
      background: rgba(245, 245, 245, 0.97);
      backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
      overflow-y: auto; padding: calc(var(--floor-h) + clamp(34px, 7vh, 76px)) 40px 60px;
    }
    #analysis-stage.on { display: block; animation: an-stage-in 0.24s ease both; }
    @keyframes an-stage-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    /* Three columns, and the order is the argument: MEASURED off the program, ASSUMED by the
       reader, then DERIVED from the two. Each column holds exactly one of those and nothing
       else, so which kind a figure is never has to be stated in words.
       Areas rather than raw columns, because the collapse is not a straight stack: at the
       middle width the derived column keeps its own full-height column beside the other two,
       and only below that does everything fall into one. */
    #analysis-inner {
      max-width: 1440px; margin: 0 auto;
      display: grid;
      grid-template-columns: minmax(0, 1.05fr) minmax(0, 0.78fr) minmax(0, 1.22fr);
      grid-template-areas: "left mid right";
      gap: clamp(24px, 2.8vw, 52px); align-items: start;
    }
    #an-left { grid-area: left; }
    #an-mid { grid-area: mid; }
    #an-right { grid-area: right; }
    /* `top` here is measured from the scrollport, and the scrollport already starts under the
       stage's own padding, so repeating the padding value in `top` pushed the column a second
       padding down before anything had even scrolled. 16px is clear of the mode switch, which
       is fixed over the stage rather than inside it. */
    #an-left { position: sticky; top: 16px; }
    /* in its own column the table starts at the top: the rule above it was a divider from the
       block it used to sit under */
    #an-mid .an-rates { margin-top: 0; padding-top: 0; border-top: none; }
    /* nothing rests on a rate yet (no timeline, or a stale one), so there are no other columns
       to hold the first one to a third of the page */
    #analysis-inner.solo { grid-template-columns: 1fr; grid-template-areas: "left"; }
    #analysis-inner.solo #an-left { position: static; max-width: 760px; }
    @media (max-width: 1280px) {
      #analysis-inner {
        grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr);
        grid-template-areas: "left right" "mid right";
        gap: clamp(22px, 3vw, 40px);
      }
    }
    @media (max-width: 940px) {
      #analysis-inner { grid-template-columns: 1fr; grid-template-areas: "left" "mid" "right"; gap: 26px; }
      #an-left { position: static; }
    }
    .an-step-mark {
      font-size: 10px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--text-lo); margin-bottom: 10px;
    }
    .an-step-mark b { color: var(--blue); font-weight: 700; }
    #an-title {
      font-size: clamp(28px, 4vw, 46px); font-weight: 300; letter-spacing: -0.02em;
      color: var(--text-hi); margin-bottom: 8px;
    }
    /* the measured sentence, which every figure below is derived from */
    .an-lede { font-size: clamp(14px, 1.5vw, 17px); line-height: 1.6; color: var(--text-mid); }
    .an-lede b { color: var(--text-hi); font-weight: 500; }
    /* the three figures, still the largest type in their column. The sizes came down with the
       column: at the old clamp one cell of three filled half the right-hand side. */
    .an-figs { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 11px; margin: 0 0 18px; }
    .an-cell {
      background: #fff; border: 1px solid var(--border);
      border-radius: var(--radius-lg); padding: 16px 17px;
    }
    /* nowrap: a third of a third of the page is narrow enough that "2,496 m²" broke across two
       lines, which reads as two figures for a moment */
    .an-v { display: block; font-size: clamp(23px, 1.9vw, 31px); font-weight: 300; letter-spacing: -0.03em; color: var(--blue); line-height: 1.05; white-space: nowrap; }
    .an-k { display: block; margin-top: 8px; font-size: 10px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-lo); }
    .an-sub { display: block; margin-top: 7px; font-size: 12px; line-height: 1.5; color: var(--text-mid); }
    /* ── the two charts ──────────────────────────────────────────────────────────────
       This page is about a DIFFERENCE, and a difference is the one thing a single number
       hides: $6.0M says nothing about what it is 6.0M less than. Both charts draw figures
       the page already carried; neither computes a new claim. */

    /* what changes, against what is built. Entirely measured, so it sits above the line
       where the assumed rates start. */
    .an-share { margin: 22px 0 0; }
    .an-share .sh-t { display: flex; height: 14px; border-radius: 3px; overflow: hidden; background: rgba(20,24,32,0.07); }
    .an-share .sh-t i { display: block; height: 100%; }
    .an-share .sh-t i.conv { background: var(--blue); }
    .an-share .sh-k { display: flex; flex-wrap: wrap; gap: 6px 20px; margin-top: 9px; font-size: 11.5px; color: var(--text-mid); }
    .an-share .sh-k span { display: flex; align-items: center; gap: 6px; }
    .an-share .sh-k b { width: 9px; height: 9px; border-radius: 2px; display: block; }
    .an-share .sh-k b.conv { background: var(--blue); }
    .an-share .sh-k b.rest { background: rgba(20,24,32,0.14); }
    .an-share .sh-churn { font-size: 11.5px; line-height: 1.6; color: var(--text-lo); margin-top: 8px; }
    /* Turnover is the plug-in kit re-letting, so it is orange here too — the same colour the
       model paints a re-plugged zone in, and the year chip its rule carries. The sentence
       stays quiet; only the figure takes the colour. */
    .an-share .sh-churn b { color: var(--orange); font-weight: 600; font-variant-numeric: tabular-nums; }
    .an-lede b.plug { color: var(--orange); }

    /* the counterfactual: two bars on one scale, and the gap between them named */
    .an-cf { margin: 22px 0 2px; }
    .an-cf-h { font-size: 10px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-lo); margin-bottom: 10px; }
    .an-cf-row { display: grid; grid-template-columns: 152px 1fr 86px; gap: 12px; align-items: center; margin-bottom: 7px; }
    .an-cf-k { font-size: 12px; color: var(--text-mid); }
    .an-cf-t { height: 16px; background: rgba(20,24,32,0.05); border-radius: 3px; }
    .an-cf-t i { display: block; height: 100%; border-radius: 3px; background: rgba(20,24,32,0.3); }
    .an-cf-t i.keep { background: var(--blue); }
    .an-cf-v { font-size: 12px; text-align: right; color: var(--text-hi); }
    .an-cf-gap { font-size: 12px; color: var(--blue); padding-left: 164px; margin-top: 1px; }
    @media (max-width: 780px) {
      .an-cf-row { grid-template-columns: 1fr 72px; }
      .an-cf-k { grid-column: 1 / -1; }
      .an-cf-gap { padding-left: 0; }
    }

    /* The rates, as the table of assumptions they are. They sit at the foot of the left column,
       under the measured sentence, rather than beside the figures they produce: these are the
       five numbers the reader owns, and a row of loose inputs threaded between two charts read
       as part of the output. */
    .an-rates { margin-top: 24px; padding-top: 15px; border-top: 1px solid var(--border-dim); }
    .an-rates-h { font-size: 10px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-lo); margin-bottom: 11px; }
    table.an-rt { width: 100%; border-collapse: collapse; }
    .an-rt th {
      text-align: left; font-size: 9px; font-weight: 700; letter-spacing: 0.12em;
      text-transform: uppercase; color: var(--text-lo); padding: 0 0 7px; border-bottom: 1px solid var(--border-dim);
    }
    .an-rt th.n { text-align: right; }
    .an-rt td { padding: 6px 0; border-bottom: 1px solid var(--border-dim); font-size: 12.5px; color: var(--text-mid); }
    .an-rt tr:last-child td { border-bottom: none; }
    .an-rt td.n { text-align: right; width: 108px; }
    .an-rt td.u { font-size: 10px; color: var(--text-lo); white-space: nowrap; padding-left: 12px; width: 1%; }
    .an-rt input {
      width: 92px; height: 29px; border: 1px solid var(--border-dim); border-radius: var(--radius-sm);
      background: #fff; text-align: right; padding: 0 9px;
      font-family: inherit; font-size: 12.5px; color: var(--text-hi); outline: none;
    }
    .an-rt input:focus { border-color: var(--blue); }
    .an-note { font-size: 12.5px; line-height: 1.65; color: var(--text-mid); margin-top: 16px; }
    .an-note b { color: var(--text-hi); font-weight: 500; }
    .an-caveat { font-size: 11.5px; line-height: 1.65; color: var(--text-lo); margin-top: 12px; }
    @media (max-width: 780px) { #analysis-stage { padding-left: 20px; padding-right: 20px; } }
    /* the model's furniture belongs to the model: the last step is not the place to keep
       offering a chat line and a code check */
    body.analysis-on #chat-bar,
    body.analysis-on #left-stack,
    body.analysis-on #right-stack,
    body.analysis-on #compass,
    body.analysis-on #title-block { display: none; }
    /* Viewport compass, bottom right. Same card as everything else — panel fill, one hairline
       border, blur, no shadow — and one bar tall, so it lines up with the chat bar beside it.
       pointer-events off: it sits over a canvas the whole screen wide that is dragged to orbit,
       and a solid disc in the corner would swallow those drags. */
    #compass { position: fixed; right: 20px; bottom: 20px; width: var(--floor-h); height: var(--floor-h); z-index: 10;
      background: var(--panel-bg); border: 1px solid var(--border); border-radius: 999px;
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); pointer-events: none; }
    #compass svg { display: block; width: 100%; height: 100%; }
    #compass .cmp-n { fill: var(--orange); }
    #compass .cmp-s { fill: rgba(23, 47, 199, 0.34); }   /* a shade over --border: at 57 px the token alone reads as nothing */
    /* The rose is scaled unevenly by the ground-plane transform, so an ordinary stroke would come
       out fat on one axis and thin on the other. non-scaling-stroke holds every line at screen
       width; only the FILLED needle foreshortens, which is the part that should. */
    #compass .cmp-ring { fill: none; stroke: var(--border-dim); stroke-width: 1.1; }
    #compass .cmp-hub { fill: var(--border); }
    #compass .cmp-tick { stroke: var(--border-dim); stroke-width: 1.5; stroke-linecap: round; }
    #compass .cmp-lab { fill: var(--text-hi); font-family: inherit; font-size: 8.5px; font-weight: 600;
      text-anchor: middle; dominant-baseline: central; }

    #viewbar { position: fixed; top: clamp(12px, 2.2vh, 26px); left: 50%; transform: translateX(-50%); z-index: 14; display: flex; flex-direction: column; align-items: center; gap: clamp(5px, 0.8vh, 10px); }
    #viewbar .vb-group { height: var(--floor-h); display: flex; align-items: stretch; gap: 2px; padding: clamp(3px, 0.45vh, 6px); background: var(--panel-bg); border: 1px solid var(--border-dim); border-radius: 999px; backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
    #viewbar button { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: clamp(3px, 0.45vh, 6px); border: none; background: none; border-radius: 999px; cursor: pointer; color: var(--text-lo); font-family: inherit; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; white-space: nowrap; transition: background 0.18s, color 0.18s; }
    #viewbar button svg { fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
    #viewbar button:hover { color: var(--text-hi); background: rgba(23, 47, 199, 0.07); }
    #viewbar button.active { color: #fff; background: var(--blue); }
    /* the group carries the height now, so the button only sets its width */
    #viewbar button { padding: 0 clamp(16px, 2.9vh, 34px); font-size: clamp(7px, 0.9vh, 10px); }
    #viewbar svg { width: clamp(14px, 2vh, 24px); height: clamp(14px, 2vh, 24px); }
    /* Second row: the options of whatever mode is lit. Only one is ever on, and the row slides
       sideways so the pill stands under its own mode button — Massing keeps its three schemes,
       Structure its two frames. The pill is orange against the blue of the modes: a different
       question, asked one level down, and the colour says so.
       The row is measured and placed in updateSubRow(), which is the only place that knows how
       far it has to travel. */
    #viewbar #vb-sub-row { position: relative; align-self: stretch; height: var(--floor-h); transition: transform 0.42s cubic-bezier(0.66, 0, 0.24, 1); }
    #viewbar #vb-sub-row > .vb-sub { position: absolute; top: 0; left: 50%; opacity: 0; pointer-events: none; transform: translateX(-50%) translateY(-4px) scale(0.94); transform-origin: 50% 0; transition: opacity 0.2s ease, transform 0.3s cubic-bezier(0.66, 0, 0.24, 1); }
    #viewbar #vb-sub-row > .vb-sub.on { opacity: 1; pointer-events: auto; transform: translateX(-50%) translateY(0) scale(1); }
    #viewbar .vb-sub { width: auto; gap: 2px; }
    #viewbar .vb-sub button { flex: 0 0 auto; padding: 0 clamp(11px, 1.9vh, 22px); font-size: clamp(6.5px, 0.8vh, 9px); gap: clamp(2px, 0.35vh, 5px); }
    #viewbar .vb-sub svg { width: clamp(11px, 1.6vh, 19px); height: clamp(11px, 1.6vh, 19px); }
    #viewbar .vb-sub button:hover { color: var(--orange); background: rgba(230, 112, 51, 0.12); }
    #viewbar .vb-sub button.active { color: #fff; background: var(--orange); }
    @media (prefers-reduced-motion: reduce) { #viewbar #vb-sub-row, #viewbar #vb-sub-row > .vb-sub { transition-duration: 0.01s; } }
    /* narrow screens squeeze the sides only */
    @media (max-width: 1100px) { #viewbar button { padding: 0 clamp(10px, 1.6vh, 18px); } #viewbar .vb-sub button { padding: 0 clamp(7px, 1.2vh, 13px); } }
    /* Not a panel: the play button and the year, straight on the background at the foot of the
       column. margin-top:auto pushes it down. The three core options used to sit under it; they
       are in the view bar now, under Massing. */
    #year-badge { display: none; position: static; width: 100%; flex: none; margin-top: auto; align-items: center; gap: 8px; padding-left: 2px; }
    #year-badge.open { display: flex; }
    #year-badge .lab, #year-badge b { font-size: 44px; line-height: 1; font-weight: 600; color: var(--blue); letter-spacing: -0.01em; }
    #year-badge b { font-variant-numeric: tabular-nums; }
    /* The caption under the three options: which one the wizard handoff picked, and the score
       every option got. Hidden unless a pick actually ran, so the sample path looks unchanged. */
    #core-pick { display: none; width: 100%; flex: none; padding: 0 10px; }
    #core-pick.on { display: block; }
    #core-pick .cp-head { font-size: 7px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: var(--text-lo); margin-bottom: 5px; }
    #core-pick .cp-row { display: flex; align-items: baseline; gap: 6px; font-size: 8.5px; letter-spacing: 0.04em; color: var(--text-lo); line-height: 1.75; }
    #core-pick .cp-row .nm { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #core-pick .cp-row b { flex: 0 0 auto; font-weight: 600; white-space: nowrap; font-variant-numeric: tabular-nums; color: var(--text-mid); }
    #core-pick .cp-row.on { color: var(--blue); }
    #core-pick .cp-row.on b { color: var(--blue); }
    #core-pick .cp-note { font-size: 7.5px; letter-spacing: 0.05em; color: var(--text-lo); line-height: 1.6; margin-top: 4px; opacity: 0.75; }
    /* ── Adaptive-use chat + timeline ── */
    /* Program and Adaptive use are two separate tabs of the left column, same as Layout: one
       header each, one body each, and only one of the three open at a time. */
    .acc-tab { position: static; width: 100%; flex: none; display: flex; align-items: center; gap: 8px; text-align: left; background: var(--panel-bg); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 13px 16px; backdrop-filter: blur(16px); font-family: inherit; font-size: 8px; font-weight: 600; letter-spacing: 0.22em; text-transform: uppercase; color: var(--text-lo); cursor: pointer; }
    .acc-tab:hover { color: var(--text-mid); }
    .acc-tab.open { color: var(--text-hi); border-bottom-left-radius: 0; border-bottom-right-radius: 0; border-bottom-color: transparent; margin-bottom: -10px; }
    .acc-tab .dot { color: var(--orange); }
    /* An open tab is as tall as it needs to be, and no taller than the column has room for: it
       runs down to the year readout when the list is long (the old 560 px cap left a gap on a tall
       screen), and stays short when there is little in it. flex 0 1 auto = size to content, shrink
       if it does not fit; the lists inside scroll (#prog-list, #chat-log). */
    #chat-panel { position: static; width: 100%; flex: 0 1 auto; min-height: 0; display: none; flex-direction: column; }
    #chat-panel.open { display: flex; border-top-left-radius: 0; border-top-right-radius: 0; }
    #chat-view { display: flex; flex-direction: column; min-height: 0; flex: 1 1 auto; }
    #prog-list { flex: 1 1 auto; overflow-y: auto; min-height: 60px; padding: 4px 14px 6px; }
    /* One row per floor, closed until clicked: a full building is 90 rows and nobody reads them
       all at once. The floor's own area stays on the header, so the list is useful shut. */
    .prog-lv { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 6px; background: none; border: none; border-top: 1px solid var(--border-dim); cursor: pointer; text-align: left; font-family: inherit; font-size: 8px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--text-lo); font-weight: 600; padding: 8px 0 7px; }
    .prog-lv:first-child { border-top: none; }
    .prog-lv:hover { color: var(--text-mid); }
    .prog-lv.open { color: var(--text-hi); }
    .prog-lv b { margin-left: auto; color: var(--text-mid); letter-spacing: 0; text-transform: none; font-variant-numeric: tabular-nums; }
    .prog-lv .chev { flex-shrink: 0; width: 10px; text-align: center; font-size: 8px; letter-spacing: 0; transition: transform 0.15s; }
    .prog-lv.open .chev { transform: rotate(180deg); }
    .prog-lv-body { padding: 2px 0 8px; }
    .prog-row { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; font-size: 10px; color: var(--text-hi); }
    .prog-row .nm { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .prog-row .nm i { color: var(--text-lo); font-style: normal; font-size: 9px; }
    /* the same key as everywhere else: blue is what stays, orange is what re-plugs */
    .prog-row .sp { flex-shrink: 0; font-size: 8px; letter-spacing: 0.08em; font-weight: 600; color: var(--text-lo); }
    .prog-row .sp.long { color: var(--blue); }
    .prog-row .sp.short { color: var(--orange); }
    .prog-row.long .nm { color: var(--blue); }
    .prog-row.short .nm { color: var(--orange); }
    .prog-row input { width: 58px; flex-shrink: 0; background: rgba(23,47,199,0.05); border: 1px solid var(--border-dim); border-radius: var(--radius-sm); color: var(--text-hi); padding: 3px 5px; font-family: inherit; font-size: 10px; text-align: right; outline: none; }
    .prog-row .del { background: none; border: none; color: var(--text-lo); cursor: pointer; font-family: inherit; font-size: 12px; line-height: 1; padding: 0 1px; flex-shrink: 0; }
    .prog-add { display: flex; gap: 5px; margin: 5px 0 2px; }
    .prog-add select { flex: 1 1 auto; min-width: 0; }
    .prog-add select, .prog-add input { background: rgba(23,47,199,0.05); border: 1px solid var(--border-dim); border-radius: var(--radius-sm); color: var(--text-hi); padding: 3px 5px; font-family: inherit; font-size: 10px; outline: none; }
    .prog-add input { width: 52px; text-align: right; }
    .prog-add button { border: none; border-radius: var(--radius-sm); background: rgba(23,47,199,0.08); color: var(--text-hi); font-family: inherit; font-size: 10px; padding: 0 8px; cursor: pointer; }
    /* the panel is a 248px column tab now, so the footer stacks instead of wrapping the button
       onto three lines beside the total */
    .prog-foot { border-top: 1px solid var(--border-dim); padding: 9px 14px 11px; display: flex; flex-direction: column; align-items: stretch; gap: 7px; }
    .prog-foot .btn { white-space: nowrap; }
    .prog-total { flex: 1 1 auto; display: flex; justify-content: space-between; font-size: 10px; color: var(--text-mid); }
    .prog-total b { color: var(--text-hi); font-variant-numeric: tabular-nums; }
    .prog-foot .btn { margin: 0; width: auto; flex-shrink: 0; }
    .chat-time { padding: 2px 14px 10px; border-bottom: 1px solid var(--border-dim); }
    .chat-time-row { display: flex; justify-content: space-between; align-items: baseline; font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-lo); margin-bottom: 4px; }
    .chat-time-row b { color: var(--text-hi); font-size: 13px; letter-spacing: 0; font-variant-numeric: tabular-nums; text-transform: none; }
    /* The timeline as a drawing: one hairline, a tick standing on it at every year a rule fires,
       and the thumb running along it. The ticks are inset by half a thumb so a tick and the thumb
       that lands on it line up — a range input's thumb centre travels from thumbW/2 to W−thumbW/2,
       not 0 to W. TICK_HALF in syncTicks() is the same number. */
    .tl-track { position: relative; padding-top: 23px; }
    #chat-ticks { position: absolute; left: 6px; right: 6px; top: 0; height: 23px; pointer-events: none; }
    #chat-ticks i { position: absolute; bottom: 0; width: 1px; height: 7px; margin-left: -0.5px; background: var(--text-lo); }
    #chat-ticks i.past { height: 10px; background: var(--orange); }
    #chat-ticks b { position: absolute; top: 0; transform: translateX(-50%); font-size: 8px; font-weight: 600; letter-spacing: 0.04em; color: var(--text-lo); font-variant-numeric: tabular-nums; white-space: nowrap; }
    #chat-ticks b.past { color: var(--orange); }
    #chat-slider { width: 100%; margin: 0; -webkit-appearance: none; appearance: none; background: none; height: 12px; cursor: pointer; }
    #chat-slider::-webkit-slider-runnable-track { height: 1px; background: var(--border); }
    #chat-slider::-moz-range-track { height: 1px; background: var(--border); }
    #chat-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; margin-top: -5.5px; border-radius: 999px; background: var(--orange); border: none; }
    #chat-slider::-moz-range-thumb { width: 12px; height: 12px; border: none; border-radius: 999px; background: var(--orange); }
    /* demo playback: the timeline runs itself */
    #tl-play {
      width: 30px; height: 30px; align-self: center; flex-shrink: 0;
      border: 1px solid var(--border-dim); border-radius: 50%; background: rgba(23,47,199,0.08);
      color: var(--blue); font-family: inherit; font-size: 11px; line-height: 1;
      cursor: pointer; padding: 0; flex-shrink: 0;
    }
    #tl-play:hover { background: var(--blue); color: #fff; border-color: var(--blue); }
    #tl-play.on { background: var(--orange); color: #fff; border-color: var(--orange); }
    .chat-time-row > span { display: inline-flex; align-items: center; }
    #chat-horizon { display: inline-flex; align-items: center; gap: 8px; margin-left: auto; }   /* the year left the row, so the switch keeps to the right */
    #chat-change:empty { display: none; }
    #chat-change { margin-top: 5px; font-size: 9.5px; line-height: 1.55; color: var(--text-mid); }
    #chat-change b { color: var(--orange); font-variant-numeric: tabular-nums; }
    #chat-change b.blue { color: var(--blue); }
    #chat-change .none { color: var(--text-lo); }
    /* sentence left, button right, and the button is one line of that sentence tall */
    #chg-see { flex-shrink: 0; display: inline-flex; align-items: center; height: 15px; border: 1px solid var(--border-dim); border-radius: 3px; background: rgba(230,112,51,0.10); color: var(--orange); font-family: inherit; font-size: 8.5px; letter-spacing: 0.06em; text-transform: uppercase; padding: 0 6px; cursor: pointer; }
    #chg-see:hover { background: var(--orange); color: #fff; border-color: var(--orange); }
    #chat-ctx:empty { display: none; }
    #chat-ctx { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border-dim); font-size: 9px; line-height: 1.65; color: var(--text-lo); }
    #chat-ctx .k { display: block; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 3px; }
    #chat-ctx b { color: var(--text-mid); font-variant-numeric: tabular-nums; }
    /* the greeting went, so an empty log is just a hole: collapse it and let the rules fill the panel */
    #chat-log:empty { display: none; }
    #chat-log { flex: 1 1 auto; overflow-y: auto; min-height: 0; padding: 10px 14px; display: flex; flex-direction: column; gap: 7px; }
    .chat-msg { font-size: 10.5px; line-height: 1.55; padding: 7px 10px; border-radius: var(--radius-md); max-width: 93%; }
    .chat-msg.you { align-self: flex-end; background: rgba(23,47,199,0.08); }
    .chat-msg.bot { align-self: flex-start; background: rgba(230,112,51,0.10); }
    .chat-msg .sub { display: block; color: var(--text-lo); font-size: 9px; margin-top: 3px; }
    /* the building-type answer, offered as chips so the three valid answers are visible.
       The question takes the full column: at 93% the three chips wrap onto two rows. */
    .chat-msg.ask { max-width: 100%; }
    .chat-chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 7px; }
    .chat-chips button { font: inherit; font-size: 9.5px; padding: 4px 8px; cursor: pointer; color: var(--text-mid); background: rgba(255,255,255,0.7); border: 1px solid var(--border-dim); border-radius: 999px; }
    .chat-chips button:hover { color: var(--text-hi); border-color: var(--border); }
    .chat-chips button.on { color: #fff; background: var(--blue); border-color: var(--blue); }
    #chat-rules:empty { display: none; }
    /* no 116 px cap: with a long rule list the panel is what runs out of room, not this — so the
       tab reaches the year readout and the rules scroll inside it */
    /* capped: a long rule list (the demo timeline files 20+) used to squeeze the log until the
       first message opened already scrolled. The rules scroll inside their own half instead. */
    #chat-rules { border-top: 1px solid var(--border-dim); padding: 9px 14px 5px; flex: 1 1 auto; min-height: 0; max-height: 45%; overflow-y: auto; }
    .chat-rule { display: flex; align-items: center; gap: 8px; font-size: 9.5px; color: var(--text-mid); margin-bottom: 5px; }
    .chat-rule.pending { opacity: 0.42; }
    /* the two colours the 3D uses in Change mode: orange = the kit re-plugged, blue = a room
       changing use or a use the building did not have before */
    .chat-rule .yr { flex-shrink: 0; background: rgba(23,47,199,0.12); color: var(--blue); border-radius: 999px; padding: 2px 7px; font-weight: 600; font-variant-numeric: tabular-nums; }
    .chat-rule.replug .yr { background: rgba(230,112,51,0.16); color: var(--orange); }
    .chat-rule .txt { flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    /* likelihood tier on a predicted rule — a label, never a number */
    .chat-rule .tier { display: inline-block; margin-right: 6px; padding: 1px 5px; border: 1px solid var(--border-dim); border-radius: 3px; font-size: 8px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-lo); }
    .chat-rule .del { background: none; border: none; color: var(--text-lo); cursor: pointer; font-family: inherit; font-size: 12px; line-height: 1; padding: 0 2px; }
    /* Site Forecast track: same row idiom as the chat rules, but the ACTIVE scenario at the
       current year is the one that reads solid */
    #chat-track { margin: 8px 0 2px; padding-top: 8px; border-top: 1px solid var(--border-dim); }
    #chat-track .chat-rule.on { color: var(--text-hi); font-weight: 600; }
    #chat-track .chat-rule.on .yr { background: var(--orange); color: #fff; }
    /* the chat bar under the model: one line, an arrow, nothing else */
    /* Centred on the window at the very bottom: nothing else sits in the middle down here for
       it to run under. Wide enough to be the thing you type in — at 360 px it read as a leftover. */
    #chat-bar { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); width: var(--bar-w); height: var(--floor-h); z-index: 12; display: flex; align-items: center; gap: 8px; padding: 6px 6px 6px 18px; background: var(--panel-bg); border: 1px solid var(--border); border-radius: 999px; backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
    /* Program Mode replaces the right column with this: same footprint as #right-stack, one card
       per row, scrolling down. While you are editing the program, the palette is what the right
       side is for — the statistics come back the moment you switch the mode off. */
    #add-palette { position: fixed; top: 20px; right: 20px; bottom: 20px; width: 248px; z-index: 12; display: none; flex-direction: column; padding: 8px; background: var(--panel-bg); border: 1px solid var(--border); border-radius: var(--radius-lg); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
    /* two to a row, under a heading each: the same LONG blue / SHORT orange key as the program
       list and the 3D, so what you are about to place is already colour-coded by timespan */
    #palette-row { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; align-content: start; width: 100%; flex: 1 1 auto; min-height: 0; overflow-y: auto; overflow-x: hidden; padding: 2px; }
    /* pale tint under brand-blue type, the way every other label on the page is set */
    #palette-row .pal-card { width: 100%; line-height: 1.3; padding: 6px 8px; text-align: left; color: var(--blue); border: none; }
    #palette-row .pal-card .ar { font-size: 9px; color: rgba(23, 47, 199, 0.7); }
    #palette-row .pal-card:hover { opacity: 1; outline: 2px solid var(--blue); outline-offset: 1px; }
    .pal-head { grid-column: 1 / -1; font-size: 8px; letter-spacing: 0.16em; text-transform: uppercase; font-weight: 600; padding: 8px 2px 0; }
    .pal-head:first-child { padding-top: 2px; }
    .pal-head.long { color: var(--blue); }
    .pal-head.short { color: var(--orange); }
    #chat-input { flex: 1 1 auto; min-width: 0; background: none; border: none; color: var(--text-hi); padding: 9px 0; font-family: inherit; font-size: 13px; outline: none; }
    #chat-input::placeholder { color: var(--text-lo); }
    #chat-send { flex-shrink: 0; width: 43px; height: 43px; display: flex; align-items: center; justify-content: center; border: none; border-radius: 999px; background: var(--orange); color: #fff; cursor: pointer; transition: background 0.18s; }
    #chat-send:hover { background: var(--blue); }
    #chat-send svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    ::-webkit-scrollbar { width: 7px; } ::-webkit-scrollbar-thumb { background: rgba(23,47,199,0.25); border-radius: 4px; }
    /* ══════════════ 9:16 PORTRAIT ══════════════
       The 1080x1920 cut of program-massing-shortfloor.html. Same model, same controls, same
       script: this re-places the furniture and sizes it for a tall screen.

       The desktop layout puts a 248 px column down each side of the model. Portrait stacks
       instead: one line across the top (the mark on the left, the mode switch on the right),
       the model through the middle, and both panel columns docked along the bottom in a band
       no deeper than a quarter of the page.

       Panel sizes are set by `zoom` rather than by re-declaring every rule: the panels are
       built out of 8-11 px type and rewriting each value would be a second stylesheet to keep
       in sync. The offsets inside the zoomed elements are therefore written in the zoomed
       system: at 1.1, 18 px reads as 20 px on screen. The view bar is NOT zoomed — its
       sub-row is measured and translated in JS, and a zoom under that maths moves the pill
       off its own button — so its sizes are written out.

       Guarded on orientation, so a landscape screen still gets the desktop layout. */
    @media (orientation: portrait) {

      /* The dock takes 30% of the page (576 px of 1920, user 260820 — it was capped at a quarter
         before). Everything in the dock is sized off it: both columns take it as their height, so
         the extra room goes to whichever card is open and to the floor list. */
      :root {
        --dock-h: 30vh; --dock-zoom: 1.1;
        /* ONE margin for the whole page: the mark, the mode switch and both dock columns all
           stand this far from their edge, so the four margins measure the same on screen. The
           dock is zoomed, so its offsets are divided by the zoom to land on the same number of
           screen pixels — writing 20px inside a 1.1 zoom would read as 22. */
        --edge: 20px;
      }

      /* ── the top line: mark left, mode switch right ──
         Both are 39 px tall and both start at 40, so they read as one band across the top
         with the model between them. */
      #title-block { zoom: 1; top: var(--edge); left: var(--edge); height: 39px; align-items: center; gap: 12px; }
      #title-block .mark { height: 24px; }
      #to-program { height: 30px; padding: 0 14px; font-size: 9px; gap: 7px; }
      #to-program svg { width: 13px; height: 13px; }

      /* Right, not centred: the middle of the top belongs to the model. At 39 px the icon
         cannot stand over its label, so the buttons read across instead: icon, then word. */
      #viewbar { top: var(--edge); left: auto; right: var(--edge); transform: none; align-items: flex-end; gap: 7px; }
      #viewbar .vb-group { height: 39px; padding: 3px; }
      #viewbar #vb-sub-row { height: 39px; }
      #viewbar button { flex-direction: row; padding: 0 20px; font-size: 10px; gap: 8px; }
      #viewbar svg { width: 16px; height: 16px; }
      #viewbar .vb-sub button { padding: 0 15px; font-size: 9px; gap: 6px; }
      #viewbar .vb-sub svg { width: 14px; height: 14px; }
      /* The three massing schemes are drawings of themselves — a plate with its cores marked —
         so the word under each one says a second time what the icon already says. Icons only;
         every button keeps its title, so hovering still names the scheme. Structure's two keep
         their words: steel and RC are not told apart by a small square. */
      #viewbar #seg-core button span { display: none; }
      #viewbar #seg-core button { padding: 0 13px; gap: 0; }
      #viewbar #seg-core svg { width: 18px; height: 18px; }

      /* ── the dock: both columns run along the bottom, side by side ──
         Both take the SAME fixed height, not a cap: a cap leaves each column as tall as
         whatever is in it, so the short one hugs the bottom while the tall one starts far
         above it and the two read as two loose cards over the model instead of one base. A
         fixed height also lets each column hand its spare room to the list inside it — with
         a max-height alone the tabs under the left panel ran past the bottom of the dock. */
      #left-stack {
        zoom: var(--dock-zoom);
        top: auto; bottom: calc(var(--edge) / 1.1); left: calc(var(--edge) / 1.1); gap: 6px;
        width: 300px; height: calc(var(--dock-h) / 1.1);
      }
      #right-stack {
        zoom: var(--dock-zoom);
        top: auto; bottom: calc(var(--edge) / 1.1); right: calc(var(--edge) / 1.1); gap: 6px;
        width: 300px; height: calc(var(--dock-h) / 1.1);
      }
      /* The right column runs from the top of the dock to its floor, so the two columns measure
         the same height: the shut headers stack under the chat line and the OPEN card takes
         whatever is left, instead of the whole group hugging the bottom on a short card.
         A shut card is a header — there is nothing in it to scroll, and `overflow-y: auto` on it
         put a scrollbar beside a single line of type. Only the open card scrolls, and only if its
         own content is taller than the room the dock has left. */
      #right-stack { justify-content: flex-start; }
      #right-stack > .panel { flex: 0 0 auto; overflow: visible; }
      /* the same on the left: the open panel takes the room the column has, so the tab under it
         rests on the floor of the dock and the two columns end level. A collapsed panel is a
         header and keeps the flex: none the base sheet gives it. */
      #left-stack > #left-panel:not(.collapsed) { flex: 1 1 auto; }
      #left-stack > #chat-panel.open { flex: 1 1 auto; }
      #right-stack > .panel:has(> .acc-head.open) { flex: 1 1 auto; min-height: 0; overflow-y: auto; }
      #add-palette {
        zoom: var(--dock-zoom);
        top: auto; bottom: calc(var(--edge) / 1.1); right: calc(var(--edge) / 1.1);
        width: 300px; height: calc(var(--dock-h) / 1.1);
      }
      /* Evolve / Futures is off in the portrait cut (user 260821). The handover shows it only
         when the wizard sends both readings, and the timeline panel in a 30% dock has no room to
         explain what the two words mean. !important because the script reveals it with an inline
         style; the switch is hidden, not removed, so TL_MODE and the slider behave as they did. */
      #tl-mode { display: none !important; }
      /* And the core-pick caption under the Timeline tab ("PICKED FOR THIS SITE", the three
         schemes and their footprints). It only appears on a site handover, it is the one block in
         the dock that is not a control, and it hangs off the bottom of the left column. The pick
         itself is untouched — the scheme the site chose is still lit in the view bar. */
      #core-pick, #core-pick.on { display: none; }

      /* a quarter-page dock has no room for a 44 px numeral */
      /* The year is what the Timeline tab is for, and the dock has room for it at 30% — it stands
         at the foot of the left column, the largest thing in the dock. */
      #year-badge .lab, #year-badge b { font-size: 40px; }

      /* Opening the Timeline collapses Layout · Program, but the Site block is a sibling of that
         fold, not part of it, so a screen of parcel figures stayed above the year slider. On the
         Timeline the site is not the subject. Inline `display:block` is written by the script when
         a site resolves, hence !important. */
      #left-stack:has(#chat-panel.open) #site-section { display: none !important; }

      /* ── the chat line and the compass, in the panel ──
         The chat bar used to float over the model on its own and the compass sat in a corner.
         Both are in the right column now, on one row above Code check: the line you type in,
         and north on the end of it. The bar keeps its shape, at the size of the fields in the
         Layout panel opposite. */
      /* The chat line is not a card. It has no panel behind it and it does not take a
         slot in the column: it is pinned to the top-right corner of the dock, over the top of
         whichever fold is open, so the column underneath starts at Statistics. */
      /* It rides in the column as its first item rather than being pinned over it. Pinned, it was
         absolutely positioned inside a FLEX container, and an abspos child of a flex container is
         laid out against the content box — so `top: 0` landed under the padding that was reserving
         room for it, 38.5 px below the top of the left panel opposite. As a plain item it needs no
         reserved room and its top IS the top of the column. */
      #chat-panel-r {
        position: static; width: 100%; flex: 0 0 auto;
        background: none; border: none; border-radius: 0; overflow: visible;
        backdrop-filter: none; -webkit-backdrop-filter: none;
      }
      #chat-body { padding: 0; }
      #chat-row { display: flex; align-items: center; gap: 7px; padding: 0; }
      #chat-bar {
        position: static; transform: none; z-index: auto;
        flex: 1 1 auto; min-width: 0; width: auto; height: 28px;
        padding: 0 3px 0 11px; gap: 5px;
        /* white, not the pale blue tint the panel fields use: this one sits unboxed on the
           top edge of the dock with the model behind it, so it has to read as a field in its own
           right rather than as a row of some card */
        background: #fff; border-color: var(--border-dim);
        backdrop-filter: none; -webkit-backdrop-filter: none;
      }
      #chat-input { font-size: 11px; padding: 0; }
      #chat-send { width: 22px; height: 22px; }
      #chat-send svg { width: 11px; height: 11px; }
      #compass {
        position: static; flex: 0 0 auto;
        width: 28px; height: 28px; border-color: var(--border-dim);
        backdrop-filter: none; -webkit-backdrop-filter: none;
      }
      #compass .cmp-lab { font-size: 11px; }   /* the dial is half its old size; the N is not */

      /* ── the dock is a quarter of the page, so the padding inside it pays for rows ──
         Every value here is space between things, never the things themselves: headers,
         fields and rows keep their type and lose their margins. The floor list is what the
         room goes to — at the desktop paddings it was down to two lines. */
      .panel h2, .acc-head, #right-panel .acc-head { padding: 9px 12px 6px; }
      .acc-tab { padding: 9px 12px; }
      .ctrl-grid { gap: 6px; padding: 2px 12px 8px; }
      .ctrl-field { gap: 2px; }
      .ctrl-field input, .ctrl-field select { padding: 4px 7px; }
      .seg button { padding: 4px 4px; }
      .btn { padding: 7px; margin: 0 12px 9px; width: calc(100% - 24px); }
      #stats, #legend, #site-info { padding: 2px 12px 9px; }
      .stat-row { margin-bottom: 3px; }
      .stat-total { margin-top: 4px; padding-top: 5px; }
      #prog-list { padding: 2px 12px 4px; }
      .prog-lv { padding: 5px 0 4px; }
      .prog-foot { padding: 6px 12px 8px; gap: 5px; }
      #code-violations { padding: 2px 12px 9px !important; }

      /* The hover label is placed by the script at `clientX + 14`, in viewport pixels. Under a
         zoom the browser multiplies that length too, so the label drifted away from the cursor by
         a fifth of however far across the window it was — at the right-hand edge, 200 px away.
         Sized directly instead. The second line carries an inline font-size, hence !important. */
      #tooltip { font-size: 12px; padding: 7px 12px; }
      #tooltip span { font-size: 11px !important; }
      #drop-overlay span { font-size: 26px; }

      /* ── analysis stage: three columns will not fit 1080, so it reads as one ── */
      #analysis-stage { padding: 170px 64px 90px; }
      #analysis-inner {
        max-width: 100%;
        grid-template-columns: 1fr; grid-template-areas: "left" "mid" "right"; gap: 40px;
      }
      #an-left { position: static; }
      #analysis-inner.solo #an-left { max-width: 100%; }
      .an-step-mark { font-size: 14px; letter-spacing: 0.2em; margin-bottom: 14px; }
      #an-title { font-size: 62px; margin-bottom: 12px; }
      .an-lede { font-size: 22px; }
      .an-figs { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 15px; margin-bottom: 26px; }
      .an-cell { padding: 22px 23px; }
      .an-v { font-size: 38px; }
      .an-k { font-size: 13px; margin-top: 11px; }
      .an-sub { font-size: 16px; }
      .an-share { margin-top: 30px; }
      .an-share .sh-t { height: 19px; }
      .an-share .sh-k, .an-share .sh-churn { font-size: 15px; }
      .an-cf-h, .an-rates-h { font-size: 13px; }
      .an-cf-row { grid-template-columns: 200px 1fr 110px; gap: 16px; }
      .an-cf-k, .an-cf-v, .an-cf-gap { font-size: 16px; }
      .an-cf-gap { padding-left: 216px; }
      .an-cf-t { height: 21px; }
      .an-rt th { font-size: 12px; }
      .an-rt td { font-size: 17px; padding: 9px 0; }
      .an-rt td.n { width: 140px; }
      .an-rt td.u { font-size: 13px; }
      .an-rt input { width: 122px; height: 38px; font-size: 17px; }
      .an-note { font-size: 17px; }
      .an-caveat { font-size: 15px; }
    }
  </style>
</head>
