    addEventListener('drop', e => { e.preventDefault(); drop.style.display = 'none'; const f = e.dataTransfer.files[0]; if (!f) return; const rd = new FileReader(); rd.onload = () => { FLOOR_H_OVERRIDE = new Map(); dropTimeline(); loadText(rd.result, 'file'); }; rd.readAsText(f); });   // dropped file = fresh program: drop the SAMPLE's L3 height override and the handed-over timeline, which described a different building

    // A dropped file is a different building, so the wizard's prediction no longer describes it.
    function dropTimeline() {
      EVOLUTION = null; FUTURES = null; TL_REASON = null;
      CONVERSIONS = []; FORECAST_TRACK = []; FORECAST_BASE_YEAR = null; TL_HORIZON = 0; SCEN_YEAR = 0;
      const seg = document.getElementById('tl-mode'); if (seg) seg.style.display = 'none';
    }

    document.getElementById('ctl-fh').addEventListener('change', e => { FLOOR_H = (parseFloat(e.target.value) || 12.75) * FT; build(); });
    // segmented two-option toggle buttons
    // `key` names a group's own buttons through data-seg, for a group whose buttons no longer sit
    // directly under it: the mode row keeps Structure inside a fold. With no key the direct
    // children are the group, as they were.
    function seg(id, cb, key) {
      const el = document.getElementById(id);
      const own = () => key ? [...el.querySelectorAll('[data-seg="' + key + '"]')] : [...el.children];
      el.addEventListener('click', e => {
        const b = e.target.closest('button'); if (!b) return;
        const mine = own(); if (!mine.includes(b)) return;
        mine.forEach(c => c.classList.toggle('active', c === b));
        cb(b.dataset.v);
      });
    }
    // ══════════════════════════════════════════════════════════════════
    // ANALYSIS · the last step of the walk (260815)
    // ══════════════════════════════════════════════════════════════════
    // Site, program, massing, then what changing it this way avoids. Two halves, and the line
    // between them is the whole point:
    //
    //   MEASURED, from the program on screen and the timeline it arrived with: how much floor
    //   area changes use over the horizon, how often, and in which year. Moving the rates below
    //   never moves these.
    //
    //   ASSUMED, by whoever is reading: what a square metre costs to build, to demolish and to
    //   convert, and what it carries in embodied carbon. Nothing in this platform measures any
    //   of that. The rates are placeholders in the same sense the forecast's FAR is one, they
    //   are editable here, and every figure derived from them says it rests on them.
    //
    // THE COUNTERFACTUAL IS PRINTED, NOT IMPLIED: the saving is against delivering the same
    // change by demolishing that floor area and building it again. Against doing nothing it is
    // zero. Only the permanent conversion is priced — a plug-in floor taking a new tenancy does
    // not avoid a demolition, so the re-plugs are reported as measured churn with no money on
    // them. Pricing those would be the easiest way to make this page lie.
    const AN_RATES = { build: 3500, demo: 120, convert: 1200, ecBuild: 600, ecConv: 120 };
    const anMoney = v => v >= 1e6 ? '$' + (v / 1e6).toFixed(1) + 'M'
      : v >= 1e3 ? '$' + Math.round(v / 1e3) + 'k' : '$' + Math.round(v);
    // One unit for every carbon figure on the page. Two bars on the same scale reading "1.4 kt"
    // and "272 t" are a subtraction the eye has to do before it can see the gap, so both stay in
    // tonnes however big they get.
    const anCO2 = kg => {
      const t = kg / 1e3;
      return (t >= 1 ? Math.round(t).toLocaleString() : t.toFixed(1)) + ' t';
    };

    function analysisRead() {
      const evs = (EVOLUTION && Array.isArray(EVOLUTION.events)) ? EVOLUTION.events : [];
      const conv = evs.filter(e => e.kind === 'long');
      const replug = evs.filter(e => e.kind === 'short');
      const sum = a => a.reduce((s, e) => s + (+e.area || 0), 0);
      const convArea = sum(conv), replugArea = sum(replug);
      const r = AN_RATES, rebuild = r.build + r.demo;
      return {
        has: !!evs.length,
        // a timeline written before events carried their area: say so rather than print a zero
        stale: !!(conv.length && !convArea),
        gfa: PROGRAM.reduce((s, p) => s + (p.area || 0), 0),
        horizon: (EVOLUTION && EVOLUTION.horizon) || TL_HORIZON || 0,
        convArea, replugArea, replugCount: replug.length,
        year: conv.length ? conv[0].year : null,
        to: conv.length ? conv[0].toType : null,
        rebuildRate: rebuild, keepRate: r.convert,
        money: Math.max(0, convArea * (rebuild - r.convert)),
        carbon: Math.max(0, convArea * (r.ecBuild - r.ecConv)),
        rates: r,
      };
    }

    function renderAnalysis() {
      // Two hosts, and which one a block goes to is the point of the page. `host` is the left
      // column: what was measured off the program, and the five rates the reader sets. `side`
      // is the right: only what those two produce. So everything on the right is derived and
      // nothing derived is printed beside something typed, which is what keeps an assumption
      // from reading as a measurement. The rate table says in its own head which it is.
      const host = document.getElementById('an-body'), side = document.getElementById('an-right'),
            midEl = document.getElementById('an-mid');
      if (!host) return;
      const a = analysisRead(), esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
      const inner = document.getElementById('analysis-inner');
      const solo = on => { if (inner) inner.classList.toggle('solo', on); };
      if (side) side.innerHTML = '';
      if (midEl) midEl.innerHTML = '';
      solo(true);
      if (!a.has) {
        host.innerHTML = '<div class="an-lede">There is no timeline on this model yet, so there is nothing to ' +
          'count. Build it from the wizard, or type a conversion into the chat line.</div>';
        return;
      }
      if (a.stale) {
        host.innerHTML = '<div class="an-lede">This timeline was written before the conversion carried its floor area, ' +
          'so there is nothing here to count yet. Go back to the program and press Build again.</div>';
        return;
      }
      solo(false);
      const out = [], mid = [], right = [];
      // "Nothing below them is" was written for a single column and is now spatially false, so
      // the sentence names the page rather than a direction. The rest is the same three facts
      // with the padding taken out.
      out.push('<div class="an-lede">Over <b>' + a.horizon + ' years</b> this building changes <b>' +
        Math.round(a.convArea + a.replugArea).toLocaleString() + ' m²</b> of use' +
        (a.convArea ? ': <b>' + Math.round(a.convArea).toLocaleString() + ' m²</b> converted once in year ' +
          a.year + ' to ' + esc(a.to) : '') +
        (a.replugCount ? (a.convArea ? ', and ' : ': ') + '<b class="plug">' + Math.round(a.replugArea).toLocaleString() +
          ' m²</b> of plug-in floor re-let <b class="plug">' + a.replugCount + '</b> time' + (a.replugCount === 1 ? '' : 's') : '') +
        '.</div>');

      // ── what changes, against what is built ──
      // Only the conversion is drawn as a share. The re-plug total counts the same floor once
      // per re-let, so stacking it here would claim a share of the building that does not
      // exist; it is reported underneath as the churn it actually is.
      if (a.gfa && a.convArea) {
        const pc = Math.min(100, a.convArea / a.gfa * 100);
        out.push('<div class="an-share"><div class="sh-t"><i class="conv" style="width:' + pc.toFixed(1) + '%"></i></div>' +
          '<div class="sh-k"><span><b class="conv"></b>' + Math.round(a.convArea).toLocaleString() + ' m² converted, ' +
          Math.round(pc) + '% of what is built</span>' +
          '<span><b class="rest"></b>' + Math.round(a.gfa - a.convArea).toLocaleString() + ' m² carries on as built</span></div>' +
          (a.replugCount ? '<div class="sh-churn">On top of that, <b>' + Math.round(a.replugArea).toLocaleString() +
            ' m²</b> of plug-in tenancy changes hands <b>' + a.replugCount + '</b> time' + (a.replugCount === 1 ? '' : 's') +
            '. A floor counts once per re-let, so that is churn, not a share of the building.</div>' : '') +
          '</div>');
      }

      if (a.convArea) {
        right.push('<div class="an-figs">' +
          '<div class="an-cell"><span class="an-v">' + anMoney(a.money) + '</span>' +
          '<span class="an-k">not spent</span>' +
          '<span class="an-sub">' + Math.round(a.convArea).toLocaleString() + ' m² × (' +
          a.rebuildRate.toLocaleString() + ' to rebuild − ' + a.keepRate.toLocaleString() + ' to convert)</span></div>' +
          '<div class="an-cell"><span class="an-v">' + anCO2(a.carbon) + '</span>' +
          '<span class="an-k">CO2e not emitted</span>' +
          '<span class="an-sub">embodied in the structure and envelope that stays</span></div>' +
          '<div class="an-cell"><span class="an-v">' + Math.round(a.convArea).toLocaleString() + ' m²</span>' +
          '<span class="an-k">not demolished</span>' +
          '<span class="an-sub">' + (a.gfa ? Math.round(a.convArea / a.gfa * 100) + '% of the ' +
            Math.round(a.gfa).toLocaleString() + ' m² built' : 'of what is built') + '</span></div>' +
          '</div>');

        // ── the counterfactual, drawn ──
        // Both routes deliver the same change to the same floor area. Drawing them on one
        // scale is what makes the saving a length rather than a number to be taken on trust,
        // and it makes the rates below read as what moves the bars.
        const cf = (head, keepV, rebuildV, gap, fmt, tail) => {
          const max = Math.max(keepV, rebuildV) || 1;
          const row = (k, v, cls) => '<div class="an-cf-row"><span class="an-cf-k">' + esc(k) + '</span>' +
            '<span class="an-cf-t"><i class="' + cls + '" style="width:' + (v / max * 100).toFixed(1) + '%"></i></span>' +
            '<span class="an-cf-v">' + fmt(v) + '</span></div>';
          return '<div class="an-cf"><div class="an-cf-h">' + esc(head) + '</div>' +
            row('Demolish and rebuild', rebuildV, '') +
            row('Convert and keep', keepV, 'keep') +
            '<div class="an-cf-gap">' + fmt(gap) + esc(tail || ' is the gap') + '</div></div>';
        };
        right.push(cf('The same ' + Math.round(a.convArea).toLocaleString() + ' m², two ways · cost',
          a.convArea * a.keepRate, a.convArea * a.rebuildRate, a.money, anMoney,
          ' is the gap'));
        right.push(cf('The same ' + Math.round(a.convArea).toLocaleString() + ' m², two ways · embodied carbon',
          a.convArea * a.rates.ecConv, a.convArea * a.rates.ecBuild, a.carbon, anCO2));

        // The five dials go at the foot of the LEFT column, under the sentence they cannot
        // move. Left is now what the reader owns: the measured areas, and the rates they set.
        // Right is only what those two produce, so every figure over there is derived and
        // nothing derived sits next to something typed.
        const rate = (id, label, val, unit) =>
          '<tr><td>' + esc(label) + '</td>' +
          '<td class="n"><input id="' + id + '" type="number" min="0" step="10" value="' + val + '"></td>' +
          '<td class="u">' + esc(unit) + '</td></tr>';
        // The heading carries it. The paragraph under it said the rates are placeholders, that the
        // platform measures areas rather than prices, and that the areas do not move when a rate
        // does — three sentences to say "these are yours to set", which the title says on its own.
        mid.push('<div class="an-rates"><div class="an-rates-h">Rates you set</div>' +
          '<table class="an-rt"><thead><tr><th>Rate</th><th class="n">Value</th><th></th></tr></thead><tbody>' +
          rate('an-build', 'New build', a.rates.build, 'USD/m²') +
          rate('an-demo', 'Demolition', a.rates.demo, 'USD/m²') +
          rate('an-conv', 'Conversion', a.rates.convert, 'USD/m²') +
          rate('an-ecb', 'Embodied, new', a.rates.ecBuild, 'kgCO2e/m²') +
          rate('an-ecc', 'Embodied, conversion', a.rates.ecConv, 'kgCO2e/m²') +
          '</tbody></table></div>');
        right.push('<div class="an-note"><b>Against demolish-and-rebuild only</b>. Do nothing and the saving ' +
          'is zero; do a lighter refit and it is smaller.</div>');
      } else {
        right.push('<div class="an-note">No permanent conversion falls inside the horizon, so there is nothing here to price.</div>');
      }

      // The placeholder warning moved to the rate table, next to the fields it is about. What
      // is left here is the one thing the table cannot say: what is deliberately NOT priced.
      right.push('<div class="an-caveat">Re-lets are not priced: a tenancy change avoids no demolition.</div>');

      host.innerHTML = out.join('');
      if (midEl) midEl.innerHTML = mid.join('');
      if (side) side.innerHTML = right.join('');
      for (const [id, key] of [['an-build', 'build'], ['an-demo', 'demo'], ['an-conv', 'convert'],
                               ['an-ecb', 'ecBuild'], ['an-ecc', 'ecConv']]) {
        const el = document.getElementById(id);
        if (!el) continue;
        el.addEventListener('change', () => {
          const v = parseFloat(el.value);
          if (!isNaN(v) && v >= 0) { AN_RATES[key] = v; renderAnalysis(); }
        });
      }
    }

    // Analysis is a STAGE, not a render mode: it lays itself over the model and leaves
    // RENDER_MODE, the camera and the scene exactly as they were, so stepping back to Massing
    // returns to the same view rather than rebuilding it.
    let ANALYSIS_ON = false, ANALYSIS_FROM_URL = false;
    function setAnalysis(on) {
      ANALYSIS_ON = !!on;
      document.getElementById('analysis-stage').classList.toggle('on', ANALYSIS_ON);
      document.body.classList.toggle('analysis-on', ANALYSIS_ON);
      updateSubRow();      // nothing on the stage is set from the second row, so it goes away with the model
      if (ANALYSIS_ON) renderAnalysis();
    }

    seg('seg-mode', v => {
      if (v === 'analysis') { setAnalysis(true); return; }   // the model underneath is untouched
      const cameFromStage = ANALYSIS_ON;
      setAnalysis(false);
      // stepping back out onto the mode that is already drawn: take the stage away and leave
      // the scene alone. Rebuilding here would re-pack and re-frame a view the eye was just on.
      if (cameFromStage && v === RENDER_MODE) return;
      RENDER_MODE = v; updateExportPanel(); updateSubRow(); build();
    }, 'mode');
    seg('seg-struct-sys', v => { STRUCT_SYS = v; build(); }, 'sys');
    // The second row belongs to the mode above it: Massing shows the three schemes, Structure the
    // two frames, and Analysis nothing, because the stage covers the model and reads none of it.
    // The row itself slides so the pill stands under its own button — the distance is measured
    // here rather than written into the CSS, since both rows are sized in vh and change with the
    // window.
    let SUB_ROW_PLACED = false;
    function updateSubRow() {
      const bar = document.getElementById('viewbar'), row = document.getElementById('vb-sub-row');
      if (!bar || !row) return;
      const which = ANALYSIS_ON ? null : (RENDER_MODE === 'structure' ? 'structure' : 'solid');
      const pill = { solid: 'seg-core', structure: 'seg-struct-sys' };
      for (const k in pill) {
        const el = document.getElementById(pill[k]);
        if (el) el.classList.toggle('on', k === which);
      }
      // Analysis leaves the row where it stood: it is invisible, and sliding it under a button
      // that has no options to show would be motion with nothing at the end of it.
      if (!which) return;
      const btn = bar.querySelector('#seg-mode > button[data-v="' + which + '"]');
      if (!btn) return;
      const dx = (btn.offsetLeft + btn.offsetWidth / 2) - (bar.clientWidth / 2);
      // The first placement is where the row already belongs, so it is set, not travelled.
      if (!SUB_ROW_PLACED) { row.style.transition = 'none'; }
      row.style.transform = 'translateX(' + dx.toFixed(1) + 'px)';
      if (!SUB_ROW_PLACED) { row.getBoundingClientRect(); row.style.transition = ''; SUB_ROW_PLACED = true; }
    }
    // Export panel follows the render mode: massing exports in Solid massing, structure exports in Structure.
    function updateExportPanel() {
      const structure = RENDER_MODE === 'structure';
      document.getElementById('export-massing').style.display = structure ? 'none' : '';
      document.getElementById('export-structure').style.display = structure ? '' : 'none';
      document.getElementById('export-title').innerHTML = structure ? 'Export &middot; Structure' : 'Export &middot; Massing';
    }
    // Switching by hand keeps the ranking on screen and just moves the highlight: the scores
    // are still true, the architect has simply chosen to overrule them.
    seg('seg-core', v => { CORE_OPTION = v; renderCorePick(); build(); });
    // M8: the readout states the OUTCOME (which side the core landed on), not the flips —
    // "core NE" is checkable against the drawing, "flipX true" is not.
    function renderOrientReadout() {
      const v = document.getElementById('ap-val');
      if (!v) return;
      const SRC = { frontage: ' · main frontage', site: ' · nearest street', manual: '', none: '' };
      v.textContent = SITE_APPROACH == null ? 'not set'
        : `${SITE_APPROACH}° ${compassOf(SITE_APPROACH)}${SRC[SITE_APPROACH_SRC] || ''}`;
      const gv = document.getElementById('gr-val'), gs = document.getElementById('ctl-grid');
      if (gv) gv.textContent = `${GRID_ROT_DEG > 0 ? '+' : ''}${GRID_ROT_DEG}°` + (GRID_ROT_LOCK ? ' · pinned' : STREET_BEARING != null ? ' · from street' : '');
      if (gs && !GRID_ROT_LOCK) gs.value = String(Math.round(GRID_ROT_DEG));
    }
    // Put the approach arrow up and start the clock on taking it down again. Called BEFORE the
    // rebuild the sliders do, so the meshes that build makes are born visible; the hide afterwards
    // only flips `visible` on what is already there, so letting go of the slider does not cost a
    // second build.
    function flashApproachArrow() {
      APPROACH_SHOW = true;
      for (const o of APPROACH_ART) o.visible = true;
      if (APPROACH_TIMER) clearTimeout(APPROACH_TIMER);
      APPROACH_TIMER = setTimeout(() => {
        APPROACH_TIMER = null; APPROACH_SHOW = false;
        if (!APPROACH_PIN) for (const o of APPROACH_ART) o.visible = false;
      }, APPROACH_LINGER);
    }
    // Both sliders move the arrow — one sets the bearing it draws, the other turns the site the
    // bearing is measured against — so both bring it up.
    document.getElementById('ctl-approach').addEventListener('input', e => {
      SITE_APPROACH = parseInt(e.target.value, 10); SITE_APPROACH_SRC = 'manual';
      flashApproachArrow();
      build(); renderOrientReadout();
    });
    // Moving this pins the rotation, exactly as ?grid= does: once the architect has turned the
    // site by hand, a rebuild must not silently put it back on the street it derived.
    document.getElementById('ctl-grid').addEventListener('input', e => {
      GRID_ROT_DEG = norm180(parseInt(e.target.value, 10)); GRID_ROT_LOCK = true;
      flashApproachArrow();
      build(); renderOrientReadout();
    });
    // Core-vs-approach and View-on-rebuild lost their controls on 260730, Cantilever on 260731;
    // all three still work, set the way they were before there was a control: ?facing=, ?view=refit,
    // ?canti=show.
    seg('seg-program', v => {
      PROGRAM_MODE = v;
      document.getElementById('move-controls').style.display = v === 'on' ? '' : 'none';
      // Program Mode takes the right column over: while you are placing blocks, the palette is
      // what that side is for. Statistics, code check and export come back when the mode goes off.
      document.getElementById('add-palette').style.display = v === 'on' ? 'flex' : 'none';
      document.getElementById('right-stack').style.display = v === 'on' ? 'none' : '';
      if (v !== 'on') {
        if (drag) { try { renderer.domElement.releasePointerCapture(drag.pointerId); } catch (e) {} drag = null; controls.enabled = true; }
        setSelected(null);
      }
    });
    seg('seg-move', v => { MOVE_INC = v === '2/3' ? 2 / 3 : v === '1/2' ? 0.5 : 1; });
    document.getElementById('btn-reset-moves').addEventListener('click', () => { MOVE_OFFSETS.clear(); applyMoveOffsets(); moveReadout(); });

    // ── export ──
    function download(name, text) {
      const blob = new Blob([text], { type: 'text/plain' }); const a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = name; a.click(); URL.revokeObjectURL(a.href);
    }
    // SHORT = porous plug-in bricks (part: 'short' massing volume);
    // LONG = everything else (solid programs + cores + circulation count as LONG).
    const isLongBox = b => !b.short && !b.part;

    // ── SHORT kit export: writes the REAL extracted Rhino module meshes (BLOCKS geometry),
    //    one instance per placement in SHORT_PLACE, mirroring geomOf()'s scale + z-rotation.
    //    Works from ANY view mode — placements are computed on every build.
    const FRAME_PARTS = [['frameHx', 'frameH', 'black', 'x'], ['frameHz', 'frameH', 'black', 'z'], ['frameV', 'frameV', 'black', 'x'], ['stair', 'stair', 'black', 'x']];
    const INFILL_PARTS = [['infillX', 'infill', 'orange', 'x'], ['infillZ', 'infill', 'orange', 'z']];
    function exportKitOBJ(parts, fname, title, acc) {
      if (!BLOCKS) { if (!acc) alert('Module block geometry (BLOCKS) missing — cannot export the kit.'); return; }
      if (!SHORT_PLACE || !parts.some(([l]) => SHORT_PLACE[l] && SHORT_PLACE[l].length)) { if (!acc) alert(`Nothing to export for ${title} — no SHORT programs in the current model.`); return; }
      const meshCache = {};
      const meshOf = (name, group, orient) => {
        const key = name + '.' + group + '.' + orient; if (meshCache[key]) return meshCache[key];
        const src = BLOCKS[name].groups[group];
        let verts = [];
        for (let n = 0; n < src.p.length; n += 3) verts.push([src.p[n] * BLOCK_S, src.p[n + 1] * BLOCK_S, src.p[n + 2] * BLOCK_S]);
        if (orient === 'z') {                        // match geomOf: rotate 90° about Y, re-origin to min corner
          verts = verts.map(v => [v[2], v[1], -v[0]]);
          const mn = [Infinity, Infinity, Infinity];
          for (const v of verts) for (let d = 0; d < 3; d++) mn[d] = Math.min(mn[d], v[d]);
          verts = verts.map(v => [v[0] - mn[0], v[1] - mn[1], v[2] - mn[2]]);
        }
        return (meshCache[key] = { verts, idx: src.i });
      };
      const A = acc || { obj: `# ${title} — extracted Rhino module blocks · module 8'-6" = ${MODULE.toFixed(4)} m\n`, vi: 1 };
      for (const [listName, name, group, orient] of parts) {
        const list = SHORT_PLACE[listName] || [];
        const { verts, idx } = list.length ? meshOf(name, group, orient) : { verts: [], idx: [] };
        for (let n = 0; n < list.length; n++) {
          const p = list[n];
          A.obj += `o RELOC_${listName}_${n}\ng RELOC_${listName}_${n}\n`;
          for (const v of verts) A.obj += `v ${(v[0] + p[0]).toFixed(4)} ${(v[1] + p[1]).toFixed(4)} ${(v[2] + p[2]).toFixed(4)}\n`;
          for (let t = 0; t < idx.length; t += 3) A.obj += `f ${idx[t] + A.vi} ${idx[t + 1] + A.vi} ${idx[t + 2] + A.vi}\n`;
          A.vi += verts.length;
        }
      }
      if (!acc) download(fname, A.obj);
    }
    // When `acc` ({obj, vi}) is passed, boxes are appended to it and nothing downloads — lets several
    // exporters share one OBJ (see exportStructureOBJ). Without acc, writes a standalone file.
    function exportOBJ(filter, fname, title, acc) {
      const boxes = exportBoxes.filter(filter);
      if (!boxes.length) { if (!acc) alert(`Nothing to export for ${title}.`); return; }
      const A = acc || { obj: `# ${title} — module 8'-6" = ${MODULE.toFixed(4)} m\n`, vi: 1 };
      for (const b of boxes) {
        const o = (!b.struct && isMovable(b) && MOVE_OFFSETS.get(moveKeyOf(b))) || { dx: 0, dy: 0, dz: 0 };
        const hx = b.w / 2, hy = b.h / 2, hz = b.d / 2, x = b.cx + o.dx, y = b.cy + o.dy, z = b.cz + o.dz;
        // Record program identity per box so the OBJ self-documents which massing is which program.
        const dur = b.struct ? 'STRUCT' : (b.short ? 'SHORT' : 'LONG');
        const nm = `${dur}_${b.type.replace(/\s+/g, '_')}_${(b.category || 'na').replace(/\s+/g, '_')}_${levelLabel(b.level)}`;
        A.obj += `o ${nm}\ng ${nm}\n`;
        // `quat`-bearing boxes (diagonal struts, addStrut) are rotated in the scene — rotate the
        // local corners by the same quaternion before offsetting to world position, otherwise the
        // OBJ would export them as if axis-aligned (wrong shape/orientation for a diagonal).
        const local = [[-hx, -hy, -hz], [hx, -hy, -hz], [hx, -hy, hz], [-hx, -hy, hz], [-hx, hy, -hz], [hx, hy, -hz], [hx, hy, hz], [-hx, hy, hz]];
        const c = b.quat
          ? local.map(([lx, ly, lz]) => { const v = new THREE.Vector3(lx, ly, lz).applyQuaternion(b.quat); return [v.x + x, v.y + y, v.z + z]; })
          : local.map(([lx, ly, lz]) => [lx + x, ly + y, lz + z]);
        for (const p of c) A.obj += `v ${p[0].toFixed(4)} ${p[1].toFixed(4)} ${p[2].toFixed(4)}\n`;
        for (const q of [[1, 2, 3, 4], [5, 8, 7, 6], [1, 5, 6, 2], [2, 6, 7, 3], [3, 7, 8, 4], [4, 8, 5, 1]]) A.obj += `f ${q.map(n => n + A.vi - 1).join(' ')}\n`;
        A.vi += 8;
      }
      if (!acc) download(fname, A.obj);
    }
    // Program massing — pick short- and/or long-duration program via the massing checkboxes.
    // Every box carries its program identity in the OBJ (o/g names), so the file self-documents.
    document.getElementById('exp-massing').addEventListener('click', () => {
      const wantShort = document.querySelector('.mass-chk[data-k="short"]').checked;
      const wantLong = document.querySelector('.mass-chk[data-k="long"]').checked;
      if (!wantShort && !wantLong) { alert('Select at least one program type to export.'); return; }
      const tags = []; if (wantShort) tags.push('SHORT'); if (wantLong) tags.push('LONG');
      exportOBJ(
        b => !b.struct && !b.ghost && ((wantShort && b.short) || (wantLong && !b.short)),   // a vacant shell is not program
        'program_massing_' + tags.join('+') + '.obj',
        tags.join(' + ') + ' program massing'
      );
    });

    // ── SHORT skin export: writes plain boxes directly (no BLOCKS mesh needed) — decks are
    //    translation-only (rot 0); windows/panes carry a per-instance Y rotation (rule: canonical
    //    Z-facing box, X-facing reuses it rotated 90°), applied here to the box corner verts.
    const SKIN_PARTS = [['skinDeck', 121, 10, 239, false], ['skinWinL', 173, 239, 5, true], ['skinWinS', 66, 239, 5, true]];
    function exportSkinOBJ(acc) {
      if (!SHORT_PLACE) { if (!acc) alert('Nothing to export for SHORT · SKIN — no SHORT programs in the current model.'); return; }
      let total = 0; for (const [k] of SKIN_PARTS) total += (SHORT_PLACE[k] || []).length;
      total += (SHORT_PLACE.skinPane || []).length;
      if (!total) { if (!acc) alert('Nothing to export for SHORT · SKIN — toggle skin ON (structure mode) and build a model with SHORT programs.'); return; }
      const A = acc || { obj: `# SHORT skin — module-deck / window / curtain-louver dressing · module 8'-6" = ${MODULE.toFixed(4)} m\n`, vi: 1 };
      let vtotal = 0, groups = 0;
      for (const [key, W, H, D, hasRot] of SKIN_PARTS) {
        const list = SHORT_PLACE[key] || []; if (!list.length) continue;
        const hx = (W * BLOCK_S) / 2, hy = (H * BLOCK_S) / 2, hz = (D * BLOCK_S) / 2;
        for (let n = 0; n < list.length; n++) {
          const it = hasRot ? list[n] : { p: list[n], rot: 0 };
          const [x, y, z] = it.p, rot = it.rot || 0, c = Math.cos(rot), s = Math.sin(rot);
          const local = [[-hx, -hy, -hz], [hx, -hy, -hz], [hx, -hy, hz], [-hx, -hy, hz], [-hx, hy, -hz], [hx, hy, -hz], [hx, hy, hz], [-hx, hy, hz]];
          A.obj += `o RELOC_${key}_${n}\ng RELOC_${key}_${n}\n`; groups++;
          for (const [lx, ly, lz] of local) A.obj += `v ${(x + lx * c + lz * s).toFixed(4)} ${(y + ly).toFixed(4)} ${(z + (-lx * s + lz * c)).toFixed(4)}\n`;
          for (const q of [[1, 2, 3, 4], [5, 8, 7, 6], [1, 5, 6, 2], [2, 6, 7, 3], [3, 7, 8, 4], [4, 8, 5, 1]]) A.obj += `f ${q.map(n2 => n2 + A.vi - 1).join(' ')}\n`;
          A.vi += 8; vtotal += 8;
        }
      }
      // FACADE_PANE07 louver — 25 blades + 2 rails per pane placement (see louverBoxSpecs()),
      // each written as its own box/group so the OBJ preserves the slat geometry.
      {
        const list = SHORT_PLACE.skinPane || [];
        if (list.length) {
          const specs = louverBoxSpecs();
          for (let n = 0; n < list.length; n++) {
            const it = list[n];
            const [x, y, z] = it.p, rot = it.rot || 0, c = Math.cos(rot), s = Math.sin(rot);
            specs.forEach((sp, bi) => {
              const hx = sp.hx * BLOCK_S, hy = sp.hy * BLOCK_S, hz = sp.hz * BLOCK_S;
              const ccx = sp.cx * BLOCK_S, ccy = sp.cy * BLOCK_S, ccz = sp.cz * BLOCK_S;
              const local = [[-hx, -hy, -hz], [hx, -hy, -hz], [hx, -hy, hz], [-hx, -hy, hz], [-hx, hy, -hz], [hx, hy, -hz], [hx, hy, hz], [-hx, hy, hz]];

    const STRUCT_BUCKETS = [
      { key: 'col', label: 'Columns', match: t => t === 'column' || t === 'cantilever column' },
      { key: 'gird', label: 'Girders', match: t => t === 'girder' || t === 'cantilever girder' || t.startsWith('cantilever back-span') || t.startsWith('cantilever long-span truss') || t.startsWith('cantilever interface tie') || t.startsWith('cantilever transfer') },

    // sharing a single vertex accumulator so everything selected lands in one self-documenting file.
    function exportStructureOBJ() {
      const perm = STRUCT_BUCKETS.filter(b => document.querySelector(`.struct-chk[data-k="${b.key}"]`).checked);
      const wantFrame = document.querySelector('.reloc-chk[data-k="frame"]').checked;
      const wantInfill = document.querySelector('.reloc-chk[data-k="infill"]').checked;
      const wantSkin = document.querySelector('.reloc-chk[data-k="skin"]').checked;
      if (!perm.length && !wantFrame && !wantInfill && !wantSkin) { alert('Select at least one structure option to export.'); return; }

      const acc = { obj: `# Structure export — module 8'-6" = ${MODULE.toFixed(4)} m\n`, vi: 1 };
      const tags = [];

      if (perm.length) {
        // struct boxes only exist in exportBoxes while structure is built; build it if needed, then restore.
        const savedMode = RENDER_MODE, hadStruct = exportBoxes.some(b => b.struct);
        if (!hadStruct) { RENDER_MODE = 'structure'; build(); }
        const matchesSelection = t => perm.some(b => b.match(t));
        exportOBJ(b => b.struct && matchesSelection(b.type), null, null, acc);
        if (!hadStruct) { RENDER_MODE = savedMode; build(); }
        tags.push(perm.length === STRUCT_BUCKETS.length ? 'perm-all' : 'perm-' + perm.map(b => b.key).join('+'));
      }

      const relParts = [];
      if (wantFrame) relParts.push(...FRAME_PARTS);
      if (wantInfill) relParts.push(...INFILL_PARTS);
      if (relParts.length) exportKitOBJ(relParts, null, null, acc);
      if (wantSkin) exportSkinOBJ(acc);
      if (wantFrame) tags.push('frame');
      if (wantInfill) tags.push('infill');
      if (wantSkin) tags.push('skin');

      if (acc.vi <= 1) { alert('Nothing to export — the selected options produced no geometry (e.g. no SHORT programs in the model, or skin not built).'); return; }
      download('structure_' + tags.join('+') + '.obj', acc.obj);

      // until then the slider overrides it and the readout says where the number came from.

        // face, and the alignment follows that same face's line, so a corner site squares to
        // its main street instead of to whichever centreline happened to be nearest.

        // nearest centreline, which is a frontage proxy and is labelled as such

        const g = siteContextGeo();
        // The RAW road list, not g.roads. siteContextGeo drops any way whose vertices average
        // more than CTX_LINE_M from the centroid, which is right for drawing but wrong here: an
        // OSM `way(around:150)["highway"]` returns the WHOLE street, often a kilometre of it, so
        // the very street the site fronts can average its way out of the drawing set. The
        // nearest-segment search below is already immune to a way's far end.
        const raw = (SITE_CTX.roads || []).filter(r => r && r.length > 1);

        // nearest vertex can sit far down the block from the nearest point on the same street

      // the derivation. One fact per line throughout.
      const head = [];
      if (s.parcel && s.parcel.lotAreaM2) head.push(kv('Lot area', s.parcel.lotAreaM2.toLocaleString() + ' m²'));
