      //          of potentially several bays, not just its own cantilever's reach.
      //   SYS3 = the hung box: its own corner verticals (COL_CANT, drawn in the COLUMNS pass below)
      //          + its floor girders (the 'cantilever girder' members, BEAMS pass) + the hangers/root
      //          struts/interface tie built here. No new member classes needed — SYS3 was already the
      //          existing hung-column + cantilever-girder machinery; this pass only changes SYS2's span.
      const SYS2_SPAN_MODS = 4 * COLSTEP;                 // SYS2 truss target span ≈ 4 column bays
      const matFrame = RC ? concreteRC() : aluminium();   // main beams + columns share one material: brushed aluminium (steel) or raw concrete (RC)
      const matSlab = concreteSlab();                     // all floor + roof slabs share one concrete material
      const matGlass = glazing();                         // all curtain-wall panels share one glazing material

      // ── SHORT-STACK BOUNDARY SHIFT ──
      // buildShortBlocks fills each run of consecutive SHORT floors on a continuous 8'-6" course
      // grid, but K (its course count) is only an UPPER BUDGET — the porous packer leaves any
      // unpaired footprint cell unplaced (no brick, no volume), so the true physical top of the
      // stack is usually below base+K*MODULE. buildShortBlocks (which always runs first in build())
      // publishes the REAL top per run into SHORT_STACK_TOP, keyed by the run's first level — that
      // is the primary source of truth here. Separately, every floor's girders/slab in THIS function
      // are drawn hanging BELOW their nominal yBase(lv) (the main girder PRI_H=0.61 m deep is the
      // worst case) — harmless over a LONG floor below (sparse frame, open air) but a real collision
      // over a SHORT run, whose bricks are solid volume right up to the nominal line. So the true
      // required clearance for the first LONG floor above a SHORT run is:
      // (actual stack top) + PRI_H (deepest hang-below member) <= that floor's yBase.
      // If SHORT_STACK_TOP has no entry for a run (buildShortBlocks took its early-return path,
      // STRUCTURE mode with no BLOCKS kit loaded — see its ~line 876 guard), fall back to the old
      // K-BUDGET re-derivation (same formula as buildShortBlocks, read-only, no edits to it) as an
      // upper-bound estimate. Either way, this block rigidly shifts every level from the boundary
      // floor upward by whatever shortfall exists — a translation, so floor-to-floor heights
      // below/within the SHORT run and all storey heights elsewhere are unchanged.
      const yBaseNominal = yBase;
      let shiftAt = new Map(levels.map(lv => [lv, 0]));
      {
        const hasShortLv = lv => L.floorRects.get(lv).some(r => rectShort(r) && !r.vacant);
        const runs = []; let cur = [];
        for (const lv of levels) { if (hasShortLv(lv)) cur.push(lv); else { if (cur.length) runs.push(cur); cur = []; } }
        if (cur.length) runs.push(cur);
        const overshoot = new Map();   // boundary level (first LONG level right after the run) → excess (m)
        // `runAcc` is the shift already owed to everything above the runs processed so far. It has
        // to be here because SHORT_STACK_TOP now arrives in SHIFTED world coordinates —
        // buildShortBlocks applies the identical accumulation so the kit and the frame stand at the
        // same elevation. Comparing a shifted stack top against a nominal topY would count the
        // shift twice and walk the building up on every run.
        let runAcc = 0;
        for (const run of runs) {
          const idx = levels.indexOf(run[run.length - 1]), boundaryLv = idx + 1 < levels.length ? levels[idx + 1] : null;
          const base = yBaseNominal(run[0]) + runAcc, topY = yBaseNominal(run[run.length - 1]) + floorHeightOf(run[run.length - 1]) + runAcc;
          let actualTop = SHORT_STACK_TOP.get(run[0]);
          if (actualTop === undefined) {
            // FALLBACK: buildShortBlocks didn't run its packer this build — re-derive the K-BUDGET
            // upper bound (may overstate the true top, but it's the best estimate available).
            let belowFoot = null;
            const li = levels.indexOf(run[0]);   // previous ENTRY in levels, not run[0]-1: level numbers are labels
            if (li > 0 && run[0] > 0) {          // at or below grade the run rests on the ground — mirrors buildShortBlocks
              belowFoot = new Set(); const bl = levels[li - 1];
              const addF = r => { for (let i = r.xMod; i < r.xMod + r.wMod; i++) for (let j = r.zMod; j < r.zMod + r.dMod; j++) belowFoot.add(i + ',' + j); };
              for (const r of (L.floorRects.get(bl) || [])) addF(r);
              for (const r of (L.floorCorr.get(bl) || [])) addF(r);
              for (const c of L.coreShafts) if (bl >= c.minL && bl <= c.maxL) addF(c);
            }
            const restsBase = (i, j) => belowFoot === null || belowFoot.has(i + ',' + j);
            const footByFloor = run.map(lv => { const m = new Map(); for (const r of L.floorRects.get(lv)) if (rectShort(r) && !r.vacant) for (let i = r.xMod; i < r.xMod + r.wMod; i++) for (let j = r.zMod; j < r.zMod + r.dMod; j++) m.set(i + ',' + j, r); return m; });
            let area = 0; const uni = new Set(); for (const m of footByFloor) { area += m.size; for (const key of m.keys()) uni.add(key); }
            let S = 0; for (const key of uni) { const [i, j] = key.split(',').map(Number); if (restsBase(i, j)) S++; }
            const natK = Math.max(1, Math.floor((topY - base) / M + 1e-6));
            const K = Math.min(natK + 4, Math.max(natK, Math.ceil(area / Math.max(1, S))));
            actualTop = base + K * M;
          }
          const excess = (actualTop + PRI_H) - topY;            // clearance the boundary floor's deepest hang-below member needs
          if (excess <= 1e-6) continue;
          runAcc += excess;                                     // every run above this one is measured from here
          // A run at the very top of the building has no floor above to shift, so it books no
          // overshoot — but it still had to be measured, because runAcc is what keeps this loop in
          // step with buildShortBlocks, which walks the same runs in the same order.
          if (boundaryLv !== null) overshoot.set(boundaryLv, (overshoot.get(boundaryLv) || 0) + excess);
        }
        let acc = 0;
        for (const lv of levels) { acc += overshoot.get(lv) || 0; shiftAt.set(lv, acc); }
      }
      yBase = lv => yBaseNominal(lv) + (shiftAt.get(lv) || 0);   // shadow the param: every downstream use (columns, girders, slabs, roof, curtain, fins) reads the shifted elevation

      const zTopOf = lv => yBase(lv) + floorHeightOf(lv);

      // ── per-floor occupancy on the module grid — ONLY the LONG (permanent) massing,
      //    plus corridors and cores. SHORT zones are EXCLUDED: they keep their own bricks,
      //    so no column / slab / curtain is generated over them. ──
      const occ = new Map();
      for (const lv of levels) {
        const s = new Set();
        const add = r => { for (let i = r.xMod; i < r.xMod + r.wMod; i++) for (let j = r.zMod; j < r.zMod + r.dMod; j++) s.add(i + ',' + j); };
        for (const r of L.floorRects.get(lv)) if (!rectShort(r)) add(r);
        for (const r of (L.floorCorr.get(lv) || [])) add(r);
        for (const c of L.coreShafts) if (lv >= c.minL && lv <= c.maxL) add(c);
        occ.set(lv, s);
      }
      const occAt = (lv, i, j) => occ.get(lv).has(i + ',' + j);
      // a column sits on a cell CORNER → present if any of its 4 touching cells is filled
      const colHere = (lv, gi, gj) => occAt(lv, gi - 1, gj - 1) || occAt(lv, gi, gj - 1) || occAt(lv, gi - 1, gj) || occAt(lv, gi, gj);

      // ── GROUNDED classification — shared with the massing view (classifyGrounded, used by
      //    build()/?canti=show) so Structure mode agrees on which modules are cantilever. A cell
      //    is "grounded" per classifyGrounded's transitive rule (occupied AND (lv<0 OR
      //    lv===groundStorey OR grounded directly below)); corridor cells are exempt (treated as
      //    always grounded, matching build()'s unconditional corridor rendering — R10 circulation
      //    is the grounded spine cantilevers grow from). ──
      const clG = classifyGrounded(L);
      const massOcc = clG.occByLv, groundedMassing = clG.groundedByLv;
      const corrOcc = new Map(levels.map(lv => [lv, new Set()]));
      for (const lv of levels) { const s = corrOcc.get(lv); for (const r of (L.floorCorr.get(lv) || [])) for (let i = r.xMod; i < r.xMod + r.wMod; i++) for (let j = r.zMod; j < r.zMod + r.dMod; j++) s.add(i + ',' + j); }
      const cellGrounded = (lv, i, j) => { const k = i + ',' + j; return corrOcc.get(lv).has(k) || (massOcc.get(lv).has(k) && groundedMassing.get(lv).has(k)); };
      // a column point is grounded at lv iff ANY of its 4 touching cells is a grounded cell
      const colGroundedAtLv = (lv, gi, gj) => cellGrounded(lv, gi - 1, gj - 1) || cellGrounded(lv, gi, gj - 1) || cellGrounded(lv, gi - 1, gj) || cellGrounded(lv, gi, gj);

      // ── global grid lines (modules), snapped to include the far edges ──
      const gxs = []; for (let i = 0; i <= L.FW; i += COLSTEP) gxs.push(i); if (gxs[gxs.length - 1] !== L.FW) gxs.push(L.FW);
      const gys = []; for (let j = 0; j <= L.FD; j += COLSTEP) gys.push(j); if (gys[gys.length - 1] !== L.FD) gys.push(L.FD);

      // ── COLUMNS — contiguous vertical (occupancy) runs, each further split at the point the
      //    column stops being grounded (colGroundedAtLv). Grounded status is monotonic within an
      //    occupancy-continuous run (classifyGrounded never re-grounds once broken), so each run
      //    splits into at most one grounded prefix (COL_MAIN) + one hung suffix (COL_CANT) — this
      //    is what keeps a "grounded" column from silently riding straight through a cantilever
      //    module (Step 4): the MAIN column stops at the split, a fresh hung sub-run + its own
      //    transfer entry starts above it. ──
      const colPts = [];                                               // every column actually drawn, in world coords
      const colAt = new Map(levels.map(lv => [lv, new Set()]));        // lv → "gi,gj" with a column through it
      const groundedAtLv = new Map(levels.map(lv => [lv, new Set()])); // lv → "gi,gj" whose column reaches the ground
      const grounded = new Set();                                 // "gi,gj" reaching the base
      const transfers = [];                                       // { gi, gj, zb, ztop, stack }
      for (const gi of gxs) for (const gj of gys) {
        const key = gi + ',' + gj;
        const present = [];
        levels.forEach((lv, k) => { if (colHere(lv, gi, gj)) present.push(k); });
        if (!present.length) continue;
        const runs = []; let run = [present[0]];
        for (let n = 1; n < present.length; n++) { if (present[n] === run[run.length - 1] + 1) run.push(present[n]); else { runs.push(run); run = [present[n]]; } }
        runs.push(run);
        for (const rn of runs) {
          const a = rn[0], b = rn[rn.length - 1];
          let split = b + 1;   // first index (within a..b) that is NOT grounded; b+1 = whole run grounded
          for (let k = a; k <= b; k++) if (!colGroundedAtLv(levels[k], gi, gj)) { split = k; break; }
          const subs = [];
          if (split > a) subs.push([a, Math.min(split - 1, b), true]);      // grounded sub-run
          if (split <= b) subs.push([Math.max(split, a), b, false]);        // hung sub-run
          for (const [sa, sb, isGround] of subs) {
            const z0 = yBase(levels[sa]), z1 = zTopOf(levels[sb]), sw = isGround ? COL_MAIN : COL_CANT;
            // In RC a hung column is not a distinct member: it stands on the transfer beam as an
            // ordinary compression column, same section and same concrete as a grounded one, so it
            // is drawn as a plain column and there is no 'cantilever column' in that system. Steel
            // keeps the distinction, where the hung column genuinely is a different thing — a
            // light tension hanger under the top truss. The transfer bookkeeping below is
            // untouched either way: it still knows exactly which runs are hung.
            const plain = isGround || RC;
            addStruct(wx(gi), (z0 + z1) / 2, wz(gj), sw, z1 - z0, sw, plain ? STRUCT.col : STRUCT.colT, 1, plain ? 'column' : 'cantilever column', levels[sa], plain ? matFrame : null);
            colPts.push({ x: wx(gi), z: wz(gj), y0: z0, y1: z1 });   // read by the truss emit: a hanger inside a column is redundant
            if (isGround) grounded.add(key); else transfers.push({ gi, gj, zb: z0, ztop: z1, stack: sb - sa + 1, lv0: levels[sa], floorYs: Array.from({ length: sb - sa + 1 }, (_, n) => yBase(levels[sa + n])) });
            for (let k = sa; k <= sb; k++) { colAt.get(levels[k]).add(key); if (isGround) groundedAtLv.get(levels[k]).add(key); }
          }
        }
      }

      // ── TRANSFER — tie each hung column's base back into the grounded grid on its row/col.
      //    260722(c) THREE-TIER MODEL (SYS1/SYS2/SYS3) — supersedes the 260722(b) per-group LOCAL
      //    hanger truss below. Per cantilever_truss_whole_building.py's SYSTEM_MAP/SYSTEM_DEFS: SYS1
      //    主要量體 = this file's existing grounded column grid + cores (COL_MAIN/PRI_ girders,
      //    unchanged); SYS2 長跨桁架 = the hanger-bar truss, now extended (extendGroundedFar,
      //    SYS2_SPAN_MODS ≈ 4 bays, matching TRUSS_SPAN/COL_GRID ≈ 3.91) so it rides across the
      //    grounded grid back to a deep column/core instead of stopping at the nearest anchor; SYS3
      //    懸挑量體 = the hung box itself (its own COL_CANT verticals + 'cantilever girder' floor
      //    beams, both pre-existing, plus the hangers/root-struts/interface-tie below). The
      //    coat-hanger MECHANISM (below) is unchanged from 260722(b) — only SYS2's SPAN changed.
      //    260722(b) COAT-HANGER MODEL — supersedes the full-depth Warren truss of 260721/260722(a).
      //    Re-derived from `references/cantilever_truss_whole_building.py`'s Rhino-measured member
      //    schedule (CANT_SCHEDULE + MASSING_SCHEDULE TRUSS/'cantilever' layers): the real
      //    case-study cantilever is ONE integrated multi-floor box carried by a STORY-DEEP TRUSS AT
      //    ITS TOP (TR_CHORD_300/TR_POST/TR_PANEL — the "hanger bar"), with the floors below hung
      //    off it by slender vertical TENSION HANGERS (the 'cantilever'-layer CAN_V members, ×18,
      //    ~1 floor long each — not a fixed section spanning the whole box depth). A full-depth
      //    Warren web the whole stack height (what 260721/260722(a) built) is not what the source
      //    building does — only the TOP storey is a deep truss; everything below hangs in tension.
      //    Reach 1–2 modules AND single-floor (stack<2) → plain cantilever girder (CANT_ section,
      //    unchanged). Otherwise (reach ≥3 OR stack ≥2) → the hanger scheme in buildTransferMember:
      //      1. top hanger truss  — one storey deep, at the TOP of the group, chord+web sized off
      //         the R5 ladder (heavier — primary carrier), Warren diagonals via addStrut.
      //      2. hangers           — slender vertical ties from the bottom chord down through every
      //         floor of the group below (one per panel node under the truss), R5 web size ×0.5.
      //      3. root struts       — a few SHORT diagonal braces at the backspan end only, tying the
      //         grounded anchor column into both chords (not a full-depth web at the root either).
      //    R3 still gates every member: backspan B must be ≥ 2× reach C or the member is flagged
      //    (bright red, STRUCT.flag) instead of silently drawn — never a free-floating tip with no
      //    backspan tie. No column is ever added under the tip (unchanged — the group hangs).
      //    260806: all of the above is the STEEL system. RC takes the same gate and the same span
      //    (tip..farX) but replaces the whole hanger mechanism with one storey-deep transfer beam
      //    at the group's BASE plus a haunch at the fulcrum — the group sits on it in compression
      //    rather than hanging from a truss, so RC draws no diagonal anywhere. See the RC branch
      //    inside buildTransferMember. ──
      // ── CIRCULATION AXIS (R10) — a cantilever roots on the grounded massing beside circulation
      //    and projects PERPENDICULAR to it; the support truss/back-span therefore only ever runs
      //    in the projection direction, never parallel to the corridor (WoZoCo: party-wall trusses
      //    run ⟂ to the gallery, never along it). Derived from the corridor rects' own shape
      //    (L.floorCorr; wMod = extent along X, dMod = extent along Z) instead of hardcoded, so a
      //    dataset whose gallery runs the other way flips this automatically.
      let corrWx = 0, corrDz = 0;
      for (const lv of levels) for (const r of (L.floorCorr.get(lv) || [])) { corrWx += r.wMod; corrDz += r.dMod; }
      const corridorAlongX = corrWx >= corrDz;   // true → gallery runs along X (this dataset, zMid row) → project ±Z
      // ── ANCHOR SET must be LEVEL-SPECIFIC, not the flat "ever grounded at any floor" set. A grid
      //    point can be grounded at low floors and separately hung higher up (occupancy gap between
      //    — e.g. a notch/setback — then the massing resumes as a cantilever at the SAME x,z): the
      //    old flat `grounded` Set couldn't tell those two floor ranges apart, so a hung run could
      //    find "itself" (its own key, grounded at an unrelated lower floor) as the "nearest" anchor
      //    at zero reach — a degenerate zero-length back-span instead of a real tie (found via the
      //    counting script while verifying the R10 axis fix below: 25 of 31 transfers on the SAMPLE
      //    were this zero-reach self-tie). Fixed by anchoring against `groundedAtLv` at the hung
      //    run's own root level (t.lv0) — the columns must be grounded AT THAT FLOOR, not "ever".
      // backspan available behind a grounded anchor (modules), walking AWAY from the hung column
      // along the shared grid line through consecutive still-grounded points, restricted to `gSet`
      // (the anchor set grounded at the relevant level).
      const backspanModules = (axisArr, anchorPos, hungPos, fixedCoord, rowCase, gSet) => {
        const dir = anchorPos > hungPos ? 1 : -1, idx = axisArr.indexOf(anchorPos);
        let acc = 0, prev = anchorPos;
        for (let k = idx + dir; k >= 0 && k < axisArr.length; k += dir) {
          const cand = axisArr[k], key = rowCase ? (cand + ',' + fixedCoord) : (fixedCoord + ',' + cand);
          if (!gSet.has(key)) break;
          acc += Math.abs(cand - prev); prev = cand;
        }
        return acc;
      };
      // ── R3 REVISED 260817 (STRUCTURE-SPINE-TRUSS-PLAN §1C) ─────────────────────────────────
      // `backspanModules` above walks grounded grid points and stops caring where it ends up, so a
      // back span that runs three modules into open floor counts the same as one that reaches a
      // core. R9 asks for the opposite: the tie has to land in something deep. Measured on the
      // SAMPLE before this, B came back 0 on 18 of 28 transfers and every single one of the 28
      // failed R3 — a test that fails everything is not a test.
      // `backspanToAnchor` walks the same way and stops at the first grid point sitting on a core
      // footprint or the corridor spine, reporting whether it ever got there.
      const anchorCells = new Map();
      const anchorAt = lv => {
        let s = anchorCells.get(lv); if (s) return s;
        s = new Set();
        const add = r => { for (let i = r.xMod; i < r.xMod + r.wMod; i++) for (let j = r.zMod; j < r.zMod + r.dMod; j++) s.add(i + ',' + j); };
        for (const c of L.coreShafts) if (lv >= c.minL && lv <= c.maxL) add(c);
        for (const r of (L.floorCorr.get(lv) || [])) add(r);
        anchorCells.set(lv, s); return s;
      };
      const backspanToAnchor = (axisArr, anchorPos, hungPos, fixedCoord, rowCase, gSet, lv) => {
        const dir = anchorPos > hungPos ? 1 : -1, idx = axisArr.indexOf(anchorPos);
        const deep = anchorAt(lv);
        const cellOf = pos => rowCase ? (pos + ',' + fixedCoord) : (fixedCoord + ',' + pos);
        // A grid point sits on the CORNER of four cells, which is why colGroundedAtLv tests all
        // four. Testing only the (gi,gj) cell found a core on no transfer at all: the first cut of
        // this rule sent every one of the 28 SAMPLE groups to 'prop'.
        const onDeep = pos => {
          const gi = rowCase ? pos : fixedCoord, gj = rowCase ? fixedCoord : pos;
          return deep.has((gi - 1) + ',' + (gj - 1)) || deep.has(gi + ',' + (gj - 1))
              || deep.has((gi - 1) + ',' + gj) || deep.has(gi + ',' + gj);
        };
        // The anchor standing ON the core is the BEST case, not the worst: the tie lands straight
        // into the deep element, so there is no back span to run out of. Returning 0 here made
        // every such group fail the ratio and go to 'prop' — 28 of 28 on the SAMPLE.
        if (onDeep(anchorPos)) return { mods: Infinity, hitAnchor: true, atCore: true };
        let acc = 0, prev = anchorPos;
        for (let k = idx + dir; k >= 0 && k < axisArr.length; k += dir) {
          const cand = axisArr[k];
          if (!gSet.has(cellOf(cand))) break;
          acc += Math.abs(cand - prev); prev = cand;
          if (onDeep(cand)) return { mods: acc, hitAnchor: true };
        }
        return { mods: acc, hitAnchor: false };
      };
      // SYS2 long-span extension — from the immediate anchor, keep walking further into the
      // grounded zone (same direction, away from the hung point), up to `capMods` additional
      // modules, staying on grounded grid points (restricted to `gSet`, the level-specific anchor
      // set — same rule as backspanModules). Returns the farthest grounded grid coordinate reached
      // (== anchorPos, unextended, if the very next grid point is already ungrounded or off-grid —
      // the graceful degenerate case when there is no room to build a true long-span truss).
      const extendGroundedFar = (axisArr, anchorPos, hungPos, fixedCoord, rowCase, gSet, capMods) => {
        const dir = anchorPos > hungPos ? 1 : -1, idx = axisArr.indexOf(anchorPos);
        let far = anchorPos, acc = 0, prev = anchorPos;
        for (let k = idx + dir; k >= 0 && k < axisArr.length; k += dir) {
          const cand = axisArr[k], key = rowCase ? (cand + ',' + fixedCoord) : (fixedCoord + ',' + cand);
          if (!gSet.has(key)) break;
          const step = Math.abs(cand - prev);
          if (acc + step > capMods + 1e-6) break;
          acc += step; prev = cand; far = cand;
        }
        return far;
      };
      // ── RC TRANSFER COLLECTOR ── two hung runs regularly share a grid line or a fulcrum. Drawn
      // as open steel trusses that overlap just reads as more structure; drawn as solid concrete
      // it is z-fighting mush and doubled edges, and a haunch ends up nested inside another
      // haunch. So the RC branch of buildTransferMember RECORDS its members here instead of
      // drawing them, and they are emitted after the transfer loop: collinear beams at the same
      // floor line merge into one continuous member (which is what a cast beam would be), and
      // haunches collapse per fulcrum + direction. Members are keyed on the FLOOR LINE `zb`, not
      // the member centre, so two beams of different depth on the same line still merge.
      // Steel collects too, for the same reason: one TRUSS LINE (axis + offset + chord elevations)
      // is one truss, however many hung columns tie back along it.
      const rcBeams = new Map(), rcHaunches = new Map(), steelTrusses = new Map();
      const k2 = v => v.toFixed(2);
      const rcBeamKey = (axisIsX, fixedW, zb) => `${axisIsX}|${k2(fixedW)}|${k2(zb)}`;
      const rcPutBeam = (key, axisIsX, fixedW, zb, dep, w, a, b, flagged) => {
        const p = rcBeams.get(key);
        if (p) { p.a = Math.min(p.a, a); p.b = Math.max(p.b, b); p.dep = Math.max(p.dep, dep); p.w = Math.max(p.w, w); p.flagged = p.flagged || flagged; }
        else rcBeams.set(key, { axisIsX, fixedW, zb, dep, w, a, b, flagged });
      };
      const rcPutHaunch = (beamKey, a, b, flagged) => {
        const key = `${beamKey}|${k2(Math.min(a, b))}`, p = rcHaunches.get(key);
        if (p) { p.a = Math.min(p.a, a); p.b = Math.max(p.b, b); p.flagged = p.flagged || flagged; }
        else rcHaunches.set(key, { beamKey, a: Math.min(a, b), b: Math.max(a, b), flagged });
      };

      // SYS2/SYS3 transfer member spanning the tie axis (X if axisIsX, else Z) at fixed world
      // coord `fixedW` on the other axis. `tipX` = the hung column's world coord (SYS3 tip);
      // `reachAnchorX` = the IMMEDIATE grounded anchor (boundary between the cantilever's reach
      // zone and the grounded backspan — this is the SYS3-to-column-grid interface node); `farX`
      // = the extended-far grounded coordinate from extendGroundedFar (the SYS2 truss's true deep
      // root, up to SYS2_SPAN_MODS beyond the anchor, or `reachAnchorX` again if there's no room
      // to extend). zb/ztop = elevation range of the WHOLE hung sub-run (ztop-zb = stack height,
      // not truss depth). reachMods = module reach; flagged = R3 (B≥2C) failed; stack = floors in
      // the group; floorYs = each floor's yBase within the group, ascending (floorYs[last] = the
      // top hung floor, directly under the hanger bar; floorYs[0] = zb, the group's bottom floor).
      const buildTransferMember = (tipX, reachAnchorX, farX, fixedW, axisIsX, zb, ztop, reachMods, flagged, stack, floorYs) => {
        const simple = reachMods < 3 && stack < 2;   // R5 + coat-hanger gate: trivial case only
        if (simple) {   // plain cantilever girder, unchanged — no SYS2 truss needed, nothing to hang
          const x0 = Math.min(tipX, reachAnchorX), x1 = Math.max(tipX, reachAnchorX);
          const label = flagged ? 'cantilever back-span (R3 short)' : 'cantilever back-span';
          const c = flagged ? STRUCT.flag : STRUCT.trans;
          if (axisIsX) addStruct((x0 + x1) / 2, zb - CANT_H / 2, fixedW, x1 - x0, CANT_H, CANT_W, c, 1, label, null, null);
          else addStruct(fixedW, zb - CANT_H / 2, (x0 + x1) / 2, CANT_W, CANT_H, x1 - x0, c, 1, label, null, null);
          return;
        }
        // ── SYS2 LONG-SPAN HANGER TRUSS (reach ≥3 and/or stack ≥2) — supersedes the 260722(b)
        // per-group LOCAL hanger truss, which stopped exactly at the nearest anchor (span ≈ reach
        // only, a few modules). Per cantilever_truss_whole_building.py's SYSTEM_MAP, the real
        // building's hanger bar (TR_CHORD_300, 30.39 m ≈ 3.91 column bays) is a building-scale
        // member that rides across the grounded grid back toward a deep column/core — so the truss
        // here now spans tip..farX (extended by extendGroundedFar, up to SYS2_SPAN_MODS), not just
        // tip..reachAnchorX. The hanger mechanism itself (top-only truss depth, tension hangers
        // below, short root struts) is unchanged from 260722(b) — only the truss's SPAN changed. ──
        const c = flagged ? STRUCT.flag : STRUCT.trans;
        if (RC) {
          // ── RC DEEP TRANSFER BEAM — the concrete answer to the same problem, and it draws no
          //    diagonal member at all. Instead of hanging the group off a truss at its TOP, one
          //    deep beam runs under the group's BASE and cantilevers past the fulcrum out to the
          //    tip, with a haunch deepening it on the reach side of the support. The hung columns
          //    (COL_CANT, already drawn in the COLUMNS pass) bear on it and carry every floor
          //    above in compression, so there is nothing to hang and no web to brace. The beam
          //    spans tip..farX; the stretch past the fulcrum is the tie-down, held by the grounded
          //    columns it passes under, which is what the steel scheme needed root struts for.
          //    Members go into rcBeams/rcHaunches, not straight to the scene — see the collector.
          const bw = rcBeamWidth(reachMods);
          // DEPTH scales with the reach the beam carries (≈ reach/5, the usual RC cantilever
          // proportion), floored at 1.5× the normal girder so it always reads as the heavier
          // member and capped at RC_XFER_DMAX so it stays a BEAM. The first cut made it a
          // full-storey wall beam sitting ON the floor plate; every other girder in this model
          // hangs BELOW its floor line, so the cantilever looked like a wall standing on the slab
          // instead of the thing carrying it. It now hangs below zb like the rest of the frame,
          // which is also where a cantilever's depth belongs: in the open air under the overhang.
          const dBeam = Math.min(RC_XFER_DMAX, Math.max(PRI_H * 1.5, Math.abs(tipX - reachAnchorX) / 5));
          const key = rcBeamKey(axisIsX, fixedW, zb);
          rcPutBeam(key, axisIsX, fixedW, zb, dBeam, bw, Math.min(tipX, farX), Math.max(tipX, farX), flagged);
          // HAUNCH — a cantilever is deepest at its root and tapers to the tip, so the deepening
          // sits on the REACH side of the fulcrum, never centred on it: centring put half the
          // block past the end of the beam whenever the backspan could not extend (22 of the 25
          // transfers on the SAMPLE), leaving fat stubs floating in mid-air. Growing from the
          // fulcrum into the reach keeps it inside the beam's own span by construction.
          const dir = Math.sign(tipX - reachAnchorX) || 1;
          const hL = Math.min(M * 1.5, Math.abs(tipX - reachAnchorX) * 0.5);
          rcPutHaunch(key, reachAnchorX, reachAnchorX + dir * hL, flagged);
          return;
        }
        const sec = trussSection(reachMods);   // R5 ladder (heavier — the hanger bar is the primary carrier)
        // 1. TOP HANGER TRUSS — one storey deep, at the TOP of the group (the "衣架橫桿"), sitting
        //    ON the top hung floor. `botFloor` is that floor; the emit puts the bottom chord just
        //    above it rather than straddling it.
        const botFloor = floorYs.length ? floorYs[floorYs.length - 1] : zb;
        // Nothing is drawn here: the truss is RECORDED on its line and emitted once after the
        // transfer loop. Several hung columns routinely tie back along the SAME grid line at the
        // SAME height, and drawing one truss per column stacked them: 11 lines on SAMPLE carried
        // two trusses each, one pair overlapping over 15.5 m. Because the two spans differ their
        // panel nodes differ, so the two Warren webs crossed instead of coinciding, and 2 or 4
        // diagonals grew out of one node in the same direction. One line is one truss.
        // Trusses on a line are matched by PROXIMITY of their group tops, not by an exact key.
        // Keying on `ztop.toFixed(2)` still left a pair 1 cm apart as two separate trusses whose
        // chord boxes then overlapped by 0.97 m³ — two hung runs ending at almost the same height
        // are one truss, not two. Anything within 0.6 m (well under a storey) merges: deepest
        // bottom floor, heaviest section, and any failing R3 flags the whole member.
        const lineKey = `${axisIsX}|${fixedW.toFixed(2)}`;
        let list = steelTrusses.get(lineKey); if (!list) steelTrusses.set(lineKey, list = []);
        let t = list.find(e => Math.abs(e.ztop - ztop) < 0.6);
        if (!t) list.push(t = { axisIsX, fixedW, ztop, botFloor, zb, floorYs, sec, flagged, a: Infinity, b: -Infinity, reach: [], roots: new Map() });
        t.a = Math.min(t.a, tipX, farX); t.b = Math.max(t.b, tipX, farX);
        t.ztop = Math.max(t.ztop, ztop);
        // HIGHEST bottom floor, not the lowest. Taking the lowest made a merged truss span several
        // storeys, and its Warren web then cut straight through the girders of every floor in
        // between. The hanger bar is one storey deep at the top of the group by definition; what
        // hangs below hangs on hangers, not on a deeper web.
        t.botFloor = Math.max(t.botFloor, botFloor);
        if (sec.chord > t.sec.chord) t.sec = sec;                       // heaviest reach on the line sizes it
        t.flagged = t.flagged || flagged;
        if (floorYs.length > t.floorYs.length) { t.floorYs = floorYs; t.zb = zb; }
        t.reach.push([Math.min(tipX, reachAnchorX), Math.max(tipX, reachAnchorX), tipX]);   // braces only over these; 3rd entry marks the free end
        t.roots.set(farX.toFixed(2), { far: farX, dir: Math.sign(tipX - farX) || 1 });
        // No SYS3 interface tie is recorded. It was a vertical member at reachAnchorX running from
        // the group's base up to the bottom chord — but reachAnchorX is by definition a GROUNDED
        // anchor, so a main column already stands on exactly that line, and the tie was drawn 96%
        // buried inside it. The column is the interface; drawing a second member inside it says
        // nothing and reads as a clash.
      };
      // ── EMIT the merged steel trusses (RC records into rcBeams/rcHaunches instead; each system
      //    leaves the other's collector empty). What is drawn is no longer the 260722(b)
      //    coat-hanger — chords, a Warren web, tension hangers, root struts. 260817 replaced that
      //    with the small SYS3 members the reference model actually lists: a tie per floor line, a
      //    post per node, and diagonals. 260817(g) below then cut the diagonals down to the
      //    WoZoCo reading. The merge collector itself is untouched: two hung runs on one line
      //    within 0.6 m are still one assembly, or the overlapping-member problem from 260722
      //    comes straight back. ──
      // ── 260817(g) WoZoCo READING — STRUCTURE-CANTILEVER-BRACE-PLAN, references/wozoco.jpg ────
      // Until now this drew one diagonal in EVERY column bay of EVERY storey of every cantilevered
      // line: a 4-storey group 3 bays deep carried 9 of them, on all three of its parallel lines,
      // so the projection read as a filled-in truss wall. A truss textbook draws a web like that; a
      // hung volume is not that. In the WoZoCo section the projecting box carries TWO diagonals in
      // total — each runs from the bottom of the box to its top, straight past the intermediate
      // floor lines, and both sit in the party walls at the ENDS of the box. The floors inside the
      // box span between those two walls, and the faces between them carry no diagonal at all.
      // So the bracing is cut on three axes at once:
      //   · faces  (§1B) only the two outermost lines of each cantilevered volume brace. Inner
      //            lines keep every post and every tie, so no floor loses its hanger; in-plane
      //            shear goes to the two end faces. That IS the party-wall mechanism.
      //   · bays   (§1A) only the outermost bay at each end of the reach, never the middle ones.
      //   · height (§1A) one member from the group's bottom floor line to its top one, crossing
      //            the floor lines in between, split along a floor line only where it would
      //            otherwise stand steeper than DIAG_MAX_RATIO (a 3:1 "brace" is a post).
      // Do NOT restore a per-bay web here on the "a truss needs a web in every panel" instinct —
      // that exact instinct already put the core diagonals back once, in 260817(b). ?cbrace=0
      // restores the 260817 per-bay per-storey version verbatim, for A/B.
      const emitSteelTrusses = () => {
        const bay = COLSTEP * M, TOL = 0.6;
        const CAN_LADDER = [CAN_SEC, CAN_SEC_TIGHT, CAN_SEC_HEAVY];
        const all = [];
        for (const list of steelTrusses.values()) for (const t of list) all.push(t);
        // per-line geometry, computed once so the census and the drawing can never disagree
        for (const t of all) {
          t.ys = (t.floorYs && t.floorYs.length ? t.floorYs.slice() : [t.zb]).sort((a, b) => a - b);
          t.panels = t.reach.map(rr => {
            const lo = Math.min(rr[0], rr[1]), hi = Math.max(rr[0], rr[1]), len = hi - lo;
            return { lo, hi, len, n: Math.max(1, Math.round(len / bay)),
                     tipAtHi: rr.length > 2 ? rr[2] >= (lo + hi) / 2 : true };
          }).filter(p => p.len > 1e-6);
        }
        // Height segments for ONE diagonal of horizontal width w: normally a single member over the
        // whole group, cut on the nearest floor lines when the group is too tall to brace in one
        // go. Cuts land on floor lines only — a diagonal ending in mid-air at half a storey has
        // nothing to be pinned to.
        const segsFor = (ys, w) => {
          const L = ys.length - 1;
          if (L < 1 || w <= 1e-6) return [];
          const m = Math.max(1, Math.min(L, Math.ceil((ys[L] - ys[0]) / (w * DIAG_MAX_RATIO))));
          const out = [];
          let prev = 0;
          for (let i = 1; i <= m && prev < L; i++) {
            const cut = Math.min(L, Math.max(prev + 1, Math.round((i * L) / m)));
            out.push([prev, cut]); prev = cut;
          }
          if (out.length) out[out.length - 1][1] = L;
          return out;
        };
        const bayKs = n => (n <= 1 ? [0] : [0, n - 1]);   // outermost bay at each end; n<=2 means all of them
        // §1B — the lines recorded above are single planes. Group them back into cantilevered
        // VOLUMES: same axis, lines within one column bay of each other, overlapping reach,
        // overlapping height. Union-find, because "adjacent" is transitive across a 3-line box.
        // The merge collector in buildTransferMember is NOT touched (260722 lesson: the vertical
        // grouping was already right long before anyone suspected it) — this only decides which of
        // the already-merged lines draws diagonals.
        const uf = all.map((_, i) => i);
        const find = i => { while (uf[i] !== i) i = uf[i] = uf[uf[i]]; return i; };
        const sameVolume = (a, b) => a.axisIsX === b.axisIsX &&
          Math.abs(a.fixedW - b.fixedW) <= bay + TOL &&          // neighbouring column lines
          a.a < b.b + TOL && b.a < a.b + TOL &&                  // reach intervals overlap
          a.zb < b.ztop + TOL && b.zb < a.ztop + TOL;            // and they overlap in height
        for (let i = 0; i < all.length; i++) for (let j = i + 1; j < all.length; j++)
          if (sameVolume(all[i], all[j])) { const ra = find(i), rb = find(j); if (ra !== rb) uf[ra] = rb; }
        const groups = new Map();
        for (let i = 0; i < all.length; i++) { const r = find(i); if (!groups.has(r)) groups.set(r, []); groups.get(r).push(all[i]); }
        // The building-wide reading of "the outermost two sides": only the two extreme column lines
        // of the WHOLE building on each axis brace, so a cantilevered volume in the middle of the
        // plan gets none. ?cbrace=building. The default reads it per volume, which is what the
        // WoZoCo section shows: its two braces are the ends of ONE box, not of the block.
        // A face one floor line tall has nothing to run a diagonal between, so it cannot be one of
        // the two braced ends — picking it anyway spends an end on a member that is never drawn.
        // The SAMPLE band is exactly that case: it tops out level but hangs 1 to 5 floors deep, so
        // its outermost line is its shallowest, and reading "outermost" literally left the whole
        // 8-line band braced on ONE face. Outermost is therefore taken among the faces that can
        // carry a brace; a volume where fewer than two can is recorded under LAT below.
        const braceable = t => t.ys.length > 1 && t.panels.length > 0;
        const globalEdge = new Map();
        if (CANT_EDGE_SCOPE === 'building') for (const t of all) {
          if (!braceable(t)) continue;
          const k = String(t.axisIsX), e = globalEdge.get(k);
          if (!e) globalEdge.set(k, { lo: t.fixedW, hi: t.fixedW });
          else { e.lo = Math.min(e.lo, t.fixedW); e.hi = Math.max(e.hi, t.fixedW); }
        }
        const cantDiag = [];
        for (const g of groups.values()) {
          let lo = Infinity, hi = -Infinity;
          for (const t of g) if (braceable(t)) { lo = Math.min(lo, t.fixedW); hi = Math.max(hi, t.fixedW); }
          if (CANT_EDGE_SCOPE === 'building') {
            const e = globalEdge.get(String(g[0].axisIsX));
            if (e) { lo = e.lo; hi = e.hi; }
          }
          let before = 0, after = 0;
          for (const t of g) {
            t.edge = Math.abs(t.fixedW - lo) <= TOL || Math.abs(t.fixedW - hi) <= TOL;
            for (const p of t.panels) {
              before += Math.max(0, t.ys.length - 1) * p.n;
              if (t.edge) after += bayKs(p.n).length * segsFor(t.ys, p.len / p.n).length;
            }
          }
          // SECTION. Cutting the member count this far concentrates the same in-plane shear into
          // what is left, and CAN_SEC = 0.14 was sized for the dense web. A group that loses more
          // than two thirds of its diagonals goes one step up the ladder at CAN_SEC_HEAVY, more
          // than seven eighths two steps. Diagrammatic grading, not an engineering check — leaving
          // 0.14 under a 25:1 concentration would quietly claim something the model cannot back.
          const ratio = after > 0 ? before / after : 0;
          const step = ratio > 8 ? 2 : ratio > 3 ? 1 : 0;
          for (const t of g) t.step = step;
          const lines = [...new Set(g.map(t => +t.fixedW.toFixed(2)))].sort((a, b) => a - b);
          const braced = [...new Set(g.filter(t => t.edge).map(t => +t.fixedW.toFixed(2)))].sort((a, b) => a - b);
          // Per FACE as well as per volume: a volume's outermost line is not always its tallest,
          // and the acceptance test (a diagonal spans >= 2 storeys) is a per-face fact.
          const faces = g.map(t => ({ w: +t.fixedW.toFixed(2), floors: t.ys.length, edge: !!t.edge,
                                      bays: t.panels.map(p => p.n),
                                      drawn: t.edge ? t.panels.reduce((a, p) => a + bayKs(p.n).length * segsFor(t.ys, p.len / p.n).length, 0) : 0,
                                      storeysPerDiag: t.panels.map(p => { const sg = segsFor(t.ys, p.len / p.n); return sg.length ? Math.max(...sg.map(q => q[1] - q[0])) : 0; }) }))
                          .sort((a, b) => a.w - b.w);
          cantDiag.push({ axis: g[0].axisIsX ? 'X' : 'Z', lines, braced,
                          span: +Math.max(...g.map(t => t.b - t.a)).toFixed(2),
                          floors: Math.max(...g.map(t => t.ys.length)),
                          before, after, ratio: +ratio.toFixed(2), step, faces });
          // Same rule as the perimeter braces (LAT): a volume left standing on one braced plane is
          // recorded, never quietly propped up by re-bracing a face inside the box. Counted on the
          // planes that actually carry a diagonal — a nominated end that draws none is not a brace.
          const drawnPlanes = new Set(faces.filter(f => f.drawn > 0).map(f => f.w));
          if (CANT_EDGE && lines.length > 1 && after > 0 && drawnPlanes.size < 2)
            CODE_CHECK.violations.push({ rule: 'LAT', level: 0, measured: drawnPlanes.size + ' braced face(s)',
              threshold: '2 faces per cantilevered volume', unit: '', note: 'cantilevered volume braced on fewer than two faces' });
        }
        if (STRUCT_DIAG) STRUCT_DIAG.cant = cantDiag;
        for (const t of all) {
          const span = t.b - t.a;
          if (STRUCT_DIAG) STRUCT_DIAG.trusses.push({ span: +span.toFixed(2), ztop: +t.ztop.toFixed(2), flagged: !!t.flagged });
          const c = t.flagged ? STRUCT.flag : STRUCT.trans;
          const label = t.flagged ? 'cantilever brace (R3 tight)' : 'cantilever brace';
          const sc = t.flagged ? CAN_SEC_TIGHT : CAN_SEC;
          const scD = CANT_EDGE ? CAN_LADDER[Math.min(CAN_LADDER.length - 1, (t.flagged ? 1 : 0) + (t.step || 0))] : sc;   // diagonals only; ties and posts keep sc
          const posAt = (p, y) => t.axisIsX ? new THREE.Vector3(p, y, t.fixedW) : new THREE.Vector3(t.fixedW, y, p);
          const ys = t.ys;
          for (const pn of t.panels) {
            const lo = pn.lo, hi = pn.hi, len = pn.len, n = pn.n, tipAtHi = pn.tipAtHi;
            const nodeAt = k => lo + (len * k) / n;
            // horizontal tie at every floor line the group spans
            for (const y of ys) {
              if (t.axisIsX) addStruct((lo + hi) / 2, y - sc / 2, t.fixedW, len, sc, sc, c, 1, label + ' tie', null, null);
              else addStruct(t.fixedW, y - sc / 2, (lo + hi) / 2, sc, sc, len, c, 1, label + ' tie', null, null);
            }
            // vertical post at each node, from the group's base to its top. Kept on EVERY line,
            // braced or not: the posts are what the floors hang from, the diagonals only take
            // in-plane shear. Dropping the posts on the inner lines would drop the floors.
            const yLo = ys[0], yHi = ys[ys.length - 1];
            if (yHi - yLo > 1e-6) for (let k = 0; k <= n; k++) {
              const x = nodeAt(k);
              if (t.axisIsX) addStruct(x, (yLo + yHi) / 2, t.fixedW, sc, yHi - yLo, sc, c, 1, label + ' post', null, null);
              else addStruct(t.fixedW, (yLo + yHi) / 2, x, sc, yHi - yLo, sc, c, 1, label + ' post', null, null);
            }
            if (!CANT_EDGE) {
              // 260817 control group, kept runnable for A/B: ONE-WAY diagonals, every panel, every
              // storey — anchor end high, tip end low.
              for (let si = 0; si < ys.length - 1; si++) {
                const yA = ys[si], yB = ys[si + 1];
                for (let k = 0; k < n; k++) {
                  const x0 = nodeAt(k), x1 = nodeAt(k + 1);
                  const p0 = tipAtHi ? posAt(x0, yB) : posAt(x0, yA);
                  const p1 = tipAtHi ? posAt(x1, yA) : posAt(x1, yB);
                  addStrut(p0, p1, sc, c, label + ' diagonal', null, null);
                }
              }
            } else if (t.edge) {
              // End bays only, one member over the whole group height, same single lean as before
              // (anchor end high, tip end low) so the load path still reads in one direction.
              const segs = segsFor(ys, len / n);
              for (const k of bayKs(n)) for (const sg of segs) {
                const yA = ys[sg[0]], yB = ys[sg[1]];
                const x0 = nodeAt(k), x1 = nodeAt(k + 1);
                const p0 = tipAtHi ? posAt(x0, yB) : posAt(x0, yA);
                const p1 = tipAtHi ? posAt(x1, yA) : posAt(x1, yB);
                addStrut(p0, p1, scD, c, label + ' diagonal', null, null);
              }
            }
          }
        }
      };
      // Only the axis ⟂ to circulation is ever tried — a hung column with an anchor solely on the
      // OTHER (parallel-to-corridor) axis is left unanchored rather than tied back the wrong way
      // (pre-existing "no anchor on either axis" gap, just narrowed to one axis; see plan doc).
      // A steel truss can ride 4 bays back across the grid cheaply because it is mostly air. The
      // same span cast solid is a lot of concrete and reads as a wall through the building, so RC
      // takes its tie-down over 2 bays. Still lands on grid points, so the columns it passes under
      // still hold it down. R3 is judged on the TRUE backspan (backspanModules, uncapped), so the
      // flag does not move with this.
      const spanCapMods = RC ? 2 * COLSTEP : SYS2_SPAN_MODS;
      STRUCT_DIAG = { rc: !!RC, transfers: transfers.length, noAnchor: 0, flagged: 0, built: 0,
                      stacks: {}, reach: [], backspan: [], trusses: [], verdict: {}, props: 0, propFail: 0 };
      // ── R3 VERDICT ──────────────────────────────────────────────────────────────────────────
      //   C ≤ B/2            comfortable, drawn as it was
      //   B/2 < C ≤ 2B/3     allowed, brace section goes up a step and the label says so
      //   C > 2B/3, or the back span never reached a core or corridor → the cantilever has to come
      //                      down: a prop under the tip, and the group is drawn as a plain girder
      //                      because it is not a cantilever any more.
      const r3Verdict = (bs, C) => {
        if (!bs.hitAnchor) return { tier: 'prop', tight: false };
        if (bs.mods >= R3_COMFORT * C) return { tier: 'ok', tight: false };
        if (bs.mods >= R3_LIMIT * C) return { tier: 'tight', tight: true };
        return { tier: 'prop', tight: false };
      };
      // A prop stands under the tip and runs to the ground. It may only land INSIDE the building
      // footprint (user 260817): with nowhere to land the member keeps the red flag and the breach
      // is written into CODE_CHECK instead of being hidden by a column standing on the plaza.
      const groundFoot = (() => {
        const s = new Set(), lv = levels[0];
        for (const r of (L.floorRects.get(lv) || [])) for (let i = r.xMod; i < r.xMod + r.wMod; i++) for (let j = r.zMod; j < r.zMod + r.dMod; j++) s.add(i + ',' + j);
        for (const r of (L.floorCorr.get(lv) || [])) for (let i = r.xMod; i < r.xMod + r.wMod; i++) for (let j = r.zMod; j < r.zMod + r.dMod; j++) s.add(i + ',' + j);
        for (const c of L.coreShafts) if (lv >= c.minL && lv <= c.maxL) for (let i = c.xMod; i < c.xMod + c.wMod; i++) for (let j = c.zMod; j < c.zMod + c.dMod; j++) s.add(i + ',' + j);
        return s;
      })();
      const yGround = yBase(levels[0]);
      const propUnder = (t, axisIsX) => {
        const inside = groundFoot.has(t.gi + ',' + t.gj);
        if (!inside) {
          STRUCT_DIAG.propFail++;
          CODE_CHECK.violations.push({ rule: 'R3', level: t.lv0, measured: 'no landing', threshold: 'prop inside footprint',
            unit: '', note: 'cantilever exceeds C ≤ ⅔B and its tip has nowhere to come down inside the building' });
          return;
        }
        STRUCT_DIAG.props++;
        const h = t.zb - yGround;
        if (h <= 0) return;
        addStruct(wx(t.gi), yGround + h / 2, wz(t.gj), COL_MAIN, h, COL_MAIN, STRUCT.col, 1, 'cantilever prop', t.lv0, matFrame);
      };
      for (const t of transfers) STRUCT_DIAG.stacks[t.stack] = (STRUCT_DIAG.stacks[t.stack] || 0) + 1;
      for (const t of transfers) {
        const gSet = groundedAtLv.get(t.lv0) || new Set();          // anchors grounded AT this run's root floor
        const gpts = [...gSet].map(s => s.split(',').map(Number));
        if (corridorAlongX) {   // project ±Z → tie back along Z only (col: fixed gi, varying gj)
          const col = gpts.filter(([x, y]) => x === t.gi && y !== t.gj);
          if (!col.length) { STRUCT_DIAG.noAnchor++; continue; }
          const gy = col.reduce((p, c) => Math.abs(c[1] - t.gj) < Math.abs(p[1] - t.gj) ? c : p)[1];
          const reachMods = Math.abs(gy - t.gj);
          const bs = backspanToAnchor(gys, gy, t.gj, t.gi, false, gSet, t.lv0);
          const v = r3Verdict(bs, reachMods);
          STRUCT_DIAG.built++; STRUCT_DIAG.reach.push(reachMods); STRUCT_DIAG.backspan.push(isFinite(bs.mods) ? bs.mods : -1);   // -1 = anchored straight into a core
          STRUCT_DIAG.verdict[v.tier] = (STRUCT_DIAG.verdict[v.tier] || 0) + 1;
          if (v.tier === 'prop') { propUnder(t, false); continue; }
          if (v.tier !== 'ok') STRUCT_DIAG.flagged++;
          const farGy = extendGroundedFar(gys, gy, t.gj, t.gi, false, gSet, Math.max(0, spanCapMods - reachMods));
          buildTransferMember(wz(t.gj), wz(gy), wz(farGy), wx(t.gi), false, t.zb, t.ztop, reachMods, v.tight, t.stack, t.floorYs);
        } else {   // project ±X → tie back along X only (row: fixed gj, varying gi)
          const row = gpts.filter(([x, y]) => y === t.gj && x !== t.gi);
          if (!row.length) { STRUCT_DIAG.noAnchor++; continue; }
          const gx = row.reduce((p, c) => Math.abs(c[0] - t.gi) < Math.abs(p[0] - t.gi) ? c : p)[0];
          const reachMods = Math.abs(gx - t.gi);
          const bs = backspanToAnchor(gxs, gx, t.gi, t.gj, true, gSet, t.lv0);
          const v = r3Verdict(bs, reachMods);
          STRUCT_DIAG.built++; STRUCT_DIAG.reach.push(reachMods); STRUCT_DIAG.backspan.push(isFinite(bs.mods) ? bs.mods : -1);   // -1 = anchored straight into a core
          STRUCT_DIAG.verdict[v.tier] = (STRUCT_DIAG.verdict[v.tier] || 0) + 1;
          if (v.tier === 'prop') { propUnder(t, true); continue; }
          if (v.tier !== 'ok') STRUCT_DIAG.flagged++;
          const farGx = extendGroundedFar(gxs, gx, t.gi, t.gj, true, gSet, Math.max(0, spanCapMods - reachMods));
          buildTransferMember(wx(t.gi), wx(gx), wx(farGx), wz(t.gj), true, t.zb, t.ztop, reachMods, v.tight, t.stack, t.floorYs);
        }
      }
      emitSteelTrusses();
      // ── EMIT the collected RC transfer members (the steel map is empty in this system and the
      //    RC maps are empty in that one). Beams first, since each haunch reads its merged
      //    parent's depth. ──
      // A transfer beam intrudes into the storey below, which is what transfer beams do, but it
      // must not punch through the slab under it: reach/5 plus a 45% haunch reaches 3.19 m, and a
      // SHORT course is only 2.59 m tall. So the beam AND its haunch together are clamped to 80%
      // of the actual storey below the beam's floor line, leaving that floor its slab and a bit of
      // headroom. Depth is per merged beam, so a beam whose reach zone hangs in open air is
      // clamped by its backspan end too — conservative, and it keeps one member one depth.
      const floorLines = levels.map(lv => yBase(lv)).sort((a, b) => a - b);
      const storeyUnder = zb => { let below = null; for (const y of floorLines) if (y < zb - 1e-6) below = y; return below === null ? FLOOR_H : zb - below; };
      for (const b of rcBeams.values()) {
        const len = b.b - b.a; if (len < 0.05) continue;
        b.dep = Math.max(0.9, Math.min(b.dep, storeyUnder(b.zb) * 0.8 / 1.45));
        const bc = b.flagged ? STRUCT.flag : STRUCT.trans;
        const lab = b.flagged ? 'cantilever transfer beam (R3 short)' : 'cantilever transfer beam';
        const y = b.zb - b.dep / 2, mid = (b.a + b.b) / 2;
        if (b.axisIsX) addStruct(mid, y, b.fixedW, len, b.dep, b.w, bc, 1, lab, null, null);
        else addStruct(b.fixedW, y, mid, b.w, b.dep, len, bc, 1, lab, null, null);
      }
      for (const h of rcHaunches.values()) {
        const b = rcBeams.get(h.beamKey); if (!b) continue;
        // clamp to the MERGED beam's span — merging can only grow a beam, but clamping is what
        // guarantees a haunch never pokes out past the end of the member it deepens.
        const a = Math.max(h.a, b.a), z = Math.min(h.b, b.b);
        if (z - a < 0.05) continue;
        const dh = b.dep * 0.45, y = b.zb - b.dep - dh / 2;
        const hc = h.flagged ? STRUCT.flag : STRUCT.trans;
        const lab = h.flagged ? 'cantilever transfer haunch (R3 short)' : 'cantilever transfer haunch';
        if (b.axisIsX) addStruct((a + z) / 2, y, b.fixedW, z - a, dh, b.w, hc, 1, lab, null, null);
        else addStruct(b.fixedW, y, (a + z) / 2, b.w, dh, z - a, hc, 1, lab, null, null);
      }

      // ── BEAMS — two-tier per floor (sit under the slab) ──
      //   PRIMARY girders: connect adjacent columns on the grid, both axes (deep section).
      //   SECONDARY joists: along X at every interior module Z-line between girders (shallow),
      //   wherever floor exists — merged into runs to limit the box count.
      const gysSet = new Set(gys);
      for (const lv of levels) {
        const yz = yBase(lv);
        // primary girders — heavy when BOTH ends sit on grounded (main) columns; thin if either
        // end is a hung/cantilever column (the span is then cantilever back-span, not main frame).
        const gAt = groundedAtLv.get(lv);
        const s = occ.get(lv);
        const onX = (i, y) => s.has(i + ',' + (y - 1)) || s.has(i + ',' + y);   // occupied under an X-girder at Z-line y
        const onZ = (x, j) => s.has((x - 1) + ',' + j) || s.has(x + ',' + j);   // occupied under a Z-girder at X-line x
        const pts = [...colAt.get(lv)].map(key => key.split(',').map(Number)), byRow = new Map(), byCol = new Map();
        for (const [x, y] of pts) { (byRow.get(y) || byRow.set(y, []).get(y)).push(x); (byCol.get(x) || byCol.set(x, []).get(x)).push(y); }
        // girders connect adjacent columns, but only over OCCUPIED columns → no beam where no volume
        for (const [y, xs] of byRow) {
          const u = [...new Set(xs)].sort((p, q) => p - q);
          for (let n = 0; n < u.length - 1; n++) {
            const main = gAt.has(u[n] + ',' + y) && gAt.has(u[n + 1] + ',' + y), w = main ? PRI_W : CANT_W, h = main ? PRI_H : CANT_H;
            let seg = -1;
            for (let i = u[n]; i <= u[n + 1]; i++) {
              if (i < u[n + 1] && onX(i, y)) { if (seg < 0) seg = i; }
              else if (seg >= 0) { addStruct((wx(seg) + wx(i)) / 2, yz - h / 2, wz(y), wx(i) - wx(seg), h, w, main ? STRUCT.beam : STRUCT.trans, 1, main ? 'girder' : 'cantilever girder', lv, main ? matFrame : null); seg = -1; }
            }
          }
        }
        for (const [x, ys] of byCol) {
          const u = [...new Set(ys)].sort((p, q) => p - q);
          for (let n = 0; n < u.length - 1; n++) {
            const main = gAt.has(x + ',' + u[n]) && gAt.has(x + ',' + u[n + 1]), w = main ? PRI_W : CANT_W, h = main ? PRI_H : CANT_H;
            let seg = -1;
            for (let j = u[n]; j <= u[n + 1]; j++) {
              if (j < u[n + 1] && onZ(x, j)) { if (seg < 0) seg = j; }
              else if (seg >= 0) { addStruct(wx(x), yz - h / 2, (wz(seg) + wz(j)) / 2, w, h, wz(j) - wz(seg), main ? STRUCT.beam : STRUCT.trans, 1, main ? 'girder' : 'cantilever girder', lv, main ? matFrame : null); seg = -1; }
            }
          }
        }
        // secondary joists (along X, interior module lines only) — s reused from above
        for (let j = 0; j <= L.FD; j++) {
          if (gysSet.has(j)) continue;                          // girder line → skip
          const row = [];
          for (let i = 0; i < L.FW; i++) if (s.has(i + ',' + (j - 1)) || s.has(i + ',' + j)) row.push(i);
          if (!row.length) continue;
          let a = row[0], p = row[0];
          for (let n = 1; n <= row.length; n++) {
            if (n < row.length && row[n] === p + 1) { p = row[n]; continue; }
            addStruct((wx(a) + wx(p + 1)) / 2, yz - SEC_H / 2, wz(j), wx(p + 1) - wx(a), SEC_H, SEC_W, STRUCT.beam, 1, 'joist', lv, matFrame);
            if (n < row.length) { a = row[n]; p = row[n]; }
          }
        }
      }

      // ── SLABS — thin plate per LONG footprint at each floor bottom (+ roof over the top floor);
      //    SHORT footprints are skipped (their bricks already read as a solid). ──
      for (const lv of levels) {
        const yz = yBase(lv);
        for (const r of [...L.floorRects.get(lv).filter(r => !rectShort(r)), ...(L.floorCorr.get(lv) || [])])
          addStruct(wx(r.xMod + r.wMod / 2), yz - SLAB_T / 2, wz(r.zMod + r.dMod / 2), r.wMod * M, SLAB_T, r.dMod * M, STRUCT.slab, 1, 'slab', lv, matSlab);
      }
      // ROOF / TOP PLATE — cap every cell that has NO volume on the floor above
      // (terminated masses: setbacks, terraces, AND the very top floor). Cells are
      // merged into runs along X per row to keep the plate count down. ──
      const roofRun = (cells, yTop, lv) => {
        const byJ = new Map();
        for (const key of cells) { const [i, j] = key.split(',').map(Number); (byJ.get(j) || byJ.set(j, []).get(j)).push(i); }
        for (const [j, is] of byJ) {
          is.sort((a, b) => a - b);
          let s = is[0], p = is[0];
          for (let n = 1; n <= is.length; n++) {
            if (n < is.length && is[n] === p + 1) { p = is[n]; continue; }
            const x0 = wx(s), x1 = wx(p + 1), z0 = wz(j), z1 = wz(j + 1);
            addStruct((x0 + x1) / 2, yTop - SLAB_T / 2, (z0 + z1) / 2, x1 - x0, SLAB_T, z1 - z0, STRUCT.slab, 1, 'roof slab', lv, matSlab);
            if (n < is.length) { s = is[n]; p = is[n]; }
          }
        }
      };
      // ROOF BEAMS — frame under every roof plate (no volume above ⇒ still needs beams):
      //   grid girders along the column lines + secondary joists between, over terminated cells.
      const beamRunX = (cols, j, yz, lv, w, h) => {
        if (!cols.length) return; cols.sort((a, b) => a - b);
        let a = cols[0], p = cols[0];
        for (let n = 1; n <= cols.length; n++) {
          if (n < cols.length && cols[n] === p + 1) { p = cols[n]; continue; }
          addStruct((wx(a) + wx(p + 1)) / 2, yz - h / 2, wz(j), wx(p + 1) - wx(a), h, w, STRUCT.beam, 1, 'roof beam', lv, matFrame);
          if (n < cols.length) { a = cols[n]; p = cols[n]; }
        }
      };
      const beamRunZ = (rows, i, yz, lv, w, h) => {
        if (!rows.length) return; rows.sort((a, b) => a - b);
        let a = rows[0], p = rows[0];
        for (let n = 1; n <= rows.length; n++) {
          if (n < rows.length && rows[n] === p + 1) { p = rows[n]; continue; }
          addStruct(wx(i), yz - h / 2, (wz(a) + wz(p + 1)) / 2, w, h, wz(p + 1) - wz(a), STRUCT.beam, 1, 'roof beam', lv, matFrame);
          if (n < rows.length) { a = rows[n]; p = rows[n]; }
        }
      };
      const frameRoof = (cells, yz, lv) => {
        const inSet = (i, j) => cells.has(i + ',' + j);
        for (const gj of gys) { const cols = []; for (let i = 0; i < L.FW; i++) if (inSet(i, gj - 1) || inSet(i, gj)) cols.push(i); beamRunX(cols, gj, yz, lv, PRI_W, PRI_H); }   // X girders on grid
        for (const gi of gxs) { const rows = []; for (let j = 0; j < L.FD; j++) if (inSet(gi - 1, j) || inSet(gi, j)) rows.push(j); beamRunZ(rows, gi, yz, lv, PRI_W, PRI_H); }   // Z girders on grid
        for (let j = 0; j <= L.FD; j++) { if (gysSet.has(j)) continue; const row = []; for (let i = 0; i < L.FW; i++) if (inSet(i, j - 1) || inSet(i, j)) row.push(i); beamRunX(row, j, yz, lv, SEC_W, SEC_H); }   // joists between
      };
      for (let k = 0; k < levels.length; k++) {
        const lv = levels[k], above = k + 1 < levels.length ? occ.get(levels[k + 1]) : new Set();
        const term = new Set();
        for (const key of occ.get(lv)) if (!above.has(key)) term.add(key);   // occupied here, empty above → exposed top
        if (term.size) { roofRun(term, zTopOf(lv), lv); frameRoof(term, zTopOf(lv), lv); }
      }

      // ── CURTAIN WALL — glass on every exposed occupancy face, per above-grade floor ──
      for (const lv of levels) {
        if (lv < 0) continue;                                   // basements get no curtain (start at grade)
        const s = occ.get(lv), z0 = yBase(lv), z1 = zTopOf(lv), cy = (z0 + z1) / 2, hh = z1 - z0;
        for (const key of s) {
          const [i, j] = key.split(',').map(Number), cxw = (wx(i) + wx(i + 1)) / 2, czw = (wz(j) + wz(j + 1)) / 2;
          if (!s.has((i - 1) + ',' + j)) addStruct(wx(i), cy, czw, GLASS_T, hh, M, STRUCT.glass, 0.18, 'curtain wall', lv, matGlass);
          if (!s.has((i + 1) + ',' + j)) addStruct(wx(i + 1), cy, czw, GLASS_T, hh, M, STRUCT.glass, 0.18, 'curtain wall', lv, matGlass);
          if (!s.has(i + ',' + (j - 1))) addStruct(cxw, cy, wz(j), M, hh, GLASS_T, STRUCT.glass, 0.18, 'curtain wall', lv, matGlass);
          if (!s.has(i + ',' + (j + 1))) addStruct(cxw, cy, wz(j + 1), M, hh, GLASS_T, STRUCT.glass, 0.18, 'curtain wall', lv, matGlass);
        }
      }

      // ── INTERIOR PARTITIONS — the plan, standing inside the frame ──
      // Structure mode drew slabs, columns, glass and the plug-in kit and nothing between them, so
      // a floor read as one open deck whatever the program said. The walls come off the same
      // floorRects the massing plates are cut from, which is what keeps the two modes describing
      // one building rather than two.
      //
      // One wall per LINE, in ONE neutral colour (STRUCT.part). A partition is a wall, not a
      // program: colouring it by what stands on either side made the frame read as massing again,
      // and a wall between two uses had to pick a side or be drawn twice. Where a wall stands: a
      // room against a DIFFERENT room, or a room against the corridor. Not against the outside
      // (that is the curtain wall) and not against a core (the 30 cm RC shear wall is already
      // standing there) — drawing either would be a second surface in the same plane.
      if (PARTITIONS_ON) {
        const PART_T = 0.09;   // 9 cm wall, centred on the line between the two rooms
        for (const lv of levels) {
          const rects = L.floorRects.get(lv).filter(r => !r.vacant && !rectShort(r));
          if (!rects.length) continue;
          // Identity is the PROGRAM ROW (uid), not the rect and not the type. The rect is too
          // fine — P1.5 cuts an oversized room into a grid of sub-blocks that are seams, not walls,
          // and every one of them would have come back as a partition through the middle of one
          // room. The type is too coarse — two apartments side by side are two rooms and there is a
          // wall between them, which type-matching merged away (SAMPLE: 139 walls by type, 167
          // by row). A synthesised plate carries no uid, so it falls back to standing with its type.
          const cellRoom = new Map();
          for (const r of rects) {
            const id = r.uid != null ? 'u' + r.uid : 't' + r.type;
            for (let i = r.xMod; i < r.xMod + r.wMod; i++) for (let j = r.zMod; j < r.zMod + r.dMod; j++) cellRoom.set(i + ',' + j, id);
          }
          const corr = new Set();
          for (const r of (L.floorCorr.get(lv) || [])) for (let i = r.xMod; i < r.xMod + r.wMod; i++) for (let j = r.zMod; j < r.zMod + r.dMod; j++) corr.add(i + ',' + j);
          const facing = (k, nk) => cellRoom.has(nk) ? cellRoom.get(nk) !== cellRoom.get(k) : corr.has(nk);
          // floor line to the soffit of the slab above, so the wall stops where a wall stops. The
          // girders of the floor above hang below that and pass through it, which is what a beam
          // over a partition does.
          const hh = Math.max(0.2, floorHeightOf(lv) - SLAB_T), cy = yBase(lv) + hh / 2;
          // Both rooms report the shared edge, so the faces go into a Set keyed by the LINE — one
          // wall comes back, not two leaves 9 cm apart. Contiguous runs on a line merge: a
          // 20-module corridor wall is one wall, not 20 slices.
          const runs = new Map();
          const mark = (axis, line, u) => { const k = axis + '|' + line; (runs.get(k) || runs.set(k, new Set()).get(k)).add(u); };
          for (const k of cellRoom.keys()) {
            const [i, j] = k.split(',').map(Number);
            if (facing(k, (i - 1) + ',' + j)) mark('X', i, j);
            if (facing(k, (i + 1) + ',' + j)) mark('X', i + 1, j);
            if (facing(k, i + ',' + (j - 1))) mark('Z', j, i);
            if (facing(k, i + ',' + (j + 1))) mark('Z', j + 1, i);
          }
          for (const [key, set] of runs) {
            const [axis, lineS] = key.split('|'), line = +lineS, us = [...set].sort((a, b) => a - b);
            let a = us[0], p = us[0];
            for (let n = 1; n <= us.length; n++) {
              if (n < us.length && us[n] === p + 1) { p = us[n]; continue; }
              if (axis === 'X') addStruct(wx(line), cy, (wz(a) + wz(p + 1)) / 2, PART_T, hh, wz(p + 1) - wz(a), STRUCT.part, 1, 'partition', lv, null);
              else addStruct((wx(a) + wx(p + 1)) / 2, cy, wz(line), wx(p + 1) - wx(a), hh, PART_T, STRUCT.part, 1, 'partition', lv, null);
              if (n < us.length) { a = us[n]; p = us[n]; }
            }
          }
        }
      }

      // ── FACADE FRAMES — SHORT-style panel division on the curtain wall (PY §FACADE FINS).
      //    Each elevation is planned as ONE composition (not per massing volume): the exposed
      //    8'-6" cells go on a GLOBAL module grid and are packed with DISCRETE timber frames
      //    (框框) — 8'-6"×17' uprights, 17'×8'-6" flats and 8'-6"×8'-6" squares — the same
      //    square/1:2 domino interleave the SHORT module bricks show. ──
      // module edges sit at integer ×M from world 0, so strips stay on the grid.
      const FR_D = 0.15, FR_W = 0.06, FR_G = 0.03;   // frame depth · bar width · gap between frames
      const matWood = timber();                           // facade frames share one timber material
      const stp = new Map();                                       // "side|plane|low" → [[z0,z1]…]  8'-6" panel strips
      const pushIv = (key, z0, z1) => { (stp.get(key) || stp.set(key, []).get(key)).push([z0, z1]); };
      for (const lv of levels) {
        if (lv < 0) continue;
        const s = occ.get(lv), z0 = yBase(lv), z1 = zTopOf(lv);
        for (const key of s) {
          const [i, j] = key.split(',').map(Number), rx0 = wx(i), rx1 = wx(i + 1), rz0 = wz(j), rz1 = wz(j + 1);
          if (!s.has((i - 1) + ',' + j)) pushIv(`W|${rx0.toFixed(2)}|${rz0.toFixed(2)}`, z0, z1);
          if (!s.has((i + 1) + ',' + j)) pushIv(`E|${rx1.toFixed(2)}|${rz0.toFixed(2)}`, z0, z1);
          if (!s.has(i + ',' + (j - 1))) pushIv(`S|${rz0.toFixed(2)}|${rx0.toFixed(2)}`, z0, z1);
          if (!s.has(i + ',' + (j + 1))) pushIv(`N|${rz1.toFixed(2)}|${rx0.toFixed(2)}`, z0, z1);
        }
      }
      const mergeIv = ints => { ints.sort((a, b) => a[0] - b[0]); const out = [ints[0].slice()]; for (let n = 1; n < ints.length; n++) { const [a, b] = ints[n]; if (a <= out[out.length - 1][1] + 0.01) out[out.length - 1][1] = Math.max(out[out.length - 1][1], b); else out.push([a, b]); } return out; };
      // one frame (框) = 4 timber bars outlining a panel, inset FR_G on every edge so each
      // frame reads as its own discrete rectangle (no shared/merged mullions between panels).
      const frame = (side, plane, u0, u1, y0, y1, label) => {
        u0 += FR_G; u1 -= FR_G; y0 += FR_G; y1 -= FR_G;
        const um = (u0 + u1) / 2, ym = (y0 + y1) / 2, uw = u1 - u0, yh = y1 - y0;
        const bars = [
          [um, y0 + FR_W / 2, uw, FR_W],            // bottom rail
          [um, y1 - FR_W / 2, uw, FR_W],            // top rail
          [u0 + FR_W / 2, ym, FR_W, yh],            // left stile
          [u1 - FR_W / 2, ym, FR_W, yh]             // right stile
        ];
        for (const [uc, yc, w, h] of bars) {
          if (side === 'W') addStruct(plane - FR_D / 2, yc, uc, FR_D, h, w, STRUCT.fin, 1, label, null, matWood);
          else if (side === 'E') addStruct(plane + FR_D / 2, yc, uc, FR_D, h, w, STRUCT.fin, 1, label, null, matWood);
          else if (side === 'S') addStruct(uc, yc, plane - FR_D / 2, w, h, FR_D, STRUCT.fin, 1, label, null, matWood);
          else addStruct(uc, yc, plane + FR_D / 2, w, h, FR_D, STRUCT.fin, 1, label, null, matWood);
        }
      };
      // plan the WHOLE elevation at once: per facade plane, index strips on the global module
      // grid (u along the facade, v = 8'-6" courses up from the ground — massing volumes on
      // the same plane share one grid) and pack the exposed cells with 1×2 UPRIGHT (8'-6"×17')
      // and 2×1 FLAT (17'×8'-6") frames; same-orientation neighbours are forbidden so the
      // dominoes interleave (交錯), and every cell left over becomes an 8'-6"×8'-6" square.
      const planes = new Map();                                      // "side|plane" → Map(u → strip)
      for (const [key, ints] of stp) {
        const [side, planeS, lowS] = key.split('|'), low = +lowS;
        const pk = side + '|' + planeS, u = Math.round((low - wx(0)) / M);
        (planes.get(pk) || planes.set(pk, new Map()).get(pk)).set(u, { runs: mergeIv(ints) });
      }
      for (const [pk, strips] of planes) {
        const [side, planeS] = pk.split('|'), plane = +planeS, sideC = side.charCodeAt(0);
        const covered = (u, v) => { const s = strips.get(u); if (!s || v < 0) return false; const c0 = v * M, c1 = c0 + M; return s.runs.some(([a, b]) => a <= c0 + 0.02 && b >= c1 - 0.02); };
        const runAt = (u, y) => strips.get(u).runs.find(([a, b]) => a <= y + 0.02 && b >= y - 0.02);
        const us = [...strips.keys()].sort((a, b) => a - b);
        let vMax = 0; for (const s of strips.values()) for (const r of s.runs) vMax = Math.max(vMax, Math.ceil(r[1] / M + 0.02));
        const occ2 = new Map(), pieces = [];                         // o: 0 = square · 1 = flat 2×1 · 2 = upright 1×2
        const oriAt = (u, v) => { const n = occ2.get(u + ',' + v); return n === undefined ? -1 : pieces[n].o; };
        for (let v = 0; v < vMax; v++) for (const u of us) {
          if (!covered(u, v) || occ2.has(u + ',' + v)) continue;
          let placed = false;
          for (const o of (hash3(u + 0.5, v + 0.5, sideC) < 0.5 ? [2, 1] : [1, 2])) {
            const u2 = o === 1 ? u + 1 : u, v2 = o === 2 ? v + 1 : v;
            if (!covered(u2, v2) || occ2.has(u2 + ',' + v2)) continue;
            const nb = [[u - 1, v], [u + 1, v], [u, v - 1], [u, v + 1], [u2 - 1, v2], [u2 + 1, v2], [u2, v2 - 1], [u2, v2 + 1]];
            if (nb.some(([x, y]) => !(x === u && y === v) && !(x === u2 && y === v2) && oriAt(x, y) === o)) continue;
            occ2.set(u + ',' + v, pieces.length); occ2.set(u2 + ',' + v2, pieces.length); pieces.push({ u, v, o }); placed = true; break;
          }
          if (!placed) { occ2.set(u + ',' + v, pieces.length); pieces.push({ u, v, o: 0 }); }
        }
        for (const p of pieces) {
          const cw = p.o === 1 ? 2 : 1, ch = p.o === 2 ? 2 : 1;
          const x0 = wx(0) + p.u * M;
          let y0 = p.v * M, y1 = y0 + ch * M;
          // stretch edge frames into the off-grid remainder where a run's top/bottom falls
          // between courses (LONG storeys are 1.5 modules, so runs can end on a half module)
          const cols = p.o === 1 ? [p.u, p.u + 1] : [p.u];
          let eT = Infinity, eB = Infinity;
          for (const uc of cols) {
            const r = runAt(uc, y0 + M / 2);
            eT = Math.min(eT, covered(uc, p.v + ch) ? 0 : Math.max(0, r[1] - y1));
            eB = Math.min(eB, covered(uc, p.v - 1) ? 0 : Math.max(0, y0 - r[0]));
          }
          if (eT > 0.02 && eT < M) y1 += eT;
          if (eB > 0.02 && eB < M) y0 -= eB;
          frame(side, plane, x0, x0 + cw * M, y0, y1, p.o === 0 ? "timber frame 8'-6\"×8'-6\"" : p.o === 1 ? "timber frame 17'×8'-6\"" : "timber frame 8'-6\"×17'");
        }
      }

      // ── CORE — continuous SOLID reinforced-concrete mass over each core's floor range,
      //    rendered with a real PBR concrete material (no longer a hollow 4-wall shaft). ──
      for (const c of L.coreShafts) {
        const z0 = yBase(c.minL), z1 = zTopOf(c.maxL), cy = (z0 + z1) / 2, hh = z1 - z0;
        const x0 = wx(c.xMod), x1 = wx(c.xMod + c.wMod), zz0 = wz(c.zMod), zz1 = wz(c.zMod + c.dMod);
        addStruct((x0 + x1) / 2, cy, (zz0 + zz1) / 2, x1 - x0, hh, zz1 - zz0, STRUCT.core, 1, c.type + ' (RC core)', c.minL, concreteRC());
      }

      // ── ALIGNED VOLUME + BRACED CORE (260807) ──
      // Re-read of references/cantilever_truss_whole_building.py: SYS1 主要量體 is "兩支核心 +
      // 梁柱結構" — the cores are single continuous volumes running the building's whole height
      // (CORE_H spans it), not something reassembled floor by floor. This file already draws each
      // core that way, but nothing above it ever treated the MASSING as one vertical volume: every
      // other pass works per level or per occupancy run, so the vertical circulation had no
      // lateral system holding it as a whole.
      // An ALIGNED VOLUME is a maximal run of consecutive levels whose LONG footprints stack on
      // each other. Its lateral system is the cores that run through it, braced ACROSS THE WHOLE
      // RUN in one panel rather than storey by storey — HYBRID-STRUCTURE-RULES §4, which for a
      // building this size (not slender, under 20 floors) selects `CORE + MEGA frame`: "core walls
      // braced by mega-frame". One X per core face per volume is exactly that mega panel.
      // STEEL only. RC's lateral system is the shear wall already drawn above, and RC draws no
      // diagonal anywhere in this file — bracing a concrete core would contradict both.
      if (!RC) {
        const ALIGN_MIN = 4;                      // modules that must stack for it to be one volume
        const BRACE = 0.30;                       // mega-brace section (m), square
        const runsAligned = []; let cur = [levels[0]];
        for (let k = 1; k < levels.length; k++) {
          const below = occ.get(levels[k - 1]), here = occ.get(levels[k]);
          let shared = 0; for (const key of here) if (below.has(key)) shared++;
          if (shared >= ALIGN_MIN) cur.push(levels[k]); else { runsAligned.push(cur); cur = [levels[k]]; }
        }
        runsAligned.push(cur);
        // ── PERIMETER MEGA-BRACING (260817b, STRUCTURE-PERIMETER-BRACING-PLAN §2) ──────────────
        // What used to be here: an X on the two long faces of every core, over every aligned
        // volume. It is deleted, and the reason matters or someone will put it back.
        //
        // 1. The core is ALREADY a shear wall. It is drawn at ~3060 as one continuous RC solid over
        //    its whole height. Gluing a steel X to the outside of a solid concrete core is bracing
        //    the stiff thing with the soft thing: the load never takes the steel, so the member
        //    does nothing but draw a line.
        // 2. The spec was read backwards. HYBRID-STRUCTURE-RULES §4 picks "CORE + MEGA frame", and
        //    a mega-frame is the PERIMETER structure that helps the core walls. This code had the
        //    frame stuck onto the core instead.
        // 3. The reference model has no such member. In the 275-piece schedule of
        //    cantilever_truss_whole_building.py the only diagonals are the TRUSS layer, i.e. SYS2's
        //    web. Core-related entries are VOL_CORE, SLAB and COL. Nothing braces a core face.
        //
        // So the bracing moves to the OUTERMOST grounded column lines, where a mega-frame belongs.
        // Per volume, because a setback changes which lines are outermost. Two panels per facade,
        // symmetric about its midpoint, one bay in from the corner (a corner column belongs to both
        // facades and would collect two directions of brace on one member). Both axes get their own,
        // or the building has a lateral system in one direction only, which is recorded as a
        // CODE_CHECK entry rather than passed over.
        // ── OUTERMOST SKIN ONLY (260817e, STRUCTURE-OUTERMOST-BRACE-PLAN) ─────────────────
        // Picking the extreme grounded lines of a volume's BASE floor is not the same as picking
        // the building's skin, and it failed three ways: a setback volume's extremes sit in the
        // middle of the plan below it, a grounded line can be several bays inboard of an edge that
        // is cantilevered, and the extreme x is often the core's own line, which is the member
        // 260817b deleted for good reasons (see the note above this loop).
        // A panel now has to sit ON the skin of every level it spans: nothing of the LONG massing,
        // the corridor or a core may lie outboard of its plane on that level. Judged per level, so
