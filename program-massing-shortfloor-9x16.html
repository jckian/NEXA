        // a setback tower's own facade still qualifies over its own floors.
        const cellAt = (lv, gi, gj) => (occ.get(lv) || new Set()).has(gi + ',' + gj);
        // outward is the opposite of the inward offset sgn
        const onSkinAt = (lv, fixed, sgn, alongX, u0, u1) => {
          const outIdx = sgn > 0 ? fixed - 1 : fixed;
          for (let u = u0; u < u1; u++) {
            if (alongX ? cellAt(lv, u, outIdx) : cellAt(lv, outIdx, u)) return false;
          }
          return true;
        };
        // a line running along a core face is excluded outright: the RC shaft is that plane's
        // lateral system already, which is the whole reason the core braces went.
        const coreFaceLines = { x: new Set(), z: new Set() };
        for (const c of L.coreShafts) {
          coreFaceLines.z.add(c.zMod); coreFaceLines.z.add(c.zMod + c.dMod);
          coreFaceLines.x.add(c.xMod); coreFaceLines.x.add(c.xMod + c.wMod);
        }
        for (const vol of runsAligned) {
          if (vol.length < 2) continue;
          // ── ABOVE GRADE ONLY (260819) ──
          // A basement is already braced by the thing holding the earth back: a continuous
          // retaining wall on all four sides, stiffer in plane than any steel X stood next to it.
          // Bracing it again is the same mistake 260817b deleted at the core — the load never takes
          // the steel. The runs used to start at the volume's base, which on this plate is B2, so
          // the mega-X was drawn down through two basement storeys. Below grade the frame is
          // ordinary beams and columns and nothing else.
          //
          // The panel lines are picked off the first ABOVE-GRADE floor for the same reason. A
          // basement is normally wider than what stands on it, so its outermost grounded lines are
          // lines the tower does not have, and choosing from B2 would have picked facades that
          // then failed `runsFor` on every storey and drawn nothing.
          const volUp = vol.filter(lv => lv >= 0);
          if (!volUp.length) continue;
          const vLo = volUp[0], vHi = volUp[volUp.length - 1];
          // The line only has to be GROUNDED, which `groundedAtLv` already means: its column
          // reaches grade. Demanding it also exist on every floor of the volume was my own extra
          // condition and it is far too strong here, where the whole building is one aligned
          // volume: only 10 grid points survive B2 to L5, essentially the core, and no facade got
          // a single panel. Instead the line is chosen off the volume's base floor, and each brace
          // then spans only the storeys where that line actually stands.
          const base = groundedAtLv.get(vLo) || new Set();
          const common = [...base].map(k => k.split(',').map(Number));
          if (common.length < 4) continue;
          const xsAll = [...new Set(common.map(q => q[0]))].sort((a, b) => a - b);
          const zsAll = [...new Set(common.map(q => q[1]))].sort((a, b) => a - b);
          if (xsAll.length < 3 || zsAll.length < 3) continue;
          const y0 = yBase(vLo), y1 = zTopOf(vHi);
          if (y1 - y0 < M) continue;
          const solidAll = (gi, gj) => base.has(gi + ',' + gj);
          // the contiguous floor runs where BOTH lines of a panel stand, so a brace never spans a
          // storey whose columns are not there
          const runsFor = (a, b, fixed, alongX) => {
            const out = []; let cur = [];
            for (const lv of volUp) {
              const g = groundedAtLv.get(lv) || new Set();
              const ok = alongX ? (g.has(a + ',' + fixed) && g.has(b + ',' + fixed))
                                : (g.has(fixed + ',' + a) && g.has(fixed + ',' + b));
              if (ok) cur.push(lv); else { if (cur.length) out.push(cur); cur = []; }
            }
            if (cur.length) out.push(cur);
            return out;
          };
          // Slenderness: BRACE 0.30 over a 4-5 storey volume is KL/r ~140, at the limit for a strut
          // that is ever in compression. Split the X per 2 storeys instead of one X over the whole
          // volume, which keeps each panel near a storey pair and the section honest.
          const STOREY_STEP = 2;
          const bays = [];
          for (let k = 0; k + 1 < volUp.length; k += STOREY_STEP) bays.push([volUp[k], volUp[Math.min(k + STOREY_STEP, volUp.length - 1)]]);
          const placed = { x: 0, z: 0 }; const dbgSides = []; const skipped = [];
          // For each of the four sides: walk in from the corner until the line is grounded all the
          // way up, take two positions either side of the facade midpoint.
          const sides = [
            { axis: 'x', fixed: zsAll[0], sgn: 1, arr: xsAll },                    // south edge, brace runs along X
            { axis: 'x', fixed: zsAll[zsAll.length - 1], sgn: -1, arr: xsAll },    // north edge
            { axis: 'z', fixed: xsAll[0], sgn: 1, arr: zsAll },                    // west edge, brace runs along Z
            { axis: 'z', fixed: xsAll[xsAll.length - 1], sgn: -1, arr: zsAll },    // east edge
          ];
          for (const sd of sides) {
            const alongX = sd.axis === 'x';
            // core faces are out, whatever else they are
            const faceSet = alongX ? coreFaceLines.z : coreFaceLines.x;
            if (faceSet.has(sd.fixed)) { skipped.push(sd.axis + ':core-face'); continue; }
            const ok = sd.arr.filter(u => alongX ? solidAll(u, sd.fixed) : solidAll(sd.fixed, u));
            dbgSides.push(sd.axis + ':ok' + ok.length);
            if (ok.length < 3) continue;                     // need a bay that is not the corner
            // Adjacent pairs, corners dropped, then the two whose centres sit nearest the quarter
            // points of the facade. Splitting `inner` into halves and demanding two candidates in
            // each was far too fussy for these facades: `ok` runs 3 to 5, so `inner` is 1 to 3 and
            // almost nothing qualified. Quarter points give the same symmetry with what is there.
            // Corners are dropped so one column does not collect a brace from both directions.
            // On a SHORT facade that rule costs the whole axis: this plan is a bar, its z-facing
            // facades have 2 to 4 grounded lines, and dropping corners left one of them with none,
            // so the z axis got a single panel and the building was free to twist. An axis with no
            // lateral system is worse than a corner column carrying two braces, so below five lines
            // the corners stay in.
            const inner = ok.length >= 5 ? ok.slice(1, -1) : ok.slice();
            if (inner.length < 2) continue;
            const pairs = [];
            for (let q = 0; q + 1 < inner.length; q++) pairs.push([inner[q], inner[q + 1]]);
            if (!pairs.length) continue;
            const lo0 = ok[0], hi0 = ok[ok.length - 1];
            const target = [lo0 + (hi0 - lo0) * 0.25, lo0 + (hi0 - lo0) * 0.75];
            const picks = [];
            for (const tgt of target) {
              let best = null, bd = Infinity;
              for (const pr of pairs) {
                if (picks.includes(pr)) continue;
                const d = Math.abs((pr[0] + pr[1]) / 2 - tgt);
                if (d < bd) { bd = d; best = pr; }
              }
              if (best) picks.push(best);
            }
            for (const [u0, u1] of picks) {
              if (u1 - u0 < 1) continue;
              const fixedW = alongX ? wz(sd.fixed) : wx(sd.fixed);
              const off = fixedW + sd.sgn * (COL_MAIN / 2 + BRACE / 2 + 0.02);   // inboard, clear of the curtain wall
              const a0 = alongX ? wx(u0) : wz(u0), a1 = alongX ? wx(u1) : wz(u1);
              const pt = (u, y) => alongX ? new THREE.Vector3(u, y, off) : new THREE.Vector3(off, y, u);
              let any = false;
              // A run of ONE storey still gets an X. Requiring two consecutive floors was the
              // reason a facade came back with a single panel per axis instead of two: the second
              // pair was chosen but its lines only stood together on one floor, so nothing drew.
              // A one-storey X is a perfectly ordinary braced bay.
              for (const run of runsFor(u0, u1, sd.fixed, alongX)) {
                for (let k = 0; k < run.length; k += STOREY_STEP) {
                  const bLo = run[k], bHi = run[Math.min(k + STOREY_STEP - 1, run.length - 1)];
                  const by0 = yBase(bLo), by1 = zTopOf(bHi);
                  if (by1 - by0 < M) continue;
                  // every level this X spans has to have the plane on its skin. A line can be the
                  // edge for three floors and be swallowed by a wider floor above, and then only
                  // the lower segment is drawn.
                  if (SKIN_ONLY) {
                    let allSkin = true;
                    for (let q = k; q <= Math.min(k + STOREY_STEP - 1, run.length - 1); q++)
                      if (!onSkinAt(run[q], sd.fixed, sd.sgn, alongX, u0, u1)) { allSkin = false; break; }
                    if (!allSkin) { skipped.push(sd.axis + ':interior'); continue; }
                  }
                  addStrut(pt(a0, by0), pt(a1, by1), BRACE, STRUCT.col, 'perimeter mega-brace', bLo, null);
                  addStrut(pt(a0, by1), pt(a1, by0), BRACE, STRUCT.col, 'perimeter mega-brace', bLo, null);
                  any = true;
                }
              }
              if (any) placed[sd.axis]++;
            }
          }
          if (STRUCT_DIAG) (STRUCT_DIAG.perim = STRUCT_DIAG.perim || []).push({ vol: vLo + '..' + vHi, x: placed.x, z: placed.z, common: common.length, nx: xsAll.length, nz: zsAll.length, sides: dbgSides, skipped });
          if (placed.x < 2 || placed.z < 2)
            CODE_CHECK.violations.push({ rule: 'LAT', level: vLo, measured: placed.x + '/' + placed.z,
              threshold: '2/2 panels per axis', unit: '', note: 'aligned volume has fewer than two perimeter brace panels on an axis' });
        }

        // ── SYS2 SPINE DEEP BEAM — OFF (260817, STRUCTURE-SPINE-TRUSS-PLAN §1A; retired 260819) ──
        // Kept behind SPINE_ON / ?spine=1 rather than deleted, so the scheme it belonged to can be
        // read again. The default steel building has no spine: see the flag at the top of build().
        // Until now nothing tied the two cores together along the circulation. The braced cores
        // above are two independent lateral systems facing each other across the gallery, and what
        // used to be called SYS2 was a per-cantilever hanger truss: 11 of them on the SAMPLE,
        // 513 m of chord, at eleven different heights, sharing no plane. The reference model has
        // ONE building-scale long span (TR_CHORD_300 ×11 chords, TR_POST_300 ×15, TR_PANEL ×40),
        // not one per overhang.
        // The spine runs core to core along the gallery axis, one storey deep, on the two grounded
        // column lines that FLANK the corridor rather than down its middle, which is empty. It
        // appears at the top of each aligned volume, at most SPINE_MAX in the building; past that
        // the longest spans win. Voids do not break it: the user's call is that crossing one is
        // what a long-span truss is for.
        if (SPINE_ON) {
          const SPINE_MAX = 3;
          const TR_SEC = 0.30;                       // TR_CHORD_300 / TR_POST_300 / TR_PANEL
          // The pair is chosen PER LEVEL, not once for the building. Taking the outermost two
          // shafts by x picked SAMPLE's two single-storey extra exits, which exist only on L1, so
          // no aligned volume top ever had both alive and the building got no spine at all.
          const cand = [];
          {
            for (const vol of runsAligned) {
              if (vol.length < 2) continue;
              const top = vol[vol.length - 1];
              const live = L.coreShafts.filter(c => top >= c.minL && top <= c.maxL);
              if (live.length < 2) continue;
              const uOf = c => corridorAlongX ? wx(c.xMod + c.wMod / 2) : wz(c.zMod + c.dMod / 2);
              const us = live.map(uOf);
              const a = Math.min(...us), b = Math.max(...us);
              if (b - a < M) continue;
              cand.push({ top, a, b, span: b - a });
            }
          }
          {
            cand.sort((x, y) => y.span - x.span);
            for (const sp of cand.slice(0, SPINE_MAX)) {
              const yTop = zTopOf(sp.top) - PRI_H - TR_SEC / 2;      // clear of the girder zone above
              const yBot = Math.min(yBase(sp.top) + TR_SEC / 2, yTop - TR_SEC * 1.5);
              const len = sp.b - sp.a, mid = (sp.a + sp.b) / 2;
              // the two grounded lines flanking the gallery, half a bay either side of its centre
              // the gallery is the zMid row, so its two long edges are the flanking column lines
              const offs = corridorAlongX ? [wz(L.zMid), wz(L.zMid + 1)] : [wx(L.zMid), wx(L.zMid + 1)];
              // ── SPINE IS A SOLID DEEP BEAM, NOT A TRUSS (260817e) ──────────────────────────
              // The user's rule is that the inside of the LONG massing carries no diagonals at all,
              // WoZoCo-style: bracing reads on the skin, the volume is clean. The spine sits on the
              // two column lines flanking the gallery, which is the middle of the plan, so its web
              // went with the rest.
              // Removing the diagonals from a truss and keeping the chords would leave two parallel
              // sticks that carry nothing, so the member is rebuilt as what it now is: one solid
              // beam per line, its depth the old chord-to-chord dimension. Same span, same two
              // lines, same clearance under the girder zone above.
              const dBeam = Math.max(TR_SEC, (yTop - yBot) + TR_SEC);
              const yMid = (yBot + yTop) / 2;
              for (const off of offs) {
                if (corridorAlongX) addStruct(mid, yMid, off, len, dBeam, TR_SEC, STRUCT.trans, 1, 'spine deep beam', sp.top, null);
                else addStruct(off, yMid, mid, TR_SEC, dBeam, len, STRUCT.trans, 1, 'spine deep beam', sp.top, null);
              }
              if (STRUCT_DIAG) (STRUCT_DIAG.spines = STRUCT_DIAG.spines || []).push({ level: sp.top, span: +sp.span.toFixed(2) });
            }
          }
        }
      }
    }
