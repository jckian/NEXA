<!DOCTYPE html><html><head><meta charset="utf-8"><title>forecast-handoff-test</title></head><body>
<!-- End-to-end test: NEXA Intel scenario draft → localStorage → shortfloor massing.
     Usage: _forecast-test.html?site=<key>&id=<scenario id>
     defaults: site=citymarket-la, id=A. Same pattern as _handoff-test.html. -->
<script src="../NEXA/intel/data/scenarios-citymarket.js"></script>
<script src="../NEXA/intel/data/scenarios-collegest.js"></script>
<script>
const q = new URLSearchParams(location.search);
const siteKey = q.get("site") || "citymarket-la";
const id = (q.get("id") || "A").toUpperCase();
const site = window.NEXA_INTEL && window.NEXA_INTEL.sites && window.NEXA_INTEL.sites[siteKey];
const sc = site && (site.scenarios || []).find(s => String(s.id).toUpperCase() === id);
if (!sc) { document.body.textContent = "not found: site=" + siteKey + " scenario=" + id; }
else {
  localStorage.setItem("programInputText", sc.programFormatDraft);
  q.delete("id"); q.delete("site"); q.set("src", "input");
  location.replace("../program-massing-shortfloor.html?" + q.toString());
}
</script>
</body></html>
