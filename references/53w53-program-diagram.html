    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --grad-start: #2563eb;
      --grad-end: #7c3aed;
      --grad: linear-gradient(135deg, #2563eb, #7c3aed);
      --panel-bg: rgba(6, 6, 18, 0.92);
      --border: rgba(120, 80, 255, 0.22);
      --border-dim: rgba(120, 80, 255, 0.10);
      --accent-glow: rgba(37, 99, 235, 0.12);
      --text-hi: #f0f0ff;
      --text-mid: #9898c0;
      --text-lo: #44445a;
      --radius-lg: 12px;
      --radius-md: 8px;
      --radius-sm: 5px;
      --shadow: 0 8px 32px rgba(37, 99, 235, 0.10), 0 2px 8px rgba(0, 0, 0, 0.5);
    }

    body {
      background: #06060f;
      font-family: 'Montserrat', 'Helvetica Neue', Helvetica, Arial, sans-serif;
      overflow: hidden;
      color: var(--text-hi);
    }

    #canvas-container {
      position: fixed;
      inset: 0;
    }

    /* ── Title ── */
    #title-block {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 10;
    }

    #title-block h1 {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.06em;
      background: var(--grad);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    #title-block p {
      font-size: 9px;
      letter-spacing: 0.18em;
      color: var(--text-lo);
      text-transform: uppercase;
      margin-top: 5px;
      font-weight: 400;
    }

    /* ── Legend ── */
    #legend {
      position: fixed;
      bottom: 70px;
      left: 20px;
      background: var(--panel-bg);
      border: 1px solid var(--border);
      padding: 12px 16px;
      border-radius: var(--radius-lg);
      z-index: 10;
      backdrop-filter: blur(16px);
      box-shadow: var(--shadow);
      min-width: 200px;
    }

    #legend h2 {
      font-size: 8px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--text-lo);
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border-dim);
      font-weight: 600;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }

    .legend-swatch {
      width: 10px;
      height: 10px;
      border-radius: 3px;
      flex-shrink: 0;
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    .legend-label {
      font-size: 10px;
      color: var(--text-mid);
      letter-spacing: 0.03em;
      font-weight: 400;
    }

    .legend-area {
      font-size: 9px;
      color: var(--text-lo);
      margin-left: auto;
      padding-left: 10px;
      white-space: nowrap;
    }

    /* ── Right panel ── */
    #right-panel {
      position: fixed;
      top: 20px;
      right: 20px;
      width: 280px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .side-panel {
      background: var(--panel-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      backdrop-filter: blur(16px);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      cursor: pointer;
      user-select: none;
    }

    .panel-header:hover {
      background: rgba(120, 80, 255, 0.05);
    }

    .panel-title {
      font-size: 8px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--text-mid);
      font-weight: 600;
    }

    .panel-arrow {
      font-size: 9px;
      color: var(--text-lo);
      transition: transform 0.2s ease;
    }

    .panel-body {
      padding: 10px 14px 14px;
      border-top: 1px solid var(--border-dim);
    }

    .panel-body.collapsed {
      display: none;
    }

    /* Stats table */
    .stats-row {
      display: flex;
      align-items: baseline;
      gap: 6px;
      margin-bottom: 5px;
    }

    .stats-swatch {
      width: 8px;
      height: 8px;
      border-radius: 2px;
      flex-shrink: 0;
      margin-top: 1px;
    }

    .stats-label {
      font-size: 10px;
      color: var(--text-mid);
      flex: 1;
      font-weight: 400;
    }

    .stats-val {
      font-size: 10px;
      color: var(--text-hi);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      font-weight: 500;
    }

    .stats-divider {
      border: none;
      border-top: 1px solid var(--border-dim);
      margin: 8px 0;
    }

    .stats-total {
      font-size: 10px;
      color: var(--text-hi);
      display: flex;
      justify-content: space-between;
      font-weight: 500;
    }

    .stats-meta {
      font-size: 9px;
      color: var(--text-lo);
      margin-top: 3px;
      line-height: 1.6;
    }

    /* File drop zone */
    .file-drop-zone {
      border: 1px dashed rgba(120, 80, 255, 0.25);
      border-radius: var(--radius-md);
      padding: 10px 12px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
      position: relative;
      margin-bottom: 4px;
      background: rgba(120, 80, 255, 0.03);
    }

    .file-drop-zone:hover {
      border-color: rgba(120, 80, 255, 0.5);
      background: rgba(120, 80, 255, 0.07);
    }

    .file-drop-zone.drag-over {
      border-color: rgba(37, 99, 235, 0.7);
      background: rgba(37, 99, 235, 0.08);
    }

    .file-drop-zone input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      width: 100%;
      height: 100%;
    }

    .file-drop-label {
      font-size: 8px;
      color: var(--text-mid);
      letter-spacing: 0.14em;
      text-transform: uppercase;
      font-weight: 600;
    }

    .file-drop-hint {
      font-size: 9px;
      color: var(--text-lo);
      margin-top: 2px;
    }

    #loaded-filename {
      font-size: 9px;
      background: var(--grad);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-top: 6px;
      letter-spacing: 0.04em;
      word-break: break-all;
      min-height: 14px;
      font-weight: 500;
    }

    #load-error {
      font-size: 9px;
      color: #f87171;
      margin-top: 4px;
      min-height: 12px;
      letter-spacing: 0.04em;
    }

    #load-entry-count {
      font-size: 9px;
      color: var(--text-lo);
      margin-top: 2px;
    }

    /* 2-col param grid */
    .param-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px 10px;
      margin-bottom: 8px;
    }

    .param-cell label {
      margin-top: 0 !important;
    }

    /* Site params */
    .panel-body label {
      font-size: 8px;
      color: var(--text-lo);
      letter-spacing: 0.1em;
      display: block;
      margin-bottom: 3px;
      margin-top: 9px;
      text-transform: uppercase;
      font-weight: 600;
    }

    .panel-body label:first-of-type {
      margin-top: 0;
    }

    .param-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .param-row input[type="number"] {
      background: rgba(120, 80, 255, 0.07);
      border: 1px solid var(--border);
      color: var(--text-hi);
      font-size: 12px;
      padding: 5px 9px;
      border-radius: var(--radius-sm);
      width: 70px;
      font-family: inherit;
      font-weight: 500;
      transition: border-color 0.2s;
    }

    .param-row input[type="number"]:focus {
      outline: none;
      border-color: var(--grad-start);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    .param-unit {
      font-size: 10px;
      color: var(--text-lo);
    }

    .panel-btn {
      background: var(--grad);
      border: none;
      color: #fff;
      font-size: 8px;
      letter-spacing: 0.12em;
      padding: 7px 16px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-family: inherit;
      font-weight: 600;
      margin-top: 10px;
      text-transform: uppercase;
      transition: all 0.2s ease;
      box-shadow: 0 2px 12px rgba(124, 58, 237, 0.35);
    }

    .panel-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 18px rgba(124, 58, 237, 0.5);
    }

    .panel-btn:active {
      transform: translateY(0);
    }

    /* Tooltip */
    #tooltip {
      position: fixed;
      background: rgba(6, 6, 18, 0.97);
      border: 1px solid var(--border);
      padding: 9px 12px;
      border-radius: var(--radius-md);
      font-size: 10px;
      color: var(--text-mid);
      line-height: 1.6;
      pointer-events: none;
      z-index: 20;
      display: none;
      max-width: 200px;
      backdrop-filter: blur(16px);
      box-shadow: var(--shadow);
    }

    #tooltip strong {
      background: var(--grad);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      font-size: 11px;
      display: block;
      margin-bottom: 2px;
      font-weight: 600;
    }
  </style>

    function parseProgramText(raw) {
      const entries = [];
      const lines = raw.trim().split('\n');
      for (const line of lines) {
        const t = line.trim();
        if (!t || t.startsWith('#')) continue;
        const parts = t.split('/').map(p => p.replace(/[{}]/g, '').trim());
        if (parts.length < 5) continue;
        const type = parts[0].toLowerCase().replace(/\s+/g, '_');
        const area = parseFloat(parts[1]);
        const level = parseInt(parts[2], 10);
        // handle swapped category/dimensions like "residence_mid/260/23/16,16/private"
        let category, dims;
        if (parts[3].includes(',')) {
          dims = parts[3];
          category = parts[4] || 'private';
        } else {
          category = parts[3].trim().toLowerCase();
          dims = parts[4] || '10,10';
        }
        const [ws, ds] = dims.split(',');
        const w = parseFloat(ws) || 10;
        const d = parseFloat(ds) || 10;
        if (isNaN(area) || isNaN(level)) continue;
        entries.push({ type, area, level, category, w, d });
      }
      return entries;
    }

    // ─────────────────────────────────────────────────────────
    // SCENE STATE
    // ─────────────────────────────────────────────────────────
    let PROGRAM_DATA = parseProgramText(RAW_PROGRAM);

    let SITE_W = 40;
    let SITE_D = 40;
    let SITE_CX = SITE_W / 2;
    let SITE_CZ = SITE_D / 2;

    let FLOOR_H = 4.5;
    let TAPER = 0.55;  // at top floor, footprint = TAPER * site size
    let TAPER_TOP = 30;    // floor level that defines the taper endpoint
    let SHOW_DIAGRID = true;

    const SLAB_GAP = 0.12; // fractional gap between slab top and next floor
    const CORE_W = 9;    // central service core dimensions
    const CORE_D = 9;

    // ─────────────────────────────────────────────────────────
    // THREE.JS SETUP
    // ─────────────────────────────────────────────────────────
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 0.85;
    document.getElementById('canvas-container').appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xf3f4f6);
    scene.fog = new THREE.FogExp2(0xf3f4f6, 0.0028);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.5, 2000);
    camera.position.set(SITE_CX + 120, 180, SITE_CZ + 140);
    camera.lookAt(SITE_CX, 80, SITE_CZ);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(SITE_CX, 80, SITE_CZ);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.minDistance = 20;
    controls.maxDistance = 800;
    controls.maxPolarAngle = Math.PI * 0.5;
    controls.update();

    // Lighting
    scene.add(new THREE.AmbientLight(0xffffff, 0.45));
    const sun = new THREE.DirectionalLight(0xfff5e0, 1.6);
    sun.position.set(70, 100, 60);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.near = 1;
    sun.shadow.camera.far = 800;
    sun.shadow.camera.left = -120;
    sun.shadow.camera.right = 120;
    sun.shadow.camera.top = 400;
    sun.shadow.camera.bottom = -60;
    sun.shadow.bias = -0.0005;
    scene.add(sun);
    const fillLight = new THREE.DirectionalLight(0xc8d8ff, 0.3);
    fillLight.position.set(-60, 40, -70);
    scene.add(fillLight);

    // ─────────────────────────────────────────────────────────
    // SCENE GROUPS
    // ─────────────────────────────────────────────────────────
    let sceneGroup = new THREE.Group();
    let labelObjects = []; // { el, worldPos }
    scene.add(sceneGroup);

    // ─────────────────────────────────────────────────────────
    // MATERIAL FACTORY
    // Each program block gets its own material instance so
    // per-floor opacity can be set without affecting other floors.
    // ─────────────────────────────────────────────────────────
    function getMat(hexColor, opacity = 1.0) {
      return new THREE.MeshPhysicalMaterial({
        color: new THREE.Color(hexColor),
        roughness: 0.7,
        metalness: 0.03,
        transparent: opacity < 1,
        opacity,
        side: THREE.DoubleSide
      });
    }

    const wireMat = new THREE.MeshBasicMaterial({
      color: new THREE.Color('#ffffff'),
      wireframe: true,
      opacity: 0.04,
      transparent: true,
    });

    const edgeMat = new THREE.LineBasicMaterial({
      color: new THREE.Color('#ffffff'),
      opacity: 0.12,
      transparent: true,
    });

    // Diagrid material — perimeter exoskeleton lines
    const diagridMat = new THREE.LineBasicMaterial({
      color: new THREE.Color('#cccccc'),
      opacity: 0.28,
      transparent: true,
    });

    // Core shaft material
    const coreMat = new THREE.MeshStandardMaterial({
      color: new THREE.Color('#1a1a22'),
      roughness: 0.9,
      metalness: 0.05,
    });

    // Ground plane material
    const groundMat = new THREE.MeshStandardMaterial({
      color: new THREE.Color('#0f0f16'),
      roughness: 1.0,
      metalness: 0,
    });

    // ─────────────────────────────────────────────────────────
    // GROUND PLANE + GRID
    // ─────────────────────────────────────────────────────────
    function buildGround() {
      const geo = new THREE.PlaneGeometry(200, 200);
      const mesh = new THREE.Mesh(geo, groundMat);
      mesh.rotation.x = -Math.PI / 2;
      mesh.position.set(SITE_CX, -0.05, SITE_CZ);
      mesh.receiveShadow = true;
      sceneGroup.add(mesh);

      // Site boundary outline
      const pts = [
        new THREE.Vector3(0, 0, 0),
        new THREE.Vector3(SITE_W, 0, 0),
        new THREE.Vector3(SITE_W, 0, SITE_D),
        new THREE.Vector3(0, 0, SITE_D),
        new THREE.Vector3(0, 0, 0),
      ];
      const bGeo = new THREE.BufferGeometry().setFromPoints(pts);
      const bLine = new THREE.Line(bGeo, new THREE.LineBasicMaterial({ color: '#334', opacity: 0.6, transparent: true }));
      sceneGroup.add(bLine);

      // Grid
      const grid = new THREE.GridHelper(200, 80, new THREE.Color('#1a1a28'), new THREE.Color('#14141e'));
      grid.position.set(SITE_CX, 0, SITE_CZ);
      sceneGroup.add(grid);
    }

    // ─────────────────────────────────────────────────────────
    // TAPERED FLOOR FOOTPRINT
    // Given a floor level and total floors, return {cx,cz,hw,hd}
    // where hw,hd = half-extents of that floor's usable footprint.
    // Basement and ground are full site. Above ground, taper linearly.
    // ─────────────────────────────────────────────────────────
    function floorFootprint(level) {
      if (level < 0) return { cx: SITE_CX, cz: SITE_CZ, hw: SITE_W / 2, hd: SITE_D / 2 };
      // First 4 floors (podium) = full footprint
      const taperStart = Math.min(4, TAPER_TOP);
      if (level <= taperStart - 1) return { cx: SITE_CX, cz: SITE_CZ, hw: SITE_W / 2, hd: SITE_D / 2 };
      const span = Math.max(1, TAPER_TOP - taperStart);
      const t = Math.min(1, (level - taperStart) / span); // 0 → 1
      const scale = 1.0 - t * (1.0 - TAPER);
      const hw = (SITE_W / 2) * scale;
      const hd = (SITE_D / 2) * scale;
      return { cx: SITE_CX, cz: SITE_CZ, hw, hd };
    }

    // ─────────────────────────────────────────────────────────
    // LAYOUT: distribute entries within the tapered footprint
    //
    // Strategy:
    //   1. Fire-stair core entries are detected and placed as a horizontal
    //      cluster at the centre of each floor, scaled to fit the tapered
    //      footprint. Their combined bounding box defines the "core zone".
    //   2. Remaining entries fill four rectangular zones around the core
    //      cluster (West, East, North, South).
    //   3. Within each zone blocks are packed column-by-column (left→right,
    //      top→bottom), clamped to zone bounds with max aspect ratio 1:5.
    //   4. Overflow goes to the next zone; any remainder falls back to centre.
    // ─────────────────────────────────────────────────────────
    const CORE_TYPES = new Set([
      'fire_stair_and_freight_elevator',
      'fire_stair_and_elevator_1',
      'fire_stair_and_elevator_2',
    ]);

    // ─────────────────────────────────────────────────────────
    // CORE REDUCTION RULE
    // Cores are progressively removed as the tower rises:
    //   Phase 1  (level ≤ 55% of TAPER_TOP)  — all 3 cores
    //     Freight elevator + 2 passenger cores serve public, amenity, lower residential
    //   Phase 2  (55%–85% of TAPER_TOP)      — 2 cores (drop freight)
    //     Freight stops at mid-rise transfer floor; service via one passenger core
    //   Phase 3  (> 85% of TAPER_TOP)        — 1 core (drop elevator 2)
    //     Single stair + elevator serves the upper residential and penthouse zone
    // Basement always keeps all 3 (loading dock + BOH infrastructure).
    // ─────────────────────────────────────────────────────────
    function getActiveCores(level) {
      if (level < 0) return new Set(CORE_TYPES); // basement: full service
      const t = level / Math.max(1, TAPER_TOP);
      if (t <= 0.55) {
        // All 3 cores
        return new Set(['fire_stair_and_freight_elevator',
          'fire_stair_and_elevator_1',
          'fire_stair_and_elevator_2']);
      } else if (t <= 0.85) {
        // Freight elevator terminates — mid-rise transfer floor
        return new Set(['fire_stair_and_elevator_1',
          'fire_stair_and_elevator_2']);
      } else {
        // Elevator 2 terminates — single main stair + elevator to top
        return new Set(['fire_stair_and_elevator_1']);
      }
    }

    function layoutFloor(entries, level) {
      const fp = floorFootprint(level);
      const activeCores = getActiveCores(level);
      // Entries in CORE_TYPES but not active this floor are simply not placed
      const coreEntries = entries.filter(e => activeCores.has(e.type));
      const others = entries.filter(e => !CORE_TYPES.has(e.type));
      const placed = [];
      const PAD = 0.25;

      // ── Core cluster: place fire-stair entries side-by-side at floor centre ──
      // Sort largest-area first so the freight elevator anchors the middle.
      const sortedCores = [...coreEntries].sort((a, b) => b.area - a.area);

      // Clamp each core's dims so the entire cluster fits within the footprint.
      // Each core gets up to 40% of the half-width; depth up to 90% of half-depth.
      const clamped = sortedCores.map(e => ({
        ...e,
        cw: Math.max(1, Math.min(e.w, fp.hw * 0.8)),
        cd: Math.max(1, Math.min(e.d, fp.hd * 1.8)),
      }));

      const totalCoreW = clamped.reduce((s, c) => s + c.cw, 0) + PAD * Math.max(0, clamped.length - 1);
      let curCoreX = fp.cx - totalCoreW / 2;

      // Track the cluster's bounding box for zone definition
      let clX0 = fp.cx - totalCoreW / 2;
      let clX1 = fp.cx + totalCoreW / 2;
      let clZ0 = fp.cz;
      let clZ1 = fp.cz;

      for (const c of clamped) {
        const px = curCoreX + c.cw / 2;
        const pz = fp.cz;
        placed.push({ ...c, px, pz, pw: c.cw, pd: c.cd });
        clZ0 = Math.min(clZ0, pz - c.cd / 2);
        clZ1 = Math.max(clZ1, pz + c.cd / 2);
        curCoreX += c.cw + PAD;
      }

      if (others.length === 0) return placed;

      const minX = fp.cx - fp.hw;
      const maxX = fp.cx + fp.hw;
      const minZ = fp.cz - fp.hd;
      const maxZ = fp.cz + fp.hd;

      // Four zones around the core cluster
      const zones = [
        { x0: minX, x1: clX0 - PAD, z0: minZ, z1: maxZ }, // West
        { x0: clX1 + PAD, x1: maxX, z0: minZ, z1: maxZ }, // East
        { x0: clX0 - PAD, x1: clX1 + PAD, z0: minZ, z1: clZ0 - PAD }, // North
        { x0: clX0 - PAD, x1: clX1 + PAD, z0: clZ1 + PAD, z1: maxZ }, // South
      ].filter(z => (z.x1 - z.x0) > 1 && (z.z1 - z.z0) > 1)
        .sort((a, b) => ((b.x1 - b.x0) * (b.z1 - b.z0)) - ((a.x1 - a.x0) * (a.z1 - a.z0)));

      if (zones.length === 0) {
        // Degenerate floor (spire tip) — stack at centre
        for (const e of others) {
          placed.push({ ...e, px: fp.cx, pz: fp.cz, pw: Math.min(e.w, fp.hw * 2 - 0.2), pd: Math.min(e.d, fp.hd * 2 - 0.2) });
        }
        return placed;
      }

      // Sort entries: largest area first
      const sorted = [...others].sort((a, b) => b.area - a.area);

      // Column-packing state per zone
      const state = zones.map(z => ({ curX: z.x0, curZ: z.z0, colMaxX: z.x0 }));

      for (const entry of sorted) {
        let wasPlaced = false;

        for (let zi = 0; zi < zones.length; zi++) {
          const zone = zones[zi];
          const st = state[zi];
          const zoneW = zone.x1 - zone.x0;
          const zoneD = zone.z1 - zone.z0;

          // Clamp dims to zone; enforce max aspect ratio 1:5
          let bw = Math.min(entry.w, zoneW);
          let bd = Math.min(entry.d, zoneD);
          if (bw > 0 && bd / bw > 5) bd = bw * 5;
          if (bd > 0 && bw / bd > 5) bw = bd * 5;
          bw = Math.max(bw, 1);
          bd = Math.max(bd, 1);

          if (st.curX + bw > zone.x1 + 0.01) continue; // zone exhausted

          if (st.curZ + bd > zone.z1 + 0.01) {
            // Advance to next column
            st.curX = st.colMaxX + PAD;
            st.curZ = zone.z0;
            if (st.curX + bw > zone.x1 + 0.01) continue;
          }

          const px = st.curX + bw / 2;
          const pz = st.curZ + bd / 2;
          placed.push({ ...entry, px, pz, pw: bw, pd: bd });

          st.curZ += bd + PAD;
          if (st.curX + bw > st.colMaxX) st.colMaxX = st.curX + bw;
          wasPlaced = true;
          break;
        }

        if (!wasPlaced) {
          placed.push({
            ...entry,
            px: fp.cx,
            pz: fp.cz,
            pw: Math.min(entry.w, fp.hw),
            pd: Math.min(entry.d, fp.hd),
          });
        }
      }

      return placed;
    }

    // ─────────────────────────────────────────────────────────
    // DIAGRID GEOMETRY: wireframe perimeter lines per floor zone
    // Creates an X-braced exoskeleton outline box
    // ─────────────────────────────────────────────────────────
    function buildDiagridForFloor(level, yBase, slabH) {
      if (!SHOW_DIAGRID) return null;
      const fp = floorFootprint(level);
      const minX = fp.cx - fp.hw;
      const maxX = fp.cx + fp.hw;
      const minZ = fp.cz - fp.hd;
      const maxZ = fp.cz + fp.hd;
      const y0 = yBase;
      const y1 = yBase + slabH;

      // Perimeter corners
      const corners = [
        [minX, y0, minZ], [maxX, y0, minZ],
        [maxX, y0, maxZ], [minX, y0, maxZ],
      ];

      const pts = [];

      // Bottom perimeter loop
      for (let i = 0; i < 4; i++) {
        const a = corners[i];
        const b = corners[(i + 1) % 4];
        pts.push(new THREE.Vector3(...a), new THREE.Vector3(...b));
      }

      // Top perimeter loop
      const cornersTop = corners.map(c => [c[0], y1, c[2]]);
      for (let i = 0; i < 4; i++) {
        const a = cornersTop[i];
        const b = cornersTop[(i + 1) % 4];
        pts.push(new THREE.Vector3(...a), new THREE.Vector3(...b));
      }

      // Vertical edges at corners
      for (let i = 0; i < 4; i++) {
        pts.push(new THREE.Vector3(...corners[i]), new THREE.Vector3(...cornersTop[i]));
      }

      // Diagonal bracing on each face (X-pattern)
      for (let i = 0; i < 4; i++) {
        const a0 = new THREE.Vector3(...corners[i]);
        const b1 = new THREE.Vector3(...cornersTop[(i + 1) % 4]);
        const b0 = new THREE.Vector3(...corners[(i + 1) % 4]);
        const a1 = new THREE.Vector3(...cornersTop[i]);
        pts.push(a0, b1, b0, a1);
      }

      const geo = new THREE.BufferGeometry().setFromPoints(pts);
      return new THREE.LineSegments(geo, diagridMat.clone());
    }

    // ─────────────────────────────────────────────────────────
    // BUILD SCENE
    // ─────────────────────────────────────────────────────────

    // Grouped by floor for opacity control
    let floorGroups = {}; // level -> THREE.Group

    function disposeGroup(group) {
      group.traverse(obj => {
        if (obj.geometry) obj.geometry.dispose();
        if (obj.material) {
          if (Array.isArray(obj.material)) obj.material.forEach(m => m.dispose());
          else obj.material.dispose();
        }
      });
      group.clear();
    }

    function recentreCamera() {
      // Recalculate site centre and reposition controls target.
      // Camera position is nudged to keep a sensible orbit distance.
      const cx = SITE_CX, cz = SITE_CZ;
      const diag = Math.sqrt(SITE_W * SITE_W + SITE_D * SITE_D);
      const levels = [...new Set(PROGRAM_DATA.map(e => e.level))];
      const maxLevel = levels.length ? Math.max(...levels) : TAPER_TOP;
      const towerH = (maxLevel + 1) * FLOOR_H;
      controls.target.set(cx, towerH * 0.4, cz);
      camera.position.set(cx + diag * 1.8, towerH * 0.7, cz + diag * 1.5);
      controls.update();
    }

    function buildScene() {
      // Recalculate derived site values whenever dimensions may have changed
      SITE_CX = SITE_W / 2;
      SITE_CZ = SITE_D / 2;

      // Clear previous
      disposeGroup(sceneGroup);
      sceneGroup.clear();
      labelObjects = [];
      floorGroups = {};

      buildGround();

      // Group entries by floor — cap at TAPER_TOP
      const byFloor = {};
      for (const e of PROGRAM_DATA) {
        if (e.level > TAPER_TOP) continue;
        if (!byFloor[e.level]) byFloor[e.level] = [];
        byFloor[e.level].push(e);
      }

      const levels = Object.keys(byFloor).map(Number).sort((a, b) => a - b);
      const maxLevel = Math.max(...levels);
      const slabH = FLOOR_H * (1 - SLAB_GAP);

      for (const level of levels) {
        const entries = byFloor[level];
        const yBase = level * FLOOR_H;

        const floorGroup = new THREE.Group();
        floorGroup.name = `floor_${level}`;
        sceneGroup.add(floorGroup);
        floorGroups[level] = floorGroup;

        // Layout
        const layout = layoutFloor(entries, level);

        for (const item of layout) {
          const blockH = slabH;
          const color = TYPE_COLORS[item.type] || '#667788';
          const isMechanical = item.type === 'mechanical';

          // Slightly reduce block size for visual gap
          const bw = item.pw * 0.94;
          const bd = item.pd * 0.94;
          const bh = isMechanical ? blockH * 0.7 : blockH;

          const geo = new THREE.BoxGeometry(bw, bh, bd);
          const mesh = new THREE.Mesh(geo, getMat(color));
          mesh.position.set(item.px, yBase + bh / 2, item.pz);
          mesh.castShadow = true;
          mesh.receiveShadow = true;
          mesh.userData = { type: item.type, area: item.area, level, category: item.category };
          floorGroup.add(mesh);

          // Edge overlay for legibility
          const edgesGeo = new THREE.EdgesGeometry(geo);
          const edges = new THREE.LineSegments(edgesGeo, edgeMat.clone());
          edges.position.copy(mesh.position);
          edges.userData.isEdge = true;
          floorGroup.add(edges);
        }

        // Diagrid perimeter wireframe
        if (SHOW_DIAGRID && level >= 0) {
          const diagrid = buildDiagridForFloor(level, yBase, slabH);
          if (diagrid) {
            diagrid.userData.isDiagrid = true;
            floorGroup.add(diagrid);
          }
        }

        // Floor number label (world-space position, projected to screen)
        const fp = floorFootprint(level);
        const labelPos = new THREE.Vector3(fp.cx - fp.hw - 2.5, yBase + slabH / 2, fp.cz);
        labelObjects.push({ level, worldPos: labelPos });
      }

      buildUI();
      buildLabelElements(); // rebuild projected label DOM elements
    }

    // ─────────────────────────────────────────────────────────
    // UI: LEGEND
    // ─────────────────────────────────────────────────────────
    function buildUI() {
      buildLegend();
      buildFloorSelector();
      buildStats();
    }

    function buildLegend() {
      const container = document.getElementById('legend-items');
      if (!container) return;
      container.innerHTML = '';
      const seen = new Set();
      for (const e of PROGRAM_DATA) {
        if (seen.has(e.type)) continue;
        seen.add(e.type);
        const color = TYPE_COLORS[e.type] || '#667788';
        const label = TYPE_LABELS[e.type] || e.type.replace(/_/g, ' ');
        const div = document.createElement('div');
        div.className = 'legend-item';
        div.innerHTML = `<div class="legend-swatch" style="background:${color}"></div><span class="legend-label">${label}</span>`;
        container.appendChild(div);
      }
    }

    // ─────────────────────────────────────────────────────────
    // UI: FLOOR SELECTOR
    // ─────────────────────────────────────────────────────────
    let activeFloor = null;

    function buildFloorSelector() {
      const sel = document.getElementById('floor-selector');
      sel.innerHTML = '';

      const allBtn = document.createElement('button');
      allBtn.className = 'floor-btn all-btn active';
      allBtn.textContent = 'ALL';
      allBtn.onclick = () => setActiveFloor(null);
      sel.appendChild(allBtn);

      const byFloor = {};
      for (const e of PROGRAM_DATA) {
        if (!byFloor[e.level]) byFloor[e.level] = [];
        byFloor[e.level].push(e);
      }
      const levels = Object.keys(byFloor).map(Number).sort((a, b) => a - b);
      for (const lvl of levels) {
        const btn = document.createElement('button');
        btn.className = 'floor-btn';
        btn.textContent = lvl < 0 ? 'B1' : `F${lvl}`;
        btn.dataset.level = lvl;
        btn.onclick = () => setActiveFloor(lvl);
        sel.appendChild(btn);
      }
    }

    function setActiveFloor(level) {
      activeFloor = level;
      // Update buttons
      document.querySelectorAll('.floor-btn').forEach(btn => {
        if (btn.classList.contains('all-btn')) {
          btn.classList.toggle('active', level === null);
        } else {
          btn.classList.toggle('active', parseInt(btn.dataset.level) === level);
        }
      });
      // Update mesh opacities
      for (const [lvl, group] of Object.entries(floorGroups)) {
        const isActive = level === null || parseInt(lvl) === level;
        group.traverse(obj => {
          if (!obj.material) return;
          const mats = Array.isArray(obj.material) ? obj.material : [obj.material];
          const isEdge = !!obj.userData.isEdge;
          const isDiagrid = !!obj.userData.isDiagrid;
          mats.forEach(m => {
            m.transparent = true;
            if (isActive) {
              m.opacity = isEdge ? 0.12 : (isDiagrid ? 0.28 : 1.0);
            } else {
              m.opacity = 0.04;
            }
          });
        });
      }
    }

    // ─────────────────────────────────────────────────────────
    // UI: STATS PANEL
    // ─────────────────────────────────────────────────────────
    function buildStats() {
      const container = document.getElementById('stats-content');
      if (!container) return;
      container.innerHTML = '';

      // Aggregate by type
      const byType = {};
      for (const e of PROGRAM_DATA) {
        if (!byType[e.type]) byType[e.type] = 0;
        byType[e.type] += e.area;
      }
      const totalArea = Object.values(byType).reduce((s, v) => s + v, 0);
      const siteArea = SITE_W * SITE_D;
      const levels = [...new Set(PROGRAM_DATA.map(e => e.level))];
      const maxFloor = Math.max(...levels);
      const towerH = (maxFloor + 1) * FLOOR_H;

      // Sort by area desc
      const sorted = Object.entries(byType).sort((a, b) => b[1] - a[1]);
      for (const [type, area] of sorted) {
        const color = TYPE_COLORS[type] || '#667788';
        const label = TYPE_LABELS[type] || type.replace(/_/g, ' ');
        const pct = ((area / totalArea) * 100).toFixed(1);
        const row = document.createElement('div');
        row.className = 'stats-row';
        row.innerHTML = `
      <div class="stats-swatch" style="background:${color}"></div>
      <span class="stats-label">${label}</span>
      <span class="stats-val">${area.toLocaleString()} m²</span>`;
        container.appendChild(row);
      }

      const hr = document.createElement('hr');
      hr.className = 'stats-divider';
      container.appendChild(hr);

      const totalRow = document.createElement('div');
      totalRow.className = 'stats-total';
      totalRow.innerHTML = `<span>Total GFA</span><span>${totalArea.toLocaleString()} m²</span>`;
      container.appendChild(totalRow);

      const meta = document.createElement('div');
      meta.className = 'stats-meta';
      meta.innerHTML = `
    Floors: B1 – F${maxFloor} &nbsp;(${levels.length} levels)<br>
    Tower height: ~${towerH.toFixed(0)} m<br>
    Site: ${siteArea} m² &nbsp;(${SITE_W}×${SITE_D}m)<br>
    Utilization (GFA/site): ${(totalArea / siteArea).toFixed(1)}× FAR
  `;
      container.appendChild(meta);
    }

    // ─────────────────────────────────────────────────────────
    // PANEL TOGGLE
    // ─────────────────────────────────────────────────────────
    function togglePanel(id) {
      const body = document.getElementById(`body-${id}`);
      const arrow = document.getElementById(`arrow-${id}`);
      const collapsed = body.classList.toggle('collapsed');
      arrow.innerHTML = collapsed ? '&#9656;' : '&#9660;';
    }
    window.togglePanel = togglePanel;

    // ─────────────────────────────────────────────────────────
    // RECEIVE PARAMETERS FROM PARENT (index.html)
    // ─────────────────────────────────────────────────────────
    window.addEventListener('message', (e) => {
      if (e.data && e.data.action === 'applyParams') {
        if (e.data.siteW > 0) SITE_W = e.data.siteW;
        if (e.data.siteD > 0) SITE_D = e.data.siteD;
        if (e.data.floorCount > 0) TAPER_TOP = e.data.floorCount;
        if (e.data.floorH > 0) FLOOR_H = e.data.floorH;
        if (e.data.taper !== undefined) TAPER = e.data.taper;
        if (e.data.diagrid !== undefined) SHOW_DIAGRID = !!e.data.diagrid;
        buildScene();
        recentreCamera();
      }
    });

    // ─────────────────────────────────────────────────────────
    // RAYCASTING / TOOLTIP
    // ─────────────────────────────────────────────────────────
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2(-9999, -9999);
    const tooltip = document.getElementById('tooltip');
    let hoveredMesh = null;

    renderer.domElement.addEventListener('mousemove', e => {
      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
      tooltip.style.left = (e.clientX + 14) + 'px';
      tooltip.style.top = (e.clientY - 10) + 'px';
    });

    renderer.domElement.addEventListener('mouseleave', () => {
      tooltip.style.display = 'none';
      if (hoveredMesh && hoveredMesh.material && hoveredMesh.material.isMeshStandardMaterial) {
        hoveredMesh.material.emissiveIntensity = 0;
        hoveredMesh.material.emissive.set(0x000000);
      }
      hoveredMesh = null;
    });

    function checkHover() {
      raycaster.setFromCamera(mouse, camera);
      const meshes = [];
      sceneGroup.traverse(obj => { if (obj.isMesh && obj.userData.type) meshes.push(obj); });
      const hits = raycaster.intersectObjects(meshes, false);

      if (hits.length > 0) {
        const hit = hits[0].object;
        if (hit !== hoveredMesh) {
          if (hoveredMesh && hoveredMesh.material && hoveredMesh.material.isMeshStandardMaterial) {
            hoveredMesh.material.emissiveIntensity = 0;
            hoveredMesh.material.emissive.set(0x000000);
          }
          hoveredMesh = hit;
          if (hit.material && hit.material.isMeshStandardMaterial) {
            hit.material.emissive.set(0xffffff);
            hit.material.emissiveIntensity = 0.14;
          }
        }
        const d = hit.userData;
        const label = TYPE_LABELS[d.type] || d.type.replace(/_/g, ' ');
        const floorStr = d.level < 0 ? 'B1' : `F${d.level}`;
        tooltip.innerHTML = `<strong>${label}</strong>${floorStr} &nbsp;&middot;&nbsp; ${d.area.toLocaleString()} m²<br><span style="color:#666;font-size:9px;text-transform:uppercase;letter-spacing:0.1em">${d.category}</span>`;
        tooltip.style.display = 'block';
      } else {
        if (hoveredMesh && hoveredMesh.material && hoveredMesh.material.isMeshStandardMaterial) {
          hoveredMesh.material.emissiveIntensity = 0;
          hoveredMesh.material.emissive.set(0x000000);
        }
        hoveredMesh = null;
        tooltip.style.display = 'none';
      }
    }

    // ─────────────────────────────────────────────────────────
    // HTML FLOOR LABELS (projected to screen)
    // ─────────────────────────────────────────────────────────
    let labelEls = [];

    function buildLabelElements() {
      labelEls.forEach(el => el.remove());
      labelEls = [];
      for (const lo of labelObjects) {
        const el = document.createElement('div');
        el.style.cssText = `
      position:fixed;
      font-size:8px;
      font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;
      color:#444;
      pointer-events:none;
      white-space:nowrap;
      z-index:5;
      letter-spacing:0.06em;
    `;
        el.textContent = lo.level < 0 ? 'B1' : `F${lo.level}`;
        document.body.appendChild(el);
        labelEls.push({ el, worldPos: lo.worldPos });
      }
    }

    function updateLabels() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      for (const { el, worldPos } of labelEls) {
        const v = worldPos.clone().project(camera);
        const sx = (v.x * 0.5 + 0.5) * w;
        const sy = (-v.y * 0.5 + 0.5) * h;
        if (v.z > 1 || sx < 0 || sx > w || sy < 0 || sy > h) {
          el.style.display = 'none';
        } else {
          el.style.display = 'block';
          el.style.left = (sx - 14) + 'px';
          el.style.top = (sy - 6) + 'px';
        }
      }
    }

    // ─────────────────────────────────────────────────────────
    // RESIZE
    // ─────────────────────────────────────────────────────────
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // ─────────────────────────────────────────────────────────
    // ANIMATION LOOP
    // ─────────────────────────────────────────────────────────
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      checkHover();
      updateLabels();
      renderer.render(scene, camera);
    }

    // ─────────────────────────────────────────────────────────
    // FILE LOADING
    // ─────────────────────────────────────────────────────────
    const fileInput = document.getElementById('file-input');
    const dropZone = document.getElementById('drop-zone');
    const fnDisplay = document.getElementById('loaded-filename');
    const ecDisplay = document.getElementById('load-entry-count');
    const errDisplay = document.getElementById('load-error');

    function handleProgramFile(file) {
      if (errDisplay) errDisplay.textContent = '';
      if (fnDisplay) fnDisplay.textContent = '';
      if (ecDisplay) ecDisplay.textContent = '';
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (evt) => {
        const raw = evt.target.result;
        let parsed;
        try {
          parsed = parseProgramText(raw);
        } catch (e) {
          if (errDisplay) errDisplay.textContent = 'Parse error: ' + e.message;
          return;
        }
        if (parsed.length === 0) {
          if (errDisplay) errDisplay.textContent = 'No program entries found. Check file format.';
          return;
        }

        PROGRAM_DATA = parsed;

        const levels = parsed.map(e => e.level);
        const maxLevel = Math.max(...levels);
        TAPER_TOP = maxLevel;

        if (fnDisplay) fnDisplay.textContent = '\u2713 ' + file.name;
        if (ecDisplay) ecDisplay.textContent = parsed.length + ' entries across ' +
          new Set(levels).size + ' floors';

        buildScene();
        recentreCamera();
      };
      reader.onerror = () => { if (errDisplay) errDisplay.textContent = 'Could not read file.'; };
      reader.readAsText(file);
    }

    if (fileInput) {
      fileInput.addEventListener('change', (e) => {
        if (e.target.files[0]) handleProgramFile(e.target.files[0]);
        e.target.value = '';
      });
    }

    if (dropZone) {
      dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('drag-over'); });
      dropZone.addEventListener('dragleave', () => { dropZone.classList.remove('drag-over'); });
      dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropZone.classList.remove('drag-over');
        const file = e.dataTransfer.files[0];
        if (file) handleProgramFile(file);
      });
    }

    // ─────────────────────────────────────────────────────────
    // INIT
    // ─────────────────────────────────────────────────────────
    buildScene(); // also calls buildLabelElements() internally
    animate();

  </script>
</body>

</html>
