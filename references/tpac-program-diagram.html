<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Taipei Performing Arts Center — OMA Program Diagram</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --grad-start: #2563eb;
      --grad-end: #7c3aed;
      --grad: linear-gradient(135deg, #2563eb, #7c3aed);
      --panel-bg: rgba(6, 6, 18, 0.92);
      --border: rgba(120, 80, 255, 0.22);
      --border-dim: rgba(120, 80, 255, 0.10);
      --text-hi: #f0f0ff;
      --text-mid: #9898c0;
      --text-lo: #44445a;
      --radius-lg: 12px;
      --radius-md: 8px;
      --radius-sm: 5px;
      --shadow: 0 8px 32px rgba(37, 99, 235, 0.10), 0 2px 8px rgba(0, 0, 0, 0.5);
    }

    body {
      background: #06060f;
      font-family: 'Montserrat', 'Helvetica Neue', Helvetica, Arial, sans-serif;
      overflow: hidden;
      color: var(--text-hi);
    }

    #canvas-container {
      position: fixed;
      inset: 0;
    }

    /* ── Legend ─────────────────────────────────────────────── */
    #legend {
      position: fixed;
      top: 20px;
      left: 20px;
      background: var(--panel-bg);
      border: 1px solid var(--border);
      padding: 14px 18px;
      border-radius: var(--radius-lg);
      min-width: 230px;
      max-width: 260px;
      max-height: 70vh;
      overflow-y: auto;
      backdrop-filter: blur(16px);
      box-shadow: var(--shadow);
      z-index: 10;
      scrollbar-width: thin;
      scrollbar-color: rgba(120, 80, 255, 0.3) transparent;
    }

    #legend::-webkit-scrollbar {
      width: 3px;
    }

    #legend::-webkit-scrollbar-thumb {
      background: rgba(120, 80, 255, 0.35);
      border-radius: 2px;
    }

    #legend h2 {
      font-size: 8px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--text-lo);
      margin-bottom: 12px;
      border-bottom: 1px solid var(--border-dim);
      padding-bottom: 9px;
      font-weight: 600;
    }

    .legend-category {
      font-size: 8px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--text-lo);
      margin: 12px 0 7px;
      border-top: 1px solid var(--border-dim);
      padding-top: 10px;
      font-weight: 600;
    }

    .legend-category:first-of-type {
      border-top: none;
      margin-top: 4px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 7px;
      font-size: 10px;
      line-height: 1.3;
    }

    .legend-swatch {
      width: 11px;
      height: 11px;
      border-radius: 3px;
      flex-shrink: 0;
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    .legend-label {
      color: var(--text-mid);
      flex: 1;
      font-weight: 400;
    }

    /* ── Info panel ──────────────────────────────────────────── */
    #info {
      position: fixed;
      bottom: 64px;
      left: 20px;
      background: var(--panel-bg);
      border: 1px solid var(--border);
      padding: 10px 14px;
      border-radius: var(--radius-md);
      font-size: 10px;
      color: var(--text-lo);
      line-height: 1.7;
      backdrop-filter: blur(16px);
      box-shadow: var(--shadow);
      z-index: 10;
      font-weight: 400;
    }

    /* ── Title ───────────────────────────────────────────────── */
    #title-block {
      position: fixed;
      top: 20px;
      right: 20px;
      text-align: right;
      z-index: 10;
    }

    #title-block h1 {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.06em;
      background: var(--grad);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    #title-block p {
      font-size: 9px;
      letter-spacing: 0.18em;
      color: var(--text-lo);
      text-transform: uppercase;
      margin-top: 5px;
      font-weight: 400;
    }

    /* ── HTML Labels ─────────────────────────────────────────── */
    .volume-label {
      position: fixed;
      transform: translate(-50%, -50%);
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #fff;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.9), 0 0 12px rgba(0, 0, 0, 0.8);
      pointer-events: none;
      white-space: nowrap;
      z-index: 5;
      opacity: 0.9;
    }

    .floor-label {
      position: fixed;
      transform: translate(-100%, -50%);
      font-size: 8px;
      font-weight: 500;
      letter-spacing: 0.08em;
      color: var(--text-mid);
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
      pointer-events: none;
      white-space: nowrap;
      z-index: 5;
    }

    /* ── Floor selector ──────────────────────────────────────── */
    #floor-selector {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 4px;
      background: var(--panel-bg);
      border: 1px solid var(--border);
      padding: 8px 12px;
      border-radius: var(--radius-lg);
      backdrop-filter: blur(16px);
      box-shadow: var(--shadow);
      z-index: 10;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 90vw;
    }

    .floor-btn {
      background: rgba(120, 80, 255, 0.06);
      border: 1px solid var(--border-dim);
      color: var(--text-lo);
      font-size: 8px;
      letter-spacing: 0.06em;
      padding: 4px 8px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
      font-weight: 500;
    }

    .floor-btn:hover {
      background: rgba(120, 80, 255, 0.16);
      color: var(--text-hi);
      border-color: var(--border);
      transform: translateY(-1px);
    }

    .floor-btn.active {
      background: var(--grad);
      color: #fff;
      border-color: transparent;
      box-shadow: 0 2px 10px rgba(124, 58, 237, 0.4);
    }

    .floor-btn.all-btn {
      background: rgba(120, 80, 255, 0.03);
      color: var(--text-lo);
      border-color: var(--border-dim);
      margin-right: 6px;
    }

    .floor-btn.all-btn.active {
      background: var(--grad);
      color: #fff;
      border-color: transparent;
      box-shadow: 0 2px 10px rgba(124, 58, 237, 0.4);
    }

    /* ── Right-side panels (program loader + site params) ─── */
    #right-panels {
      position: fixed;
      top: 72px;
      right: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 10;
      width: 300px;
    }

    .side-panel {
      background: var(--panel-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      backdrop-filter: blur(16px);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      cursor: pointer;
      user-select: none;
      border-bottom: 1px solid var(--border-dim);
    }

    .panel-header:hover {
      background: rgba(120, 80, 255, 0.05);
    }

    .panel-title {
      font-size: 8px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--text-mid);
      font-weight: 600;
    }

    .panel-arrow {
      font-size: 9px;
      color: var(--text-lo);
      transition: transform 0.2s ease;
    }

    .panel-body {
      padding: 12px 14px 14px;
    }

    .panel-body.collapsed {
      display: none;
    }

    /* inputs inside panels */
    .panel-body label {
      font-size: 8px;
      color: var(--text-lo);
      letter-spacing: 0.10em;
      display: block;
      margin-bottom: 3px;
      margin-top: 9px;
      text-transform: uppercase;
      font-weight: 600;
    }

    .panel-body label:first-of-type {
      margin-top: 0;
    }

    .param-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .param-row input[type="number"] {
      background: rgba(120, 80, 255, 0.07);
      border: 1px solid var(--border);
      color: var(--text-hi);
      font-size: 12px;
      padding: 5px 9px;
      border-radius: var(--radius-sm);
      width: 70px;
      font-family: inherit;
      font-weight: 500;
      transition: border-color 0.2s;
    }

    .param-row input[type="number"]:focus {
      outline: none;
      border-color: var(--grad-start);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    .param-unit {
      font-size: 10px;
      color: var(--text-lo);
    }

    .panel-body textarea {
      background: rgba(120, 80, 255, 0.05);
      border: 1px solid var(--border);
      color: var(--text-hi);
      font-size: 10px;
      padding: 7px 9px;
      border-radius: var(--radius-sm);
      width: 100%;
      resize: vertical;
      font-family: 'Courier New', monospace;
      line-height: 1.5;
      transition: border-color 0.2s;
    }

    .panel-body textarea:focus {
      outline: none;
      border-color: var(--grad-start);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    .panel-btn {
      background: var(--grad);
      border: none;
      color: #fff;
      font-size: 8px;
      letter-spacing: 0.12em;
      padding: 7px 16px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-family: inherit;
      font-weight: 600;
      margin-top: 10px;
      text-transform: uppercase;
      transition: all 0.2s ease;
      box-shadow: 0 2px 12px rgba(124, 58, 237, 0.35);
    }

    .panel-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 18px rgba(124, 58, 237, 0.5);
    }

    .panel-btn:active {
      transform: translateY(0);
    }

    .panel-error {
      font-size: 10px;
      color: #f87171;
      margin-top: 6px;
      display: none;
    }
  </style>
</head>

    /* ═══════════════════════════════════════════════════════════════
       PRE-POPULATE TEXTAREA  with canonical TPAC program text
    ═══════════════════════════════════════════════════════════════ */
    (async function loadCanonicalProgram() {
      const ta = document.getElementById('program-textarea');
      try {
        const resp = await fetch('references/TPAC-PROGRAM-DISTRIBUTION.txt');
        if (resp.ok) {
          const txt = await resp.text();
          const parsed = parseProgramText(txt);
          if (parsed.length > 0) {
            FLOOR_DATA = parsed;
            if (ta) ta.value = txt.trim();
            buildLegend();
            buildScene({ siteW: 70, siteD: 70, floorCount: 14, floorHeight: 4.5 });
            return;
          }
        }
      } catch (e) {
        // silent fallback
      }

      if (ta) {
        const lines = FLOOR_DATA.map(e =>
          `{${e.type}}/{${e.area}}/{${e.level}}/{${e.category}}/{${e.w},${e.d}}`
        );
        ta.value = lines.join('\n');
      }
    })();

    /* ═══════════════════════════════════════════════════════════════
       PARSER  — raw text → FLOOR_DATA entries
    ═══════════════════════════════════════════════════════════════ */
    function parseProgramText(text) {
      const entries = [];
      const lineRe = /\{([^}]+)\}\/\{([^}]+)\}\/\{([^}]+)\}\/\{([^}]+)\}\/\{([^}]+)\}/g;
      let m;
      while ((m = lineRe.exec(text)) !== null) {
        const [, type, area, level, category, dims] = m;
        const [w, d] = dims.split(',').map(s => parseFloat(s.trim()));
        const lvl = parseInt(level.trim(), 10);
        if (!isNaN(lvl) && !isNaN(w) && !isNaN(d)) {
          entries.push({ type: type.trim(), area: parseFloat(area), level: lvl, category: category.trim(), w, d });
        }
      }
      return entries;
    }

    /* ═══════════════════════════════════════════════════════════════
       SCENE SETUP  (renderer / camera / controls / lights — once)
    ═══════════════════════════════════════════════════════════════ */

    const container = document.getElementById('canvas-container');
    const W = container.clientWidth;
    const H = container.clientHeight;

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(W, H);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1;
    container.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0d0d0d);
    scene.fog = new THREE.FogExp2(0x0d0d0d, 0.0032);

    const camera = new THREE.PerspectiveCamera(42, W / H, 0.5, 1000);
    camera.position.set(105, 90, 100);
    camera.lookAt(0, 22, 0);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 22, 0);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.minDistance = 20;
    controls.maxDistance = 400;
    controls.maxPolarAngle = Math.PI / 2.05;
    controls.update();

    /* ── Lighting ────────────────────────────────────────────────── */
    const ambient = new THREE.AmbientLight(0xffffff, 0.5);
    scene.add(ambient);

    const sun = new THREE.DirectionalLight(0xfff5e0, 1.7);
    sun.position.set(70, 100, 60);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.near = 1;
    sun.shadow.camera.far = 400;
    sun.shadow.camera.left = -100;
    sun.shadow.camera.right = 100;
    sun.shadow.camera.top = 100;
    sun.shadow.camera.bottom = -100;
    sun.shadow.bias = -0.0005;
    scene.add(sun);

    const fill = new THREE.DirectionalLight(0xc8d8ff, 0.35);
    fill.position.set(-50, 40, -70);
    scene.add(fill);

    /* ═══════════════════════════════════════════════════════════════
       MATERIAL HELPERS
    ═══════════════════════════════════════════════════════════════ */

    // Cache materials by hex string to avoid duplicates
    const _matCache = {};
    function getSlabMat(hexStr, opacity = 0.82) {
      const key = hexStr + '_' + opacity;
      if (!_matCache[key]) {
        _matCache[key] = new THREE.MeshPhysicalMaterial({
          color: new THREE.Color(hexStr),
          opacity,
          transparent: opacity < 1.0,
          roughness: 0.7,
          metalness: 0.03,
          side: THREE.DoubleSide,
          depthWrite: opacity >= 0.99,
        });
      }
      return _matCache[key];
    }

    function getEdgeMat(hexStr) {
      const key = 'edge_' + hexStr;
      if (!_matCache[key]) {
        _matCache[key] = new THREE.LineBasicMaterial({
          color: new THREE.Color(hexStr),
          opacity: 0.4,
          transparent: true,
        });
      }
      return _matCache[key];
    }

    // Global site extents used to keep slabs inside the site rectangle.
    // Updated at start of buildScene.
    let SITE_W_GLOBAL = 70;
    let SITE_D_GLOBAL = 70;
    let SITE_BOUNDARY_EPS = 0.15;

    /* ── Utility: add a box slab with edge lines ─────────────────── */
    // Returns { mesh, lines } so we can reference them for floor-selector
    function addSlab(sx, sy, sz, cx, cy, cz, typeKey, opacity) {
      const hexStr = TYPE_COLORS[typeKey] || '#888888';

      // Enforce site rectangle bounds: adjust half-extents and center so slab doesn't cross site edges
      let halfX = sx / 2;
      let halfZ = sz / 2;
      const maxHalfX = Math.max(0.01, SITE_W_GLOBAL / 2 - SITE_BOUNDARY_EPS);
      const maxHalfZ = Math.max(0.01, SITE_D_GLOBAL / 2 - SITE_BOUNDARY_EPS);
      if (halfX > maxHalfX) halfX = maxHalfX;
      if (halfZ > maxHalfZ) halfZ = maxHalfZ;
      sx = Math.max(0.01, halfX * 2);
      sz = Math.max(0.01, halfZ * 2);

      const cxMin = -SITE_W_GLOBAL / 2 + halfX + SITE_BOUNDARY_EPS;
      const cxMax = SITE_W_GLOBAL / 2 - halfX - SITE_BOUNDARY_EPS;
      const czMin = -SITE_D_GLOBAL / 2 + halfZ + SITE_BOUNDARY_EPS;
      const czMax = SITE_D_GLOBAL / 2 - halfZ - SITE_BOUNDARY_EPS;
      cx = Math.max(cxMin, Math.min(cxMax, cx));
      cz = Math.max(czMin, Math.min(czMax, cz));

      const geo = new THREE.BoxGeometry(sx, sy, sz);
      const mesh = new THREE.Mesh(geo, getSlabMat(hexStr, opacity));
      mesh.position.set(cx, cy, cz);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      mesh.userData.typeKey = typeKey;
      mesh.userData.isBuilt = true;
      scene.add(mesh);

      const edges = new THREE.EdgesGeometry(geo, 10);
      const lines = new THREE.LineSegments(edges, getEdgeMat(hexStr));
      lines.position.set(cx, cy, cz);
      lines.userData.typeKey = typeKey;
      lines.userData.isBuilt = true;
      scene.add(lines);

      return { mesh, lines };
    }

    /* ═══════════════════════════════════════════════════════════════
       LABEL SYSTEM  — volume + floor labels updated each frame
    ═══════════════════════════════════════════════════════════════ */

    // Arrays are rebuilt by buildScene(); updateLabels() reads them each frame.
    let VOLUME_LABEL_DATA = [];
    let FLOOR_LABEL_DATA = [];
    let volumeLabelEls = [];
    let floorLabelEls = [];

    function clearLabelEls() {
      volumeLabelEls.forEach(el => el.remove());
      floorLabelEls.forEach(el => el.remove());
      volumeLabelEls = [];
      floorLabelEls = [];
    }

    const _v3 = new THREE.Vector3();

    function projectToScreen(worldPos) {
      _v3.copy(worldPos).project(camera);
      const x = (_v3.x * 0.5 + 0.5) * renderer.domElement.clientWidth;
      const y = (-_v3.y * 0.5 + 0.5) * renderer.domElement.clientHeight;
      const behind = _v3.z > 1;
      return { x, y, behind };
    }

    function updateLabels() {
      VOLUME_LABEL_DATA.forEach(({ world }, i) => {
        const { x, y, behind } = projectToScreen(world);
        volumeLabelEls[i].style.display = behind ? 'none' : 'block';
        volumeLabelEls[i].style.left = x + 'px';
        volumeLabelEls[i].style.top = y + 'px';
      });

      FLOOR_LABEL_DATA.forEach(({ world }, i) => {
        const { x, y, behind } = projectToScreen(world);
        floorLabelEls[i].style.display = behind ? 'none' : 'block';
        floorLabelEls[i].style.left = (x - 2) + 'px';
        floorLabelEls[i].style.top = y + 'px';
      });
    }

    /* ═══════════════════════════════════════════════════════════════
       FLOOR SELECTOR STATE
       Rebuilt by buildScene(); applyFloorFocus() reads current state.
    ═══════════════════════════════════════════════════════════════ */

    let floorMeshes = {};   // levelKey → [{ mesh, lines, baseOpacity }]
    let activeFloor = null; // null = all visible

    // Shaft objects are tagged userData.isShaft; looked up from scene each time.
    function getShaftObjects() {
      return scene.children.filter(obj => obj.userData.isShaft);
    }

    function applyFloorFocus(selectedKey, floorKeys) {
      floorKeys.forEach(k => {
        const isActive = (selectedKey === null || k === selectedKey);
        const targetOpacity = isActive ? null : 0.06;

        (floorMeshes[k] || []).forEach(({ mesh, lines, baseOpacity }) => {
          if (!mesh.userData._opacitySetThisFrame) {
            const op = (targetOpacity === null) ? baseOpacity : targetOpacity;
            mesh.material.opacity = op;
            mesh.material.transparent = op < 1.0;
            lines.material.opacity = (targetOpacity === null) ? 0.4 : 0.04;
            mesh.userData._opacitySetThisFrame = true;
          }
        });
      });

      scene.children.forEach(obj => {
        if (obj.userData._opacitySetThisFrame) delete obj.userData._opacitySetThisFrame;
      });

      getShaftObjects().forEach(obj => {
        if (obj.isMesh) {
          obj.material.opacity = (selectedKey === null) ? 0.88 : 0.1;
        } else {
          obj.material.opacity = (selectedKey === null) ? 0.4 : 0.05;
        }
      });
    }

    /* ═══════════════════════════════════════════════════════════════
       LEGEND  — rebuilds from currently active TYPE_COLORS
    ═══════════════════════════════════════════════════════════════ */
    function buildLegend() {
      const legend = document.getElementById('legend');
      if (!legend) return;
      legend.innerHTML = '<h2>Program Types</h2>';

      // Collect active types present in FLOOR_DATA
      const activeTypes = new Set(FLOOR_DATA.map(e => e.type));

      Object.entries(LEGEND_GROUPS).forEach(([groupName, types]) => {
        // Only show group if at least one type is active
        const visibleTypes = types.filter(t => TYPE_COLORS[t] && activeTypes.has(t));
        if (visibleTypes.length === 0) return;

        const groupHead = document.createElement('div');
        groupHead.className = 'legend-category';
        groupHead.textContent = groupName;
        legend.appendChild(groupHead);

        visibleTypes.forEach(typeKey => {
          const row = document.createElement('div');
          row.className = 'legend-item';
          const hexStr = TYPE_COLORS[typeKey];
          row.innerHTML = `
        <div class="legend-swatch" style="background:${hexStr}"></div>
        <span class="legend-label">${typeKey}</span>
      `;
          legend.appendChild(row);
        });
      });
    }

    /* ═══════════════════════════════════════════════════════════════
       DISPOSE + CLEAR SCENE
       Removes all built objects (tagged userData.isBuilt or isShaft)
       while preserving lights, renderer, camera, controls.
    ═══════════════════════════════════════════════════════════════ */
    function disposeAndClear() {
      const toRemove = scene.children.filter(obj =>
        obj.userData.isBuilt || obj.userData.isShaft || obj.isGridHelper || obj instanceof THREE.GridHelper
      );
      toRemove.forEach(obj => {
        scene.remove(obj);
        if (obj.geometry) obj.geometry.dispose();
        if (obj.material) {
          if (Array.isArray(obj.material)) obj.material.forEach(m => m.dispose());
          else obj.material.dispose();
        }
      });
    }

    /* ═══════════════════════════════════════════════════════════════
       buildScene(params)
       params: { siteW, siteD, floorCount, floorHeight }
       Called on initial load and on Apply / Load.
    ═══════════════════════════════════════════════════════════════ */
    function buildScene(params) {
      const { siteW, siteD, floorCount, floorHeight } = params;

      /* ── Derived constants ── */
      const SITE_W = siteW;
      const SITE_D = siteD;
      const FLOOR_STEP = floorHeight;
      const SLAB_H = FLOOR_STEP * 0.85;
      const PILOTIS_H = 6.0;
      const SHAFT_W = 10.0;
      const SHAFT_D = 12.0;
      const SLAB_OPACITY = 0.80;

      const CUBE_W = SITE_W * 0.5;
      const CUBE_D = SITE_D * 0.5;
      const CUBE_HALF_X = CUBE_W / 2;
      const CUBE_HALF_Z = CUBE_D / 2;

      // Grand Theater protrusion (+X from cube east face)
      const GRAND_PROTRUDE_W = CUBE_W * 0.8;
      const GRAND_D = CUBE_D * 0.8;
      const GRAND_X_START = CUBE_HALF_X;
      const GRAND_X_CENTER = GRAND_X_START + GRAND_PROTRUDE_W / 2;

      // Blue Box protrusion (-X from cube west face)
      const BLUE_PROTRUDE_W = CUBE_W * 0.63;
      const BLUE_D = CUBE_D * 0.63;
      const BLUE_X_START = -CUBE_HALF_X;
      const BLUE_X_CENTER = BLUE_X_START - BLUE_PROTRUDE_W / 2;

      // Globe Playhouse protrusion (-Z from cube north face)
      const GLOBE_PROTRUDE_D = CUBE_D * 0.63;
      const GLOBE_W = CUBE_W * 0.63;
      const GLOBE_Z_START = -CUBE_HALF_Z;
      const GLOBE_Z_CENTER = GLOBE_Z_START - GLOBE_PROTRUDE_D / 2;

      /* ── Floor key / label generation ── */
      // Level -1 = B1, level 0 = L0, levels 1..(floorCount-2) = L1..L{N-2}
      // floorCount includes B1 as a floor, so top level = floorCount - 2
      const topLevel = floorCount - 2;
      const FLOOR_KEYS = [];
      const FLOOR_LABELS_DISPLAY = [];

      // B1 (level -1)
      FLOOR_KEYS.push('-1');
      FLOOR_LABELS_DISPLAY.push('B1');
      // L0
      FLOOR_KEYS.push('0');
      FLOOR_LABELS_DISPLAY.push('L0');
      // L1 .. L{topLevel}
      for (let i = 1; i <= topLevel; i++) {
        FLOOR_KEYS.push(String(i));
        FLOOR_LABELS_DISPLAY.push('L' + i);
      }

      /* ── Floor Y table ── */
      const FLOOR_Y = {};
      FLOOR_Y['-1'] = -FLOOR_STEP;         // B1 starts one floor below ground
      FLOOR_Y['0'] = 0;                   // L0 at ground
      for (let i = 1; i <= topLevel; i++) {
        FLOOR_Y[String(i)] = PILOTIS_H + (i - 1) * FLOOR_STEP;
      }

      const CUBE_Y_BOTTOM = FLOOR_Y['-1'];
      const CUBE_Y_TOP = FLOOR_Y[String(topLevel)] + FLOOR_STEP;
      const CUBE_TOTAL_H = CUBE_Y_TOP - CUBE_Y_BOTTOM;
      const CUBE_CY = (CUBE_Y_TOP + CUBE_Y_BOTTOM) / 2;
      const TOTAL_H = CUBE_Y_TOP;

      // Small margin to keep slabs slightly inside the site boundary
      const BOUNDARY_EPS = 0.15;

      // Update globals used by addSlab
      SITE_W_GLOBAL = siteW;
      SITE_D_GLOBAL = siteD;
      SITE_BOUNDARY_EPS = BOUNDARY_EPS;

      function clamp(val, a, b) { return Math.max(a, Math.min(b, val)); }

      /* ── Private BOH / Public / Circ type sets ── */
      const BACK_TYPES = new Set([
        'backstage', 'rehearsal room', 'dressing room', 'green room',
        'loading', 'production workshop', 'set storage',
        'storage', 'mechanical', 'staff', 'IT support', 'fly tower',
        'stage', 'orchestra pit',
      ]);
      const FRONT_TYPES = new Set([
        'lobby', 'box office', 'lounge bar', 'event lounge',
        'restaurant', 'roof terrace', 'viewing platform',
        'circulation', 'plaza',
        'restroom', 'sales and display', 'fitting rooms',
      ]);
      const CIRC_TYPES = new Set([
        'fire stair and freight elevator',
        'fire stair and elevator 1',
        'fire stair and elevator 2',
        'fire stair and elevator 3',
      ]);

      /* ── Dispose existing built objects ── */
      disposeAndClear();
      clearLabelEls();

      /* ── Reset floorMeshes ── */
      floorMeshes = {};
      FLOOR_KEYS.forEach(k => { floorMeshes[k] = []; });

      function registerSlab(levelKey, slabResult, baseOpacity) {
        if (floorMeshes[levelKey]) {
          floorMeshes[levelKey].push({ mesh: slabResult.mesh, lines: slabResult.lines, baseOpacity });
        }
      }

      /* ────────────────────────────────────────────────────────────
         1. Ground plane
      ──────────────────────────────────────────────────────────── */
      {
        const geoGround = new THREE.PlaneGeometry(SITE_W, SITE_D);
        geoGround.rotateX(-Math.PI / 2);
        const meshGround = new THREE.Mesh(geoGround, getSlabMat('#1a1a1a', 1.0));
        meshGround.receiveShadow = true;
        meshGround.userData.isBuilt = true;
        scene.add(meshGround);

        const outline = new THREE.EdgesGeometry(geoGround);
        const outLine = new THREE.LineSegments(outline, new THREE.LineBasicMaterial({ color: 0x444444 }));
        outLine.position.y = 0.02;
        outLine.userData.isBuilt = true;
        scene.add(outLine);

        const grid = new THREE.GridHelper(SITE_W, 10, 0x1e1e1e, 0x181818);
        grid.position.y = 0.01;
        grid.userData.isBuilt = true;
        scene.add(grid);
      }

      /* ────────────────────────────────────────────────────────────
         2. Pilotis columns (Y: 0 → PILOTIS_H)
      ──────────────────────────────────────────────────────────── */
      {
        const colMat = new THREE.MeshPhysicalMaterial({
          color: 0xb0a090, roughness: 0.7, metalness: 0.0
        });
        const r = Math.min(CUBE_HALF_X * 0.7, 14);
        const colPositions = [
          [-r * 0.86, -r * 0.86], [-r * 0.86, r * 0.86],
          [r * 0.86, -r * 0.86], [r * 0.86, r * 0.86],
          [0, -r], [0, r],
          [-r, 0], [r, 0],
        ];
        colPositions.forEach(([cx, cz]) => {
          const geo = new THREE.CylinderGeometry(0.5, 0.5, PILOTIS_H, 8);
          const m = new THREE.Mesh(geo, colMat);
          m.position.set(cx, PILOTIS_H / 2, cz);
          m.castShadow = true;
          m.userData.isBuilt = true;
          scene.add(m);
        });
      }

      /* ────────────────────────────────────────────────────────────
         3. Central Cube ghost wireframe envelope
      ──────────────────────────────────────────────────────────── */
      {
        const ghostMat = new THREE.MeshPhysicalMaterial({
          color: 0xffffff,
          opacity: 0.12,
          transparent: true,
          wireframe: true,
          depthWrite: false,
        });
        const ghostGeo = new THREE.BoxGeometry(CUBE_W, CUBE_TOTAL_H, CUBE_D);
        const ghost = new THREE.Mesh(ghostGeo, ghostMat);
        ghost.position.set(0, CUBE_CY, 0);
        ghost.userData.isBuilt = true;
        scene.add(ghost);
      }

      /* ────────────────────────────────────────────────────────────
         4. Circulation shafts — 4 corners, full cube height
      ──────────────────────────────────────────────────────────── */
      {
        const shaftDefs = [
          { type: 'fire stair and freight elevator', w: 10, d: 12, cx: -CUBE_HALF_X + 10 / 2 + 0.2, cz: CUBE_HALF_Z - 12 / 2 - 0.2 },
          { type: 'fire stair and elevator 1', w: 8, d: 8, cx: CUBE_HALF_X - 8 / 2 - 0.2, cz: CUBE_HALF_Z - 8 / 2 - 0.2 },
          { type: 'fire stair and elevator 2', w: 8, d: 8, cx: CUBE_HALF_X - 8 / 2 - 0.2, cz: -CUBE_HALF_Z + 8 / 2 + 0.2 },
          { type: 'fire stair and elevator 3', w: 8, d: 8, cx: -CUBE_HALF_X + 8 / 2 + 0.2, cz: -CUBE_HALF_Z + 8 / 2 + 0.2 },
        ];

        shaftDefs.forEach(({ type, w, d, cx, cz }) => {
          const hexStr = TYPE_COLORS[type];
          const shaftGeo = new THREE.BoxGeometry(w, CUBE_TOTAL_H, d);
          const shaftMesh = new THREE.Mesh(shaftGeo, getSlabMat(hexStr, 0.88));
          shaftMesh.position.set(cx, CUBE_CY, cz);
          shaftMesh.castShadow = true;
          shaftMesh.userData.typeKey = type;
          shaftMesh.userData.isShaft = true;
          scene.add(shaftMesh);

          const edges = new THREE.EdgesGeometry(shaftGeo, 5);
          const shaftLines = new THREE.LineSegments(edges, getEdgeMat(hexStr));
          shaftLines.position.set(cx, CUBE_CY, cz);
          shaftLines.userData.isShaft = true;
          scene.add(shaftLines);
        });
      }

      /* ────────────────────────────────────────────────────────────
         5. Per-floor program slabs
      ──────────────────────────────────────────────────────────── */

      /* Helper: layout a list of entries as X-strips within a zone */
      function layoutStrips(entryList, zoneXMin, zoneXMax, zoneZMin, zoneZMax, slabCY, levelKey) {
        if (entryList.length === 0) return;
        const sumArea = entryList.reduce((s, e) => s + e.area, 0);
        const zoneXW = zoneXMax - zoneXMin;
        const zoneZD = zoneZMax - zoneZMin;
        const totalArea = Math.max(sumArea, zoneXW * zoneZD);
        let curX = zoneXMin;
        const minWidth = 0.3;
        const maxZoneX = zoneXMax - BOUNDARY_EPS;
        const minZoneX = zoneXMin + BOUNDARY_EPS;

        // Group skinny vs normal entries
        const chunks = [];
        let curChunk = [];
        entryList.forEach(e => {
          const frac = e.area / totalArea;
          const w = zoneXW * frac;
          // Skinny if length:width > 4.0
          const isSkinny = (zoneZD / w) > 4.0;

          if (curChunk.length === 0) {
            curChunk.push({ e, w, frac });
            curChunk.isSkinny = isSkinny;
          } else {
            if (curChunk.isSkinny === isSkinny) {
              curChunk.push({ e, w, frac });
            } else {
              chunks.push(curChunk);
              curChunk = [{ e, w, frac }];
              curChunk.isSkinny = isSkinny;
            }
          }
        });
        if (curChunk.length > 0) chunks.push(curChunk);

        // Layout items chunk by chunk
        chunks.forEach(chunk => {
          const chunkVolW = chunk.reduce((s, it) => s + it.w, 0);
          if (chunkVolW <= 0.01) return;

          if (!chunk.isSkinny || chunk.length === 1) {
            // Normal layout: full Z depth
            const slabDepth = Math.max(0.1, Math.min(zoneZD - 0.12, zoneZD - BOUNDARY_EPS * 2));
            const cz = clamp((zoneZMin + zoneZMax) / 2, -siteD / 2 + slabDepth / 2 + BOUNDARY_EPS, siteD / 2 - slabDepth / 2 - BOUNDARY_EPS);

            chunk.forEach(it => {
              let slabW = Math.max(it.w, minWidth);
              const maxRemaining = maxZoneX - curX;
              if (maxRemaining <= minWidth) return;
              if (slabW > maxRemaining) slabW = Math.max(minWidth, maxRemaining);

              const cx = curX + slabW / 2;
              if (slabW - 0.12 > 0.01) {
                const res = addSlab(slabW - 0.12, SLAB_H, Math.max(0.01, slabDepth), cx, slabCY, cz, it.e.type, SLAB_OPACITY);
                registerSlab(levelKey, res, SLAB_OPACITY);
              }
              curX += slabW;
            });
          } else {
            // Halve the Z depth into two stacked rows for better aspect ratio
            const sorted = [...chunk].sort((a, b) => b.e.area - a.e.area);
            let r1 = [], r2 = [];
            let area1 = 0, area2 = 0;
            sorted.forEach(it => {
              if (area1 <= area2) { r1.push(it); area1 += it.e.area; }
              else { r2.push(it); area2 += it.e.area; }
            });
            if (area1 === 0) area1 = 1;
            if (area2 === 0 && r2.length > 0) area2 = 1;

            const z1_d = zoneZD * (area1 / (area1 + area2));
            const z2_d = zoneZD - z1_d;

            // Row 1
            if (r1.length > 0) {
              const cz1 = clamp(zoneZMin + z1_d / 2, -siteD / 2 + z1_d / 2 + BOUNDARY_EPS, siteD / 2 - z1_d / 2 - BOUNDARY_EPS);
              const d1 = Math.max(0.1, z1_d - BOUNDARY_EPS * 2);
              let rx = curX;
              r1.forEach(it => {
                let slabW = Math.max((it.e.area / area1) * chunkVolW, minWidth);
                const maxRem = Math.max(minWidth, maxZoneX - rx);
                if (slabW > maxRem) slabW = maxRem;
                const cx1 = rx + slabW / 2;
                if (slabW - 0.12 > 0.01 && d1 > 0.01) {
                  const res = addSlab(slabW - 0.12, SLAB_H, d1, cx1, slabCY, cz1, it.e.type, SLAB_OPACITY);
                  registerSlab(levelKey, res, SLAB_OPACITY);
                }
                rx += slabW;
              });
            }
            // Row 2
            if (r2.length > 0) {
              const cz2 = clamp(zoneZMin + z1_d + z2_d / 2, -siteD / 2 + z2_d / 2 + BOUNDARY_EPS, siteD / 2 - z2_d / 2 - BOUNDARY_EPS);
              const d2 = Math.max(0.1, z2_d - BOUNDARY_EPS * 2);
              let rx = curX;
              r2.forEach(it => {
                let slabW = Math.max((it.e.area / area2) * chunkVolW, minWidth);
                const maxRem = Math.max(minWidth, maxZoneX - rx);
                if (slabW > maxRem) slabW = maxRem;
                const cx2 = rx + slabW / 2;
                if (slabW - 0.12 > 0.01 && d2 > 0.01) {
                  const res = addSlab(slabW - 0.12, SLAB_H, d2, cx2, slabCY, cz2, it.e.type, SLAB_OPACITY);
                  registerSlab(levelKey, res, SLAB_OPACITY);
                }
                rx += slabW;
              });
            }
            curX += chunkVolW;
          }
        });
      }

      const MECH_X_START = CUBE_HALF_X * 0.49;  // where mechanical zone begins (~mid-back)

      FLOOR_KEYS.forEach(levelKey => {
        const level = parseInt(levelKey, 10);
        const floorY = FLOOR_Y[levelKey];
        if (floorY === undefined) return;
        const slabCY = floorY + SLAB_H / 2;

        // Filter entries for this floor; skip circulation types
        let dataEntries = FLOOR_DATA.filter(e => e.level === level && !CIRC_TYPES.has(e.type));

        // Ensure every floor has a restroom cluster per RESTROOM GUIDELINES §H
        const restroomTypes = new Set(['toilets', 'restroom']);
        const defaultCluster = [
          { type: 'restroom', area: 168, level: level, category: 'public', w: 12, d: 14 },
        ];

        if (dataEntries.length === 0) {
          dataEntries = defaultCluster.map(e => Object.assign({}, e));
        } else if (!dataEntries.some(e => restroomTypes.has(e.type))) {
          // inject a default cluster to meet FOH restroom sizing and stacking rules
          dataEntries = dataEntries.concat(defaultCluster.map(e => Object.assign({}, e)));
        }

        const grandEntries = dataEntries.filter(e => e.zone === 'grand');
        const blueEntries = dataEntries.filter(e => e.zone === 'blue');
        const globeEntries = dataEntries.filter(e => e.zone === 'globe');
        const cubeEntries = dataEntries.filter(e => !e.zone);

        const backEntries = cubeEntries.filter(e => BACK_TYPES.has(e.type));
        const frontEntries = cubeEntries.filter(e => FRONT_TYPES.has(e.type));
        const mechEntries = backEntries.filter(e => e.type === 'mechanical');
        const nonMechBack = backEntries.filter(e => e.type !== 'mechanical');

        // Limit BOH to 40% front/back depth split, expanding completely to the front/back curtain walls (forming cruciform bar)
        const zMaxCube = CUBE_HALF_Z - 0.3;
        const zMinCube = -CUBE_HALF_Z + 0.3;
        const splitZ = zMaxCube - (zMaxCube - zMinCube) * 0.4;

        // Back half: Starts from splitZ to +Z boundary
        layoutStrips(nonMechBack, -CUBE_HALF_X + SHAFT_W + 0.3, MECH_X_START, splitZ + 0.2, zMaxCube, slabCY, levelKey);
        layoutStrips(mechEntries, MECH_X_START, CUBE_HALF_X - SHAFT_W - 0.3, splitZ + 0.2, zMaxCube, slabCY, levelKey);

        // Front half: Starts from -Z boundary to splitZ
        layoutStrips(frontEntries, -CUBE_HALF_X + SHAFT_W + 0.3, CUBE_HALF_X - SHAFT_W - 0.3, zMinCube, splitZ - 0.2, slabCY, levelKey);

        /* ── Grand Theater zone (+X protrusion) ── */
        grandEntries.forEach(e => {
          let w = Math.min(GRAND_PROTRUDE_W - 0.3, GRAND_PROTRUDE_W * 0.95);
          let d = Math.min(GRAND_D - 0.3, GRAND_D * 0.95);
          // clamp sizes to site extents
          w = Math.min(w, siteW - BOUNDARY_EPS * 2);
          d = Math.min(d, siteD - BOUNDARY_EPS * 2);
          const GAP = 3.5;
          const desiredCx = GRAND_X_START + w / 2 + GAP;
          const cxMin = -siteW / 2 + w / 2 + BOUNDARY_EPS;
          const cxMax = siteW / 2 - w / 2 - BOUNDARY_EPS;
          const cx = clamp(desiredCx, cxMin, cxMax);
          const cz = clamp(0, -siteD / 2 + d / 2 + BOUNDARY_EPS, siteD / 2 - d / 2 - BOUNDARY_EPS);
          const result = addSlab(Math.max(0.01, w), SLAB_H, Math.max(0.01, d), cx, slabCY, cz, e.type, SLAB_OPACITY);
          registerSlab(levelKey, result, SLAB_OPACITY);

          const linkW = (cx - w / 2) - GRAND_X_START;
          if (linkW > 0.1) {
            const linkCx = GRAND_X_START + linkW / 2;
            const linkD = Math.min(14, d * 0.7);
            const linkRes = addSlab(Math.max(0.01, linkW - 0.05), SLAB_H, Math.max(0.01, linkD), linkCx, slabCY, cz, 'circulation', SLAB_OPACITY);
            registerSlab(levelKey, linkRes, SLAB_OPACITY);
          }
        });

        /* ── Blue Box zone (-X protrusion) ── */
        blueEntries.forEach(e => {
          let w = Math.min(BLUE_PROTRUDE_W - 0.3, BLUE_PROTRUDE_W * 0.95);
          let d = Math.min(BLUE_D - 0.3, BLUE_D * 0.95);
          w = Math.min(w, siteW - BOUNDARY_EPS * 2);
          d = Math.min(d, siteD - BOUNDARY_EPS * 2);
          const GAP = 3.5;
          const desiredCx = BLUE_X_START - w / 2 - GAP;
          const cxMin = -siteW / 2 + w / 2 + BOUNDARY_EPS;
          const cxMax = siteW / 2 - w / 2 - BOUNDARY_EPS;
          const cx = clamp(desiredCx, cxMin, cxMax);
          const cz = clamp(0, -siteD / 2 + d / 2 + BOUNDARY_EPS, siteD / 2 - d / 2 - BOUNDARY_EPS);
          const result = addSlab(Math.max(0.01, w), SLAB_H, Math.max(0.01, d), cx, slabCY, cz, e.type, SLAB_OPACITY);
          registerSlab(levelKey, result, SLAB_OPACITY);

          const linkW = BLUE_X_START - (cx + w / 2);
          if (linkW > 0.1) {
            const linkCx = BLUE_X_START - linkW / 2;
            const linkD = Math.min(12, d * 0.7);
            const linkRes = addSlab(Math.max(0.01, linkW - 0.05), SLAB_H, Math.max(0.01, linkD), linkCx, slabCY, cz, 'circulation', SLAB_OPACITY);
            registerSlab(levelKey, linkRes, SLAB_OPACITY);
          }
        });

        /* ── Globe Playhouse zone (-Z protrusion, north face) ── */
        globeEntries.forEach(e => {
          let w = Math.min(GLOBE_W - 0.3, GLOBE_W * 0.95);
          let d = Math.min(GLOBE_PROTRUDE_D - 0.3, GLOBE_PROTRUDE_D * 0.95);
          w = Math.min(w, siteW - BOUNDARY_EPS * 2);
          d = Math.min(d, siteD - BOUNDARY_EPS * 2);
          const GAP = 3.5;
          const czDesired = GLOBE_Z_START - d / 2 - GAP;
          const czMin = -siteD / 2 + d / 2 + BOUNDARY_EPS;
          const czMax = siteD / 2 - d / 2 - BOUNDARY_EPS;
          const cz = clamp(czDesired, czMin, czMax);
          const cx = clamp(0, -siteW / 2 + w / 2 + BOUNDARY_EPS, siteW / 2 - w / 2 - BOUNDARY_EPS);
          const result = addSlab(Math.max(0.01, w), SLAB_H, Math.max(0.01, d), cx, slabCY, cz, e.type, SLAB_OPACITY);
          registerSlab(levelKey, result, SLAB_OPACITY);

          const linkD = GLOBE_Z_START - (cz + d / 2);
          if (linkD > 0.1) {
            const linkCz = GLOBE_Z_START - linkD / 2;
            const linkW = Math.min(14, w * 0.7);
            const linkRes = addSlab(Math.max(0.01, linkW), SLAB_H, Math.max(0.01, linkD - 0.05), cx, slabCY, linkCz, 'circulation', SLAB_OPACITY);
            registerSlab(levelKey, linkRes, SLAB_OPACITY);
          }
        });
      });

      /* ── Plaza slab at L0 (ground level, full site) ── */
      {
        const plazaHexStr = TYPE_COLORS['plaza'];
        const plazaGeo = new THREE.BoxGeometry(SITE_W, 0.25, SITE_D);
        const plazaMesh = new THREE.Mesh(plazaGeo, getSlabMat(plazaHexStr, 0.95));
        plazaMesh.position.set(0, 0.125, 0);
        plazaMesh.receiveShadow = true;
        plazaMesh.userData.typeKey = 'plaza';
        plazaMesh.userData.isBuilt = true;
        scene.add(plazaMesh);

        const plazaEdges = new THREE.EdgesGeometry(plazaGeo);
        const plazaLines = new THREE.LineSegments(plazaEdges, getEdgeMat(plazaHexStr));
        plazaLines.position.set(0, 0.125, 0);
        plazaLines.userData.isBuilt = true;
        scene.add(plazaLines);

        if (floorMeshes['0']) {
          floorMeshes['0'].push({ mesh: plazaMesh, lines: plazaLines, baseOpacity: 0.95 });
        }
      }

      /* ────────────────────────────────────────────────────────────
         6. HTML Labels
      ──────────────────────────────────────────────────────────── */
      const midFloorKey = String(Math.floor((topLevel) / 2));
      const midFloorY = FLOOR_Y[midFloorKey] !== undefined ? FLOOR_Y[midFloorKey] : CUBE_CY;

      VOLUME_LABEL_DATA = [
        { text: 'Central Cube', world: new THREE.Vector3(0, CUBE_Y_TOP + 3.5, 0) },
        { text: 'Grand Theater', world: new THREE.Vector3(GRAND_X_CENTER + 2, midFloorY + SLAB_H * 1.5, 0) },
        { text: 'Blue Box', world: new THREE.Vector3(BLUE_X_CENTER - 2, midFloorY + SLAB_H * 1.5, 0) },
        { text: 'Globe Playhouse', world: new THREE.Vector3(0, midFloorY + SLAB_H * 1.5, GLOBE_Z_CENTER - 3) },
        { text: 'Public Plaza', world: new THREE.Vector3(-CUBE_HALF_X * 1.5, 1.5, CUBE_HALF_Z * 1.5) },
      ];

      volumeLabelEls = VOLUME_LABEL_DATA.map(({ text }) => {
        const el = document.createElement('div');
        el.className = 'volume-label';
        el.textContent = text;
        document.body.appendChild(el);
        return el;
      });

      FLOOR_LABEL_DATA = FLOOR_KEYS.map((k, i) => {
        const fY = FLOOR_Y[k];
        const labelY = fY + SLAB_H / 2;
        return {
          text: FLOOR_LABELS_DISPLAY[i],
          world: new THREE.Vector3(-CUBE_HALF_X - 1.5, labelY, 0),
        };
      });

      floorLabelEls = FLOOR_LABEL_DATA.map(({ text }) => {
        const el = document.createElement('div');
        el.className = 'floor-label';
        el.textContent = text;
        document.body.appendChild(el);
        return el;
      });


      /* ────────────────────────────────────────────────────────────
         7. Floor selector buttons
      ──────────────────────────────────────────────────────────── */
      const selectorEl = document.getElementById('floor-selector');
      selectorEl.innerHTML = '';
      activeFloor = null;

      const allBtn = document.createElement('button');
      allBtn.className = 'floor-btn all-btn active';
      allBtn.textContent = 'ALL';
      allBtn.addEventListener('click', () => {
        activeFloor = null;
        applyFloorFocus(null, FLOOR_KEYS);
        selectorEl.querySelectorAll('.floor-btn').forEach(b => b.classList.remove('active'));
        allBtn.classList.add('active');
      });
      selectorEl.appendChild(allBtn);

      FLOOR_KEYS.forEach((k, i) => {
        const btn = document.createElement('button');
        btn.className = 'floor-btn';
        btn.textContent = FLOOR_LABELS_DISPLAY[i];
        btn.addEventListener('click', () => {
          activeFloor = k;
          applyFloorFocus(k, FLOOR_KEYS);
          selectorEl.querySelectorAll('.floor-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
        });
        selectorEl.appendChild(btn);
      });

      /* ────────────────────────────────────────────────────────────
         8. Refit camera
      ──────────────────────────────────────────────────────────── */
      camera.position.set(siteW * 1.4, siteW * 1.2, siteW * 1.4);
      controls.target.set(0, TOTAL_H * 0.4, 0);
      controls.update();
    }

    /* ═══════════════════════════════════════════════════════════════
       PANEL TOGGLE LOGIC
    ═══════════════════════════════════════════════════════════════ */
    window.togglePanel = function (id) {
      const body = document.getElementById('body-' + id);
      const arrow = document.getElementById('arrow-' + id);
      if (!body || !arrow) return;
      const collapsed = body.classList.toggle('collapsed');
      arrow.innerHTML = collapsed ? '&#9656;' : '&#9662;';
    };

    /* ═══════════════════════════════════════════════════════════════
       RECEIVE PARAMETERS FROM PARENT (index.html)
    ═══════════════════════════════════════════════════════════════ */
    window.addEventListener('message', (e) => {
      if (e.data && e.data.action === 'applyParams') {
        const siteW = e.data.siteW || 70;
        const siteD = e.data.siteD || 70;
        const floorCount = e.data.floorCount || 14;
        const floorHeight = e.data.floorH || 4.5;
        buildLegend();
        buildScene({ siteW, siteD, floorCount, floorHeight });
      }
    });

    /* ═══════════════════════════════════════════════════════════════
       INITIAL BUILD
    ═══════════════════════════════════════════════════════════════ */
    buildLegend();
    buildScene({ siteW: 70, siteD: 70, floorCount: 14, floorHeight: 4.5 });

    /* ═══════════════════════════════════════════════════════════════
       RENDER LOOP
    ═══════════════════════════════════════════════════════════════ */
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
      updateLabels();
    }
    animate();

    /* ── Resize handler ─────────────────────────────────────────── */
    window.addEventListener('resize', () => {
      const nW = container.clientWidth;
      const nH = container.clientHeight;
      camera.aspect = nW / nH;
      camera.updateProjectionMatrix();
      renderer.setSize(nW, nH);
    });

  </script>

</body>
